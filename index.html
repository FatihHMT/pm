  <script>/* js/modules/costs.js */
/* PM Tool — modules/costs.js
 * Costs per project, in four views:
 *   Estimate          preliminary cost estimate (estimate.md) + hourly rates for this project (rates.md)
 *   Additional work   extras on top of the offer price (additional-work.md): revenue + expected cost
 *   Actual costs      fixed costs and purchases (costs.md); each can be linked to an estimate line or extra
 *   Analysis          estimate vs actual per subject / line and the current margin
 * Labour actuals come from Hours (matched to labour estimate lines by role, or linked to an extra).
 * Every view has a PDF export (modules/costs-pdf.js).
 * The analysis table is exposed as PM.costAnalysis for Reports and plugins.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { view: 'estimate', type: '', open: {} };
  const M = v => U.fmtMoney(v), MC = v => U.fmtMoney(v, true), N = v => U.fmtNum(v);
  const SUBJECTS = ['Labour', 'Engineering', 'Pump set', 'Controls', 'Piping & valves', 'Fuel system', 'Prefab / building', 'Subcontracting', 'Transport', 'Commissioning', 'Travel', 'Contingency'];
  const BASE = r => r.kind === 'line' || r.kind === 'labour';
  const AW_STATUS = { quoted: 'Quoted', approved: 'Approved', invoiced: 'Invoiced', rejected: 'Rejected' };

  function pct(v) { return v == null || !isFinite(v) ? '—' : U.fmtPct(v); }
  function signed(v) { return (v > 0.005 ? '+' : '') + M(v); }
  function editLink(pid, text) { return h('a', { href: 'javascript:void 0', onclick: () => PM.app.editProjectDialog(pid) }, text); }
  function extraActual(pid, id) {
    const calc = PM.services.calc;
    return U.sum(PM.store.list('costs', c => c.project === pid && c.estimate === id), calc.costAmount) +
      U.sum(PM.store.list('hours', x => x.project === pid && x.extra === id), calc.entryCost);
  }

  /* ---------- analysis: stats + table (also used by Reports) ---------- */
  function statsRow(a) {
    return h('div', { class: 'stats' },
      PM.ui.stat('Revenue', a.revenue ? M(a.revenue) : '—', a.offer ? 'offer ' + M(a.offer) + (a.extrasRevenue ? ' + extras ' + M(a.extrasRevenue) : '') + (a.extrasQuoted ? ' · ' + M(a.extrasQuoted) + ' quoted' : '') : 'offer price not set — ✎ Edit project', a.offer ? '' : 'warn'),
      PM.ui.stat('Planned margin', a.revenue ? M(a.margin) : '—', a.revenue ? pct(a.marginPct) + ' · estimated cost ' + M(a.baseEstimate + a.extrasCost) + (a.extrasRevenue ? ' (extras at their est. cost)' : '') : a.lines + ' estimate line(s)', a.revenue && a.margin < 0 ? 'bad' : ''),
      PM.ui.stat('Actual costs so far', M(a.actual), pct(a.used) + ' of estimate · planning ' + U.fmtPct(a.progress) + ' done', a.used > Math.max(a.progress, 0) + 0.15 && a.estimate ? 'warn' : ''),
      PM.ui.stat('Current margin', a.revenue ? M(a.currentMargin) : '—', a.revenue ? pct(a.currentMarginPct) + ' of revenue · revenue − actual costs so far' : 'set an offer price', a.revenue ? (a.currentMargin < 0 ? 'bad' : 'accent') : ''));
  }

  function rowLabel(r) {
    return r.kind === 'labour' ? r.title + ' (labour)' : r.kind === 'line' || r.kind === 'extra' ? r.id + ' · ' + r.title : r.title;
  }
  function rowHours(r) {
    if (r.kind === 'labour') return N(r.actHours) + ' / ' + N(r.estHours) + ' h';
    if (r.actHours) return N(r.actHours) + ' h';
    return '';
  }

  function detailRows(r, colspan) {
    const calc = PM.services.calc;
    const items = [];
    if (r.kind === 'labour' && r.lines.length) items.push(h('div', { class: 'ea-sub muted' }, 'Estimate: ' + r.lines.map(e => e.id + ' ' + (e.description || '') + ' (' + N(e.qty) + ' ' + (e.unit || 'h') + ')').join(' · ')));
    if (r.kind === 'extra') items.push(h('div', { class: 'ea-sub muted' }, 'Additional work · ' + (AW_STATUS[r.status] || r.status) + ' · price ' + M(r.price) + ' · est. cost ' + M(r.quotedCost) + (r.counted ? '' : ' — not counted until approved')));
    if (r.hours.length) {
      const byPerson = new Map();
      r.hours.forEach(x => { const k = x.person || '—'; const o = byPerson.get(k) || { h: 0, c: 0 }; o.h += U.num(x.hours); o.c += calc.entryCost(x); byPerson.set(k, o); });
      items.push(h('div', { class: 'ea-sub' }, 'Hours: ' + Array.from(byPerson.entries()).map(([k, o]) => ((calc.person(k) || {}).name || k) + ' ' + N(o.h) + ' h (' + M(o.c) + ')').join(' · ')));
    }
    r.costs.forEach(c => items.push(h('div', { class: 'ea-sub ea-cost' },
      h('span', { class: 'muted' }, U.fmtDate(c.date) || '—'), h('span', null, c.id + ' · ' + (c.description || '') + (c.supplier ? ' · ' + c.supplier : '')), h('span', { class: 'right' }, MC(calc.costAmount(c))))));
    if (items.length === (r.kind === 'extra' ? 1 : 0)) items.push(h('div', { class: 'ea-sub muted' }, r.kind === 'labour' ? 'No hours logged for this role yet.' : 'Nothing linked yet. Link purchases in Actual costs → column "Estimate line / extra".'));
    return h('tr', { class: 'ea-detail' }, h('td', { colspan }, items));
  }

  function table(a, opts) {
    opts = opts || {};
    const cols = 5;
    const body = h('tbody');
    a.groups.forEach(g => {
      const unplanned = g.subject === 'Not in estimate';
      body.appendChild(h('tr', { class: 'ea-group' + (unplanned ? ' ea-unplanned' : '') },
        h('td', null, g.subject), h('td', { class: 'right' }, unplanned ? '—' : M(g.estimate)), h('td', { class: 'right' }, M(g.actual)),
        h('td', { class: 'right ' + (g.over && !unplanned ? 'bad-text' : '') }, unplanned ? '' : signed(g.diff)),
        h('td', null, unplanned ? '' : PM.ui.meter(g.actual, g.estimate))));
      g.rows.forEach(r => {
        const key = a.project + '|' + r.key;
        const open = !!state.open[key];
        const ht = rowHours(r);
        const compare = BASE(r) || (r.kind === 'extra' && r.counted);
        const tr = h('tr', { class: 'ea-row' + (r.over && r.estimate ? ' over' : '') + (opts.print ? '' : ' clickable'), title: opts.print ? null : 'Show what is linked' },
          h('td', null, opts.print ? null : h('span', { class: 'ea-caret' }, open ? '▾' : '▸'), rowLabel(r), ht ? h('span', { class: 'muted small' }, ' · ' + ht) : null,
            r.kind === 'unlinked' ? h('span', { class: 'muted small' }, ' · ' + r.costs.length + ' line(s)') : null,
            r.kind === 'extra' && !r.counted ? h('span', { class: 'aw-badge st-' + r.status }, AW_STATUS[r.status] || r.status) : null),
          h('td', { class: 'right' }, compare ? M(r.estimate) : '—'),
          h('td', { class: 'right' }, M(r.actual)),
          h('td', { class: 'right ' + (r.over && compare ? 'bad-text' : '') }, compare ? signed(r.diff) : ''),
          h('td', null, r.estimate ? PM.ui.meter(r.actual, r.estimate) : ''));
        if (!opts.print) tr.addEventListener('click', () => { state.open[key] = !open; opts.rerender && opts.rerender(); });
        body.appendChild(tr);
        if (open && !opts.print) body.appendChild(detailRows(r, cols));
      });
    });
    if (!a.groups.length) body.appendChild(h('tr', null, h('td', { colspan: cols, class: 'empty' }, 'No estimate and no costs yet.')));
    const t = h('table', { class: 'data report ea-table' },
      h('thead', null, h('tr', null, ['Subject / line', 'Estimate', 'Actual', 'Difference', 'Used'].map((c, i) => h('th', { class: i && i !== 4 ? 'right' : '' }, c)))),
      body,
      h('tfoot', null, h('tr', null, h('td', { class: 'total' }, 'Total'), h('td', { class: 'right total' }, M(a.estimate)), h('td', { class: 'right total' }, M(a.actual)),
        h('td', { class: 'right total ' + (a.actual > a.estimate ? 'bad-text' : '') }, signed(a.estimate - a.actual)), h('td', { class: 'total' }, PM.ui.meter(a.actual, a.estimate)))));
    const csv = h('button', { class: 'btn ghost small no-print', onclick: () => {
      const flat = [];
      a.groups.forEach(g => g.rows.forEach(r => flat.push({ subject: g.subject, item: rowLabel(r), est_hours: r.estHours, act_hours: r.actHours, estimate: r.estimate, actual: r.actual, difference: r.diff })));
      const R = v => v == null ? '' : Math.round(v * 100) / 100;
      U.download('estimate-vs-actual-' + a.project + '.csv', U.toCSV([['Subject', 'subject'], ['Item', 'item'], ['Est. hours', 'est_hours'], ['Actual hours', 'act_hours'], ['Estimate', 'estimate'], ['Actual', 'actual'], ['Difference', 'difference']]
        .map(([label, k]) => ({ label, value: r => typeof r[k] === 'number' ? R(r[k]) : (r[k] == null ? '' : r[k]) })), flat), 'text/csv;charset=utf-8');
    } }, 'CSV');

    const file = (name) => U.slugify(name + '-' + (p ? p.id : 'all-projects') + '-' + U.todayISO()) + '.pdf';

    if (view === 'estimate') {
      const a = calc.estimateAnalysis(p.id);

/* PM Tool — modules/reports.js
 * Hours and cost reports, per project or for the whole portfolio.

 * Uses PM.services.calc.summary() — the same numbers are available to plugins.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { period: 'all', from: '', to: '' };

  function periodRange() {
    const t = U.parseDate(U.todayISO());
    const y = t.getUTCFullYear(), m = t.getUTCMonth();
    const d = (yy, mm, dd) => U.iso(new Date(Date.UTC(yy, mm, dd)));
    switch (state.period) {
      case 'month': return [d(y, m, 1), d(y, m + 1, 0)];
      case 'lastmonth': return [d(y, m - 1, 1), d(y, m, 0)];
      case 'quarter': { const q = Math.floor(m / 3) * 3; return [d(y, q, 1), d(y, q + 3, 0)]; }
      case 'year': return [d(y, 0, 1), d(y, 11, 31)];
      case 'custom': return [state.from, state.to];
      default: return ['', ''];
    }
  }

  PM.registerModule({
    id: 'reports', title: 'Reports', icon: '▥', order: 60,
    render(el, ctx) {

        [['all', 'All time'], ['month', 'This month'], ['lastmonth', 'Last month'], ['quarter', 'This quarter'], ['year', 'This year'], ['custom', 'Custom…']]
          .map(([k, t]) => h('option', { value: k, selected: state.period === k || null }, t)));

        h('input', { type: 'date', value: state.from, 'aria-label': 'From', onchange: e => { state.from = e.target.value; ctx.rerender(); } }),
        h('span', { class: 'muted' }, 'to'),

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Report · ' + (ctx.project ? ctx.project.name : 'All projects')),
          h('p', { class: 'muted' }, periodText + (ctx.project ? ' · ' + ctx.project.id + (ctx.project.client ? ' · ' + ctx.project.client : '') : ' · ' + s.projects.length + ' project(s)') + ' · generated ' + U.fmtDate(U.todayISO())))));

          { key: 'used', label: '% budget', align: 'right', value: r => r.budgetCosts ? r.total / r.budgetCosts : '', format: v => v === '' ? '–' : U.fmtPct(v) }
        ], s.byProject, { filename: 'projects', totals: { budgetHours: N(s.budgetHours), hours: N(s.hours), budgetCosts: M(s.budgetCosts), labour: M(s.labour), fixed: M(s.fixed), purchases: M(s.purchases), total: M(s.total) } }));
      }

      const grid = h('div', { class: 'two-col' });
      el.appendChild(grid);
      grid.appendChild(PM.ui.reportTable('Hours and labour cost per role', [
        { key: 'name', label: 'Role' }, { key: 'rate', label: 'Rate', format: v => U.fmtMoney(v, true), align: 'right' },
        { key: 'hours', label: 'Hours', format: N }, { key: 'cost', label: 'Cost', format: M }
      ], s.byRole, { filename: 'per-role', totals: { hours: N(s.hours), cost: M(s.labour) }, before: s.byRole.length ? PM.ui.bars(s.byRole.map(r => ({ label: r.name, value: r.cost })), { money: true }) : null }));

      grid.appendChild(PM.ui.reportTable('Hours per person', [
        { key: 'name', label: 'Person' }, { key: 'hours', label: 'Hours', format: N }, { key: 'cost', label: 'Cost', format: M }
      ], s.byPerson, { filename: 'per-person', totals: { hours: N(s.hours), cost: M(s.labour) } }));

      el.appendChild(PM.ui.reportTable('Fixed costs and purchases per category', [
        { key: 'type', label: 'Type' }, { key: 'category', label: 'Category' }, { key: 'count', label: 'Lines', format: N }, { key: 'amount', label: 'Amount', format: M }

  <!-- Import / export adapters -->
  <script>/* js/adapters/json.js */
/* PM Tool — adapters/json.js
 * Full data set as one JSON document — the easiest way for other programs to
 * read everything, or to move data between installations.
 *
 * Format:
 * { "format": "pm-tool", "version": 1, "exported": "2026-10-12",
 *   "collections": { "projects": [ {...} ], "roles": [...], "tasks": [ {"project": "P-001", ...} ] } }
 */
(function () {
  const U = PM.util;

  function exportAll() {
    const out = { format: 'pm-tool', version: 1, exported: U.todayISO(), collections: {} };
    PM.collections().forEach(def => {
      out.collections[def.name] = PM.store.list(def.name).map(r => {
        const o = {};
        Object.keys(r).forEach(k => { if (!k.startsWith('_')) o[k] = r[k]; });
        if (def.scope === 'meta') { o.folder = r._folder; o.notes = r._notes; }
        return o;
      });
    });
    return out;
  }

  /* Merge records into the store: same id (+ project) = update, otherwise insert. */
  function importData(data) {
    if (!data || !data.collections) throw new Error('Not a pm-tool JSON file (missing "collections").');
    const counts = {};
    const order = ['roles', 'people', 'projects'].concat(PM.collections().map(d => d.name).filter(n => !['roles', 'people', 'projects'].includes(n)));
    order.forEach(name => {
      const def = PM.collection(name);
      const list = data.collections[name];
      if (!def || !Array.isArray(list)) return;
      let ins = 0, upd = 0;
      list.forEach(raw => {
        const r = Object.assign({}, raw);
        if (def.scope === 'meta') {
          const ex = PM.store.project(r.id);
          const notes = r.notes; delete r.notes; delete r.folder;
          if (notes != null) r._notes = notes;
          if (ex) { PM.store.update('projects', ex._key, r); upd++; } else { const p = PM.store.createProject(r); if (notes != null) p._notes = notes; ins++; }
          return;
        }
        const pid = r.project;
        const ex = r.id ? PM.store.find(name, r.id, pid) : null;
        if (ex) { PM.store.update(name, ex._key, r); upd++; }
        else if (def.scope !== 'project' || PM.store.project(pid)) { PM.store.insert(name, r, pid); ins++; }
      });
      if (ins || upd) counts[def.label] = ins + ' new, ' + upd + ' updated';
    });
    return Object.keys(counts).map(k => k + ': ' + counts[k]).join('; ') || 'Nothing imported.';
  }

  PM.registerAdapter({
    id: 'json', label: 'JSON (complete data set)',
    exports: [{ id: 'json-all', label: 'Export everything as JSON', run: () => ({ filename: 'pm-data-' + U.todayISO() + '.json', content: JSON.stringify(exportAll(), null, 2), mime: 'application/json' }) }],
    imports: [{ id: 'json-all', label: 'Import / merge JSON', accept: '.json,application/json', run: async text => importData(JSON.parse(text)) }]
  });

  PM.json = { exportAll, importData };
})();

  </script>
  <script>/* js/adapters/csv.js */
/* PM Tool — adapters/csv.js
 * CSV per collection (Excel, Google Sheets, accounting tools).
 * Export: the selected project, or all projects (with a "project" column).
 * Import: rows are merged by id into the selected project (or by their "project" column).
 */
(function () {
  const U = PM.util;

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    const head = (rows.shift() || []).map(x => x.trim().toLowerCase().replace(/\s+/g, '_'));
    return rows.filter(r => r.some(c => c.trim() !== '')).map(r => { const o = {}; head.forEach((k, i) => { o[k] = (r[i] || '').trim(); }); return o; });
  }

  function exportCollection(name, projectId) {
    const def = PM.collection(name);
    const rows = PM.store.list(name, projectId && def.scope === 'project' ? { project: projectId } : null);
    const cols = (def.scope === 'project' ? [{ key: 'project', label: 'project' }] : []).concat(def.fields.map(f => ({ key: f.key, label: f.key })));
    return U.toCSV(cols, rows);
  }

  function importCollection(name, text, projectId) {
    const def = PM.collection(name);
    const rows = parseCSV(text);
    let ins = 0, upd = 0, skipped = 0;
    rows.forEach(r => {
      if (def.scope === 'meta') {
        const ex = PM.store.project(r.id);
        if (ex) { PM.store.update('projects', ex._key, r); upd++; } else { PM.store.createProject(r); ins++; }
        return;
      }
      const pid = def.scope === 'project' ? (r.project || projectId) : null;
      delete r.project;
      if (def.scope === 'project' && !PM.store.project(pid)) { skipped++; return; }
      const ex = r.id ? PM.store.find(name, r.id, pid) : null;
      if (ex) { PM.store.update(name, ex._key, r); upd++; } else { PM.store.insert(name, r, pid); ins++; }
    });
    return def.label + ': ' + ins + ' new, ' + upd + ' updated' + (skipped ? ', ' + skipped + ' skipped (unknown project — select a project or add a "project" column)' : '');
  }

  PM.registerAdapter({
    id: 'csv', label: 'CSV (one collection)',
    perCollection: true,
    exports: [{ id: 'csv', label: 'Export CSV', run: ctx => ({ filename: ctx.collection + (ctx.projectId ? '-' + ctx.projectId : '-all') + '.csv', content: exportCollection(ctx.collection, ctx.projectId), mime: 'text/csv;charset=utf-8' }) }],
    imports: [{ id: 'csv', label: 'Import CSV', accept: '.csv,text/csv', run: async (text, ctx) => importCollection(ctx.collection, text, ctx.projectId) }]
  });

  PM.csv = { parseCSV, exportCollection, importCollection };
})();
