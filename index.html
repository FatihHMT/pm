  <script>/* js/surveys/surveys.js */
/* PM Tool — surveys/surveys.js
 * Forms core ("surveys" in the data): form definitions, answers, storage.
 *
 * FORM DEFINITIONS are Markdown files in your data: settings/forms/<id>.md
 * (built-in forms are copied there the first time, so you can change them).
 *
 *   ---
 *   id: prefab-spec
 *   name: Prefab pump room – specification
 *   short: Prefab spec
 *   lang: en                         en | nl  (button texts: Yes/No, OK/Not OK…)
 *   description: One line shown when choosing a form.
 *   signatures: Tested by; Witnessed by     (optional: signature lines in the PDF)
 *   ---
 *   # Prefab pump room – specification
 *
 *   ## General
 *   Optional note under the section title.
 *
 *   | key  | question | type | options       | unit | hint |
 *   | ---- | -------- | ---- | ------------- | ---- | ---- |
 *   | date | Date     | date | default=today |      |      |
 *
 *   ## Fire pump {n} [repeat=pump_count]     section repeated "pump_count" times
 *   ## Positions [diagram]                   shows the pump-set drawing
 *
 * Question types and their options (separate options with ;):
 *   text, textarea, tel, email, date      default=today · prefill=client|address|number · rows=8
 *   number                                +approx (±) · prefix=ø          (unit column)
 *   dims                                  L; W; H                          (unit column)
 *   yesno                                 +na (adds N/A)
 *   choice                                A; B; C · +other ("Other…" free text)
 *   check                                 OK / Not OK / N/A with remark and photos per item
 *   position                              F; G; H · mark=panel|jockey|fuel|cooling
 *   pipesize                              DN or ANSI with size list
 *   pumptest                              rated_flow=<key>; rated_pressure=<key>; flow=m³/h; pressure=bar
 *   table                                 rows=A, B, C; cols=X (unit), Y (unit)
 *   person, estimate, photos
 * Options for every type: +optional (not counted in progress) · +nolabel ·
 *   show=<key>=<value> (only shown when that answer is given) · show=<key>~<text> (answer contains text)
 *
 * ANSWERS are stored per project in projects/<folder>/surveys.md (see codec below).
 */
PM.surveys = (function () {
  const templates = [];
  const U = PM.util;
  const FORMS_DIR = 'settings/forms';

  const L = {
    nl: { yes: 'Ja', no: 'Nee', na: 'NVT', ok: 'Akkoord', nok: 'Niet akkoord', other: 'Anders…', otherPh: 'Anders, namelijk…', choose: '— kies —', photo: 'Foto', remark: 'Opmerking', addRemark: '+ opmerking / foto', filled: 'ingevuld', days: 'dagen', men: 'man', mandays: 'mandagen', flow: 'Debiet', suction: 'Zuigdruk', discharge: 'Persdruk', net: 'Netto', speed: 'Toerental', rated: 'van nominaal', pass: 'Voldoet', fail: 'Voldoet niet', churn: 'Afgesloten (0%)', deviations: 'Afwijkingen', size: 'Maat' },
    en: { yes: 'Yes', no: 'No', na: 'N/A', ok: 'OK', nok: 'Not OK', other: 'Other…', otherPh: 'Other, namely…', choose: '— choose —', photo: 'Photo', remark: 'Remark', addRemark: '+ remark / photo', filled: 'filled in', days: 'days', men: 'men', mandays: 'man-days', flow: 'Flow', suction: 'Suction', discharge: 'Discharge', net: 'Net pressure', speed: 'Speed', rated: 'of rated', pass: 'Pass', fail: 'Fail', churn: 'Churn (0%)', deviations: 'Deviations', size: 'Size' }
  };
  const lang = t => L[(t && t.lang) || 'en'] || L.en;

  const PIPE = {
    DN: ['DN25', 'DN32', 'DN40', 'DN50', 'DN65', 'DN80', 'DN100', 'DN125', 'DN150', 'DN200', 'DN250', 'DN300', 'DN350', 'DN400', 'DN450', 'DN500'],
    ANSI: ['1"', '1¼"', '1½"', '2"', '2½"', '3"', '4"', '5"', '6"', '8"', '10"', '12"', '14"', '16"', '18"', '20"']
  };

  /* ---------- compile a question from its raw table row ---------- */
  function compile(f) {
    if (f._c) return f._c;
    if (f.opt == null && f.type) { Object.defineProperty(f, '_c', { value: f, enumerable: false, configurable: true }); return f; }   // already compiled (JS-registered form)
    const c = { key: f.key, label: f.label, type: f.type || 'text', unit: f.unit || '', hint: f.hint || '' };
    const list = [];
    String(f.opt || '').split(';').map(x => x.trim()).filter(Boolean).forEach(tok => {
      if (tok[0] === '+') { const flag = tok.slice(1).toLowerCase(); if (flag === 'nolabel') c.hideLabel = true; else c[flag] = true; return; }
      const eq = tok.indexOf('=');
      if (eq > 0) {
        const k = tok.slice(0, eq).trim().toLowerCase(), v = tok.slice(eq + 1).trim();
        if (k === 'show') {
          const m = /^([A-Za-z0-9_]+)\s*([=~])\s*(.*)$/.exec(v);
          if (m) c.show = { key: m[1], op: m[2], val: m[3] };
        } else if (k === 'rows' || k === 'cols') c[k] = v.split(',').map(x => x.trim()).filter(Boolean);
        else c[k] = v;
        return;
      }
      list.push(tok);
    });
    if (c.type === 'textarea' && c.rows && !Array.isArray(c.rows)) c.rows = +c.rows;
    if (c.type === 'textarea' && Array.isArray(c.rows)) c.rows = +c.rows[0] || 3;
    if (c.type === 'dims') c.parts = list.length ? list : ['L', 'W', 'H'];
    else c.options = list;
    if (c.type === 'yesno' && c.na) c.na = true;
    if (c.default === 'today') c.default = 'today';
    if (c.prefill) { const pf = c.prefill; c.prefill = p => (p && (pf === 'number' ? p.number : pf === 'address' ? p.address : pf === 'client' ? p.client : p[pf])) || ''; }
    if (c.type === 'pumptest') { c.ratedFlow = c.rated_flow || 'rated_flow'; c.ratedPressure = c.rated_pressure || 'rated_pressure'; c.flowUnit = c.flow || 'm³/h'; c.pressureUnit = c.pressure || 'bar'; }
    Object.defineProperty(f, '_c', { value: c, enumerable: false, configurable: true, writable: true });
    return c;
  }

  /* ---------- registry ---------- */
  function register(t) {
    t.sections = t.sections || [];
    const i = templates.findIndex(x => x.id === t.id);
    if (i >= 0) templates[i] = t; else templates.push(t);
    return t;
  }
  const get = id => templates.find(t => t.id === id) || null;
  const list = () => templates.slice();
  const fieldsOf = t => (t ? t.sections.reduce((a, s) => a.concat(s.fields.map(compile)), []) : []);

  /* ---------- sections with repeats, as they appear for one record ---------- */
  function expand(t, values) {
    values = values || {};
    const out = [];
    (t ? t.sections : []).forEach(sec => {
      const fields = sec.fields.map(compile);
      if (sec.repeat) {
        const n = Math.max(0, Math.min(8, Math.round(U.num(values[sec.repeat]))));
        for (let i = 1; i <= n; i++) {
          const sfx = '__' + i;
          out.push({ sec, n: i, id: sec.id + sfx, title: /\{n\}/.test(sec.title) ? sec.title.replace(/\{n\}/g, i) : sec.title + ' ' + i,
            fields: fields.map(f => Object.assign({}, f, { key: f.key + sfx, base: f.key, sfx })) });
        }
      } else out.push({ sec, n: 0, id: sec.id, title: sec.title, fields: fields.map(f => Object.assign({}, f, { base: f.key, sfx: '' })) });
    });
    return out;
  }
  function resolveKey(f, key, values) { return f.sfx && (key + f.sfx) in values ? key + f.sfx : (f.sfx && !(key in values) ? key + f.sfx : key); }
  function isVisible(f, values) {
    if (!f.show) return true;
    const v = values[resolveKey(f, f.show.key, values)];
    if (f.show.op === '~') return String(v || '').toLowerCase().includes(String(f.show.val).toLowerCase());
    return String(v == null ? '' : v) === f.show.val;
  }

  /* every stored key of a question: [{key, label}] */
  function keysOf(f, t) {
    const T = lang(t);
    switch (f.type) {
      case 'dims': return f.parts.map(p => ({ key: f.key + '_' + p.toLowerCase(), label: f.label + ' – ' + p + (f.unit ? ' (' + f.unit + ')' : '') }));
      case 'estimate': return [{ key: f.key + '_days', label: f.label + ' – ' + T.days }, { key: f.key + '_men', label: f.label + ' – ' + T.men }];
      case 'pipesize': return [{ key: f.key + '_std', label: f.label + ' – DN/ANSI' }, { key: f.key, label: f.label }];
      case 'check': return [{ key: f.key, label: f.label }, { key: f.key + '_note', label: f.label + ' – ' + T.remark }, { key: f.key + '_ph', label: f.label + ' – ' + T.photo }];
      case 'pumptest': {
        const out = [];
        pumpRows(t).forEach((r, i) => ['flow', 'suction', 'discharge', 'rpm'].forEach(c => out.push({ key: f.key + '_r' + (i + 1) + '_' + c, label: f.label + ' – ' + r.label + ' – ' + c })));
        return out;
      }
      case 'table': {
        const out = [];
        (f.rows || []).forEach((r, i) => (f.cols || []).forEach((c, j) => out.push({ key: f.key + '_r' + (i + 1) + '_c' + (j + 1), label: f.label + ' – ' + r + ' – ' + c })));
        return out;
      }
      default: return [{ key: f.key, label: f.label + (f.unit ? ' (' + f.unit + ')' : '') }];
    }
  }
  function flatFields(t, values) {
    const out = [];
    expand(t, values || {}).forEach(s => s.fields.forEach(f => keysOf(f, t).forEach(k => out.push(Object.assign(k, { field: f })))));
    return out;
  }
  const pumpRows = t => [{ label: lang(t).churn, pct: 0 }, { label: '100%', pct: 100 }, { label: '150%', pct: 150 }];

  /* NFPA 20 style acceptance check of a pump test (net pressure vs rated). */
  function pumpCheck(f, values, t) {
    const ratedQ = U.num(values[resolveKey(f, f.ratedFlow, values)]);
    const ratedP = U.num(values[resolveKey(f, f.ratedPressure, values)]);
    return pumpRows(t).map((r, i) => {
      const g = c => values[f.key + '_r' + (i + 1) + '_' + c];
      const has = g('discharge') !== undefined && g('discharge') !== '';
      const net = has ? U.num(g('discharge')) - U.num(g('suction')) : null;
      const q = U.num(g('flow'));
      let ok = null, rule = '';
      if (has && ratedP) {
        if (r.pct === 0) { ok = net <= ratedP * 1.4; rule = '≤ 140%'; }
        else if (r.pct === 100) { ok = net >= ratedP && (!ratedQ || q >= ratedQ); rule = '≥ 100%'; }
        else { ok = net >= ratedP * 0.65 && (!ratedQ || q >= ratedQ * 1.5); rule = '≥ 65% @ 150% flow'; }
      }
      return { label: r.label, pct: r.pct, flow: g('flow'), suction: g('suction'), discharge: g('discharge'), rpm: g('rpm'), net, ratio: has && ratedP ? net / ratedP : null, ok, rule };
    });
  }

  function has(v) { return Array.isArray(v) ? v.length > 0 : v != null && String(v).trim() !== ''; }
  function isAnswered(f, values) {
    switch (f.type) {
      case 'dims': return f.parts.every(p => has(values[f.key + '_' + p.toLowerCase()]));
      case 'estimate': return has(values[f.key + '_days']) && has(values[f.key + '_men']);
      case 'pumptest': return [1, 2, 3].every(i => has(values[f.key + '_r' + i + '_discharge']));
      case 'table': return Object.keys(values).some(k => k.startsWith(f.key + '_r') && has(values[k]));
      default: return has(values[f.key]);
    }
  }
  function visibleFields(rec) {
    const t = get(rec.template);
    const v = rec.values || {};
    return expand(t, v).reduce((a, s) => a.concat(s.fields), []).filter(f => isVisible(f, v));
  }
  function progress(rec) {
    const fs = visibleFields(rec).filter(f => !f.optional);
    const done = fs.filter(f => isAnswered(f, rec.values || {})).length;
    return { done, total: fs.length };
  }
  function deviations(rec) {
    const v = rec.values || {};
    return visibleFields(rec).filter(f => f.type === 'check' && v[f.key] === 'nok');
  }
  function photoCount(rec) {
    let n = 0;
    Object.keys(rec.values || {}).forEach(k => { if (Array.isArray(rec.values[k])) n += rec.values[k].length; });
    return n;
  }
  function photoPath(rec, rel) {
    const p = PM.store.project(rec.project);
    return p ? 'projects/' + p._folder + '/' + rel : rel;
  }
  const MARKS = {
    panel: { label: 'Schakelkast', color: '#2f6fed' },
    jockey: { label: 'Jockeypomp', color: '#d9822b' },
    fuel: { label: 'Brandstof', color: '#d14343' },
    cooling: { label: 'Koelstraat', color: '#0f9d8a' }
  };
  function marksFor(rec) {
    const out = {};
    const v = rec.values || {};
    visibleFields(rec).filter(f => f.type === 'position').forEach(f => {
      if (v[f.key] && MARKS[f.mark]) (out[v[f.key]] = out[v[f.key]] || []).push(MARKS[f.mark]);
    });
    return out;
  }

  /* ---------- form definition files (settings/forms/<id>.md) ---------- */
  function slug(s) { return U.slugify(s).replace(/-/g, '_') || 'section'; }
  function parseForm(text, source) {
    const fm = PM.md.parseFrontmatter(text);
    const d = fm.data;
    const parts = fm.body.split(/^(?=## )/m);
    const head = /^## /.test(parts[0]) ? '' : parts.shift();
    const sections = parts.map(chunk => {
      const firstLine = chunk.split('\n')[0].replace(/^##\s*/, '').trim();
      let title = firstLine, flags = '';
      const m = /^(.*?)\s*\[([^\]]*)\]\s*$/.exec(firstLine);
      if (m) { title = m[1].trim(); flags = m[2]; }
      const sec = { id: slug(title.replace(/\{n\}/g, '')), title, fields: [], note: '' };
      flags.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(fl => {
        if (fl === 'diagram') sec.diagram = true;
        else if (/^repeat\s*=/.test(fl)) sec.repeat = fl.split('=')[1].trim();
      });
      const rest = chunk.split('\n').slice(1).join('\n');
      const doc = PM.md.parseTableDoc(rest);
      sec.note = (doc.before || '').trim();
      doc.rows.forEach(r => { if (r.key) sec.fields.push({ key: r.key.trim(), label: r.question || r.label || r.key, type: (r.type || 'text').trim(), opt: r.options || '', unit: r.unit || '', hint: r.hint || '' }); });
      return sec;
    });
    const ids = new Set();
    sections.forEach(s => { let id = s.id, i = 2; while (ids.has(id)) id = s.id + '_' + i++; s.id = id; ids.add(id); });
    return {
      id: String(d.id || '').trim(), name: d.name || d.id, short: d.short || d.name || d.id, lang: d.lang || 'en',
      description: d.description || '', signatures: d.signatures ? String(d.signatures).split(';').map(x => x.trim()).filter(Boolean) : [],
      diagram: { motor: d.motor || 'MOTOR' }, intro: head.replace(/^\s*#[^\n]*\n?/, '').trim(), sections, source: source || 'data', text
    };
  }
  function serializeForm(t) {
    const meta = { id: t.id, name: t.name, short: t.short || t.name, lang: t.lang || 'en', description: t.description || '' };
    if (t.signatures && t.signatures.length) meta.signatures = t.signatures.join('; ');
    if (t.diagram && t.diagram.motor && t.diagram.motor !== 'MOTOR') meta.motor = t.diagram.motor;
    let out = PM.md.stringifyFrontmatter(meta, ['id', 'name', 'short', 'lang', 'description', 'signatures', 'motor']);
    out += '\n# ' + t.name + '\n\n' + (t.intro || 'Form definition. Edit it in the app (Settings → Forms) or here. Columns: key (do not change once used), question, type, options, unit, hint.') + '\n';
    t.sections.forEach(sec => {
      const flags = [sec.diagram ? 'diagram' : '', sec.repeat ? 'repeat=' + sec.repeat : ''].filter(Boolean).join('; ');
      out += '\n## ' + sec.title + (flags ? ' [' + flags + ']' : '') + '\n\n';
      if (sec.note) out += sec.note + '\n\n';
      out += PM.md.writeTableDoc({ meta: null, before: '', after: '' }, ['key', 'question', 'type', 'options', 'unit', 'hint'],
        sec.fields.map(f => ({ key: f.key, question: f.label, type: f.type, options: f.opt != null ? f.opt : '', unit: f.unit || '', hint: f.hint || '' })));
    });
    return out;
  }

  /* built-in forms (Markdown text, see templates.js) */
  const builtins = {};
  function registerBuiltin(text) {
    const t = parseForm(text, 'builtin');
    builtins[t.id] = text;
    register(t);
    return t;
  }

  /* Load forms from the data source; copy built-ins there the first time so they can be edited. */
  async function loadFromBackend(be) {
    Object.keys(builtins).forEach(id => register(parseForm(builtins[id], 'builtin')));
    templates.slice().forEach(t => { if (t.source === 'data') templates.splice(templates.indexOf(t), 1); });
    if (!be || !be.listFiles) return;
    let files = [];
    try { files = (await be.listFiles(FORMS_DIR)).filter(n => /\.md$/i.test(n)); } catch (e) { files = []; }
    for (const name of files) {
      try {
        const text = await be.readText(FORMS_DIR + '/' + name);
        if (text == null) continue;
        const t = parseForm(text, 'data');
        if (!t.id) t.id = name.replace(/\.md$/i, '');
        t.path = FORMS_DIR + '/' + name;
        t.edited = builtins[t.id] != null && t.text.trim() !== builtins[t.id].trim();
        t.builtin = builtins[t.id] != null;
        register(t);
      } catch (e) { console.warn('Form ' + name + ' could not be read:', e); }
    }
    // first time on a real data source: store the built-in forms there
    if (!files.length && be.writable && ['folder', 'github', 'onedrive', 'http'].includes(be.kind)) {
      for (const id of Object.keys(builtins)) {
        try { await be.writeText(FORMS_DIR + '/' + id + '.md', builtins[id]); const t = get(id); t.source = 'data'; t.builtin = true; t.path = FORMS_DIR + '/' + id + '.md'; }
        catch (e) { console.warn('Could not store form ' + id, e); break; }
      }
    }
  }
  async function saveForm(t) {
    const be = PM.store.backend;
    const text = serializeForm(t);
    const path = FORMS_DIR + '/' + t.id + '.md';
    if (be && be.writeText) {
      try { await be.writeText(path, text); }
      catch (e) { if (e.code === 'conflict' && be.force) { be.force(path); await be.writeText(path, text); } else throw e; }
    }
    const nt = parseForm(text, be && be.kind !== 'memory' ? 'data' : 'builtin-edited');
    nt.path = path; nt.builtin = builtins[nt.id] != null; nt.edited = nt.builtin && text.trim() !== builtins[nt.id].trim();
    register(nt);
    PM.events.emit('forms', {});
    return nt;
  }
  async function deleteForm(id) {
    const be = PM.store.backend;
    const path = FORMS_DIR + '/' + id + '.md';
    if (be && be.deleteFile) await be.deleteFile(path);
    if (be && be.files) delete be.files[path];
    const i = templates.findIndex(t => t.id === id);
    if (i >= 0) templates.splice(i, 1);
    if (builtins[id]) register(parseForm(builtins[id], 'builtin'));
    PM.events.emit('forms', {});
  }
  async function resetForm(id) {
    if (!builtins[id]) return;
    return saveForm(parseForm(builtins[id], 'builtin'));
  }

  /* ---------- answers storage (projects/<folder>/surveys.md) ----------
   *   ## S-001 · Opname Diesel set · Klant BV
   *   | key | question | answer |
   *   | template | Template | diesel |
   *   | pos_panel | Positie van de schakelkast | F |
   *   | ph_panel | Binnen- en buitenkant… | ![](photos/S-001-ph_panel-k3x9.jpg) |   */
  const imgRe = /!\[[^\]]*\]\(([^)]+)\)/g;
  const codec = {
    parse(text) {
      const fm = PM.md.parseFrontmatter(text);
      const parts = fm.body.split(/^(?=## +S-\d+)/m);
      const before = /^## +S-\d+/.test(parts[0]) ? '' : parts.shift();
      const records = parts.map(sec => {
        const id = (/^## +(S-\d+)/.exec(sec) || [])[1];
        const doc = PM.md.parseTableDoc(sec);
        const raw = {};
        doc.rows.forEach(r => { if (r.key) raw[r.key] = r.answer != null ? r.answer : ''; });
        const values = {};
        Object.keys(raw).forEach(k => {
          if (k === 'template' || k === 'status') return;
          if (/!\[[^\]]*\]\(/.test(raw[k]) || /_ph$|^ph_/.test(k) && raw[k] === '') {
            const paths = []; let m; imgRe.lastIndex = 0;
            while ((m = imgRe.exec(raw[k]))) paths.push(m[1]);
            if (paths.length) values[k] = paths;
          } else if (raw[k] !== '') values[k] = raw[k];
        });
        return { id, template: raw.template || '', status: raw.status || 'draft', values };
      }).filter(r => r.id);
      return { records, doc: { meta: fm.data, before } };
    },
    serialize(rows, prev, projectId) {
      const meta = Object.assign({}, prev && prev.meta, { collection: 'surveys', project: projectId });
      let out = PM.md.stringifyFrontmatter(meta, ['collection', 'project']);
      const before = (prev && prev.before != null ? prev.before : '\n# Forms\n\nForms (surveys, specifications, checklists, FAT reports) for this project. Photos are stored in the photos/ folder next to this file.\n').replace(/\s+$/, '');
      out += before + '\n';
      rows.slice().sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true })).forEach(r => {
        const t = get(r.template);
        const v = r.values || {};
        const title = [r.id, t ? t.name : r.template, v.client].filter(Boolean).join(' · ');
        const lines = [{ key: 'template', question: 'Template', answer: r.template }, { key: 'status', question: 'Status', answer: r.status || 'draft' }];
        const seen = new Set(['template', 'status']);
        const cell = val => Array.isArray(val) ? val.map(p => '![](' + p + ')').join(' ') : (val == null ? '' : val);
        flatFields(t, v).forEach(ff => {
          if (seen.has(ff.key)) return;
          seen.add(ff.key);
          const val = v[ff.key];
          if ((val === undefined || val === '') && ff.field.show && !isVisible(ff.field, v)) return;   // hidden question, no answer
          lines.push({ key: ff.key, question: ff.label, answer: cell(val) });
        });
        Object.keys(v).forEach(k => { if (!seen.has(k)) lines.push({ key: k, question: k, answer: cell(v[k]) }); });
        out += '\n## ' + title + '\n\n' + PM.md.writeTableDoc({ meta: null, before: '', after: '' }, ['key', 'question', 'answer'], lines);
      });
      return out;
    }
  };

  PM.defineCollection({
    name: 'surveys', label: 'Forms', scope: 'project', file: 'surveys.md', idPrefix: 'S-',
    heading: 'Forms', codec,
    fields: [
      { key: 'id', label: 'ID', type: 'id' },
      { key: 'template', label: 'Form', type: 'string' },
      { key: 'status', label: 'Status', type: 'enum', options: ['draft', 'complete'], default: 'draft' }
    ],
    title: r => { const t = get(r.template); return (t ? t.short : r.template) + (r.values && r.values.client ? ' · ' + r.values.client : ''); }
  });

  // forms are loaded together with the data
  if (PM.store && PM.store.addLoader) PM.store.addLoader(loadFromBackend);
  // form definitions that live in the data are part of "download all" / "save to folder"
  if (PM.store && PM.store.addExtraFiles) PM.store.addExtraFiles(() => {
    const out = {};
    templates.filter(t => t.source === 'data').forEach(t => { out[FORMS_DIR + '/' + t.id + '.md'] = serializeForm(t); });
    return out;
  });

  /* ---------- the pump-set drawing (top view) ----------
   * Drawn with the PDF/canvas surface API, so the screen and the PDF show the
   * same picture. Coordinates follow the drawing in the original Word form. */
  function drawPumpset(pg, x0, y0, w, marks, opts) {
    opts = opts || {};
    marks = marks || {};
    const k = w / 500;                                   // drawing units are 500 wide, 990 high
    const X = x => x0 + (x - 150) * k, Y = y => y0 + (y - 50) * k, L = v => v * k;
    const ink = '#2b2f36', grey = '#c9ced6', lw = Math.max(0.25, L(3));
    const hi = l => marks[l] && marks[l][0];
    const fillFor = (l, base) => hi(l) ? hi(l).color : base;
    const fs = Math.max(5, L(36) * 2.83);                // letter size in pt
    // centre lines
    pg.line(X(390), Y(60), X(390), Y(1035), { stroke: '#8a909a', lw: lw * 0.6, dash: [L(14), L(9)] });
    pg.line(X(240), Y(245), X(545), Y(245), { stroke: '#8a909a', lw: lw * 0.6, dash: [L(14), L(9)] });
    // frame
    pg.rect(X(255), Y(125), L(275), L(820), { stroke: ink, lw });
    // pump + flanges
    pg.circle(X(395), Y(245), L(95), { fill: '#ffffff', stroke: ink, lw });
    pg.rect(X(345), Y(140), L(95), L(15), { fill: grey, stroke: ink, lw: lw * 0.7 });
    pg.rect(X(345), Y(340), L(95), L(15), { fill: grey, stroke: ink, lw: lw * 0.7 });
    pg.rect(X(285), Y(200), L(15), L(90), { fill: grey, stroke: ink, lw: lw * 0.7 });

    const has = x => x != null && String(x).trim() !== '';
    switch (f.type) {
      case 'dims': { const ps = f.parts.map(p => v[f.key + '_' + p.toLowerCase()]); return ps.some(has) ? ps.map(x => has(x) ? x : '?').join(' × ') + (f.unit ? ' ' + f.unit : '') + ' (' + f.parts.join('×') + ')' : ''; }
      case 'number': return has(v[f.key]) ? (f.approx ? '± ' : '') + (f.prefix ? f.prefix + ' ' : '') + v[f.key] + (f.unit ? ' ' + f.unit : '') : '';
      case 'estimate': { const d = v[f.key + '_days'], m = v[f.key + '_men']; if (!has(d) && !has(m)) return ''; const tot = U.num(d) * U.num(m); return (d || '?') + ' ' + F.days + ' × ' + (m || '?') + ' ' + F.men + (tot ? ' = ' + U.fmtNum(tot) + ' ' + F.mandays : '') + (f.hint ? '  (' + f.hint + ')' : ''); }
      case 'person': { const pp = PM.store.find('people', v[f.key]); return pp ? [pp.name, pp.phone, pp.email].filter(Boolean).join('  ·  ') : (v[f.key] || ''); }
      case 'date': return has(v[f.key]) ? U.fmtDate(v[f.key]) : '';
      case 'pipesize': return has(v[f.key]) ? v[f.key] + (v[f.key + '_std'] === 'ANSI' ? ' (ANSI)' : '') : '';
      case 'photos': { const n = (v[f.key] || []).length; return n ? n + ' ' + (n === 1 ? L.photo : L.photosN) + ' (' + L.seeAppendix + ')' : ''; }
      default: return has(v[f.key]) ? String(v[f.key]) : '';
    }
  }

  async function render(rec) {
    const t = S.get(rec.template);
    const L = TX[t.lang] || TX.en, F = S.lang(t);
    const v = rec.values || {};
    const co = PM.company();
    const project = PM.store.project(rec.project);
    const doc = PM.pdf.create({ size: 'A4', orientation: 'portrait', title: t.name });
    const W = doc.width, H = doc.height, CW = W - 2 * M, BOTTOM = H - M - 8;
    let logo = null;
    if (co.logo) { try { const u = await PM.files.url(co.logo); if (u) logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* no logo */ } }

    let pg, y;
    const pages = [];
    function header() {
      if (logo) { const lh = 13, lw = Math.min(55, lh * logo.ratio); pg.image(logo, M, M, lw, lw / logo.ratio); }
      else if (co.name) pg.text(co.name, M, M + 7, { size: 13, bold: true, color: C.text });
      pg.text(PM.pdf.fit(t.name, CW - 60, 14, true), W - M, M + 5, { size: 14, bold: true, color: C.text, align: 'right' });
      const sub = [v.projectnr ? L.project + ': ' + v.projectnr : (project ? project.id : ''), v.date ? U.fmtDate(v.date) : ''].filter(Boolean).join('   ·   ');
      pg.text(sub, W - M, M + 10.5, { size: 8.5, color: C.muted, align: 'right' });
      if (rec.status !== 'complete') {
        const lw = PM.pdf.textWidth(L.draft, 7.5, true) + 6;
        pg.rect(W - M - lw, M + 12.6, lw, 4.8, { fill: '#fdecec', r: 1 });
        pg.text(L.draft, W - M - lw / 2, M + 16, { size: 7.5, bold: true, color: C.bad, align: 'center' });
      }
      pg.line(M, M + 19, W - M, M + 19, { stroke: '#c9ced8', lw: 0.4 });
      y = M + 26;
    }
    function newPage() { pg = doc.addPage(); pages.push(pg); header(); }
    function ensure(hNeeded) { if (y + hNeeded > BOTTOM) newPage(); }
    function sectionTitle(title) {
      ensure(16);
      pg.rect(M, y, CW, 6.6, { fill: C.head, r: 1 });
      pg.text(PM.pdf.fit(title.toUpperCase(), CW - 5, 8, true), M + 2.5, y + 4.6, { size: 8, bold: true, color: C.text });
      y += 9;
    }
    function tick(ok, x, yy) {
      pg.rect(x, yy, 2.8, 2.8, { stroke: ok ? C.ok : C.faint, lw: 0.3, fill: ok ? C.ok : null });
      if (ok) pg.poly([[x + 0.6, yy + 1.4], [x + 1.2, yy + 2.1], [x + 2.3, yy + 0.6], [x + 2.3, yy + 1.1], [x + 1.2, yy + 2.6], [x + 0.6, yy + 1.9]], { fill: '#ffffff' });
    }
    function row(label, value, opts) {
      opts = opts || {};
      const lw = 82;
      const lLines = PM.pdf.wrap(label, lw - 3, 8.5);
      const vLines = value ? PM.pdf.wrap(value, CW - lw - 6, 9, true) : [L.none];
      const hh = Math.max(lLines.length * 3.9, vLines.length * 4.1) + 2.6;
      ensure(hh);
      if (opts.check !== false) tick(!!value, M + 0.3, y + 0.9);
      lLines.forEach((ln, i) => pg.text(ln, M + 5, y + 3.3 + i * 3.9, { size: 8.5, color: C.muted }));
      vLines.forEach((ln, i) => pg.text(ln, M + lw + 3, y + 3.3 + i * 4.1, { size: 9, bold: !!value, color: value ? C.text : C.faint }));
      y += hh;
      pg.line(M, y - 1.1, W - M, y - 1.1, { stroke: C.line, lw: 0.15 });
    }
    function checkRow(f) {
      const val = v[f.key], note = v[f.key + '_note'];
      const lLines = PM.pdf.wrap(f.label, CW - 36, 8.8);
      const nLines = note ? PM.pdf.wrap(note, CW - 36, 8) : [];
      const nph = (v[f.key + '_ph'] || []).length;
      const hh = lLines.length * 4 + nLines.length * 3.7 + (nph ? 3.7 : 0) + 3;
      ensure(hh);
      const map = { ok: [F.ok, C.ok], nok: [F.nok, C.bad], na: [F.na, '#8a909a'] };
      const st = map[val];
      if (st) {
        const w = Math.max(16, PM.pdf.textWidth(st[0], 7.5, true) + 5);
        pg.rect(M, y + 0.4, w, 4.6, { fill: st[1], r: 1 });
        pg.text(st[0], M + w / 2, y + 3.7, { size: 7.5, bold: true, color: '#ffffff', align: 'center' });
      } else pg.rect(M, y + 0.4, 16, 4.6, { stroke: C.faint, lw: 0.3, r: 1 });
      lLines.forEach((ln, i) => pg.text(ln, M + 32, y + 3.6 + i * 4, { size: 8.8, color: C.text }));
      let yy = y + 3.6 + lLines.length * 4;
      nLines.forEach(ln => { pg.text(ln, M + 32, yy, { size: 8, color: val === 'nok' ? C.bad : C.muted }); yy += 3.7; });
      if (nph) pg.text(nph + ' ' + (nph === 1 ? L.photo : L.photosN) + ' (' + L.seeAppendix + ')', M + 32, yy, { size: 7.5, color: C.muted });
      y += hh;
      pg.line(M, y - 1.1, W - M, y - 1.1, { stroke: C.line, lw: 0.15 });
    }
    function textBox(f) {
      const lines = v[f.key] ? PM.pdf.wrap(v[f.key], CW - 6, 9.5) : [];
      if (!f.hideLabel) { ensure(12); pg.text(f.label, M, y + 3, { size: 8.5, color: C.muted }); y += 5; }
      if (!lines.length) { ensure(8); pg.text(L.none, M + 3, y + 4, { size: 9, color: C.faint }); y += 8; return; }
      ensure(10);
      let segTop = y;
      lines.forEach(ln => {
        if (y + 5 > BOTTOM) { pg.line(M + 0.5, segTop, M + 0.5, y, { stroke: '#c9ced8', lw: 0.8 }); newPage(); segTop = y; }
        pg.text(ln, M + 4, y + 3.8, { size: 9.5, color: C.text });
        y += 4.6;
      });
      pg.line(M + 0.5, segTop, M + 0.5, y, { stroke: '#c9ced8', lw: 0.8 });
      y += 3;
    }
    function gridTable(head, body, widths, opts) {
      opts = opts || {};
      const rh = 5.4;
      ensure(rh * (body.length + 1) + 3);
      const xs = []; let x = M; widths.forEach(w => { xs.push(x); x += w; });
      pg.rect(M, y, CW, rh, { fill: C.head });
      head.forEach((c, i) => pg.text(PM.pdf.fit(c, widths[i] - 2, 7, true), xs[i] + (i ? widths[i] - 1.2 : 1.2), y + 3.7, { size: 7, bold: true, color: C.muted, align: i ? 'right' : 'left' }));
      y += rh;
      body.forEach(r => {
        r.forEach((c, i) => {
          if (c && typeof c === 'object') {           // status chip
            const w = Math.min(widths[i] - 2, PM.pdf.textWidth(c.text, 7, true) + 4);
            pg.rect(xs[i] + widths[i] - 1.2 - w, y + 0.8, w, 3.9, { fill: c.color, r: 0.8 });
            pg.text(c.text, xs[i] + widths[i] - 1.2 - w / 2, y + 3.6, { size: 7, bold: true, color: '#ffffff', align: 'center' });
          } else pg.text(PM.pdf.fit(c == null || c === '' ? (i ? '' : '') : String(c), widths[i] - 2.4, 8, i === 0), xs[i] + (i ? widths[i] - 1.2 : 1.2), y + 3.8, { size: 8, bold: i === 0, color: c == null || c === '' ? C.faint : C.text, align: i ? 'right' : 'left' });
        });
        y += rh;
        pg.line(M, y, W - M, y, { stroke: C.line, lw: 0.15 });
      });
      y += 2;
    }

    newPage();

    // ---- client / contact boxes ----
    const fields = S.visibleFields(rec);
    const personField = fields.find(f => f.type === 'person' && v[f.key]) || fields.find(f => f.type === 'person');
    const us = personField ? PM.store.find('people', v[personField.key]) : null;
    const hasClient = ['client', 'client_contact', 'client_phone', 'client_email'].some(k => v[k]) || (project && project.client);
    if (hasClient || personField) {
      const boxW = (CW - 6) / 2, bh = 26;
      const boxes = [];
      if (hasClient) boxes.push([L.client, [[v.client || (project && project.client) || ''], [L.contact, v.client_contact], [L.phone, v.client_phone], [L.email, v.client_email]]]);
      if (personField) boxes.push([personField.label || co.name || L.contact, [[us ? us.name : ''], [L.phone, us && us.phone], [L.email, us && us.email]]]);
      boxes.forEach((b, i) => {
        const bx = M + i * (boxW + 6);
        pg.rect(bx, y, boxW, bh, { stroke: C.line, lw: 0.3, r: 1.5 });
        pg.text(PM.pdf.fit(b[0].toUpperCase(), boxW - 6, 7, true), bx + 3, y + 5, { size: 7, bold: true, color: C.muted });
        b[1].forEach((ln, j) => {
          const yy = y + 10.5 + j * 4.6;
          if (ln.length === 1) pg.text(PM.pdf.fit(ln[0] || L.none, boxW - 6, 10.5, true), bx + 3, yy, { size: 10.5, bold: true, color: ln[0] ? C.text : C.faint });
          else { pg.text(ln[0], bx + 3, yy, { size: 8, color: C.muted }); pg.text(PM.pdf.fit(ln[1] || L.none, boxW - 34, 8.5), bx + 30, yy, { size: 8.5, color: ln[1] ? C.text : C.faint }); }
        });
      });
      y += bh + 4;
    }
    if (v.address) {
      const lines = PM.pdf.wrap(v.address, CW - 36, 9);
      pg.text(L.address, M, y + 3.5, { size: 8, color: C.muted });
      lines.forEach((ln, i) => pg.text(ln, M + 34, y + 3.5 + i * 4.2, { size: 9, bold: true, color: C.text }));
      y += lines.length * 4.2 + 4;
    }

    // ---- deviations summary (check items "Not OK") ----
    const checksAll = fields.filter(f => f.type === 'check');
    if (checksAll.length) {
      const dev = checksAll.filter(f => v[f.key] === 'nok');
      const okN = checksAll.filter(f => v[f.key] === 'ok').length;
      const naN = checksAll.filter(f => v[f.key] === 'na').length;
      const lines = [];
      dev.forEach(f => { lines.push({ t: '• ' + f.label, b: true }); if (v[f.key + '_note']) PM.pdf.wrap(v[f.key + '_note'], CW - 14, 8).forEach(n => lines.push({ t: n, b: false })); });
      const hh = 12 + lines.length * 4;
      ensure(Math.min(hh, 80));
      pg.rect(M, y, CW, hh, { fill: dev.length ? '#fdf0f0' : '#eef8f2', r: 1.5 });
      pg.text((dev.length ? L.deviations + ': ' + dev.length : L.noDeviations).toUpperCase(), M + 3, y + 5.2, { size: 8, bold: true, color: dev.length ? C.bad : C.ok });
      pg.text(okN + ' / ' + checksAll.length + ' ' + L.summary + (naN ? '  ·  ' + naN + ' ' + F.na : ''), W - M - 3, y + 5.2, { size: 8, color: C.muted, align: 'right' });
      let yy = y + 10.5;
      lines.forEach(ln => { if (yy > BOTTOM) return; pg.text(PM.pdf.fit(ln.t, CW - 10, 8.5, ln.b), M + (ln.b ? 3 : 6.5), yy, { size: ln.b ? 8.5 : 8, bold: ln.b, color: ln.b ? C.text : C.muted }); yy += 4; });
      y += hh + 4;
    }

    // ---- sections ----
    const usedKeys = new Set(BOXED.concat(personField ? [personField.key] : []));
    for (const sec of S.expand(t, v)) {
      const fs = sec.fields.filter(f => S.isVisible(f, v) && !usedKeys.has(f.key) && f.type !== 'photos');
      if (!fs.length) continue;
      sectionTitle(sec.title);
      if (sec.sec.note) { PM.pdf.wrap(sec.sec.note, CW, 7.5).forEach(ln => { ensure(4); pg.text(ln, M, y + 2, { size: 7.5, color: C.muted }); y += 3.6; }); y += 1.5; }
      const positions = fs.filter(f => f.type === 'position');
      if (positions.length) {
        const dw = 44, dh = dw / S.PUMPSET_RATIO;
        ensure(dh + 4);
        const top = y;
        S.drawPumpset(pg, W - M - dw, top, dw, S.marksFor(rec), t.diagram);
        positions.forEach(f => {
          const val = v[f.key];
          const m = S.MARKS[f.mark];
          pg.circle(M + 2, y + 2.6, 1.6, { fill: m ? m.color : C.accent });
          pg.text(PM.pdf.fit(f.label, 84, 9), M + 6, y + 3.6, { size: 9, color: C.text });
          pg.text(val || L.none, M + 92, y + 3.8, { size: 13, bold: true, color: val ? (m ? m.color : C.text) : C.faint });
          y += 9;
          pg.line(M, y - 2, W - M - dw - 6, y - 2, { stroke: C.line, lw: 0.15 });
        });
        y = Math.max(y, top + dh) + 4;
      }
      for (const f of fs) {
        if (f.type === 'position') continue;
        if (f.type === 'check') { checkRow(f); continue; }
        if (f.type === 'textarea' && (f.hideLabel || (v[f.key] || '').length > 90)) { textBox(f); continue; }
        if (f.type === 'pumptest') {
          ensure(30);
          pg.text(f.label, M, y + 3.4, { size: 9, bold: true, color: C.text });
          const rq = v[S.resolveKey(f, f.ratedFlow, v)], rp = v[S.resolveKey(f, f.ratedPressure, v)];
          if (rp) pg.text('Rated: ' + (rq || '?') + ' ' + f.flowUnit + ' at ' + rp + ' ' + f.pressureUnit, W - M, y + 3.4, { size: 8, color: C.muted, align: 'right' });
          y += 6;
          const chk = S.pumpCheck(f, v, t);
          gridTable(['', F.flow + ' (' + f.flowUnit + ')', F.suction + ' (' + f.pressureUnit + ')', F.discharge + ' (' + f.pressureUnit + ')', F.net + ' (' + f.pressureUnit + ')', '% ' + F.rated, F.speed + ' (rpm)', F.pass + '?'],
            chk.map(r => [r.label, r.flow, r.suction, r.discharge, r.net == null ? '' : U.fmtNum(r.net), r.ratio == null ? '' : Math.round(r.ratio * 100) + '%', r.rpm, r.ok == null ? '' : { text: r.ok ? F.pass : F.fail, color: r.ok ? C.ok : C.bad }]),
            [26, 22, 22, 24, 24, 20, 22, CW - 160]);
          if (f.hint) PM.pdf.wrap(f.hint, CW, 7).forEach(ln => { ensure(4); pg.text(ln, M, y + 1.5, { size: 7, color: C.muted }); y += 3.4; });
          y += 3;
          continue;
        }
        if (f.type === 'table') {
          if (!S.isAnswered(f, v)) { row(f.label, '', { check: !f.optional }); continue; }
          ensure(12);
          pg.text(f.label, M, y + 3.4, { size: 9, bold: true, color: C.text }); y += 6;
          const cols = f.cols || [];
          const first = 40, w = (CW - first) / Math.max(1, cols.length);
          gridTable([''].concat(cols), (f.rows || []).map((r, i) => [r].concat(cols.map((c, j) => v[f.key + '_r' + (i + 1) + '_c' + (j + 1)] || ''))), [first].concat(cols.map(() => w)));
          continue;
        }
        row(f.label, answer(f, v, t), { check: !f.optional });
      }
      y += 3;
    }

    // ---- photos ----
    const photoItems = [];
    S.expand(t, v).forEach(sec => sec.fields.filter(f => S.isVisible(f, v)).forEach(f => {
      const list = f.type === 'photos' ? v[f.key] : f.type === 'check' ? v[f.key + '_ph'] : null;
      if (list && list.length) photoItems.push({ label: (sec.n ? sec.title + ' – ' : '') + f.label, list });
    }));
    if (photoItems.length) {
      sectionTitle(L.photos);
      for (const it of photoItems) {
        ensure(12);
        pg.text(PM.pdf.fit(it.label, CW, 9, true), M, y + 3, { size: 9, bold: true, color: C.text });
        y += 6;
        const per = 3, gap = 4, cw = (CW - gap * (per - 1)) / per;
        let col = 0, rowH = 0;
        for (const rel of it.list) {
          let img = null;
          try { const u = await PM.files.url(S.photoPath(rec, rel)); if (u) img = await PM.pdf.loadImage(u, 1400); } catch (e) { /* missing */ }
          const ih = img ? Math.min(cw / img.ratio, 70) : 30;
          const iw = img ? ih * img.ratio : cw;
          if (col === 0) ensure(ih + 4);
          const x = M + col * (cw + gap);
          if (img) pg.image(img, x + (cw - iw) / 2, y, iw, ih);
          else { pg.rect(x, y, cw, ih, { fill: C.head }); pg.text('—', x + cw / 2, y + ih / 2, { size: 8, color: C.muted, align: 'center' }); }
          rowH = Math.max(rowH, ih);
          col++;
          if (col === per) { col = 0; y += rowH + gap; rowH = 0; }
        }
        if (col) y += rowH + gap;
        y += 2;
      }
    }

    // ---- signatures (to sign by pen) ----
    if (t.signatures && t.signatures.length) {
      const bh = 34, gap = 6, per = 2, bw = (CW - gap) / per;
      ensure(10 + bh);
      sectionTitle(L.signatures);
      t.signatures.forEach((label, i) => {
        if (i % per === 0 && i) { y += bh + gap; ensure(bh); }
        const x = M + (i % per) * (bw + gap);
        pg.rect(x, y, bw, bh, { stroke: '#c9ced8', lw: 0.35, r: 1.5 });
        pg.text(PM.pdf.fit(label.toUpperCase(), bw - 6, 7.5, true), x + 3, y + 5, { size: 7.5, bold: true, color: C.muted });
        [[L.name, 12], [L.date, 19]].forEach(([lab, yy]) => { pg.text(lab, x + 3, y + yy, { size: 8, color: C.muted }); pg.line(x + 24, y + yy + 0.6, x + bw - 4, y + yy + 0.6, { stroke: '#b9bfca', lw: 0.25 }); });
        pg.text(L.signature, x + 3, y + 27, { size: 8, color: C.muted });
        pg.line(x + 24, y + bh - 3, x + bw - 4, y + bh - 3, { stroke: '#b9bfca', lw: 0.25 });
      });
      y += bh + 4;
    }

    // ---- footers (page count known now) ----
    pages.forEach((p, i) => {
      const fy = H - M + 4;
      p.line(M, fy - 4, W - M, fy - 4, { stroke: C.line, lw: 0.2 });
      const foot = co.footer || [co.name, co.address, co.phone, co.email, co.website].filter(Boolean).join('  ·  ');
      if (foot) p.text(PM.pdf.fit(foot, CW - 28, 6.5), M, fy, { size: 6.5, color: C.muted });
      p.text(L.page + ' ' + (i + 1) + ' ' + L.of + ' ' + pages.length, W - M, fy, { size: 6.5, color: C.muted, align: 'right' });
    });
    return doc.output();
  }

  return { render, answer };
})();

  </script>
  <script>/* js/modules/surveys.js */
/* PM Tool — modules/surveys.js
 * Forms: site surveys, specifications, checklists, FAT reports.
 * List per project, a phone-friendly form per record (with the pump-set
 * drawing, photos, checks, test tables), and a PDF report.
 * Form definitions: settings/forms/*.md (see js/surveys/surveys.js).
 * Route: #/surveys?project=P-001&survey=S-001
 */
(function () {
  const U = PM.util, h = U.h, S = PM.surveys;
  const STATUS = { draft: 'Draft', complete: 'Complete' };
  let lastSurveyor = '';
  try { lastSurveyor = localStorage.getItem('pm.surveyor') || ''; } catch (e) { /* ignore */ }

  /* ---------- list ---------- */
  function renderList(el, ctx) {
    const all = PM.store.list('surveys', ctx.projectId ? { project: ctx.projectId } : null)
      .sort((a, b) => String((b.values || {}).date || '').localeCompare(String((a.values || {}).date || '')) || b.id.localeCompare(a.id));
    el.appendChild(h('div', { class: 'page-head' },
      h('div', null, h('h1', null, 'Forms'), h('p', { class: 'muted' }, (ctx.project ? ctx.project.name : 'All projects') + ' · ' + all.length + ' form' + (all.length === 1 ? '' : 's'))),
      h('span', { class: 'spacer' }),
      h('a', { class: 'btn ghost', href: '#/settings?tab=forms' }, 'Edit forms'),
      h('button', { class: 'btn primary', onclick: () => newDialog(ctx) }, '+ New form')));

    if (!all.length) {
      el.appendChild(h('div', { class: 'empty-state survey-empty' },
        h('p', null, 'No forms filled in yet.'),
        h('p', { class: 'small' }, 'Site surveys, prefab pump room specifications, quality checklists and FAT reports. Fill them in on site or in the workshop, add photos, and export a PDF.'),
        h('div', { class: 'btn-row center' }, S.list().map(t => h('button', { class: 'btn', onclick: () => newDialog(ctx, t.id) }, '+ ' + t.short)))));
      return;
    }
    el.appendChild(h('div', { class: 'survey-grid' }, all.map(r => {
      const t = S.get(r.template);
      const v = r.values || {};
      const pr = t ? S.progress(r) : { done: 0, total: 0 };
      const dev = t ? S.deviations(r).length : 0;
      const p = PM.store.project(r.project);
      const who = PM.store.find('people', v.surveyor || v.tester || v.inspector);

  /* ---------- editor ---------- */
  function renderEditor(el, ctx, rec) {

    const T = S.lang(t);

    const v = rec.values;
    const save = U.debounce(() => PM.store.update('surveys', rec._key, { values: v }), 400);

    const checks = [];          // [{field, el}] — answered markers

    secs.forEach(sec => {

    el.appendChild(h('div', { class: 'sv-bottom' }, h('a', { class: 'btn ghost', href: '#/surveys?project=' + rec.project }, '‹ Back to forms'), h('span', { class: 'spacer' }), pdf2));
    refresh();

    /* ----- field renderers ----- */
    function fieldRow(f) {
      const id = 'sv-' + f.key;

    function textInput(key, attrs) {

    function segmented(key, options, labels, onPick) {

    function numInput(key, attrs) { return textInput(key, Object.assign({ type: 'text', inputmode: 'decimal', class: 'num' }, attrs)); }

    function control(f, id) {

          if (other) {

          if (f.other) seg.appendChild(h('button', { type: 'button', class: v[f.key] && !known ? 'on' : '', onclick: e => { other.hidden = false; other.focus(); seg.querySelectorAll('button').forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); } }, T.other));

          const seg = segmented(f.key, ['ok', 'nok', 'na'], [T.ok, T.nok, T.na], () => showExtra());

    function pumpTest(f) {
      const res = h('tbody');
      const ratedInfo = h('p', { class: 'small muted' });
      const cols = [['flow', T.flow + ' (' + f.flowUnit + ')'], ['suction', T.suction + ' (' + f.pressureUnit + ')'], ['discharge', T.discharge + ' (' + f.pressureUnit + ')'], ['rpm', T.speed + ' (rpm)']];

        ratedInfo.textContent = rp ? 'Rated: ' + (rq || '?') + ' ' + f.flowUnit + ' at ' + rp + ' ' + f.pressureUnit : 'Fill in the rated flow and pressure above for the automatic check.';

        h('thead', null, h('tr', null, h('th'), cols.map(c => h('th', null, c[1])), h('th', null, T.net))), res)));

    function photoField(f, id, compact) {
      const grid = h('div', { class: 'sv-photos' + (compact ? ' compact' : '') });
      const input = h('input', { type: 'file', accept: 'image/*', multiple: true, id, class: 'visually-hidden' });
      const draw = () => {
        grid.innerHTML = '';
        (v[f.key] || []).forEach((rel, i) => {
          const thumb = h('button', { type: 'button', class: 'sv-thumb', 'aria-label': T.photo + ' ' + (i + 1) }, PM.files.img(S.photoPath(rec, rel)));

        grid.appendChild(h('label', { class: 'sv-add-photo', for: id }, h('span', { class: 'plus', 'aria-hidden': 'true' }, '+'), h('span', null, T.photo)));
      };

        const files = Array.from(input.files || []);

          try {
            const blob = await PM.files.compress(file);
            const rel = 'photos/' + rec.id + '-' + f.key.replace(/[^a-z0-9_]/gi, '') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + '.jpg';
            await PM.files.save(S.photoPath(rec, rel), blob);
            set(f.key, (v[f.key] || []).concat(rel), true);
            draw();
          } catch (e) { console.error(e); PM.ui.toast('Could not add the photo: ' + e.message, 'error'); }
        }
      });
      draw();
      return h('div', null, grid, input);
    }

    function viewPhoto(f, rel, redraw) {
      const img = PM.files.img(S.photoPath(rec, rel), { class: 'sv-photo-full', alt: f.label });
      PM.ui.dialog({ title: f.label, wide: true, className: 'photo-dialog', content: img,
        actions: [{ label: 'Delete photo', danger: true, onClick: async () => {
          set(f.key, (v[f.key] || []).filter(x => x !== rel), true);
          redraw();
          await PM.files.remove(S.photoPath(rec, rel));
        } }, { label: 'Close', primary: true }] });
    }
  }

  PM.registerModule({
    id: 'surveys', title: 'Forms', icon: '✎', order: 35, manualRefresh: true,
    render(el, ctx) {
      const sid = ctx.params.survey;
      if (sid && ctx.projectId) {
        const rec = PM.store.find('surveys', sid, ctx.projectId);
        if (rec) return renderEditor(el, ctx, rec);
        el.appendChild(h('div', { class: 'error-box' }, 'Form ' + sid + ' not found.'));
      }
      renderList(el, ctx);
    }
  });
  PM.surveysUi = { create };
})();

  <script>/* js/modules/forms-editor.js */
/* PM Tool — modules/forms-editor.js
 * Settings → Forms: list, edit, duplicate, create and delete form definitions.
 * Forms are stored in your data as settings/forms/<id>.md (format: see js/surveys/surveys.js),
 * so they can also be edited directly in GitHub / OneDrive / any text editor.
 */
PM.formsEditor = (function () {
  const U = PM.util, h = U.h, S = PM.surveys;
  const TYPES = [
    ['text', 'Text'], ['textarea', 'Long text'], ['number', 'Number'], ['dims', 'Dimensions'], ['yesno', 'Yes / No'], ['choice', 'Choice'],
    ['check', 'Check (OK / Not OK / N/A)'], ['date', 'Date'], ['tel', 'Phone'], ['email', 'Email'], ['person', 'Person (our team)'],
    ['pipesize', 'Pipe size (DN / ANSI)'], ['pumptest', 'Pump test table'], ['table', 'Table'], ['estimate', 'Days × men'], ['position', 'Position on drawing'], ['photos', 'Photos']
  ];
  const HELP = [
    ['All types', '+optional (not counted in progress) · show=key=Value (only shown when that answer is given) · show=key~text (answer contains text) · +nolabel'],
    ['Text / long text / date', 'default=today · prefill=client | address | number · rows=6 (long text)'],
    ['Number', '+approx (adds ±) · prefix=ø — put the unit in the Unit column'],
    ['Dimensions', 'L; W; H (the parts) — unit in the Unit column'],
    ['Yes / No', '+na adds N/A'],
    ['Choice', 'Option A; Option B; Option C · +other adds “Other…” with free text'],
    ['Check', 'No options needed. Each item gets OK / Not OK / N/A, a remark and photos.'],
    ['Pump test table', 'rated_flow=<key>; rated_pressure=<key>; flow=m³/h; pressure=bar — keys of the rated flow/pressure questions'],
    ['Table', 'rows=Row 1, Row 2; cols=Column 1, Column 2'],
    ['Position on drawing', 'F; G; H; mark=panel (or jockey, fuel, cooling)'],
    ['Sections', 'Repeat a section a number of times by choosing a number question under “Repeat per”. Use {n} in the title for the number.']
  ];

  function badge(t) {
    if (t.source === 'data' && t.builtin && t.edited) return h('span', { class: 'pill small st-review' }, 'built-in, changed');
    if (t.source === 'data' && t.builtin) return h('span', { class: 'pill small' }, 'built-in');
    if (t.source === 'data') return h('span', { class: 'pill small st-active' }, 'your own');
    return h('span', { class: 'pill small' }, 'built-in (not yet in your data)');
  }

  function renderTab(el) {
    const forms = S.list();
    el.appendChild(h('p', { class: 'muted' }, 'Forms are stored in your data as ', h('code', null, 'settings/forms/<id>.md'), '. Changing a question’s text, options or order is safe. Changing a question’s key disconnects answers already given to it.'));
    el.appendChild(h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', onclick: () => newForm() }, '+ New form')));
    el.appendChild(h('div', { class: 'forms-list' }, forms.map(t => {
      const n = S.fieldsOf(t).length;
      const used = PM.store.list('surveys', r => r.template === t.id).length;
      return h('div', { class: 'card form-card' },
        h('div', { class: 'form-card-head' }, h('strong', null, t.name), badge(t)),
        h('div', { class: 'muted small' }, [t.id + '.md', (t.lang || 'en').toUpperCase(), t.sections.length + ' sections', n + ' questions', used + ' filled in'].join(' · ')),
        t.description ? h('p', { class: 'small form-card-desc' }, t.description) : null,
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn small', onclick: () => edit(t) }, 'Edit'),
          h('button', { class: 'btn ghost small', onclick: () => duplicate(t) }, 'Duplicate'),
          t.builtin && t.edited ? h('button', { class: 'btn ghost small', onclick: () => confirmBox('Reset “' + t.name + '” to the built-in version?', 'Your changes to this form are replaced. Answers already given are kept.', 'Reset', async () => { await S.resetForm(t.id); PM.ui.toast('Form reset.', 'ok'); PM.app.render(); }) }, 'Reset to built-in') : null,
          !S.isBuiltin(t.id) ? h('button', { class: 'btn ghost small danger-text', onclick: () => confirmBox('Delete the form “' + t.name + '”?', used ? used + ' filled-in form(s) use it. Their answers are kept, but cannot be opened until the form exists again.' : 'The file ' + t.id + '.md is removed from your data.', 'Delete', async () => { await S.deleteForm(t.id); PM.ui.toast('Form deleted.', 'ok'); PM.app.render(); }) }, 'Delete') : null));
    })));
  }

  function confirmBox(title, text, label, fn) {
    PM.ui.dialog({ title, content: h('p', null, text), actions: [{ label: 'Cancel' }, { label, danger: true, onClick: fn }] });
  }

  function clone(t) {
    return { id: t.id, name: t.name, short: t.short, lang: t.lang || 'en', description: t.description || '', signatures: (t.signatures || []).slice(), diagram: Object.assign({}, t.diagram), intro: t.intro || '',
      sections: t.sections.map(s => ({ id: s.id, title: s.title, note: s.note || '', repeat: s.repeat || '', diagram: !!s.diagram,
        fields: s.fields.map(f => ({ key: f.key, label: f.label, type: f.type, opt: f.opt != null ? f.opt : '', unit: f.unit || '', hint: f.hint || '' })) })) };
  }
  function uniqueId(base) { let id = U.slugify(base) || 'form', i = 2; const b = id; while (S.get(id)) id = b + '-' + i++; return id; }

  function newForm() {
    const t = { id: '', name: 'New form', short: 'New form', lang: 'en', description: '', signatures: [], diagram: {}, sections: [
      { title: 'General', note: '', repeat: '', diagram: false, fields: [
        { key: 'date', label: 'Date', type: 'date', opt: 'default=today', unit: '', hint: '' },
        { key: 'projectnr', label: 'Project number', type: 'text', opt: 'prefill=number', unit: '', hint: '' },
        { key: 'client', label: 'Client', type: 'text', opt: 'prefill=client', unit: '', hint: '' },
        { key: 'surveyor', label: 'Filled in by', type: 'person', opt: '', unit: '', hint: '' }] },
      { title: 'Remarks', note: '', repeat: '', diagram: false, fields: [{ key: 'remarks', label: 'Remarks', type: 'textarea', opt: '+optional; +nolabel; rows=6', unit: '', hint: '' }] }] };
    edit(t, true);
  }
  function duplicate(t) {
    const c = clone(t);
    c.name = t.name + ' (copy)'; c.short = (t.short || t.name) + ' (copy)'; c.id = '';
    edit(c, true);
  }

  function keyFrom(label, used) {
    let k = U.slugify(label).replace(/-/g, '_').slice(0, 24) || 'q';
    if (/^\d/.test(k)) k = 'q_' + k;
    let i = 2; const b = k;
    while (used.has(k)) k = b + '_' + i++;
    return k;
  }

  /* ---------- the editor ---------- */
  function edit(orig, isNew) {
    const t = clone(orig);
    let textMode = false;
    const body = h('div', { class: 'fe' });
    const err = h('p', { class: 'small bad-text', role: 'alert' });

    function allKeys(except) { const s = new Set(); t.sections.forEach(sec => sec.fields.forEach(f => { if (f !== except && f.key) s.add(f.key); })); return s; }
    function inp(obj, prop, attrs) {
      const i = h(attrs && attrs.tag === 'textarea' ? 'textarea' : 'input', Object.assign({ type: 'text', value: obj[prop] || '' }, attrs, { tag: null }));
      if (i.tagName === 'TEXTAREA') i.value = obj[prop] || '';
      i.addEventListener('input', () => { obj[prop] = i.value; });
      return i;
    }

    function draw() {
      body.innerHTML = '';
      if (textMode) {
        const ta = h('textarea', { class: 'fe-text', spellcheck: 'false', 'aria-label': 'Form as Markdown text' });
        ta.value = S.serializeForm(Object.assign({}, t, { id: t.id || uniqueId(t.name) }));
        ta.addEventListener('input', () => { body.dataset.text = ta.value; });
        body.dataset.text = ta.value;
        body.append(h('p', { class: 'small muted' }, 'The form as it is stored in your data. Each section is a table: key | question | type | options | unit | hint.'), ta);
        return;
      }
      const sig = h('input', { type: 'text', value: (t.signatures || []).join('; '), placeholder: 'e.g. Tested by; Witnessed by (client)', id: 'fe-sig' });
      sig.addEventListener('input', () => { t.signatures = sig.value.split(';').map(x => x.trim()).filter(Boolean); });
      const lang = h('select', { id: 'fe-lang' }, [['en', 'English'], ['nl', 'Nederlands']].map(([v, l]) => h('option', { value: v, selected: t.lang === v || null }, l)));
      lang.addEventListener('change', () => { t.lang = lang.value; });
      body.append(h('div', { class: 'form-grid fe-meta' },
        h('label', { class: 'form-row', for: 'fe-name' }, h('span', null, 'Form name *'), inp(t, 'name', { id: 'fe-name' })),
        h('label', { class: 'form-row', for: 'fe-short' }, h('span', null, 'Short name (badge)'), inp(t, 'short', { id: 'fe-short' })),
        h('label', { class: 'form-row', for: 'fe-lang' }, h('span', null, 'Language of buttons and PDF'), lang),
        h('label', { class: 'form-row wide', for: 'fe-desc' }, h('span', null, 'Description'), inp(t, 'description', { id: 'fe-desc' })),
        h('label', { class: 'form-row wide', for: 'fe-sig' }, h('span', null, 'Signature boxes in the PDF (separate with ;)'), sig)));

      t.sections.forEach((sec, si) => {
        const numberKeys = [];
        t.sections.forEach((s2, j) => { if (j < si) s2.fields.forEach(f => { if (f.type === 'number') numberKeys.push(f); }); });
        const rep = h('select', { 'aria-label': 'Repeat per' }, h('option', { value: '' }, '— no —'), numberKeys.map(f => h('option', { value: f.key, selected: sec.repeat === f.key || null }, f.label + ' (' + f.key + ')')));
        rep.addEventListener('change', () => { sec.repeat = rep.value; });
        const dia = h('input', { type: 'checkbox', checked: sec.diagram || null });
        dia.addEventListener('change', () => { sec.diagram = dia.checked; });
        const qWrap = h('div', { class: 'fe-questions' });
        sec.fields.forEach((f, fi) => qWrap.appendChild(questionRow(sec, f, fi)));
        body.appendChild(h('section', { class: 'fe-section' },
          h('div', { class: 'fe-sec-head' },
            inp(sec, 'title', { class: 'fe-sec-title', 'aria-label': 'Section title' }),
            h('div', { class: 'fe-tools' },
              h('button', { type: 'button', class: 'icon-btn', title: 'Move up', disabled: si === 0 || null, onclick: () => { t.sections.splice(si - 1, 0, t.sections.splice(si, 1)[0]); draw(); } }, '↑'),
              h('button', { type: 'button', class: 'icon-btn', title: 'Move down', disabled: si === t.sections.length - 1 || null, onclick: () => { t.sections.splice(si + 1, 0, t.sections.splice(si, 1)[0]); draw(); } }, '↓'),
              h('button', { type: 'button', class: 'icon-btn', title: 'Delete section', onclick: () => { if (!sec.fields.length || confirm('Delete section “' + sec.title + '” with ' + sec.fields.length + ' question(s)?')) { t.sections.splice(si, 1); draw(); } } }, '✕'))),
          h('div', { class: 'fe-sec-opts' },
            h('label', { class: 'form-row' }, h('span', null, 'Note under the title'), inp(sec, 'note')),
            h('label', { class: 'form-row' }, h('span', null, 'Repeat per'), rep),
            h('label', { class: 'check' }, dia, ' Show pump-set drawing')),
          h('div', { class: 'fe-q-head', 'aria-hidden': 'true' }, ['Question', 'Type', 'Options', 'Unit', 'Hint', 'Key', ''].map(x => h('span', null, x))),
          qWrap,
          h('button', { type: 'button', class: 'btn ghost small', onclick: () => { sec.fields.push({ key: '', label: '', type: 'text', opt: '', unit: '', hint: '' }); draw(); const qs = body.querySelectorAll('.fe-section')[si].querySelectorAll('.fe-q input'); const last = qs[qs.length - 6]; if (last) last.focus(); } }, '+ Question')));
      });
      body.appendChild(h('button', { type: 'button', class: 'btn', onclick: () => { t.sections.push({ title: 'New section', note: '', repeat: '', diagram: false, fields: [] }); draw(); } }, '+ Section'));
      body.appendChild(h('details', { class: 'fe-help' }, h('summary', null, 'Help: options per question type'),
        h('dl', null, HELP.map(([k, d]) => [h('dt', null, k), h('dd', null, d)]))));
    }

    function questionRow(sec, f, fi) {
      const label = inp(f, 'label', { placeholder: 'Question', 'aria-label': 'Question' });
      const key = inp(f, 'key', { placeholder: 'auto', 'aria-label': 'Key', class: 'fe-key' });
      label.addEventListener('change', () => { if (!f.key && f.label) { f.key = keyFrom(f.label, allKeys(f)); key.value = f.key; } });
      key.addEventListener('change', () => { f.key = f.key.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_'); key.value = f.key; });
      const type = h('select', { 'aria-label': 'Type' }, TYPES.map(([v, l]) => h('option', { value: v, selected: f.type === v || null }, l)));
      type.addEventListener('change', () => { f.type = type.value; });
      return h('div', { class: 'fe-q' },
        label, type,
        inp(f, 'opt', { placeholder: 'Options', 'aria-label': 'Options' }),
        inp(f, 'unit', { placeholder: 'Unit', 'aria-label': 'Unit', class: 'fe-unit' }),
        inp(f, 'hint', { placeholder: 'Hint', 'aria-label': 'Hint' }),
        key,
        h('div', { class: 'fe-tools' },
          h('button', { type: 'button', class: 'icon-btn', title: 'Move up', disabled: fi === 0 || null, onclick: () => { sec.fields.splice(fi - 1, 0, sec.fields.splice(fi, 1)[0]); draw(); } }, '↑'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Move down', disabled: fi === sec.fields.length - 1 || null, onclick: () => { sec.fields.splice(fi + 1, 0, sec.fields.splice(fi, 1)[0]); draw(); } }, '↓'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Delete question', onclick: () => { sec.fields.splice(fi, 1); draw(); } }, '✕')));
    }

    function validate(form) {
      if (!form.name || !form.name.trim()) return 'Give the form a name.';
      const seen = new Set();
      for (const sec of form.sections) {
        if (!sec.title.trim()) return 'Every section needs a title.';
        for (const f of sec.fields) {
          if (!f.label.trim()) return 'Every question needs a text (section “' + sec.title + '”).';
          if (!f.key) f.key = keyFrom(f.label, seen);
          if (!/^[a-z0-9_]+$/.test(f.key)) return 'Key “' + f.key + '” may only contain a–z, 0–9 and _.';
          if (seen.has(f.key)) return 'The key “' + f.key + '” is used twice. Every question needs its own key.';
          seen.add(f.key);
        }
      }
      return null;
    }

    const modeBtn = h('button', { type: 'button', class: 'btn ghost', onclick: () => {
      if (textMode) {
        try { const p = S.parseForm(body.dataset.text || '', 'data'); Object.assign(t, clone(p)); }
        catch (e) { err.textContent = 'The text could not be read: ' + e.message; return; }
      }
      textMode = !textMode; modeBtn.textContent = textMode ? 'Edit visually' : 'Edit as text'; err.textContent = ''; draw();
    } }, 'Edit as text');

    draw();
    PM.ui.dialog({
      title: isNew ? 'New form' : 'Edit form · ' + orig.name, wide: true, className: 'fe-dialog',
      content: h('div', null, body, err),
      footLeft: modeBtn,
      actions: [{ label: 'Cancel' }, { label: 'Save form', primary: true, onClick: async () => {
        let form = t;
        if (textMode) { try { form = clone(S.parseForm(body.dataset.text || '', 'data')); } catch (e) { err.textContent = 'The text could not be read: ' + e.message; return false; } }
        const problem = validate(form);
        if (problem) { err.textContent = problem; return false; }
        if (!form.id) form.id = uniqueId(form.name);
        if (!isNew && form.id !== orig.id) form.id = orig.id;
        try { await S.saveForm(form); }
        catch (e) { err.textContent = 'Could not save: ' + e.message; return false; }
        PM.ui.toast('Form “' + form.name + '” saved.', 'ok');
        PM.app.render();
      } }]
    });
  }

  return { renderTab, edit, newForm };
})();

  <script>/* js/modules/hours.js */
/* PM Tool — modules/hours.js
 * Time registration. Cost = hours × rate of the role (entry role, else the person's default role).
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { month: '', person: '', last: {} };

  PM.registerModule({
    id: 'hours', title: 'Hours', icon: '◷', order: 40,
    render(el, ctx) {
      const calc = PM.services.calc;
      const all = PM.store.list('hours', ctx.projectId ? { project: ctx.projectId } : null);
      const months = Array.from(new Set(all.map(x => U.monthKey(x.date)).filter(Boolean))).sort().reverse();
      let rows = all;
      if (state.month) rows = rows.filter(x => U.monthKey(x.date) === state.month);
      if (state.person) rows = rows.filter(x => x.person === state.person);

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Hours'), h('p', { class: 'muted' }, (ctx.project ? ctx.project.name : 'All projects') + ' · ' + U.fmtNum(U.sum(rows, x => x.hours)) + ' h · ' + U.fmtMoney(U.sum(rows, calc.entryCost)) + ' labour in this selection'))));

      // Quick entry
      if (ctx.project) {
        const pid = ctx.projectId;
        const def = PM.collection('hours');
        const fld = k => def.fields.find(f => f.key === k);
        const v = Object.assign({ date: U.todayISO(), person: '', role: '', line: '', task: '', hours: '', note: '' }, state.last[pid] || {}, { hours: '', note: '' });
        const mk = k => { const i = PM.ui.input(fld(k), v[k], { record: { project: pid }, projectId: pid, onCommit: val => { v[k] = val; if (k === 'person') roleHint(); if (k === 'task') { const t = PM.store.find('tasks', val, pid); if (t && t.line) { v.line = t.line; lineSel.value = t.line; } } } }); if (i.tagName === 'INPUT') i.addEventListener('input', () => { v[k] = i.value; }); return i; };
        const lineSel = mk('line');
        const hint = h('span', { class: 'muted small' });
        const roleHint = () => { const p = PM.store.find('people', v.person); const r = p && PM.store.find('roles', p.role); hint.textContent = r ? '(default ' + r.name + ')' : ''; };
        roleHint();
        const hoursInp = mk('hours');
        hoursInp.placeholder = 'h';
        const noteInp = mk('note');
        noteInp.placeholder = 'Note';
        const submit = () => {
          if (!U.num(v.hours)) { PM.ui.toast('Enter the number of hours.', 'warn'); hoursInp.focus(); return; }
          if (!v.person) { PM.ui.toast('Choose a person.', 'warn'); return; }
          state.last[pid] = { date: v.date, person: v.person, role: v.role, line: v.line, task: v.task };
          PM.ui.pendingFocus = 'quick-hours';
          PM.store.insert('hours', Object.assign({}, v), pid);
        };
        hoursInp.dataset.focus = 'quick-hours';
        [hoursInp, noteInp].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { v.hours = hoursInp.value; v.note = noteInp.value; submit(); } }));
        el.appendChild(h('div', { class: 'card quick' },
          h('div', { class: 'quick-grid' },
            h('label', null, h('span', null, 'Date'), mk('date')),
            h('label', null, h('span', null, 'Person'), mk('person')),
            h('label', null, h('span', null, 'Role ', hint), mk('role')),
            h('label', null, h('span', null, 'Planning line'), lineSel),
            h('label', null, h('span', null, 'Task'), mk('task')),
            h('label', null, h('span', null, 'Hours'), hoursInp),
            h('label', { class: 'wide' }, h('span', null, 'Note'), noteInp),
            h('button', { class: 'btn primary', onclick: () => { v.hours = hoursInp.value; v.note = noteInp.value; submit(); } }, 'Log hours'))));
      }

      el.appendChild(h('div', { class: 'toolbar' },
        h('select', { 'aria-label': 'Month', onchange: e => { state.month = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'All months'), months.map(m => h('option', { value: m, selected: state.month === m || null }, U.fmtMonth(m)))),
        h('select', { 'aria-label': 'Person', onchange: e => { state.person = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'Everyone'), PM.store.list('people').map(p => h('option', { value: p.id, selected: state.person === p.id || null }, p.name)))));

      el.appendChild(PM.ui.dataTable({
        id: 'hours', collection: 'hours', projectId: ctx.projectId, rows, showProject: !ctx.projectId,
        newRecord: false, defaultSort: ['date', -1],
        extra: [
          { key: 'rate', label: 'Rate', width: 90, align: 'right', after: 'hours', value: x => { const r = calc.rate(calc.entryRole(x)); return r ? U.fmtMoney(r, true) : '⚠ none'; }, sortVal: x => calc.rate(calc.entryRole(x)) },
          { key: 'cost', label: 'Cost', width: 100, align: 'right', after: 'hours', value: x => U.fmtMoney(calc.entryCost(x), true), sortVal: x => calc.entryCost(x) }
        ],
        totals: { hours: r => U.fmtNum(U.sum(r, x => x.hours)), cost: r => U.fmtMoney(U.sum(r, calc.entryCost)) }
      }));
    }
  });
})();

/* PM Tool — modules/costs.js
 * Fixed costs and purchases per project (costs.md). Labour comes from Hours.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { type: '' };

  PM.registerModule({
    id: 'costs', title: 'Costs', icon: '€', order: 50,
    render(el, ctx) {
      const calc = PM.services.calc;
      const s = calc.summary(ctx.projectId ? { project: ctx.projectId } : {});
      const all = PM.store.list('costs', ctx.projectId ? { project: ctx.projectId } : c => { const p = PM.store.project(c.project); return p && p.status !== 'archived'; });

/* PM Tool — modules/reports.js
 * Hours and cost reports, per project or for the whole portfolio.
 * Every table can be exported as CSV; the page prints cleanly (Print / PDF).
 * Uses PM.services.calc.summary() — the same numbers are available to plugins.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { period: 'all', from: '', to: '' };

  function periodRange() {
    const t = U.parseDate(U.todayISO());
    const y = t.getUTCFullYear(), m = t.getUTCMonth();
    const d = (yy, mm, dd) => U.iso(new Date(Date.UTC(yy, mm, dd)));
    switch (state.period) {
      case 'month': return [d(y, m, 1), d(y, m + 1, 0)];
      case 'lastmonth': return [d(y, m - 1, 1), d(y, m, 0)];
      case 'quarter': { const q = Math.floor(m / 3) * 3; return [d(y, q, 1), d(y, q + 3, 0)]; }
      case 'year': return [d(y, 0, 1), d(y, 11, 31)];
      case 'custom': return [state.from, state.to];
      default: return ['', ''];
    }
  }

  PM.registerModule({
    id: 'reports', title: 'Reports', icon: '▥', order: 60,
    render(el, ctx) {
      const calc = PM.services.calc;
      const [from, to] = periodRange();
      const s = calc.summary({ project: ctx.projectId, from, to });
      const M = v => U.fmtMoney(v), N = v => U.fmtNum(v);
      const periodText = from || to ? (from ? U.fmtDate(from) : '…') + ' – ' + (to ? U.fmtDate(to) : '…') : 'All time';

      const periodSel = h('select', { 'aria-label': 'Period', onchange: e => { state.period = e.target.value; ctx.rerender(); } },
        [['all', 'All time'], ['month', 'This month'], ['lastmonth', 'Last month'], ['quarter', 'This quarter'], ['year', 'This year'], ['custom', 'Custom…']]
          .map(([k, t]) => h('option', { value: k, selected: state.period === k || null }, t)));
      const custom = state.period === 'custom' ? [
        h('input', { type: 'date', value: state.from, 'aria-label': 'From', onchange: e => { state.from = e.target.value; ctx.rerender(); } }),
        h('span', { class: 'muted' }, 'to'),
        h('input', { type: 'date', value: state.to, 'aria-label': 'To', onchange: e => { state.to = e.target.value; ctx.rerender(); } })] : null;

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Report · ' + (ctx.project ? ctx.project.name : 'All projects')),
          h('p', { class: 'muted' }, periodText + (ctx.project ? ' · ' + ctx.project.id + (ctx.project.client ? ' · ' + ctx.project.client : '') : ' · ' + s.projects.length + ' project(s)') + ' · generated ' + U.fmtDate(U.todayISO())))));

      el.appendChild(h('div', { class: 'toolbar no-print' }, periodSel, custom,

        h('button', { class: 'btn ghost small', onclick: () => U.download('report-' + (ctx.projectId || 'portfolio') + '-' + U.todayISO() + '.json', JSON.stringify(Object.assign({ generated: U.todayISO(), period: { from, to } }, s), null, 2), 'application/json') }, 'Export JSON'),
        h('button', { class: 'btn primary small', onclick: () => window.print() }, 'Print / PDF')));

      el.appendChild(h('div', { class: 'stats' },
        PM.ui.stat('Hours', N(s.hours) + ' h', s.budgetHours ? 'budget ' + N(s.budgetHours) + ' h · ' + U.fmtPct(s.hours / s.budgetHours) : 'no hour budget', s.budgetHours && s.hours > s.budgetHours ? 'bad' : ''),
        PM.ui.stat('Labour', M(s.labour), s.hours ? 'avg ' + U.fmtMoney(s.labour / s.hours, true) + '/h' : ''),
        PM.ui.stat('Fixed + purchases', M(s.fixed + s.purchases), M(s.fixed) + ' fixed · ' + M(s.purchases) + ' purch.'),
        PM.ui.stat('Total cost', M(s.total), s.budgetCosts ? 'remaining ' + M(s.remainingCosts) : 'no cost budget', s.budgetCosts && s.total > s.budgetCosts ? 'bad' : 'accent')));

      if (s.budgetHours || s.budgetCosts) {
        el.appendChild(PM.ui.section('Budget use' + (from || to ? ' (selected period vs. full budget)' : ''), h('div', { class: 'budget-rows' },
          h('div', { class: 'kv' }, h('span', null, 'Hours: ' + N(s.hours) + ' of ' + N(s.budgetHours) + ' h' + (s.estimateHours ? ' · task estimates ' + N(s.estimateHours) + ' h' : '')), PM.ui.meter(s.hours, s.budgetHours)),
          h('div', { class: 'kv' }, h('span', null, 'Costs: ' + M(s.total) + ' of ' + M(s.budgetCosts)), PM.ui.meter(s.total, s.budgetCosts)))));
      }

      if (s.warnings.length) {
        el.appendChild(h('div', { class: 'warn-box' }, h('strong', null, 'Check your data: '), h('ul', null, s.warnings.slice(0, 8).map(w => h('li', null, w))), s.warnings.length > 8 ? h('p', null, '… and ' + (s.warnings.length - 8) + ' more.') : null));
      }

      if (!ctx.projectId) {
        el.appendChild(PM.ui.reportTable('Projects', [
          { key: 'project', label: 'ID' }, { key: 'name', label: 'Project' }, { key: 'client', label: 'Client' }, { key: 'status', label: 'Status' },
          { key: 'budgetHours', label: 'Budget h', format: N }, { key: 'hours', label: 'Hours', format: N },
          { key: 'budgetCosts', label: 'Budget €', format: M }, { key: 'labour', label: 'Labour', format: M },
          { key: 'fixed', label: 'Fixed', format: M }, { key: 'purchases', label: 'Purchases', format: M },
          { key: 'total', label: 'Total', format: M },
          { key: 'used', label: '% budget', align: 'right', value: r => r.budgetCosts ? r.total / r.budgetCosts : '', format: v => v === '' ? '–' : U.fmtPct(v) }
        ], s.byProject, { filename: 'projects', totals: { budgetHours: N(s.budgetHours), hours: N(s.hours), budgetCosts: M(s.budgetCosts), labour: M(s.labour), fixed: M(s.fixed), purchases: M(s.purchases), total: M(s.total) } }));
      }

      const grid = h('div', { class: 'two-col' });
      el.appendChild(grid);
      grid.appendChild(PM.ui.reportTable('Hours and labour cost per role', [
        { key: 'name', label: 'Role' }, { key: 'rate', label: 'Rate', format: v => U.fmtMoney(v, true), align: 'right' },
        { key: 'hours', label: 'Hours', format: N }, { key: 'cost', label: 'Cost', format: M }
      ], s.byRole, { filename: 'per-role', totals: { hours: N(s.hours), cost: M(s.labour) }, before: s.byRole.length ? PM.ui.bars(s.byRole.map(r => ({ label: r.name, value: r.cost })), { money: true }) : null }));

      grid.appendChild(PM.ui.reportTable('Hours per person', [
        { key: 'name', label: 'Person' }, { key: 'hours', label: 'Hours', format: N }, { key: 'cost', label: 'Cost', format: M }
      ], s.byPerson, { filename: 'per-person', totals: { hours: N(s.hours), cost: M(s.labour) } }));

      el.appendChild(PM.ui.reportTable('Fixed costs and purchases per category', [
        { key: 'type', label: 'Type' }, { key: 'category', label: 'Category' }, { key: 'count', label: 'Lines', format: N }, { key: 'amount', label: 'Amount', format: M }
      ], s.byCategory, { filename: 'per-category', totals: { amount: M(s.fixed + s.purchases) } }));

      el.appendChild(PM.ui.reportTable('Per month', [
        { key: 'month', label: 'Month', format: v => v ? U.fmtMonth(v) : '(no date)' }, { key: 'hours', label: 'Hours', format: N },
        { key: 'labour', label: 'Labour', format: M }, { key: 'fixed', label: 'Fixed', format: M }, { key: 'purchases', label: 'Purchases', format: M }, { key: 'total', label: 'Total', format: M }
      ], s.byMonth, { filename: 'per-month', totals: { hours: N(s.hours), labour: M(s.labour), fixed: M(s.fixed), purchases: M(s.purchases), total: M(s.total) },
        before: s.byMonth.length > 1 ? PM.ui.bars(s.byMonth.map(m => ({ label: m.month ? U.fmtMonth(m.month) : '(no date)', value: m.total })), { money: true }) : null }));

      el.appendChild(PM.ui.reportTable('Per planning line (only lines with hours or costs booked)', [
        ...(ctx.projectId ? [] : [{ key: 'project', label: 'Project' }]),
        { key: 'line', label: 'Line' }, { key: 'group', label: 'Phase' }, { key: 'title', label: 'Title' },
        { key: 'estimate', label: 'Est. h', format: N }, { key: 'hours', label: 'Hours', format: N },
        { key: 'labour', label: 'Labour', format: M }, { key: 'costs', label: 'Costs', format: M }, { key: 'total', label: 'Total', format: M }
      ], s.byLine, { filename: 'per-line' }));
    }
  });
})();

(function () {

    const box = h('div', null,
      PM.ui.section('Data source', h('div', null,

          h('button', { class: 'btn ghost', onclick: () => PM.app.downloadZip(false) }, 'Download all (.zip)'))))
    );

    if (PM.onedrive.configured()) box.appendChild(oneDriveSection());

    // export / import
    const collSel = h('select', { 'aria-label': 'Collection', onchange: e => { state.collection = e.target.value; } },
      PM.collections().map(d => h('option', { value: d.name, selected: state.collection === d.name || null }, d.label)));
    const exportBtns = [], importBtns = [];
    PM.adapters().forEach(a => {

        PM.github.configured() ? h('button', { class: 'btn ghost', onclick: () => PM.app.copyDemoTo(PM.github.backend()) }, 'Copy demo data to GitHub') : null)));
