  <script>/* js/modules/planning.js */
/* PM Tool — modules/planning.js
 * Timeline (Gantt-style bars). One bar per planning line (planning.md).
 * Bars with linked tasks get the project colour; bars without tasks are grey;
 * bars whose tasks are all done (or progress 100%) turn green.
 * Drag a bar to move it, drag its edges to change start/end, click to edit and link tasks.
 */
(function () {
  const U = PM.util, h = U.h;
  const ZOOM = { day: { px: 30, label: 'Days' }, week: { px: 12, label: 'Weeks' }, month: { px: 4, label: 'Months' } };
  const state = { zoom: 'week', collapsed: {}, expandedProjects: {}, view: 'timeline', filter: 'all' };

  let taskIndex = null;            // project/line -> tasks, rebuilt on every timeline render
  function buildIndex() {
    taskIndex = new Map();
    PM.store.list('tasks').forEach(t => { if (t.line) { const k = t.project + '/' + t.line; if (!taskIndex.has(k)) taskIndex.set(k, []); taskIndex.get(k).push(t); } });
  }
  function lineState(l) {
    const tasks = taskIndex ? (taskIndex.get(l.project + '/' + l.id) || []) : PM.services.calc.lineTasks(l.project, l.id);
    const done = tasks.filter(t => t.status === 'done').length;
    const complete = tasks.length > 0 && done === tasks.length;     // green only when every linked task is done
    return { tasks, done, linked: tasks.length > 0, complete };
  }

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / U.DAY + 1) / 7);
  }

  /* ---------------- line dialog: edit + link tasks ---------------- */
  function openLineDialog(line) {
    const pid = line.project;
    const f = PM.ui.form('lines', line, { projectId: pid });
    const taskBox = h('div', { class: 'linked-tasks' });

    function refresh() {
      taskBox.innerHTML = '';
      const linked = PM.services.calc.lineTasks(pid, line.id);
      taskBox.appendChild(h('h4', null, 'Linked tasks (' + linked.length + ')'));
      taskBox.appendChild(linked.length ? h('ul', { class: 'line-list' }, linked.map(t => {
        const who = PM.store.find('people', t.assignee);
        const sel = PM.ui.input(PM.collection('tasks').fields.find(x => x.key === 'status'), t.status, { onCommit: v => { PM.store.update('tasks', t._key, { status: v }); refresh(); } });
        return h('li', null, sel,
          h('div', { class: 'grow' }, h('div', null, t.title), h('div', { class: 'muted small' }, t.id + (who ? ' · ' + who.name : '') + (t.due ? ' · due ' + U.fmtDate(t.due) : ''))),
          h('button', { class: 'btn ghost small', onclick: () => { PM.store.update('tasks', t._key, { line: '' }); refresh(); } }, 'Unlink'));
      })) : h('p', { class: 'muted small' }, 'No tasks linked yet — this bar is shown in grey.'));

      // link an existing task
      const free = PM.store.list('tasks', t => t.project === pid && t.line !== line.id);
      if (free.length) {
        const sel = h('select', { 'aria-label': 'Task to link' }, free.map(t => h('option', { value: t._key }, t.id + ' · ' + t.title + (t.line ? '  (now on ' + t.line + ')' : ''))));
        taskBox.appendChild(h('div', { class: 'inline-form' }, sel, h('button', { class: 'btn small', onclick: () => { PM.store.update('tasks', sel.value, { line: line.id }); refresh(); } }, 'Link task')));
      }
      // create a new task on this line
      const title = h('input', { type: 'text', placeholder: 'New task title…', 'aria-label': 'New task title' });
      const who = PM.ui.input(PM.collection('tasks').fields.find(x => x.key === 'assignee'), '', {});
      const add = () => {
        if (!title.value.trim()) { title.focus(); return; }
        PM.store.insert('tasks', { title: title.value.trim(), line: line.id, assignee: who.value, status: 'todo', due: f.values().end || line.end }, pid);
        refresh();
        taskBox.querySelector('input[type=text]').focus();
      };
      title.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      taskBox.appendChild(h('div', { class: 'inline-form' }, title, who, h('button', { class: 'btn primary small', onclick: add }, 'Add task')));
    }
    refresh();

    const dlg = PM.ui.dialog({
      title: line.id + ' · ' + (line.title || 'Planning line'), wide: true,
      content: h('div', null, f.el, taskBox),
      footLeft: h('button', { class: 'btn danger', onclick: () => {
        if (confirm('Delete planning line ' + line.id + '? Linked tasks stay, but are unlinked.')) { PM.store.remove('lines', line._key); dlg.close(); }
      } }, 'Delete line'),
      actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: () => {
        const v = f.values();
        if (v.start && v.end && v.end < v.start) { PM.ui.toast('End date is before start date.', 'warn'); return false; }
        const patch = {};
        ['group', 'title', 'start', 'end', 'progress', 'milestone'].forEach(k => { if (v[k] !== line[k]) patch[k] = v[k]; });
        if (Object.keys(patch).length) PM.store.update('lines', line._key, patch);
      } }]
    });
  }

  function addLine(pid) {
    const lines = PM.store.list('lines', { project: pid });
    const last = lines[lines.length - 1];
    const start = U.todayISO();
    const rec = PM.store.insert('lines', { title: 'New planning line', group: last ? last.group : '', start, end: U.addDays(start, 6), progress: 0 }, pid);
    openLineDialog(rec);
  }

  /* ---------------- timeline ---------------- */
  function renderTimeline(el, ctx) {
    buildIndex();
    const LABEL_W = PM.ui.isNarrow() ? 150 : 300;
    const px = ZOOM[state.zoom].px;
    const today = U.todayISO();

    // Build the row model
    const rows = [];
    const allLines = [];
    const passes = l => state.filter === 'all' || (state.filter === 'linked') === lineState(l).linked;
    if (ctx.project) {
      const lines = PM.store.list('lines', { project: ctx.projectId });
      const groups = U.groupBy(lines, l => l.group || '');
      groups.forEach((ls, g) => {
        const vis = ls.filter(passes);
        if (!vis.length) return;
        const gk = ctx.projectId + '|' + g;
        if (g) rows.push({ type: 'group', key: gk, title: g, lines: ls, color: ctx.project.color });
        if (!g || !state.collapsed[gk]) vis.forEach(l => rows.push({ type: 'line', line: l }));
        allLines.push(...ls);
      });
    } else {
      PM.store.projects().filter(p => p.status !== 'archived' && p.status !== 'completed').forEach(p => {
        const ls = PM.store.list('lines', { project: p.id });
        rows.push({ type: 'project', key: p.id, title: p.name, project: p, lines: ls, color: p.color });
        allLines.push(...ls);
        if (state.expandedProjects[p.id]) ls.filter(passes).forEach(l => rows.push({ type: 'line', line: l, indent: true }));
        if (!ls.length && p.start && p.end) allLines.push({ start: p.start, end: p.end });
      });
    }

    // Date range
    const starts = allLines.map(l => l.start).filter(Boolean).concat(today);
    const ends = allLines.map(l => l.end || l.start).filter(Boolean).concat(today);
    let from = starts.reduce((a, b) => a < b ? a : b);
    let to = ends.reduce((a, b) => a > b ? a : b);
    from = U.addDays(from, -10);
    const fd = U.parseDate(from);
    from = U.addDays(from, -((fd.getUTCDay() + 6) % 7));       // align to Monday
    to = U.addDays(to, 21);
    const days = U.daysBetween(from, to) + 1;
    const W = days * px;
    const x = d => U.daysBetween(from, d) * px;

    // Header (months + days/weeks)
    const top = h('div', { class: 'g-scale top', style: { width: W + 'px' } });
    const bottom = h('div', { class: 'g-scale bottom', style: { width: W + 'px' } });
    let d = U.parseDate(from);
    const end = U.parseDate(to);
    while (d <= end) {
      const di = U.iso(d);
      if (d.getUTCDate() === 1 || di === from) {
        const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
        const w = Math.min(U.daysBetween(di, U.iso(next)), U.daysBetween(di, to) + 1) * px;
        top.appendChild(h('div', { class: 'g-cell', style: { left: x(di) + 'px', width: w + 'px' } }, w > 50 ? U.MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : (w > 22 ? U.MONTHS[d.getUTCMonth()] : '')));
      }
      if (state.zoom === 'day') {
        const dow = d.getUTCDay();
        bottom.appendChild(h('div', { class: 'g-cell' + (dow === 0 || dow === 6 ? ' wknd' : '') + (di === today ? ' today' : ''), style: { left: x(di) + 'px', width: px + 'px' } }, d.getUTCDate()));
      } else if (state.zoom === 'week' && d.getUTCDay() === 1) {
        bottom.appendChild(h('div', { class: 'g-cell', style: { left: x(di) + 'px', width: 7 * px + 'px' } }, 'W' + isoWeek(d)));
      }
      d = new Date(d.getTime() + U.DAY);
    }

    // background: weekends (day/week zoom) or week lines (month zoom)
    const bg = state.zoom === 'month'
      ? 'repeating-linear-gradient(to right, transparent 0, transparent ' + (7 * px - 1) + 'px, var(--grid) ' + (7 * px - 1) + 'px, var(--grid) ' + (7 * px) + 'px)'
      : 'repeating-linear-gradient(to right, transparent 0, transparent ' + (5 * px) + 'px, var(--weekend) ' + (5 * px) + 'px, var(--weekend) ' + (7 * px) + 'px)';
    const trackStyle = { width: W + 'px', backgroundImage: bg };

    const inner = h('div', { class: 'g-inner', style: { width: (LABEL_W + W) + 'px' } });
    inner.appendChild(h('div', { class: 'g-head' }, h('div', { class: 'g-label head' }, ctx.project ? 'Planning line' : 'Project'), h('div', { class: 'g-scales' }, top, bottom)));

    const body = h('div', { class: 'g-body' });
    inner.appendChild(body);
    if (U.daysBetween(from, today) >= 0) body.appendChild(h('div', { class: 'g-today', style: { left: (LABEL_W + x(today) + px / 2) + 'px' }, title: 'Today' }));

    rows.forEach(r => {
      if (r.type === 'group' || r.type === 'project') {
        const ls = r.lines.filter(l => l.start);
        const s = ls.length ? ls.map(l => l.start).reduce((a, b) => a < b ? a : b) : (r.project && r.project.start);
        const e = ls.length ? ls.map(l => l.end || l.start).reduce((a, b) => a > b ? a : b) : (r.project && r.project.end);
        const open = r.type === 'group' ? !state.collapsed[r.key] : !!state.expandedProjects[r.key];
        const toggle = () => { if (r.type === 'group') state.collapsed[r.key] = open; else state.expandedProjects[r.key] = !open; ctx.rerender(); };
        const linked = r.lines.filter(l => lineState(l).linked).length;
        const label = h('div', { class: 'g-label group', style: { '--pc': r.color || '#2f6fed' } },
          h('button', { class: 'caret', 'aria-expanded': String(open), 'aria-label': (open ? 'Collapse ' : 'Expand ') + r.title, onclick: toggle }, open ? '▾' : '▸'),
          h('span', { class: 'g-title', onclick: toggle }, r.title),
          h('span', { class: 'muted small nowrap', title: linked + ' of ' + r.lines.length + ' planning lines have linked tasks' }, linked + '/' + r.lines.length),
          r.type === 'project' ? h('a', { class: 'open-link small', href: '#/planning?project=' + r.key, title: 'Open project planning' }, 'open ›') : null);
        const track = h('div', { class: 'g-track', style: trackStyle });
        if (s && e) track.appendChild(h('div', { class: 'g-summary', style: { left: x(s) + 'px', width: Math.max(px, (U.daysBetween(s, e) + 1) * px) + 'px', '--pc': r.color || '#2f6fed' }, title: r.title + ': ' + U.fmtDate(s) + ' – ' + U.fmtDate(e) }));
        body.appendChild(h('div', { class: 'g-row group-row' }, label, track));
        return;
      }

      const l = r.line;
      const ls = lineState(l);
      const proj = PM.store.project(l.project);
      const label = h('div', { class: 'g-label' + (r.indent ? ' indent' : '') },
        h('span', { class: 'dot ' + (ls.linked ? 'linked' : '') + (ls.complete ? ' done' : ''), style: ls.linked ? { '--pc': proj.color || '#2f6fed' } : null }),
        h('button', { class: 'g-title link', onclick: () => openLineDialog(l), title: 'Edit ' + l.id }, l.title || l.id),
        h('span', { class: 'muted small nowrap' }, ls.linked ? ls.done + '/' + ls.tasks.length + ' ✓' : ''));
      const track = h('div', { class: 'g-track', style: trackStyle });
      if (l.start) {
        const lEnd = l.end && l.end >= l.start ? l.end : l.start;
        const left = x(l.start), width = Math.max(px, (U.daysBetween(l.start, lEnd) + 1) * px);
        const cls = 'bar' + (ls.linked ? ' linked' : ' unlinked') + (ls.complete ? ' complete' : '') + (l.milestone ? ' milestone' : '');
        const text = (l.title || l.id) + (ls.linked ? '  (' + ls.done + '/' + ls.tasks.length + ')' : '');
        const bar = h('div', {
          class: cls, tabindex: 0, role: 'button',
          style: { left: (l.milestone ? left + px / 2 - 9 : left) + 'px', width: (l.milestone ? 18 : width) + 'px', '--pc': proj.color || '#2f6fed' },
          title: l.id + ' · ' + (l.title || '') + '\n' + U.fmtDate(l.start) + ' – ' + U.fmtDate(lEnd) + '\n' + (ls.linked ? ls.tasks.length + ' linked task(s), ' + ls.done + ' done' : 'No linked tasks') + '\nProgress ' + U.num(l.progress) + '%',
          'aria-label': 'Planning line ' + (l.title || l.id) + ', ' + U.fmtDate(l.start) + ' to ' + U.fmtDate(lEnd)
        },
          l.milestone ? h('div', { class: 'diamond' }) : null,
          l.milestone ? null : h('div', { class: 'bar-prog', style: { width: Math.min(100, U.num(l.progress)) + '%' } }),
          l.milestone ? null : h('div', { class: 'handle l' }),
          l.milestone ? null : h('div', { class: 'handle r' }),
          h('span', { class: 'bar-text' + (width < 120 || l.milestone ? ' outside' : '') }, text));
        bar.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLineDialog(l); } });
        attachDrag(bar, l, px, lEnd);
        track.appendChild(bar);
      }
      body.appendChild(h('div', { class: 'g-row' }, label, track));
    });

    if (!rows.length) body.appendChild(h('div', { class: 'empty-state' }, h('p', null, ctx.project ? 'No planning lines yet.' : 'No active projects.'), ctx.project ? h('button', { class: 'btn primary', onclick: () => addLine(ctx.projectId) }, '+ Add the first line') : null));

    const scroll = h('div', { class: 'gantt', 'data-keep-scroll': 'gantt', style: { '--label-w': LABEL_W + 'px' } }, inner);
    el.appendChild(scroll);

    // Scroll to today the first time
    if (!state.scrolled) {
      state.scrolled = true;
      requestAnimationFrame(() => { scroll.scrollLeft = Math.max(0, x(today) - (scroll.clientWidth - LABEL_W) * 0.3); });
    }
    state.scrollToday = () => { scroll.scrollLeft = Math.max(0, x(today) - (scroll.clientWidth - LABEL_W) * 0.3); };
  }

  /* Drag to move / resize; a click or tap without movement opens the dialog.
   * Mouse / pen: drag straight away.
   * Touch: a swipe scrolls the timeline as usual. Press and hold a bar (~0.4 s) to
   * select it; a selected bar is outlined and can then be dragged, or resized by
   * its edges. Tap anywhere else to deselect. */
  function attachDrag(bar, l, px, lEnd) {
    if (state.touchSel === l._key) bar.classList.add('selected');
    bar.addEventListener('contextmenu', ev => ev.preventDefault());
    bar.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const touch = e.pointerType === 'touch';
      const selected = bar.classList.contains('selected');
      const x0 = e.clientX, y0 = e.clientY;

      if (touch && !selected) {
        // decide between tap (open), hold (select) and swipe (scroll — browser handles it)
        let done = false;
        const timer = setTimeout(() => {
          done = true;
          document.querySelectorAll('.bar.selected').forEach(b => b.classList.remove('selected'));
          state.touchSel = l._key;
          bar.classList.add('selected');
          if (navigator.vibrate) navigator.vibrate(15);
          PM.ui.toast('Bar selected — drag it to move, or drag an edge to change a date. Tap elsewhere to finish.');
        }, 400);
        const end = ev => {
          clearTimeout(timer);
          document.removeEventListener('pointerup', end);
          document.removeEventListener('pointercancel', cancel);
          document.removeEventListener('pointermove', mv);
          if (!done && ev.type === 'pointerup') openLineDialog(l);
        };
        const cancel = () => { clearTimeout(timer); done = true; end({ type: 'pointercancel' }); };
        const mv = ev => { if (Math.abs(ev.clientX - x0) > 8 || Math.abs(ev.clientY - y0) > 8) cancel(); };
        document.addEventListener('pointerup', end);
        document.addEventListener('pointercancel', cancel);
        document.addEventListener('pointermove', mv);
        return;
      }

      const mode = e.target.classList.contains('handle') ? (e.target.classList.contains('l') ? 'start' : 'end') : 'move';
      const left0 = parseFloat(bar.style.left), width0 = parseFloat(bar.style.width);
      let dd = 0, moved = false;
      const textEl = bar.querySelector('.bar-text');
      const text0 = textEl.textContent;
      try { bar.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      bar.classList.add('dragging');
      const onMove = ev => {
        const dx = ev.clientX - x0;
        if (Math.abs(dx) > 3) moved = true;
        if (!moved || l.milestone && mode !== 'move') return;
        dd = Math.round(dx / px);
        let s = l.start, en = lEnd;
        if (mode === 'move') { s = U.addDays(l.start, dd); en = U.addDays(lEnd, dd); bar.style.left = (left0 + dd * px) + 'px'; }
        else if (mode === 'start') { dd = Math.min(dd, U.daysBetween(l.start, lEnd)); s = U.addDays(l.start, dd); bar.style.left = (left0 + dd * px) + 'px'; bar.style.width = (width0 - dd * px) + 'px'; }
        else { dd = Math.max(dd, -U.daysBetween(l.start, lEnd)); en = U.addDays(lEnd, dd); bar.style.width = (width0 + dd * px) + 'px'; }
        textEl.textContent = U.fmtDate(s) + ' – ' + U.fmtDate(en);
      };
      const cleanup = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
        bar.classList.remove('dragging');
        textEl.textContent = text0;
      };
      const onCancel = () => { cleanup(); bar.style.left = left0 + 'px'; bar.style.width = width0 + 'px'; };
      const onUp = () => {
        cleanup();
        if (!moved) { if (!touch) openLineDialog(l); return; }
        if (!dd) return;
        const patch = mode === 'move' ? { start: U.addDays(l.start, dd), end: U.addDays(lEnd, dd) }
          : mode === 'start' ? { start: U.addDays(l.start, dd) } : { end: U.addDays(lEnd, dd) };
        PM.store.update('lines', l._key, patch);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
    });
  }
  // a tap outside the selected bar ends touch editing
  document.addEventListener('pointerdown', e => {
    if (!state.touchSel || (e.target.closest && e.target.closest('.bar.selected'))) return;
    state.touchSel = null;
    document.querySelectorAll('.bar.selected').forEach(b => b.classList.remove('selected'));
  }, true);

  PM.registerModule({
    id: 'planning', title: 'Planning', icon: '▤', order: 20,
    render(el, ctx) {
      if (state.lastPid !== ctx.projectId) { state.lastPid = ctx.projectId; state.scrolled = false; }
      const zoomBtns = h('div', { class: 'seg', role: 'group', 'aria-label': 'Zoom' }, Object.keys(ZOOM).map(z =>
        h('button', { class: state.zoom === z ? 'on' : '', 'aria-pressed': String(state.zoom === z), onclick: () => { state.zoom = z; state.scrolled = false; ctx.rerender(); } }, ZOOM[z].label)));
      const viewBtns = ctx.project ? h('div', { class: 'seg', role: 'group', 'aria-label': 'View' }, ['timeline', 'table'].map(v =>
        h('button', { class: state.view === v ? 'on' : '', 'aria-pressed': String(state.view === v), onclick: () => { state.view = v; ctx.rerender(); } }, v === 'timeline' ? 'Timeline' : 'Table'))) : null;
      const filter = h('select', { 'aria-label': 'Show lines', onchange: e => { state.filter = e.target.value; ctx.rerender(); } },
        [['all', 'All lines'], ['linked', 'With tasks'], ['unlinked', 'Without tasks']].map(([v, t]) => h('option', { value: v, selected: state.filter === v || null }, t)));

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Planning'), h('p', { class: 'muted' }, ctx.project ? ctx.project.name : 'All active projects — expand a project to see its lines')),
        h('span', { class: 'spacer' }),
        h('div', { class: 'legend' },
          h('span', null, h('i', { class: 'lg unlinked' }), 'No tasks'),
          h('span', null, h('i', { class: 'lg linked', style: { '--pc': ctx.project ? ctx.project.color : '#2f6fed' } }), 'Tasks linked'),
          h('span', null, h('i', { class: 'lg complete' }), 'All tasks done'))));

      el.appendChild(h('div', { class: 'toolbar' },
        viewBtns,
        state.view === 'timeline' || !ctx.project ? zoomBtns : null,
        state.view === 'timeline' || !ctx.project ? h('button', { class: 'btn ghost small', onclick: () => state.scrollToday && state.scrollToday() }, 'Today') : null,
        filter,
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn small', onclick: () => PM.planningPdf.open(ctx.projectId) }, 'Export PDF'),
        ctx.project ? h('button', { class: 'btn primary small', onclick: () => addLine(ctx.projectId) }, '+ Planning line') : null));

      if (ctx.project && state.view === 'table') {
        taskIndex = null;
        el.appendChild(PM.ui.dataTable({
          id: 'lines', collection: 'lines', projectId: ctx.projectId,
          rows: PM.store.list('lines', { project: ctx.projectId }).filter(l => state.filter === 'all' || (state.filter === 'linked') === lineState(l).linked),
          newRecord: () => { const s = U.todayISO(); return { start: s, end: U.addDays(s, 6) }; },
          extra: [{ key: 'tasks', label: 'Tasks', width: 80, align: 'right', value: l => { const s = lineState(l); return s.linked ? s.done + '/' + s.tasks.length : '–'; } }]
        }));
        return;
      }
      renderTimeline(el, ctx);
      taskIndex = null;            // dialogs opened later must see live data
    },
    destroy() { state.scrolled = false; }
  });

  PM.planning = { openLineDialog, addLine, lineState };
})();

  </script>
  <script>/* js/modules/planning-pdf.js */
/* PM Tool — modules/planning-pdf.js
 * "Export PDF" for the planning: ready-made formats (presets) for customers,
 * the team, the workshop and management, every option adjustable, a live
 * preview, and your own presets saved in settings/pdf-presets.md.
 *
 *   PM.planningPdf.open(projectId)      open the export screen
 *   PM.planningPdf.PRESETS              built-in presets
 *   PM.planningPdf.render(options)      -> Promise<Blob> (for plugins / automation)
 */
(function () {
  const U = PM.util, h = U.h;

  /* ---------- presets ---------- */
  const BASE = {
    scope: 'project', period: 'project', from: '', to: '', lines: 'all', phases: [],
    tasks: 'none',                                 // none | list | detail
    cols: { id: false, start: true, end: true, duration: true, progress: true, tasks: false, assignee: false, hours: false, cost: false },
    groupPhases: true, milestones: true, today: true, legend: true, weekends: true,
    colors: 'project',                             // project | status | mono
    paper: 'A4', orientation: 'landscape', fit: 'page',
    showDescription: true, showLogo: true, summary: false, label: '', title: 'Project planning', size: 'normal'
  };
  const PRESETS = [
    { id: 'customer', name: 'Customer', description: 'Clean overview for the client: phases, bars, milestones and dates. No costs, hours, people or internal notes.',
      options: { cols: { start: true, end: true, duration: true, progress: true }, tasks: 'none', colors: 'project', title: 'Project planning', label: '', fit: 'page' } },
    { id: 'internal', name: 'Internal team', description: 'Full planning with linked tasks, assignees and status. Spread over several pages if needed.',
      options: { cols: { id: true, start: true, end: true, progress: true, tasks: true, assignee: true }, tasks: 'detail', colors: 'status', paper: 'A3', fit: 'pages', title: 'Project planning — internal', label: 'Internal' } },
    { id: 'workshop', name: 'Workshop', description: 'The next 6 weeks only, unfinished work, who does what. Large text, black and white for the printer.',
      options: { period: 'next6', lines: 'open', cols: { start: true, end: true, assignee: true }, tasks: 'list', colors: 'mono', fit: 'page', size: 'large', title: 'Work planning', label: 'Internal', showDescription: false } },
    { id: 'management', name: 'Management', description: 'Planning with hours and costs per line, plus budget versus actual. Confidential.',
      options: { cols: { start: true, end: true, progress: true, hours: true, cost: true }, tasks: 'none', colors: 'project', summary: true, title: 'Planning & cost overview', label: 'Confidential' } }
  ];
  function merge(base, extra) {
    const o = JSON.parse(JSON.stringify(base));
    Object.keys(extra || {}).forEach(k => {
      if (k === 'cols') o.cols = Object.assign({ id: false, start: false, end: false, duration: false, progress: false, tasks: false, assignee: false, hours: false, cost: false }, extra.cols);
      else o[k] = JSON.parse(JSON.stringify(extra[k]));
    });
    return o;
  }
  function presetOptions(id) {
    const b = PRESETS.find(p => p.id === id);
    if (b) return merge(BASE, b.options);
    const c = PM.store.list('pdfpresets').find(p => p.id === id);
    if (c) { try { return merge(BASE, JSON.parse(c.options || '{}')); } catch (e) { /* broken JSON */ } }
    return merge(BASE, PRESETS[0].options);
  }

  /* ---------- data model ---------- */
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / U.DAY + 1) / 7);
  }

  function build(o, projectId) {
    const calc = PM.services.calc;
    const today = U.todayISO();
    const projects = o.scope === 'all'
      ? PM.store.projects().filter(p => ['active', 'planned', 'on-hold'].includes(p.status || 'active'))
      : [PM.store.project(projectId)].filter(Boolean);
    let from = '', to = '';
    if (o.period === 'custom') { from = o.from; to = o.to; }
    else if (/^next(\d+)$/.test(o.period)) { const wk = +o.period.slice(4); from = U.addDays(today, -((U.parseDate(today).getUTCDay() + 6) % 7)); to = U.addDays(from, wk * 7 - 1); }

    const hoursByLine = new Map(), costByLine = new Map();
    if (o.cols.hours || o.cols.cost || o.summary) {
      PM.store.list('hours').forEach(x => { if (x.line) { const k = x.project + '/' + x.line; const v = hoursByLine.get(k) || { h: 0, c: 0 }; v.h += U.num(x.hours); v.c += calc.entryCost(x); hoursByLine.set(k, v); } });
      PM.store.list('costs').forEach(c => { if (c.line) { const k = c.project + '/' + c.line; costByLine.set(k, (costByLine.get(k) || 0) + calc.costAmount(c)); } });
    }

    const sections = projects.map(p => {
      let lines = PM.store.list('lines', { project: p.id }).filter(l => l.start);
      if (o.phases && o.phases.length && o.scope !== 'all') lines = lines.filter(l => o.phases.includes(l.group || ''));
      const state = l => {
        const tasks = calc.lineTasks(p.id, l.id);
        const done = tasks.filter(t => t.status === 'done').length;
        return { tasks, done, linked: tasks.length > 0, complete: U.num(l.progress) >= 100 || (tasks.length > 0 && done === tasks.length) };
      };
      lines = lines.map(l => Object.assign({}, l, { _s: state(l), _end: l.end && l.end >= l.start ? l.end : l.start }));
      if (o.lines === 'linked') lines = lines.filter(l => l._s.linked);
      if (o.lines === 'open') lines = lines.filter(l => !l._s.complete);
      if (from) lines = lines.filter(l => l._end >= from && l.start <= to);

      const rows = [];
      const groups = U.groupBy(lines, l => l.group || '');
      groups.forEach((ls, g) => {
        if (o.groupPhases && g) rows.push({ type: 'group', title: g, start: ls.map(l => l.start).reduce((a, b) => a < b ? a : b), end: ls.map(l => l._end).reduce((a, b) => a > b ? a : b) });
        ls.forEach(l => {
          const hc = hoursByLine.get(p.id + '/' + l.id) || { h: 0, c: 0 };
          rows.push({ type: 'line', line: l, hours: hc.h, cost: hc.c + (costByLine.get(p.id + '/' + l.id) || 0) });
          if (o.tasks !== 'none') l._s.tasks.filter(t => o.lines !== 'open' || t.status !== 'done').forEach(t => rows.push({ type: 'task', task: t, line: l }));
        });
      });
      const s = o.summary ? calc.summary({ project: p.id }) : null;
      return { project: p, rows, summary: s, progress: calc.progress(p.id) };
    }).filter(sec => sec.rows.length || o.scope !== 'all');

    // overall date range
    let rFrom = from, rTo = to;
    if (!from) {
      const all = [];
      sections.forEach(sec => sec.rows.forEach(r => { if (r.type === 'line') { all.push(r.line.start, r.line._end); } }));
      if (!all.length) sections.forEach(sec => { if (sec.project.start) all.push(sec.project.start); if (sec.project.end) all.push(sec.project.end); });
      if (!all.length) all.push(today, U.addDays(today, 30));
      rFrom = all.reduce((a, b) => a < b ? a : b);
      rTo = all.reduce((a, b) => a > b ? a : b);
      rFrom = U.addDays(rFrom, -((U.parseDate(rFrom).getUTCDay() + 6) % 7));     // Monday
      rTo = U.addDays(rTo, 6 - ((U.parseDate(rTo).getUTCDay() + 6) % 7));        // Sunday
    }
    return { sections, from: rFrom, to: rTo, today };
  }

  /* ---------- layout ---------- */
  const M = 10;                          // page margin (mm)
  const C = {                            // colours
    text: '#1c2230', muted: '#687187', grid: '#e3e6ec', gridStrong: '#c9ced8', head: '#f3f5f8', weekend: '#f6f7f9',
    group: '#eef1f5', today: '#d14343', ok: '#1f9d55', unlinked: '#ffffff', unlinkedLine: '#8a93a6', bad: '#d14343'
  };
  function shade(hex, f) {
    const n = parseInt(String(hex || '#2f6fed').replace('#', ''), 16);
    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.round(f < 0 ? c * (1 + f) : c + (255 - c) * f));
    return '#' + ch.map(c => c.toString(16).padStart(2, '0')).join('');
  }

  function columnsFor(o) {
    const cols = [];
    if (o.cols.id) cols.push({ key: 'id', label: 'ID', w: 13 });
    cols.push({ key: 'title', label: o.groupPhases ? 'Phase / activity' : 'Activity', w: 0, flex: true });
    if (o.cols.assignee) cols.push({ key: 'assignee', label: 'Who', w: 24 });
    if (o.cols.start) cols.push({ key: 'start', label: 'Start', w: 17, align: 'right' });
    if (o.cols.end) cols.push({ key: 'end', label: 'End', w: 17, align: 'right' });
    if (o.cols.duration) cols.push({ key: 'duration', label: 'Days', w: 10, align: 'right' });
    if (o.cols.progress) cols.push({ key: 'progress', label: '%', w: 11, align: 'right' });
    if (o.cols.tasks) cols.push({ key: 'tasks', label: 'Tasks', w: 18, align: 'right' });
    if (o.cols.hours) cols.push({ key: 'hours', label: 'Hours', w: 13, align: 'right' });
    if (o.cols.cost) cols.push({ key: 'cost', label: 'Cost', w: 20, align: 'right' });
    return cols;
  }
  const shortDate = s => { const d = U.parseDate(s); return d ? String(d.getUTCDate()).padStart(2, '0') + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCFullYear()).slice(2) : ''; };

  /* Split rows into pages. Returns [{section, rows, first, last}] plus geometry. */
  function paginate(o, model, page, headerH) {
    const big = o.size === 'large';
    const legendH = o.legend ? 6 : 0, scaleH = 9;
    const bottomLimit = page.h - M - 5 - legendH;          // footer sits below this
    const pages = [];
    let rowH = big ? 7 : 5.6;
    model.sections.forEach(sec => {
      const summaryH = sec.summary ? 15 : 0;
      const descH = o.showDescription && sec.project.description ? Math.min(3, PM.pdf.wrap(sec.project.description, page.w - 2 * M, 8).length) * 3.6 + 2 : 0;
      const avail = bottomLimit - (M + headerH + descH + summaryH + scaleH);
      const availNext = bottomLimit - (M + headerH + scaleH);
      let rh = rowH;
      if (o.fit === 'page') {
        rh = Math.max(big ? 4.5 : 3.2, Math.min(big ? 8 : 6.5, avail / Math.max(1, sec.rows.length)));
      }
      let i = 0, first = true;
      if (!sec.rows.length) pages.push({ sec, rows: [], rh, first: true, descH, summaryH });
      while (i < sec.rows.length) {
        const room = Math.max(1, Math.floor((first ? avail : availNext) / rh));
        pages.push({ sec, rows: sec.rows.slice(i, i + room), rh, first, descH: first ? descH : 0, summaryH: first ? summaryH : 0 });
        i += room; first = false;
      }
    });
    return pages;
  }

  function drawHeader(pg, o, pageInfo, assets, pageNo, total) {
    const W = pg.width;
    const co = PM.company();
    const p = pageInfo.sec.project;
    let x = M;
    const top = M;
    if (o.showLogo && assets.logo) {
      const lh = 12, lw = Math.min(45, lh * assets.logo.ratio);
      pg.image(assets.logo, M, top, lw, lw / assets.logo.ratio);
      x = M + lw + 6;
    } else if (o.showLogo && co.name) {
      pg.text(co.name, M, top + 6, { size: 12, bold: true, color: C.text });
      x = M + PM.pdf.textWidth(co.name, 12, true) + 8;
    }
    const rightW = 62;
    const titleW = W - M - rightW - 6 - x - (o.label ? PM.pdf.textWidth(o.label.toUpperCase(), 7, true) + 10 : 0);
    pg.text(PM.pdf.fit(o.title || 'Project planning', titleW, 8, false), x, top + 3.5, { size: 8, color: C.muted });
    pg.text(PM.pdf.fit(o.scope === 'all' ? 'All active projects' : p.name, titleW, 15, true), x, top + 10, { size: 15, bold: true, color: C.text });
    const sub = o.scope === 'all' ? '' : [p.client, p.id].filter(Boolean).join('  ·  ');
    if (sub) pg.text(PM.pdf.fit(sub, titleW, 9), x, top + 15, { size: 9, color: C.muted });
    // document block (right)
    const bx = W - M - rightW;
    const rowsInfo = [['Date', U.fmtDate(U.todayISO())], o.docNo ? ['Document', o.docNo] : null, o.revision ? ['Revision', o.revision] : null, o.preparedBy ? ['Prepared by', o.preparedBy] : null].filter(Boolean);
    rowsInfo.forEach((r, i) => {
      pg.text(r[0], bx, top + 3.5 + i * 4.2, { size: 7.5, color: C.muted });
      pg.text(PM.pdf.fit(r[1], rightW - 22, 8, true), W - M, top + 3.5 + i * 4.2, { size: 8, bold: true, color: C.text, align: 'right' });
    });
    if (o.label) {
      const lw = PM.pdf.textWidth(o.label.toUpperCase(), 7, true) + 5;
      pg.rect(bx - lw - 5, top + 0.6, lw, 4.6, { fill: '#fdecec', r: 1 });
      pg.text(o.label.toUpperCase(), bx - 5 - lw / 2, top + 3.9, { size: 7, bold: true, color: C.bad, align: 'center' });
    }
    const hy = top + 19;
    pg.line(M, hy, W - M, hy, { stroke: C.gridStrong, lw: 0.4 });
    // footer
    const fy = pg.height - M + 3;
    pg.line(M, fy - 4, W - M, fy - 4, { stroke: C.grid, lw: 0.2 });
    const foot = co.footer || [co.name, co.address, co.phone, co.email, co.website].filter(Boolean).join('  ·  ');
    if (foot) pg.text(PM.pdf.fit(foot, W - 2 * M - 30, 6.5), M, fy, { size: 6.5, color: C.muted });
    pg.text('Page ' + pageNo + ' of ' + total, W - M, fy, { size: 6.5, color: C.muted, align: 'right' });
    return hy;
  }

  function drawPage(pg, o, model, info, assets, pageNo, total) {
    const W = pg.width;
    const big = o.size === 'large';
    let y = drawHeader(pg, o, info, assets, pageNo, total) + 3;
    const p = info.sec.project;
    const color = o.colors === 'mono' ? '#555b66' : (p.color || '#2f6fed');

    if (info.first && info.descH) {
      PM.pdf.wrap(p.description, W - 2 * M, 8).slice(0, 3).forEach((ln, i) => pg.text(ln, M, y + 3 + i * 3.6, { size: 8, color: C.text }));
      y += info.descH;
    }
    if (info.first && info.summaryH && info.sec.summary) {
      const s = info.sec.summary;
      const cells = [
        ['Progress', U.fmtPct(info.sec.progress), ''],
        ['Hours', U.fmtNum(s.hours) + ' h', s.budgetHours ? 'of ' + U.fmtNum(s.budgetHours) + ' h (' + U.fmtPct(s.hours / s.budgetHours) + ')' : 'no budget'],
        ['Labour', U.fmtMoney(s.labour), ''],
        ['Fixed + purchases', U.fmtMoney(s.fixed + s.purchases), ''],
        ['Total cost', U.fmtMoney(s.total), s.budgetCosts ? 'of ' + U.fmtMoney(s.budgetCosts) + ' (' + U.fmtPct(s.total / s.budgetCosts) + ')' : 'no budget']
      ];
      const cw = (W - 2 * M) / cells.length;
      cells.forEach((c, i) => {
        const cx = M + i * cw;
        pg.rect(cx + (i ? 1 : 0), y, cw - (i ? 1 : 0), 12, { fill: C.head, r: 1 });
        pg.text(c[0].toUpperCase(), cx + 3, y + 3.6, { size: 6, bold: true, color: C.muted });
        const over = (i === 1 && s.budgetHours && s.hours > s.budgetHours) || (i === 4 && s.budgetCosts && s.total > s.budgetCosts);
        pg.text(c[1], cx + 3, y + 8.4, { size: 10, bold: true, color: over ? C.bad : C.text });
        if (c[2]) pg.text(PM.pdf.fit(c[2], cw - 30, 6.5), cx + cw - 2, y + 8.4, { size: 6.5, color: over ? C.bad : C.muted, align: 'right' });
      });
      y += info.summaryH;
    }

    // geometry
    const cols = columnsFor(o);
    const fixedW = cols.reduce((a, c) => a + c.w, 0);
    const tableW = W - 2 * M;
    const titleW = Math.max(38, Math.min(big ? 80 : 70, tableW * 0.3));
    cols.find(c => c.flex).w = titleW;
    const leftW = fixedW + titleW;
    const tlX = M + leftW, tlW = tableW - leftW;
    const days = Math.max(1, U.daysBetween(model.from, model.to) + 1);
    const dayW = tlW / days;
    const X = d => tlX + U.daysBetween(model.from, d) * dayW;
    const rh = info.rh;
    const fs = Math.max(5.5, Math.min(big ? 10 : 8.5, rh * 1.5));
    const scaleH = 9;

    // scale header
    pg.rect(M, y, tableW, scaleH, { fill: C.head });
    let cx = M;
    cols.forEach(c => {
      const tx = c.align === 'right' ? cx + c.w - 1.5 : cx + 1.5;
      pg.text(c.label, tx, y + 6, { size: 6.5, bold: true, color: C.muted, align: c.align === 'right' ? 'right' : 'left' });
      cx += c.w;
    });
    const unit = dayW >= 3.2 ? 'day' : dayW * 7 >= 7 ? 'week' : 'month';
    const tableTop = y + scaleH;
    const rowsH = info.rows.length * rh;
    const tableBottom = tableTop + Math.max(rowsH, rh);
    // months (top half)
    let d = U.parseDate(model.from);
    const end = U.parseDate(model.to);
    pg.clip(tlX, y, tlW, scaleH + rowsH + 2);
    while (d <= end) {
      const di = U.iso(d);
      if (d.getUTCDate() === 1 || di === model.from) {
        const next = U.iso(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)));
        const x0 = X(di), x1 = X(next < model.to ? next : U.addDays(model.to, 1));
        const label = (x1 - x0) > 16 ? U.MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : (x1 - x0) > 7 ? U.MONTHS[d.getUTCMonth()] : '';
        pg.line(x0, y, x0, tableBottom, { stroke: C.gridStrong, lw: 0.25 });
        if (label) pg.text(label, x0 + 1.2, y + 3.4, { size: 6.5, bold: true, color: C.text });
      }
      if (unit === 'day') {
        const dow = d.getUTCDay();
        if (o.weekends && (dow === 0 || dow === 6)) pg.rect(X(di), tableTop, dayW, tableBottom - tableTop, { fill: C.weekend });
        pg.text(String(d.getUTCDate()), X(di) + dayW / 2, y + 7.8, { size: 5.5, color: C.muted, align: 'center' });
        if (dow === 1) pg.line(X(di), y + 4.5, X(di), tableBottom, { stroke: C.grid, lw: 0.15 });
      } else if (unit === 'week' && d.getUTCDay() === 1) {
        if (o.weekends) pg.rect(X(U.addDays(di, 5)), tableTop, dayW * 2, tableBottom - tableTop, { fill: C.weekend });
        pg.line(X(di), y + 4.5, X(di), tableBottom, { stroke: C.grid, lw: 0.15 });
        if (dayW * 7 > 6) pg.text('W' + isoWeek(d), X(di) + dayW * 3.5, y + 7.8, { size: 5.5, color: C.muted, align: 'center' });
      }
      d = new Date(d.getTime() + U.DAY);
    }
    pg.unclip();
    pg.line(M, tableTop, W - M, tableTop, { stroke: C.gridStrong, lw: 0.3 });

    // rows
    info.rows.forEach((r, i) => {
      const ry = tableTop + i * rh;
      const base = ry + rh / 2 + fs / 2.83 * 0.36;   // vertical centre for text (pt -> mm)
      if (r.type === 'group') pg.rect(M, ry, tableW, rh, { fill: C.group });
      pg.line(M, ry + rh, W - M, ry + rh, { stroke: C.grid, lw: 0.15 });
      let cx2 = M;
      cols.forEach(c => {
        let v = '', bold = false, color = C.text, size = fs, indent = 0;
        if (r.type === 'group') {
          if (c.key === 'title') { v = r.title; bold = true; }
          else if (c.key === 'start') v = shortDate(r.start);
          else if (c.key === 'end') v = shortDate(r.end);
          color = C.text;
        } else if (r.type === 'line') {
          const l = r.line;
          switch (c.key) {
            case 'id': v = l.id; color = C.muted; break;
            case 'title': v = l.title; indent = o.groupPhases && l.group ? 2.5 : 0; break;
            case 'start': v = shortDate(l.start); break;
            case 'end': v = l.milestone ? '' : shortDate(l._end); break;
            case 'duration': v = l.milestone ? '' : String(U.daysBetween(l.start, l._end) + 1); break;
            case 'progress': v = l.milestone ? '' : U.num(l.progress) + '%'; break;
            case 'tasks': v = l._s.linked ? l._s.done + '/' + l._s.tasks.length : ''; break;
            case 'assignee': { const names = Array.from(new Set(l._s.tasks.map(t => { const pp = PM.store.find('people', t.assignee); return pp ? pp.name.split(' ')[0] : ''; }).filter(Boolean))); v = names.join(', '); color = C.muted; break; }
            case 'hours': v = r.hours ? U.fmtNum(r.hours) : ''; break;
            case 'cost': v = r.cost ? U.fmtMoney(r.cost) : ''; break;
          }
        } else if (r.type === 'task') {
          const t = r.task;
          size = fs * 0.88; color = C.muted;
          switch (c.key) {
            case 'id': v = t.id; break;
            case 'title': v = '– ' + t.title; indent = o.groupPhases ? 5 : 2.5; break;
            case 'assignee': { const pp = PM.store.find('people', t.assignee); v = pp ? pp.name : ''; break; }
            case 'end': v = shortDate(t.due); color = t.status !== 'done' && t.due && t.due < model.today ? C.bad : C.muted; break;
            case 'tasks': v = t.status; break;
            case 'hours': v = t.estimate ? 'est. ' + U.fmtNum(t.estimate) : ''; break;
          }
        }
        if (v) {
          const maxW = c.w - 3 - indent;
          const tx = c.align === 'right' ? cx2 + c.w - 1.5 : cx2 + 1.5 + indent;
          pg.text(PM.pdf.fit(v, maxW, size, bold), tx, base, { size, bold, color, align: c.align === 'right' ? 'right' : 'left' });
        }
        cx2 += c.w;
      });

      // timeline
      pg.clip(tlX, ry, tlW, rh);
      if (r.type === 'group' && r.start) {
        const x0 = X(r.start), x1 = X(U.addDays(r.end, 1));
        const by = ry + rh * 0.38, bh = Math.max(1, rh * 0.22);
        pg.rect(x0, by, x1 - x0, bh, { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
        pg.poly([[x0, by + bh], [x0 + 1.4, by + bh], [x0, by + bh + 1.2]], { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
        pg.poly([[x1, by + bh], [x1 - 1.4, by + bh], [x1, by + bh + 1.2]], { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
      } else if (r.type === 'line') {
        const l = r.line, st = l._s;
        const x0 = X(l.start), x1 = X(U.addDays(l._end, 1));
        const bh = Math.max(1.6, rh * 0.62), by = ry + (rh - bh) / 2;
        if (l.milestone) {
          if (!o.milestones) { pg.unclip(); return; }
          const mx = x0 + dayW / 2, ms = Math.min(bh * 0.62, 2.6);
          pg.poly([[mx, by + bh / 2 - ms], [mx + ms, by + bh / 2], [mx, by + bh / 2 + ms], [mx - ms, by + bh / 2]], { fill: st.complete ? (o.colors === 'mono' ? '#999' : C.ok) : (o.colors === 'mono' ? '#222' : shade(color, -0.2)) });
          pg.text(PM.pdf.fit(l.title, 50, fs * 0.9), mx + ms + 1.2, base, { size: fs * 0.9, color: C.text });
        } else {
          let fill, stroke = null, dash = null, prog, txt = '#ffffff';
          if (o.colors === 'mono') { fill = st.complete ? '#b9bdc4' : '#5d636e'; prog = '#30343b'; }
          else if (o.colors === 'status' && !st.linked) { fill = C.unlinked; stroke = C.unlinkedLine; dash = [0.8, 0.6]; prog = '#dde1e8'; txt = C.text; }
          else if (st.complete) { fill = C.ok; prog = shade(C.ok, -0.22); }
          else { fill = color; prog = shade(color, -0.28); }
          pg.rect(x0, by, Math.max(0.6, x1 - x0), bh, { fill, stroke, lw: 0.25, dash, r: 0.6 });
          const pr = Math.min(100, U.num(l.progress)) / 100;
          if (pr > 0 && pr < 1 && !st.complete) pg.rect(x0, by + bh * 0.7, (x1 - x0) * pr, bh * 0.3, { fill: prog });
          const label = l.title;
          const vx0 = Math.max(x0, tlX), vx1 = Math.min(x1, tlX + tlW);
          const inside = vx1 - vx0 - 2;
          if (inside > 14 && PM.pdf.textWidth(label, fs * 0.85) <= inside) pg.text(label, vx0 + 1, base, { size: fs * 0.85, color: txt });
          else if (inside > 14) pg.text(PM.pdf.fit(label, inside, fs * 0.85), vx0 + 1, base, { size: fs * 0.85, color: txt });
          else if (x1 + 1 < tlX + tlW - 10) pg.text(PM.pdf.fit(label, tlX + tlW - x1 - 2, fs * 0.85), x1 + 1, base, { size: fs * 0.85, color: C.text });
        }
      } else if (r.type === 'task' && r.task.due) {
        const t = r.task;
        const mx = X(t.due) + dayW / 2, ms = Math.min(rh * 0.22, 1.3);
        const late = t.status !== 'done' && t.due < model.today;
        pg.circle(mx, ry + rh / 2, ms, { fill: t.status === 'done' ? (o.colors === 'mono' ? '#999' : C.ok) : late ? C.bad : '#8a93a6' });
      }
      pg.unclip();
    });

    // vertical separators of the column area
    let sx = M;
    cols.forEach(c => { sx += c.w; pg.line(sx, y, sx, tableBottom, { stroke: c.flex || sx === tlX ? C.gridStrong : C.grid, lw: sx === tlX ? 0.35 : 0.15 }); });
    pg.rect(M, y, tableW, tableBottom - y, { stroke: C.gridStrong, lw: 0.3 });

    // today line

      const tx = X(model.today) + dayW / 2;
      pg.line(tx, tableTop, tx, tableBottom, { stroke: C.today, lw: 0.35, dash: [1.2, 0.8] });
      pg.rect(tx - 5, tableTop - 2.6, 10, 2.8, { fill: C.today, r: 0.6 });
      pg.text('Today', tx, tableTop - 0.6, { size: 5.5, bold: true, color: '#ffffff', align: 'center' });
    }
    if (!info.rows.length) pg.text('No planning lines in this selection.', M + 3, tableTop + 5, { size: 8, color: C.muted });

    // legend
    if (o.legend) {
      const ly = tableBottom + 4.6;
      let lx = M;
      const item = (draw, label) => { draw(lx, ly - 2.2); lx += 7; pg.text(label, lx, ly, { size: 6.5, color: C.muted }); lx += PM.pdf.textWidth(label, 6.5) + 6; };
      const mono = o.colors === 'mono';
      item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: mono ? '#5d636e' : color, r: 0.4 }), 'Planned');
      if (o.colors === 'status') item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: '#fff', stroke: C.unlinkedLine, lw: 0.25, dash: [0.8, 0.6], r: 0.4 }), 'No tasks linked');
      item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: mono ? '#b9bdc4' : C.ok, r: 0.4 }), 'Completed');
      item((x, yy) => pg.rect(x, yy + 1.8, 5 * 0.6, 0.8, { fill: mono ? '#30343b' : shade(color, -0.28) }), 'Progress');
      if (o.milestones) item((x, yy) => pg.poly([[x + 2.5, yy - 0.2], [x + 4, yy + 1.3], [x + 2.5, yy + 2.8], [x + 1, yy + 1.3]], { fill: mono ? '#222' : shade(color, -0.2) }), 'Milestone');
      if (o.tasks !== 'none') item((x, yy) => pg.circle(x + 2.5, yy + 1.3, 1, { fill: '#8a93a6' }), 'Task due');
      if (o.today) item((x, yy) => pg.line(x + 2.5, yy - 0.5, x + 2.5, yy + 3, { stroke: C.today, lw: 0.35, dash: [0.8, 0.5] }), 'Today');
    }
  }

  async function loadAssets(o) {
    const out = {};
    const co = PM.company();
    if (o.showLogo && co.logo) {
      try { const u = await PM.files.url(co.logo); if (u) out.logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* logo missing */ }
    }
    return out;
  }

  function pageGeom(o) {
    const s = PM.pdf.SIZES[o.paper] || PM.pdf.SIZES.A4;
    return o.orientation === 'landscape' ? { w: s[1], h: s[0] } : { w: s[0], h: s[1] };
  }

  function layout(o, projectId) {
    const model = build(o, projectId);
    const geom = pageGeom(o);
    const pages = paginate(o, model, geom, 22);

  }

  async function render(o, projectId) {
    const L = layout(o, projectId);
    const assets = await loadAssets(o);
    const doc = PM.pdf.create({ size: o.paper, orientation: o.orientation, title: o.title });
    L.pages.forEach((info, i) => drawPage(doc.addPage(), o, L.model, info, assets, i + 1, L.pages.length));

  }

  /* ---------- export screen ---------- */
  const LS = 'pm.pdf.last';
  function open(projectId) {
    const project = PM.store.project(projectId);
    let last = {};
    try { last = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { /* ignore */ }
    let presetId = last.preset || 'customer';
    let o = presetOptions(presetId);
    const meta = { docNo: (project && project.pdf_docno) || '', revision: (project && project.pdf_revision) || '', preparedBy: last.preparedBy || '' };
    Object.assign(o, meta);
    if (!project) o.scope = 'all';
    let page = 0, assets = {}, L = null;

    const canvas = h('canvas', { class: 'pdf-canvas', 'aria-label': 'Preview of the PDF' });
    const pageInfo = h('span', { class: 'small muted', role: 'status' });
    const warn = h('p', { class: 'small bad-text', role: 'status' });

    const nextBtn = h('button', { class: 'btn ghost small', 'aria-label': 'Next page', onclick: () => { if (L && page < L.pages.length - 1) { page++; draw(); } } }, '›');
    const previewWrap = h('div', { class: 'pdf-preview' }, h('div', { class: 'pdf-canvas-wrap' }, canvas), h('div', { class: 'pdf-pager' }, prevBtn, pageInfo, nextBtn), warn);

    function draw() {
      L = layout(o, projectId);
      page = Math.min(page, L.pages.length - 1);
      const avail = Math.max(260, (previewWrap.clientWidth || 600) - 4);
      const scale = Math.min(4, (avail / L.geom.w) * (window.devicePixelRatio || 1));
      const pg = PM.pdf.canvasPage(canvas, L.geom.w, L.geom.h, scale);
      if (L.pages.length) drawPage(pg, o, L.model, L.pages[page], assets, page + 1, L.pages.length);
      canvas.style.width = '100%';
      pageInfo.textContent = 'Page ' + (page + 1) + ' of ' + L.pages.length + ' · ' + o.paper + ' ' + o.orientation;
      prevBtn.disabled = page === 0; nextBtn.disabled = page >= L.pages.length - 1;
      const rows = L.model.sections.reduce((a, s) => a + s.rows.length, 0);
      warn.textContent = o.fit === 'page' && L.pages.length > L.model.sections.length ? 'Too many rows for one page at a readable size — continued on the next page. Choose A3, fewer lines, or a shorter period.' : (!rows ? 'Nothing to show with these settings.' : '');
    }
    const redraw = U.debounce(draw, 60);
    const set = (k, v) => { o[k] = v; markCustom(); redraw(); };

    // controls
    const presetSel = h('select', { id: 'pdf-preset' });
    function fillPresets() {
      presetSel.innerHTML = '';
      presetSel.appendChild(h('optgroup', { label: 'Ready-made' }, PRESETS.map(p => h('option', { value: p.id, selected: presetId === p.id || null }, p.name))));
      const mine = PM.store.list('pdfpresets');
      if (mine.length) presetSel.appendChild(h('optgroup', { label: 'Your presets' }, mine.map(p => h('option', { value: p.id, selected: presetId === p.id || null }, p.name))));

    const presetDesc = h('p', { class: 'small muted preset-desc' });
    function descFor(id) { const b = PRESETS.find(p => p.id === id); return b ? b.description : id === '_custom' ? 'Your own adjustments.' : 'Your saved preset.'; }
    function markCustom() { if (presetId !== '_custom') { presetId = '_custom'; fillPresets(); presetDesc.textContent = descFor(presetId); } }
    presetSel.addEventListener('change', () => {
      presetId = presetSel.value;

    function seg(name, value, options, onChange) {

    }
    function text(id, label, value, onInput, placeholder) {

    function group(title, ...kids) { return h('fieldset', { class: 'pdf-group' }, h('legend', null, title), kids); }

    function buildControls() {
      controls.innerHTML = '';
      const phases = project ? Array.from(new Set(PM.store.list('lines', { project: projectId }).map(l => l.group || '').filter(Boolean))) : [];
      controls.append(
        group('What',
          project ? seg('Projects', o.scope, [['project', 'This project'], ['all', 'All active projects']], v => { o.scope = v; markCustom(); buildControls(); redraw(); }) : h('p', { class: 'small muted' }, 'All active projects'),
          h('div', { class: 'row2' },
            h('label', { class: 'form-row', for: 'pdf-period' }, h('span', null, 'Period'),
              (() => { const s = h('select', { id: 'pdf-period' }, [['project', 'Whole project'], ['next4', 'Next 4 weeks'], ['next6', 'Next 6 weeks'], ['next13', 'Next 3 months'], ['custom', 'Choose dates…']].map(([v, t]) => h('option', { value: v, selected: o.period === v || null }, t))); s.addEventListener('change', () => { o.period = s.value; markCustom(); buildControls(); redraw(); }); return s; })()),
            h('label', { class: 'form-row', for: 'pdf-lines' }, h('span', null, 'Planning lines'),
              (() => { const s = h('select', { id: 'pdf-lines' }, [['all', 'All lines'], ['open', 'Not finished'], ['linked', 'With tasks only']].map(([v, t]) => h('option', { value: v, selected: o.lines === v || null }, t))); s.addEventListener('change', () => set('lines', s.value)); return s; })())),
          o.period === 'custom' ? h('div', { class: 'row2' },
            (() => { const i = h('input', { type: 'date', id: 'pdf-from', value: o.from }); i.addEventListener('change', () => set('from', i.value)); return h('label', { class: 'form-row', for: 'pdf-from' }, h('span', null, 'From'), i); })(),
            (() => { const i = h('input', { type: 'date', id: 'pdf-to', value: o.to }); i.addEventListener('change', () => set('to', i.value)); return h('label', { class: 'form-row', for: 'pdf-to' }, h('span', null, 'To'), i); })()) : null,
          phases.length && o.scope !== 'all' ? h('div', { class: 'chips', role: 'group', 'aria-label': 'Phases' }, phases.map(ph => {
            const on = !o.phases.length || o.phases.includes(ph);
            return h('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), 'aria-pressed': String(on), onclick: () => {
              let list = o.phases.length ? o.phases.slice() : phases.slice();

          h('label', { class: 'form-row', for: 'pdf-tasks' }, h('span', null, 'Linked tasks'),
            (() => { const s = h('select', { id: 'pdf-tasks' }, [['none', 'Don’t show'], ['list', 'Show under each bar'], ['detail', 'Show with status and due date']].map(([v, t]) => h('option', { value: v, selected: o.tasks === v || null }, t))); s.addEventListener('change', () => set('tasks', s.value)); return s; })())),
        group('Columns',
          h('div', { class: 'check-grid' },
            [['id', 'ID'], ['start', 'Start'], ['end', 'End'], ['duration', 'Days'], ['progress', 'Progress %'], ['tasks', 'Tasks done'], ['assignee', 'Who'], ['hours', 'Hours (internal)'], ['cost', 'Cost (internal)']]
              .map(([k, t]) => check('pdf-col-' + k, t, o.cols[k], v => { o.cols[k] = v; markCustom(); redraw(); }))),
          o.cols.hours || o.cols.cost || o.summary ? h('p', { class: 'small bad-text' }, 'Contains internal hours/costs — not for customers.') : null),
        group('Page',
          seg('Paper', o.paper, [['A4', 'A4'], ['A3', 'A3']], v => { set('paper', v); buildControls(); }),
          seg('Orientation', o.orientation, [['landscape', 'Landscape'], ['portrait', 'Portrait']], v => { set('orientation', v); buildControls(); }),
          seg('Fit', o.fit, [['page', 'Fit on one page'], ['pages', 'Readable, several pages']], v => { set('fit', v); buildControls(); }),
          seg('Colours', o.colors, [['project', 'Project colour'], ['status', 'Show task status'], ['mono', 'Black & white']], v => { set('colors', v); buildControls(); }),
          seg('Text size', o.size, [['normal', 'Normal'], ['large', 'Large']], v => { set('size', v); buildControls(); }),
          h('div', { class: 'check-grid' },
            check('pdf-groups', 'Group by phase', o.groupPhases, v => set('groupPhases', v)),
            check('pdf-ms', 'Milestones', o.milestones, v => set('milestones', v)),
            check('pdf-today', 'Today line', o.today, v => set('today', v)),
            check('pdf-legend', 'Legend', o.legend, v => set('legend', v)),
            check('pdf-weekends', 'Shade weekends', o.weekends, v => set('weekends', v)),
            check('pdf-summary', 'Budget summary (internal)', o.summary, v => { set('summary', v); buildControls(); }))),
        group('Header',
          text('pdf-title', 'Title', o.title, v => set('title', v)),
          h('div', { class: 'row2' },
            text('pdf-docno', 'Document no.', o.docNo, v => { meta.docNo = v; o.docNo = v; redraw(); }, 'e.g. PL-2026-014'),
            text('pdf-rev', 'Revision', o.revision, v => { meta.revision = v; o.revision = v; redraw(); }, 'e.g. B')),
          h('div', { class: 'row2' },
            text('pdf-by', 'Prepared by', o.preparedBy, v => { meta.preparedBy = v; o.preparedBy = v; redraw(); }),
            text('pdf-label', 'Label', o.label, v => set('label', v), 'e.g. Internal')),
          h('div', { class: 'check-grid' },
            check('pdf-logo', 'Company logo', o.showLogo, v => { set('showLogo', v); reloadAssets(); }),
            check('pdf-desc', 'Project description', o.showDescription, v => set('showDescription', v))),
          !PM.company().name && !PM.company().logo ? h('p', { class: 'small muted' }, 'Tip: add your company name and logo in Settings → Company.') : null)
      );
    }

    async function reloadAssets() { assets = await loadAssets(o); redraw(); }

    const saveBtn = h('button', { class: 'btn ghost', onclick: () => {
      const name = h('input', { type: 'text', id: 'preset-name', placeholder: 'e.g. Customer A3 with tasks' });
      PM.ui.dialog({ title: 'Save as preset', content: h('label', { class: 'form-row', for: 'preset-name' }, h('span', null, 'Name'), name),
        actions: [{ label: 'Cancel' }, { label: 'Save preset', primary: true, onClick: () => {
          if (!name.value.trim()) { name.focus(); return false; }
          const copy = JSON.parse(JSON.stringify(o));
          ['docNo', 'revision', 'preparedBy', 'from', 'to', 'scope'].forEach(k => delete copy[k]);
          const rec = PM.store.insert('pdfpresets', { name: name.value.trim(), kind: 'planning', options: JSON.stringify(copy) });
          presetId = rec.id; fillPresets(); presetDesc.textContent = descFor(presetId);
          PM.ui.toast('Preset “' + rec.name + '” saved.', 'ok');
        } }] });
      setTimeout(() => name.focus(), 50);
    } }, 'Save as preset');

    const exportBtn = h('button', { class: 'btn primary', onclick: async () => {
      exportBtn.disabled = true; exportBtn.textContent = 'Creating PDF…';
      try {
        const blob = await render(o, projectId);
        const name = U.slugify((o.scope === 'all' ? 'planning-all-projects' : (project.id + '-' + project.name)) + (o.revision ? '-rev-' + o.revision : '')) + '.pdf';
        if (project && o.scope !== 'all' && (project.pdf_docno !== meta.docNo || project.pdf_revision !== meta.revision)) PM.store.update('projects', project._key, { pdf_docno: meta.docNo, pdf_revision: meta.revision });
        try { localStorage.setItem(LS, JSON.stringify({ preset: presetId === '_custom' ? 'customer' : presetId, preparedBy: meta.preparedBy })); } catch (e) { /* ignore */ }
        const how = await PM.pdf.deliver(blob, name);

      } catch (e) { console.error(e); PM.ui.toast('Could not create the PDF: ' + e.message, 'error'); }
      exportBtn.disabled = false; exportBtn.textContent = PM.app.isTouch() ? 'Create PDF' : 'Download PDF';
    } }, PM.app.isTouch() ? 'Create PDF' : 'Download PDF');

    fillPresets();
    presetDesc.textContent = descFor(presetId);
    buildControls();

    const dlg = PM.ui.dialog({
      title: 'Export planning to PDF', wide: true, className: 'pdf-dialog',
      content: h('div', { class: 'pdf-layout' },
        h('div', { class: 'pdf-side' },
          h('label', { class: 'form-row', for: 'pdf-preset' }, h('span', null, 'Format'), presetSel), presetDesc,
          controls),
        previewWrap),
      footLeft: saveBtn,
      actions: [{ label: 'Close' }, exportBtn]
    });
    requestAnimationFrame(() => { reloadAssets(); draw(); });
    const ro = new ResizeObserver(redraw); ro.observe(previewWrap);
    dlg.el.addEventListener('close', () => ro.disconnect());
  }

  PM.planningPdf = { PRESETS, open, render, presetOptions };
})();

  <script>/* js/modules/tasks.js */
/* PM Tool — modules/tasks.js
 * Task list. The "Planning line" column links a task to a bar on the timeline.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { status: 'open', person: '' };

  PM.registerModule({
    id: 'tasks', title: 'Tasks', icon: '☑', order: 30,
    render(el, ctx) {
      const all = PM.store.list('tasks', ctx.projectId ? { project: ctx.projectId } : t => { const p = PM.store.project(t.project); return p && p.status !== 'archived'; });
      const counts = { all: all.length, open: all.filter(t => t.status !== 'done').length, unlinked: all.filter(t => !t.line).length };
      PM.constants.STATUS_TASK.forEach(s => { counts[s] = all.filter(t => (t.status || 'todo') === s).length; });
      const today = U.todayISO();
      counts.overdue = all.filter(t => t.status !== 'done' && t.due && t.due < today).length;

      const filters = [['open', 'Open'], ['all', 'All']].concat(PM.constants.STATUS_TASK.map(s => [s, s])).concat([['overdue', 'Overdue'], ['unlinked', 'Not on planning']]);
      let rows = all;
      if (state.status === 'open') rows = rows.filter(t => t.status !== 'done');
      else if (state.status === 'overdue') rows = rows.filter(t => t.status !== 'done' && t.due && t.due < today);
      else if (state.status === 'unlinked') rows = rows.filter(t => !t.line);
      else if (state.status !== 'all') rows = rows.filter(t => (t.status || 'todo') === state.status);
      if (state.person) rows = rows.filter(t => t.assignee === state.person);

      const hoursByTask = new Map();
      PM.store.list('hours', ctx.projectId ? { project: ctx.projectId } : null).forEach(x => { if (x.task) { const k = x.project + '/' + x.task; hoursByTask.set(k, (hoursByTask.get(k) || 0) + U.num(x.hours)); } });

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Tasks'), h('p', { class: 'muted' }, (ctx.project ? ctx.project.name : 'All projects') + ' · ' + counts.open + ' open, ' + counts.done + ' done'))));

      el.appendChild(h('div', { class: 'toolbar wrap' },
        h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter by status' }, filters.map(([k, label]) => h('button', {
          class: 'chip' + (state.status === k ? ' on' : '') + (k === 'overdue' && counts.overdue ? ' bad' : ''), 'aria-pressed': String(state.status === k),
          onclick: () => { state.status = k; ctx.rerender(); }
        }, label, h('span', { class: 'chip-n' }, counts[k] || 0)))),
        h('span', { class: 'spacer' }),
        h('select', { 'aria-label': 'Filter by assignee', onchange: e => { state.person = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'Everyone'),
          PM.store.list('people').map(p => h('option', { value: p.id, selected: state.person === p.id || null }, p.name)))));

      el.appendChild(PM.ui.dataTable({
        id: 'tasks', collection: 'tasks', projectId: ctx.projectId, rows, showProject: !ctx.projectId,
        emptyText: ctx.projectId ? 'No tasks match this filter.' : 'No tasks match. Select a project to add tasks.',
        newRecord: ctx.projectId ? () => ({ status: 'todo', assignee: state.person || '' }) : false,
        extra: [{ key: 'logged', label: 'Logged h', width: 85, align: 'right', after: 'estimate', value: t => { const v = hoursByTask.get(t.project + '/' + t.id) || 0; return v ? U.fmtNum(v) : ''; }, sortVal: t => hoursByTask.get(t.project + '/' + t.id) || 0 }],
        totals: { estimate: r => U.fmtNum(U.sum(r, t => t.estimate)), logged: r => U.fmtNum(U.sum(r, t => hoursByTask.get(t.project + '/' + t.id) || 0)) }
      }));
    }
  });
})();
