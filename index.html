  <script>/* js/core/store.js */
/* PM Tool — core/store.js
 * The in-memory data model + load/save to Markdown through a storage backend.
 *
 * Public API (stable — use this from modules and plugins):
 *   PM.store.list(collection, filter?)        -> records   filter: {project:'P-001', status:'done'} or fn
 *   PM.store.get(collection, key)             -> record    key = record._key (or id for global/meta)
 *   PM.store.find(collection, id, projectId)  -> record
 *   PM.store.insert(collection, data, projectId?) -> record   (id auto-assigned)
 *   PM.store.update(collection, key, patch)   -> record
 *   PM.store.remove(collection, key)
 *   PM.store.createProject(data)              -> project record (creates the folder + files)
 *   PM.store.project(id), PM.store.projects()
 *   PM.store.serializeAll()                   -> { 'path.md': text } of the whole data set
 *   PM.store.flush()                          -> save pending changes now
 * Every mutation emits PM.events 'change' and schedules an autosave.
 */
PM.store = (function () {
  const U = PM.util;
  let backend = null;
  let records = {};            // collection name -> array
  let docs = {};               // path -> {meta, before, after, columns} preserved from disk
  const dirty = new Map();     // path -> {def, projectId}
  const changedSinceLoad = new Set();
  let saving = false;
  const loaders = [];          // extra async steps after loading (e.g. form definitions)

  function reset() {
    records = {};
    docs = {};
    dirty.clear();
    changedSinceLoad.clear();
    PM.collections().forEach(d => { records[d.name] = []; });
  }

  function keyFor(def, rec) {
    return def.scope === 'project' ? rec.project + '/' + rec.id : rec.id;
  }

  function coerce(def, row) {
    const rec = {};
    const known = new Set(def.fields.map(f => f.key));
    def.fields.forEach(f => {
      if (f.key in row) rec[f.key] = PM.md.fromCell(f, row[f.key]);
      else rec[f.key] = f.default != null ? f.default : (f.type === 'bool' ? false : '');
    });
    Object.keys(row).forEach(k => { if (!known.has(k) && !k.startsWith('_')) rec[k] = row[k]; });   // keep unknown columns
    return rec;
  }

  function projectFolder(pid) {
    const p = records.projects && records.projects.find(x => x.id === pid);
    return p ? p._folder : null;
  }
  function pathFor(def, projectId) {
    if (def.scope === 'global') return def.file;
    const folder = projectFolder(projectId);
    if (!folder) return null;
    return 'projects/' + folder + '/' + (def.scope === 'meta' ? 'project.md' : def.file);
  }

  /* ---------- loading ---------- */
  async function load(be, onProgress, opts) {
    opts = opts || {};
    backend = be;
    reset();
    conflicts.clear();
    authBlocked = false;
    if (be.prefetch) await be.prefetch(onProgress);
    const defs = PM.collections();

    for (const def of defs.filter(d => d.scope === 'global')) {
      const text = await be.readText(def.file);
      if (text == null) continue;
      if (def.codec) {
        const parsed = def.codec.parse(text);
        docs[def.file] = parsed.doc;
        records[def.name] = parsed.records.map(rec => { rec._key = keyFor(def, rec); return rec; });
        continue;
      }
      const doc = PM.md.parseTableDoc(text);
      docs[def.file] = doc;
      records[def.name] = doc.rows.map(r => { const rec = coerce(def, r); rec._key = keyFor(def, rec); return rec; });
    }

    const metaDef = PM.collection('projects');
    const folders = await be.listDirs('projects');
    for (const folder of folders) {
      const text = await be.readText('projects/' + folder + '/project.md');
      if (text == null) continue;
      const fm = PM.md.parseFrontmatter(text);
      const rec = coerce(metaDef, fm.data);
      if (!rec.id) rec.id = folder;
      rec._folder = folder;
      rec._notes = fm.body.replace(/^\n+/, '');
      rec._key = rec.id;
      if (records.projects.find(p => p.id === rec.id)) { console.warn('Duplicate project id', rec.id, 'in', folder); continue; }
      records.projects.push(rec);

      for (const def of defs.filter(d => d.scope === 'project')) {
        const path = 'projects/' + folder + '/' + def.file;
        const t = await be.readText(path);
        if (t == null) continue;
        if (def.codec) {
          const parsed = def.codec.parse(t);
          docs[path] = parsed.doc;
          parsed.records.forEach(r => { r.project = rec.id; r._key = keyFor(def, r); records[def.name].push(r); });
          continue;
        }
        const doc = PM.md.parseTableDoc(t);
        docs[path] = doc;
        doc.rows.forEach(r => {
          const rec2 = coerce(def, r);
          rec2.project = rec.id;
          rec2._key = keyFor(def, rec2);
          records[def.name].push(rec2);
        });
      }
    }
    if (!opts.skipParked && await applyParked()) return load(be, onProgress, { skipParked: true });
    for (const fn of loaders) { try { await fn(be); } catch (e) { console.warn('Loader failed', e); } }
    PM.events.emit('loaded', { source: be.label });
    PM.events.emit('status', statusInfo());
  }

  /* ---------- queries ---------- */
  function list(name, filter) {
    const arr = records[name] || [];
    if (!filter) return arr.slice();
    if (typeof filter === 'function') return arr.filter(filter);
    const keys = Object.keys(filter).filter(k => filter[k] != null && filter[k] !== '');
    return arr.filter(r => keys.every(k => r[k] === filter[k]));
  }
  function get(name, key) { return (records[name] || []).find(r => r._key === key) || null; }
  function find(name, id, projectId) {
    const def = PM.collection(name);
    return (records[name] || []).find(r => r.id === id && (def.scope !== 'project' || r.project === projectId)) || null;
  }
  function project(id) { return find('projects', id); }
  function projects() { return list('projects'); }

  /* ---------- mutations ---------- */
  function markDirty(def, projectId) {
    const path = pathFor(def, projectId);
    if (!path) return;
    dirty.set(path, { def, projectId });
    changedSinceLoad.add(path);
    scheduleSave();
  }

  function insert(name, data, projectId) {
    const def = PM.collection(name);
    if (!def) throw new Error('Unknown collection ' + name);
    if (def.scope === 'meta') return createProject(data);
    const pid = def.scope === 'project' ? (projectId || data.project) : null;
    if (def.scope === 'project' && !project(pid)) throw new Error('Unknown project ' + pid);
    const scopeIds = list(name, def.scope === 'project' ? { project: pid } : null).map(r => r.id);
    const rec = coerce(def, Object.assign({}, data));
    if (!rec.id || scopeIds.includes(rec.id)) rec.id = U.nextId(def.idPrefix, scopeIds, def.idPad);
    if (pid) rec.project = pid;
    rec._key = keyFor(def, rec);
    records[name].push(rec);
    markDirty(def, pid);
    PM.events.emit('change', { collection: name, action: 'insert', record: rec });
    return rec;
  }

  function update(name, key, patch) {
    const def = PM.collection(name);
    const rec = get(name, key);
    if (!rec) throw new Error('Record not found: ' + name + ' ' + key);
    Object.keys(patch).forEach(k => {
      if (k === 'id' || k === 'project' || k === '_key' || k === '_folder') return;
      const f = def.fields.find(x => x.key === k);
      rec[k] = f ? PM.md.fromCell(f, patch[k]) : patch[k];
    });
    markDirty(def, def.scope === 'meta' ? rec.id : rec.project);
    PM.events.emit('change', { collection: name, action: 'update', record: rec, patch });
    return rec;
  }

  function remove(name, key) {
    const def = PM.collection(name);
    const rec = get(name, key);
    if (!rec) return;
    if (def.scope === 'meta') throw new Error('Projects are not deleted from the app; set status to "archived" or remove the folder.');
    records[name] = records[name].filter(r => r !== rec);
    markDirty(def, rec.project);
    // Referential cleanup: clear any field pointing at the removed record (same project).
    PM.collections().forEach(d => d.fields.filter(f => f.type === 'ref' && f.ref === name).forEach(f => {
      list(d.name).forEach(r => {
        if (r[f.key] === rec.id && (def.scope !== 'project' || d.scope !== 'project' || r.project === rec.project)) {
          r[f.key] = '';
          markDirty(d, d.scope === 'meta' ? r.id : r.project);
        }
      });
    }));
    PM.events.emit('change', { collection: name, action: 'remove', record: rec });
  }

  function createProject(data) {
    const def = PM.collection('projects');
    const ids = projects().map(p => p.id);
    const rec = coerce(def, Object.assign({}, data));
    if (!rec.id || ids.includes(rec.id)) rec.id = U.nextId(def.idPrefix, ids, def.idPad);
    rec._folder = rec.id + '-' + U.slugify(rec.name);
    rec._notes = '# ' + (rec.name || rec.id) + '\n\nProject notes, scope and agreements can be written here.\n';
    rec._key = rec.id;
    records.projects.push(rec);
    markDirty(def, rec.id);
    PM.collections().filter(d => d.scope === 'project').forEach(d => markDirty(d, rec.id));
    PM.events.emit('change', { collection: 'projects', action: 'insert', record: rec });
    return rec;
  }

  /* ---------- serialisation ---------- */
  function columnsFor(def, path, rows) {
    const cols = def.fields.filter(f => !f.computed).map(f => f.key);
    const extra = new Set();
    (docs[path] && docs[path].columns || []).forEach(c => { if (c && !cols.includes(c) && c !== 'project') extra.add(c); });
    rows.forEach(r => Object.keys(r).forEach(k => { if (!k.startsWith('_') && k !== 'project' && !cols.includes(k)) extra.add(k); }));
    return cols.concat(Array.from(extra));
  }

  function serialize(def, projectId) {
    const path = pathFor(def, projectId);
    if (def.scope === 'meta') {
      const p = project(projectId);
      const meta = {};
      def.fields.forEach(f => { meta[f.key] = p[f.key]; });
      Object.keys(p).forEach(k => { if (!k.startsWith('_') && !(k in meta)) meta[k] = p[k]; });
      Object.keys(meta).forEach(k => { if (meta[k] === '' && k !== 'name') delete meta[k]; });
      return { path, text: PM.md.stringifyFrontmatter(meta, def.fields.map(f => f.key)) + '\n' + (p._notes || '').replace(/^\n+/, '') };
    }
    const rows = def.scope === 'project' ? list(def.name, { project: projectId }) : list(def.name);
    const prev = docs[path];
    if (def.codec) return { path, text: def.codec.serialize(rows, prev, projectId) };
    const doc = {
      meta: Object.assign({ collection: def.name }, def.scope === 'project' ? { project: projectId } : {}, prev ? prev.meta : {}),
      metaOrder: ['collection', 'project'],
      before: prev ? prev.before : '# ' + (def.heading || def.label) + (def.intro ? '\n\n' + def.intro : ''),
      after: prev ? prev.after : ''
    };
    if (def.scope === 'project') doc.meta.project = projectId;
    return { path, text: PM.md.writeTableDoc(doc, columnsFor(def, path, rows), rows) };
  }

  const extraFiles = [];       // providers of extra text files (e.g. form definitions)
  function serializeAll() {
    const out = {};
    extraFiles.forEach(fn => { try { Object.assign(out, fn()); } catch (e) { console.warn(e); } });
    PM.collections().forEach(def => {
      if (def.scope === 'global') { const s = serialize(def); out[s.path] = s.text; }
      else projects().forEach(p => { const s = serialize(def, p.id); if (s.path) out[s.path] = s.text; });
    });
    return out;
  }

  /* ---------- saving ---------- */
  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    const delay = (backend && backend.saveDelay) || 500;
    if (delay > 1000 && backend) PM.events.emit('status', { text: 'Saving soon…', kind: 'busy' });
    saveTimer = setTimeout(() => flush(), delay);
  }
  // Save right away when the app goes to the background (phones may close it without warning)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty.size) { clearTimeout(saveTimer); parkUnsaved(); flush(); } });
  window.addEventListener('pagehide', () => { if (dirty.size) { clearTimeout(saveTimer); parkUnsaved(); flush(); } });
  window.addEventListener('online', () => { if (dirty.size) flush(); });

  const conflicts = new Map();   // path -> job, files changed elsewhere since we read them
  let authBlocked = false;

  async function flush() {
    if (saving || !backend) { if (saving) scheduleSave(); return; }
    if (!dirty.size) return;
    if (authBlocked) { parkUnsaved(); PM.events.emit('status', { text: 'Not saved — see banner', kind: 'error' }); return; }
    saving = true;
    PM.events.emit('status', { text: 'Saving…', kind: 'busy' });
    const jobs = Array.from(dirty.entries());
    dirty.clear();
    const written = [];
    let failed = null;
    for (let i = 0; i < jobs.length; i++) {
      const [path, job] = jobs[i];
      const s = serialize(job.def, job.projectId);
      if (!s.path) continue;
      try {
        await backend.writeText(s.path, s.text);
        docs[s.path] = job.def.codec ? job.def.codec.parse(s.text).doc : PM.md.parseTableDoc(s.text);
        written.push(s.path);
      } catch (e) {
        if (e.code === 'conflict') { conflicts.set(path, job); continue; }
        // stop on other errors: keep this and the remaining files dirty
        jobs.slice(i).forEach(([p, j]) => dirty.set(p, j));
        failed = e;
        break;
      }
    }
    saving = false;
    if (written.length) { unpark(written); PM.events.emit('saved', { files: written }); }
    if (failed || conflicts.size) parkUnsaved();
    if (failed) {
      console.error(failed);
      if (failed.code === 'auth') { authBlocked = true; parkUnsaved(); PM.events.emit('auth-required', { kind: backend.kind, message: failed.message }); }
      const txt = failed.code === 'auth' ? (backend.kind === 'github' ? 'Token refused — not saved' : 'Signed out — sign in to save')
        : failed.code === 'offline' ? 'Offline — will save when connected' : 'Save failed: ' + failed.message;
      PM.events.emit('status', { text: txt, kind: failed.code === 'offline' ? 'warn' : 'error' });
    } else if (conflicts.size) {
      PM.events.emit('status', { text: 'Conflict — see banner', kind: 'error' });
    } else {
      PM.events.emit('status', statusInfo());
    }
    if (conflicts.size) PM.events.emit('conflict', { paths: Array.from(conflicts.keys()) });
  }

  /* ---------- unsaved work survives closing the app ----------
   * For online storage (GitHub, OneDrive, server): when changes cannot be saved
   * (no signal, expired sign-in, conflict), the file contents are parked in this
   * browser. The next time the app loads the same data source, they are saved,
   * unless the file was changed elsewhere in the meantime — then the user decides. */
  const REMOTE = ['github', 'onedrive', 'http'];
  function parkKey(be) { be = be || backend; return 'pm.parked.' + be.kind + '|' + be.label; }
  function readParked(be) { try { return JSON.parse(localStorage.getItem(parkKey(be)) || '{}'); } catch (e) { return {}; } }
  function writeParkedStore(obj, be) {
    try { if (Object.keys(obj).length) localStorage.setItem(parkKey(be), JSON.stringify(obj)); else localStorage.removeItem(parkKey(be)); } catch (e) { /* storage full or blocked */ }
  }
  function parkUnsaved() {
    if (!backend || !REMOTE.includes(backend.kind)) return;
    const parked = readParked();
    const add = (job) => {
      const s = serialize(job.def, job.projectId);
      if (!s.path) return;
      const base = parked[s.path] ? parked[s.path].base : (backend.versionOf ? backend.versionOf(s.path) : null);
      parked[s.path] = { text: s.text, base: base == null ? null : base, at: new Date().toISOString() };
    };
    dirty.forEach(add);
    conflicts.forEach(add);
    writeParkedStore(parked);
  }
  function unpark(paths) {
    if (!backend || !REMOTE.includes(backend.kind)) return;
    const parked = readParked();
    let changed = false;
    paths.forEach(p => { if (parked[p]) { delete parked[p]; changed = true; } });
    if (changed) writeParkedStore(parked);
  }
  /* Returns true when parked files were written (the caller then reloads). */
  async function applyParked() {
    if (!REMOTE.includes(backend.kind)) return false;
    const parked = readParked();
    const paths = Object.keys(parked);
    if (!paths.length) return false;
    let wrote = false;
    const clash = [];
    for (const p of paths) {
      const cur = backend.versionOf ? backend.versionOf(p) : null;
      const base = parked[p].base;
      if (base != null && cur != null && base !== cur) { clash.push(p); continue; }
      try { await backend.writeText(p, parked[p].text); delete parked[p]; wrote = true; }
      catch (e) { if (e.code === 'conflict') clash.push(p); else break; }      // offline etc.: keep parked
    }
    writeParkedStore(parked);
    if (clash.length) setTimeout(() => PM.events.emit('parked-conflict', { paths: clash }), 0);
    if (wrote) setTimeout(() => PM.ui && PM.ui.toast('Changes you made earlier (not saved at the time) are now saved.', 'ok'), 0);
    return wrote;
  }
  async function resolveParked(how) {
    const parked = readParked();
    const clash = Object.keys(parked);
    if (how === 'mine') {
      for (const p of clash) { if (backend.force) backend.force(p); await backend.writeText(p, parked[p].text); delete parked[p]; }
      writeParkedStore(parked);
      await load(backend, null, { skipParked: true });
    } else {
      writeParkedStore({});
    }
  }

  /* Conflict resolution: 'overwrite' writes our version anyway, 'reload' takes theirs. */
  async function resolveConflicts(how) {
    if (how === 'overwrite') {
      conflicts.forEach((job, path) => { if (backend.force) backend.force(path); dirty.set(path, job); });
      conflicts.clear();
      await flush();
    } else {
      conflicts.clear();
      await flush();
      if (backend.prefetch) backend.files = {};
      await load(backend);
    }
  }


  function statusInfo() {
    if (!backend) return { text: 'No data', kind: 'warn' };
    if (backend.kind === 'memory') return { text: 'Demo data — changes are not saved', kind: 'warn' };
    if (backend.kind === 'onedrive') return { text: 'Saved to OneDrive', kind: 'ok' };
    if (backend.kind === 'github') return { text: 'Saved to GitHub', kind: 'ok' };
    if (backend.kind === 'readonly') return { text: changedSinceLoad.size ? changedSinceLoad.size + ' changed file(s) — download to keep' : 'Read-only folder', kind: 'warn' };
    return { text: 'All changes saved', kind: 'ok' };
  }

  async function writeAllTo(be) {
    const files = serializeAll();
    for (const p in files) await be.writeText(p, files[p]);
    return Object.keys(files).length;
  }

  function changedFiles() {
    const all = serializeAll();
    const out = {};
    changedSinceLoad.forEach(p => { if (p in all) out[p] = all[p]; });
    return out;
  }

  // Warn before closing with unsaved changes.
  // When we leave on purpose (Microsoft sign-in), park unsaved work instead of asking.
  window.addEventListener('beforeunload', e => {
    if (!dirty.size && !saving) return;
    parkUnsaved();
    if (PM.leaving) return;
    flush(); e.preventDefault(); e.returnValue = '';
  });

  return {
    load, list, get, find, insert, update, remove, createProject, project, projects,
    retry() { authBlocked = false; return flush(); },
    addLoader(fn) { loaders.push(fn); },
    addExtraFiles(fn) { extraFiles.push(fn); },
    get pending() { return dirty.size; },
    serialize, serializeAll, flush, writeAllTo, changedFiles, statusInfo, pathFor, resolveConflicts, resolveParked, parkUnsaved,
    get conflicts() { return Array.from(conflicts.keys()); },
    get backend() { return backend; }
  };
})();

  <script>/* js/core/calc.js */
/* PM Tool — core/calc.js
 * Calculation service: hours, labour cost (per role rate), fixed costs, purchases.
 * Exposed as PM.services.calc so reports, dashboards and future plugins all use
 * the same numbers.
 *
 *   calc.summary({ project?, from?, to? })  -> totals + breakdowns (see below)
 *   calc.entryCost(hourRecord)               -> EUR
 *   calc.costAmount(costRecord)              -> EUR
 *   calc.progress(projectId)                 -> 0..1 (duration-weighted planning progress)
 *   calc.taskStats(projectId?)               -> { total, done, open, overdue, byStatus }
 */
PM.registerService('calc', (function () {
  const U = PM.util;
  const S = () => PM.store;

  function role(id) { return S().find('roles', id); }
  function person(id) { return S().find('people', id); }
  function entryRole(h) { return h.role || (person(h.person) || {}).role || ''; }
  function rate(roleId) { const r = role(roleId); return r ? U.num(r.rate) : 0; }
  function entryCost(h) { return U.num(h.hours) * rate(entryRole(h)); }
  function costAmount(c) {
    const q = c.qty === '' || c.qty == null ? 1 : U.num(c.qty);
    return q * U.num(c.unit_price);
  }

  function inRange(date, from, to) {
    if (from && (!date || date < from)) return false;
    if (to && (!date || date > to)) return false;
    return true;
  }

  function add(map, key, init, fn) { if (!map.has(key)) map.set(key, Object.assign({}, init)); fn(map.get(key)); }

  function summary(opts) {
    opts = opts || {};
    const pf = opts.project ? { project: opts.project } : null;
    const projects = opts.project ? [S().project(opts.project)].filter(Boolean) : S().projects().filter(p => opts.includeArchived || p.status !== 'archived');
    const pids = new Set(projects.map(p => p.id));
    const hours = S().list('hours', pf).filter(h => pids.has(h.project) && inRange(h.date, opts.from, opts.to));
    const costs = S().list('costs', pf).filter(c => pids.has(c.project) && inRange(c.date, opts.from, opts.to));
    const tasks = S().list('tasks', pf).filter(t => pids.has(t.project));
    const warnings = [];

    const byRole = new Map(), byPerson = new Map(), byMonth = new Map(), byCat = new Map(), byLine = new Map(), byProject = new Map();
    projects.forEach(p => byProject.set(p.id, { project: p.id, name: p.name, client: p.client, status: p.status,
      budgetHours: U.num(p.budget_hours), budgetCosts: U.num(p.budget_costs), hours: 0, labour: 0, fixed: 0, purchases: 0, total: 0 }));

    let tHours = 0, tLabour = 0, tFixed = 0, tPurch = 0;

    hours.forEach(h => {
      const rid = entryRole(h);
      const r = role(rid);
      const hh = U.num(h.hours);
      const cost = hh * (r ? U.num(r.rate) : 0);
      if (!rid) warnings.push('Hours ' + h.project + ' ' + h.id + ' has no role (and the person has no default role).');

      add(byRole, rid || '(none)', { role: rid, name: r ? r.name : (rid || 'No role'), rate: r ? U.num(r.rate) : 0, hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      const pe = person(h.person);
      add(byPerson, h.person || '(none)', { person: h.person, name: pe ? pe.name : (h.person || 'Unknown'), hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      add(byMonth, U.monthKey(h.date) || '(no date)', { month: U.monthKey(h.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { x.hours += hh; x.labour += cost; });
      if (h.line) add(byLine, h.project + '/' + h.line, { project: h.project, line: h.line, hours: 0, labour: 0, costs: 0 }, x => { x.hours += hh; x.labour += cost; });
      const bp = byProject.get(h.project); if (bp) { bp.hours += hh; bp.labour += cost; }
    });

    costs.forEach(c => {
      const amt = costAmount(c);
      const fixed = c.type === 'fixed';
      if (fixed) tFixed += amt; else tPurch += amt;
      add(byCat, (c.type || 'purchase') + '|' + (c.category || 'Uncategorised'), { type: c.type || 'purchase', category: c.category || 'Uncategorised', amount: 0, count: 0 }, x => { x.amount += amt; x.count++; });
      add(byMonth, U.monthKey(c.date) || '(no date)', { month: U.monthKey(c.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { if (fixed) x.fixed += amt; else x.purchases += amt; });
      if (c.line) add(byLine, c.project + '/' + c.line, { project: c.project, line: c.line, hours: 0, labour: 0, costs: 0 }, x => { x.costs += amt; });
      const bp = byProject.get(c.project); if (bp) { if (fixed) bp.fixed += amt; else bp.purchases += amt; }
    });

    byProject.forEach(x => { x.total = x.labour + x.fixed + x.purchases; });
    const lines = Array.from(byLine.values()).map(x => {
      const l = S().find('lines', x.line, x.project);
      const est = U.sum(tasks.filter(t => t.project === x.project && t.line === x.line), t => t.estimate);
      return Object.assign(x, { title: l ? l.title : x.line, group: l ? l.group : '', estimate: est, total: x.labour + x.costs });
    });

    const budgetHours = U.sum(projects, p => p.budget_hours);
    const budgetCosts = U.sum(projects, p => p.budget_costs);
    const total = tLabour + tFixed + tPurch;
    return {
      projects: projects.map(p => p.id),
      hours: tHours, labour: tLabour, fixed: tFixed, purchases: tPurch, total,
      budgetHours, budgetCosts,
      remainingHours: budgetHours - tHours, remainingCosts: budgetCosts - total,
      estimateHours: U.sum(tasks, t => t.estimate),
      byRole: Array.from(byRole.values()).sort((a, b) => b.cost - a.cost),
      byPerson: Array.from(byPerson.values()).sort((a, b) => b.hours - a.hours),
      byCategory: Array.from(byCat.values()).sort((a, b) => a.type.localeCompare(b.type) || b.amount - a.amount),
      byMonth: Array.from(byMonth.values()).map(m => Object.assign(m, { total: m.labour + m.fixed + m.purchases })).sort((a, b) => (a.month || '').localeCompare(b.month || '')),
      byLine: lines.sort((a, b) => b.total - a.total),
      byProject: Array.from(byProject.values()),
      warnings: Array.from(new Set(warnings))
    };
  }

  function progress(projectId) {
    const lines = S().list('lines', { project: projectId });
    let w = 0, done = 0;
    lines.forEach(l => {
      const d = Math.max(1, U.daysBetween(l.start, l.end) + 1);
      w += d; done += d * Math.min(100, U.num(l.progress)) / 100;
    });
    return w ? done / w : 0;
  }

  function taskStats(projectId) {
    const tasks = S().list('tasks', projectId ? { project: projectId } : null);
    const today = U.todayISO();
    const byStatus = {};
    tasks.forEach(t => { byStatus[t.status || 'todo'] = (byStatus[t.status || 'todo'] || 0) + 1; });
    const done = byStatus.done || 0;
    return {
      total: tasks.length, done, open: tasks.length - done, byStatus,
      overdue: tasks.filter(t => t.status !== 'done' && t.due && t.due < today).length
    };
  }

  /* Tasks linked to a planning line */
  function lineTasks(projectId, lineId) {
    return S().list('tasks', t => t.project === projectId && t.line === lineId);
  }

  return { role, person, entryRole, rate, entryCost, costAmount, summary, progress, taskStats, lineTasks };
})());

  <script>/* js/core/files.js */
/* PM Tool — core/files.js
 * Photos and other binary files (survey photos, company logo).
 *
 *   PM.files.compress(file)          -> Promise<Blob>  JPEG, max 1600 px (keeps uploads small)
 *   PM.files.save(path, blob)        -> stores locally at once, uploads in the background
 *   PM.files.url(path)               -> Promise<string|null>  object URL for <img src>
 *   PM.files.dataUrl(path)           -> Promise<string|null>  for PDF export
 *   PM.files.remove(path)
 *   PM.files.pending                 -> number of uploads still waiting (no signal etc.)
 *
 * Uploads that fail (no signal in the pump room) are kept in this browser's
 * IndexedDB "outbox" and retried when the connection is back, also after the app
 * was closed and opened again.
 */
PM.files = (function () {
  const urls = new Map();          // path -> object URL (this session)
  let pendingCount = 0;
  let flushing = false;

  /* ---------- outbox (IndexedDB) ---------- */
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const rq = indexedDB.open('pm-outbox', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('files');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    try {
      const d = await db();
      return await new Promise((res, rej) => {
        const t = d.transaction('files', mode);
        const out = fn(t.objectStore('files'));
        t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
        t.onerror = () => rej(t.error);
      });
    } catch (e) { return undefined; }
  }
  function sourceKey() { const be = PM.store.backend; return be ? be.kind + '|' + be.label : ''; }
  const outboxPut = (path, blob) => tx('readwrite', s => s.put({ source: sourceKey(), path, blob, at: Date.now() }, sourceKey() + '::' + path));
  const outboxDel = (path) => tx('readwrite', s => s.delete(sourceKey() + '::' + path));
  async function outboxAll() {
    const all = await tx('readonly', s => s.getAll());
    return (all || []).filter(x => x.source === sourceKey());
  }

  /* ---------- image compression ---------- */
  async function compress(file, maxDim, quality) {
    maxDim = maxDim || 1600; quality = quality || 0.8;
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
    }
    const w = bmp.width, h = bmp.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', quality));
  }

  /* ---------- API ---------- */
  async function save(path, blob) {
    if (urls.has(path)) URL.revokeObjectURL(urls.get(path));
    urls.set(path, URL.createObjectURL(blob));
    const be = PM.store.backend;
    if (!be || !be.writeBinary) return;
    await outboxPut(path, blob);
    flush();
  }

  async function flush() {
    const be = PM.store.backend;
    if (flushing || !be || !be.writeBinary) return;
    flushing = true;
    try {
      const items = await outboxAll();
      pendingCount = items.length;
      for (const it of items) {
        try {
          await be.writeBinary(it.path, it.blob);
          await outboxDel(it.path);
          pendingCount--;
        } catch (e) {
          console.warn('Upload postponed:', it.path, e.message);
          break;                       // no signal: try again later
        }
      }
    } finally {
      flushing = false;
      PM.events.emit('files', { pending: pendingCount });
      if (pendingCount > 0) setTimeout(flush, 30000);
    }
  }

  async function url(path) {
    if (!path) return null;
    if (urls.has(path)) return urls.get(path);
    const be = PM.store.backend;
    if (!be || !be.readBinary) return null;
    // not uploaded yet? it is still in the outbox
    const waiting = (await outboxAll()).find(x => x.path === path);
    let blob = waiting ? waiting.blob : null;
    if (!blob) { try { blob = await be.readBinary(path); } catch (e) { console.warn(e); return null; } }
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    urls.set(path, u);
    return u;
  }

  async function dataUrl(path) {
    const u = await url(path);
    if (!u) return null;
    const blob = await (await fetch(u)).blob();
    return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  }

  async function remove(path) {
    if (urls.has(path)) { URL.revokeObjectURL(urls.get(path)); urls.delete(path); }
    await outboxDel(path);
    const be = PM.store.backend;
    if (be && be.deleteFile) { try { await be.deleteFile(path); } catch (e) { console.warn('Could not delete', path, e.message); } }
  }

  /* <img> that loads its picture from storage */
  function img(path, attrs) {
    const el = PM.util.h('img', Object.assign({ alt: '', loading: 'lazy' }, attrs || {}));
    el.classList.add('loading-img');
    url(path).then(u => { if (u) { el.src = u; el.classList.remove('loading-img'); } else el.classList.add('missing-img'); });
    return el;
  }

  PM.events.on('loaded', () => { urls.forEach(u => URL.revokeObjectURL(u)); urls.clear(); flush(); });
  window.addEventListener('online', () => flush());

  return { compress, save, flush, url, dataUrl, remove, img, get pending() { return pendingCount; } };
})();

  function downloadZip(onlyChanged) {
    const files = onlyChanged ? PM.store.changedFiles() : PM.store.serializeAll();
    if (!Object.keys(files).length) { PM.ui.toast('No changed files.', 'warn'); return; }
    U.download((onlyChanged ? 'pm-changed-' : 'pm-data-') + U.todayISO() + '.zip', PM.zip(files), 'application/zip');
  }

  function showBanner(content) {
    banner.innerHTML = '';
    banner.appendChild(content);
    banner.hidden = false;
  }
  function hideBanner() { banner.hidden = true; banner.innerHTML = ''; }

  function dataMenu(anchor) {
    const be = PM.store.backend;
    const items = [
      { label: PM.github.configured() ? 'GitHub connection…' : 'Connect GitHub…', run: () => connectGitHub() },
      { label: 'Use GitHub data', run: () => useBackend(PM.github.backend()), hide: !PM.github.configured() || (be && be.kind === 'github') },
      { label: 'Copy demo data to GitHub…', run: () => copyDemoTo(PM.github.backend()), hide: !PM.github.configured() },
      { label: 'Disconnect GitHub on this device', run: () => { PM.github.forget(); PM.ui.toast('Token removed from this device.', 'ok'); useBackend(demoBackend()); }, hide: !PM.github.configured() },
      { label: PM.onedrive.signedIn() ? 'Use OneDrive' : 'Connect OneDrive…', run: () => PM.onedrive.signedIn() ? useBackend(PM.onedrive.backend()) : connectOneDrive(), hide: !PM.onedrive.configured() || (be && be.kind === 'onedrive') },
      { label: 'Copy demo data to OneDrive…', run: copyToOneDrive, hide: !PM.onedrive.signedIn() },
      { label: 'Sign out of OneDrive', run: () => PM.onedrive.signOut(), hide: !PM.onedrive.signedIn() },
      { label: PM.storage.supportsFolder ? 'Open data folder…' : 'Open data folder (read-only)…', run: openFolder, hide: isTouch() && !PM.storage.supportsFolder },
      { label: 'Save all data to a folder…', run: saveToFolder, hide: !PM.storage.supportsFolder },
      { label: 'Download all data (.zip)', run: () => downloadZip(false) },
      { label: 'Download changed files (.zip)', run: () => downloadZip(true), hide: !be || be.kind !== 'readonly' },
      { label: 'Reload from source', run: () => be && useBackend(be), hide: !be || be.kind === 'memory' },
      { label: 'Load demo data', run: () => useBackend(demoBackend()) }
    ].filter(i => !i.hide);
    const menu = h('div', { class: 'menu', role: 'menu' }, items.map(i => h('button', { role: 'menuitem', onclick: () => { close(); i.run(); } }, i.label)));
    const r = anchor.getBoundingClientRect();
    Object.assign(menu.style, { top: (r.bottom + 4) + 'px', right: (window.innerWidth - r.right) + 'px' });
    document.body.appendChild(menu);
    const close = () => { menu.remove(); document.removeEventListener('mousedown', outside, true); };
    const outside = e => { if (!menu.contains(e.target) && e.target !== anchor) close(); };
    setTimeout(() => document.addEventListener('mousedown', outside, true));
    menu.querySelector('button').focus();
    menu.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }

  const NEW_PROJECT_FIELDS = ['name', 'client', 'description', 'status', 'manager', 'start', 'end', 'budget_costs', 'color'];

  function newProjectDialog() {
    if (!PM.store.backend) return;
    const today = U.todayISO();
    const f = PM.ui.form('projects', { status: 'active', start: today, end: U.addDays(today, 90), color: '#2f6fed' }, { fields: NEW_PROJECT_FIELDS });
    PM.ui.dialog({
      title: 'New project', content: f.el,
      actions: [{ label: 'Cancel' }, { label: 'Create project', primary: true, onClick: () => {
        if (!f.valid()) { PM.ui.toast('Please fill in the object.', 'warn'); return false; }
        const p = PM.store.createProject(f.values());
        setProject(p.id);
        PM.ui.toast('Project ' + p.id + ' created.', 'ok');
      } }]
    });
  }

  /* Edit all details of an existing project */
  function editProjectDialog(pid) {
    const p = PM.store.project(pid);
    if (!p) return;
    const f = PM.ui.form('projects', p);
    PM.ui.dialog({
      title: 'Edit project ' + p.id, content: f.el,
      actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: () => {
        if (!f.valid()) { PM.ui.toast('Please fill in the object.', 'warn'); return false; }
        const v = f.values();
        if (v.start && v.end && v.end < v.start) { PM.ui.toast('End date is before start date.', 'warn'); return false; }
        const patch = {};
        PM.collection('projects').fields.forEach(fd => { if (fd.type !== 'id' && v[fd.key] !== p[fd.key]) patch[fd.key] = v[fd.key]; });
        if (Object.keys(patch).length) PM.store.update('projects', p._key, patch);
        PM.ui.toast('Project saved.', 'ok');
      } }]
    });
  }

  /* ---------- boot ---------- */
  async function boot() {
    const root = document.getElementById('app');
    navEl = h('nav', { class: 'nav', 'aria-label': 'Main' });
    projSel = h('select', { class: 'proj-select', 'aria-label': 'Project', onchange: () => setProject(projSel.value) });
    statusEl = h('span', { class: 'status-pill' }, 'Loading…');
    viewEl = h('div', { id: 'view' });
    banner = h('div', { class: 'banner', hidden: true });
    const dataBtn = h('button', { class: 'btn ghost', 'aria-haspopup': 'menu', onclick: e => dataMenu(e.currentTarget) }, 'Data ▾');

    root.appendChild(h('aside', { class: 'sidebar' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }), h('span', null, 'Project Manager')),
      navEl,
      h('div', { class: 'side-foot' }, h('div', { class: 'muted small' }, 'Data source'), h('div', { id: 'source-name', class: 'small' }, '—'))));
    root.appendChild(h('div', { class: 'main', id: 'main' },
      h('header', { class: 'topbar' }, projSel, h('button', { class: 'btn ghost hide-narrow', onclick: newProjectDialog, title: 'New project' }, '+ Project'), h('span', { class: 'spacer' }), statusEl, dataBtn),
      banner, viewEl));

    PM.events.on('status', setStatus);
    PM.events.on('files', () => setStatus(lastStatus));
    PM.events.on('forms', () => renderSoon());
    PM.events.on('change', () => { if (!(current && current.manualRefresh)) renderSoon(); else renderProjectSelect(); });
    PM.events.on('modules', () => { if (PM.store.backend) renderSoon(); });
    window.addEventListener('hashchange', () => { route = parseHash(); render(); });
    // switch between table and card layouts when the screen size class changes (rotate tablet, resize window)
    if (window.matchMedia) window.matchMedia('(max-width: 760px)').addEventListener('change', () => { if (PM.store.backend) render(); });

    route = parseHash();
    if (!('project' in route.params)) {
      let last = '';
      try { last = localStorage.getItem('pm.project') || ''; } catch (e) { /* ignore */ }
      if (last) route.params.project = last;
    }

    PM.events.on('conflict', conflictBanner);
    PM.events.on('parked-conflict', e => showBanner(h('div', { class: 'banner-inner bad' },
      h('span', null, 'Changes you made earlier on this device were never saved, and meanwhile someone else changed ', h('code', null, e.paths.join(', ')), '. Which version do you want to keep?'),
      h('button', { class: 'btn primary small', onclick: async () => { hideBanner(); await PM.store.resolveParked('mine'); render(); PM.ui.toast('Your earlier changes are saved.', 'ok'); } }, 'Keep my earlier changes'),
      h('button', { class: 'btn ghost small', onclick: () => { hideBanner(); PM.store.resolveParked('theirs'); PM.ui.toast('Your earlier changes were discarded.', 'ok'); } }, 'Discard them'))));
    PM.events.on('auth-required', authBanner);

    // 0) coming back from the Microsoft sign-in page?
    if (PM.onedrive.configured()) {
      let res = null;
      try { res = await PM.onedrive.handleRedirect(); } catch (e) { res = { error: e.message }; }
      if (res && res.ok) {
        const carry = sessionStorage.getItem('pm.carry'); sessionStorage.removeItem('pm.carry');
        try {
          await useBackend(PM.onedrive.backend(), true);
          if (carry && !PM.store.projects().length && confirm('Your OneDrive folder is empty. Copy the data you were working with to OneDrive?')) {
            const files = JSON.parse(carry);
            const od = PM.onedrive.backend();
            for (const p in files) await od.writeText(p, files[p]);
            await useBackend(PM.onedrive.backend());
          }
          return;
        } catch (e) { PM.ui.toast('OneDrive: ' + e.message, 'error'); }
      } else if (res && res.error && !res.silent) {
        PM.ui.toast('Microsoft sign-in failed: ' + res.error, 'error');
      }
    }

    // 1) served by tools/server.js (or any compatible server)?
    if (/^https?:$/.test(location.protocol) && !PM.onedrive.configured()) {
      try {
        const r = await fetch('api/ping');
        if (r.ok) { await useBackend(new PM.storage.HttpBackend(''), true); return; }
      } catch (e) { /* not a server with an API */ }
    }

    let lastSource = '';
    try { lastSource = localStorage.getItem('pm.source') || ''; } catch (e) { /* ignore */ }

    // 2a) GitHub, if connected on this device
    if (PM.github.configured() && lastSource !== 'folder' && lastSource !== 'onedrive') {
      try { await useBackend(PM.github.backend(), true); if (!PM.store.projects().length) emptyRepoBanner(); return; }
      catch (e) { PM.ui.toast('GitHub: ' + e.message, 'error'); }
    }

    // 2b) OneDrive, if signed in before (and that was the last source used here)
    if (PM.onedrive.configured() && (lastSource === 'onedrive' || !PM.storage.supportsFolder)) {
      if (PM.onedrive.signedIn()) {
        try { await useBackend(PM.onedrive.backend(), true); return; }
        catch (e) {
          if (e.code === 'auth' && PM.onedrive.canSignIn() && !sessionStorage.getItem('pm.silent')) {
            sessionStorage.setItem('pm.silent', '1');          // try once per session without asking
            await PM.onedrive.signIn({ silent: true });
          }
          PM.ui.toast('OneDrive: ' + e.message, 'error');
        }
      }
    }

    // 3) last used folder (PC)
    const last = await PM.storage.lastFolder();
    if (last && last.granted) {
      try { await useBackend(new PM.storage.FolderBackend(last.handle), true); return; } catch (e) { console.warn(e); }
    }

    // 4) demo data, plus the right offer for this device
    await useBackend(demoBackend(), true);
    const odBtn = PM.onedrive.configured() && PM.onedrive.canSignIn()
      ? h('button', { class: 'btn ghost small', onclick: connectOneDrive }, PM.onedrive.signedIn() ? 'Open my OneDrive data' : 'Sign in with Microsoft')
      : null;
    const ghBtn = h('button', { class: 'btn primary small', onclick: () => connectGitHub() }, PM.github.configured() ? 'Open my GitHub data' : 'Connect GitHub');
    if (last) {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'Showing demo data. Your folder "' + last.handle.name + '" needs permission again.'),
        h('button', { class: 'btn primary small', onclick: async () => { try { await useBackend(await PM.storage.reopen(last.handle)); } catch (e) { PM.ui.toast(e.message, 'error'); } } }, 'Reconnect folder'),
        ghBtn, odBtn,
        h('button', { class: 'btn ghost small', onclick: openFolder }, 'Choose another folder')));
    } else {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'You are looking at demo data. Changes are not saved until you connect your data (GitHub) or choose a folder.'),
        ghBtn,
        odBtn,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: saveToFolder }, 'Save demo to a new folder') : null,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: openFolder }, 'Open existing folder') : null,
        h('button', { class: 'icon-btn', 'aria-label': 'Dismiss', onclick: hideBanner }, '✕')));
    }
  }

  function isTouch() { return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }

  return { boot, render, navigate, setProject, openFolder, saveToFolder, downloadZip, newProjectDialog, editProjectDialog, useBackend, connectOneDrive, copyToOneDrive, connectGitHub, copyDemoTo, isTouch, get route() { return route; } };
})();

  <script>/* js/modules/dashboard.js */
/* PM Tool — modules/dashboard.js
 * Portfolio overview (all projects) and project overview (one project).
 */
PM.registerModule({
  id: 'dashboard', title: 'Dashboard', short: 'Home', icon: '◧', order: 10,
  render(el, ctx) {
    const U = PM.util, h = U.h, calc = PM.services.calc;
    if (ctx.project) return renderProject(el, ctx);

    const st = this.state = this.state || { showAll: false };
    const all = PM.store.projects();
    const projects = all.filter(p => st.showAll ? p.status !== 'archived' : ['active', 'planned', 'on-hold'].includes(p.status || 'active'));
    const sum = calc.summary({});
    const month = U.todayISO().slice(0, 7);
    const monthSum = calc.summary({ from: month + '-01', to: month + '-31' });
    const ts = calc.taskStats();

    el.appendChild(h('div', { class: 'page-head' },
      h('div', null, h('h1', null, 'Portfolio'), h('p', { class: 'muted' }, U.fmtDate(U.todayISO()) + ' · ' + all.filter(p => p.status === 'active').length + ' active project(s)')),
      h('span', { class: 'spacer' }),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.showAll || null, onchange: e => { st.showAll = e.target.checked; ctx.rerender(); } }), ' Show completed'),
      h('button', { class: 'btn primary', onclick: () => PM.app.newProjectDialog() }, '+ New project')));

    el.appendChild(h('div', { class: 'stats' },
      PM.ui.stat('Hours this month', U.fmtNum(monthSum.hours), U.fmtMoney(monthSum.labour) + ' labour'),
      PM.ui.stat('Total cost to date', U.fmtMoney(sum.total), 'budget ' + U.fmtMoney(sum.budgetCosts), sum.budgetCosts && sum.total > sum.budgetCosts ? 'bad' : ''),
      PM.ui.stat('Hours to date', U.fmtNum(sum.hours), 'budget ' + U.fmtNum(sum.budgetHours) + ' h'),
      PM.ui.stat('Open tasks', U.fmtNum(ts.open), ts.overdue ? ts.overdue + ' overdue' : 'none overdue', ts.overdue ? 'bad' : '')));

    if (!projects.length) {
      el.appendChild(PM.ui.empty('No projects to show.', h('button', { class: 'btn primary', onclick: () => PM.app.newProjectDialog() }, 'Create the first project')));
      return;
    }

    const byId = new Map(sum.byProject.map(x => [x.project, x]));
    el.appendChild(h('div', { class: 'proj-grid' }, projects.map(p => {
      const s = byId.get(p.id) || { hours: 0, total: 0 };
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      return h('a', { class: 'proj-card', href: '#/dashboard?project=' + p.id, style: { '--pc': p.color || '#2f6fed' } },
        h('div', { class: 'proj-card-head' },
          h('div', null, h('div', { class: 'proj-name' }, p.name), h('div', { class: 'muted small' }, p.id + (p.client ? ' · ' + p.client : ''))),
          h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active'),
          h('button', { class: 'icon-btn edit', title: 'Edit project', 'aria-label': 'Edit ' + p.name, onclick: e => { e.preventDefault(); e.stopPropagation(); PM.app.editProjectDialog(p.id); } }, '✎')),
        p.description ? h('div', { class: 'small proj-card-desc' }, p.description) : null,
        h('div', { class: 'muted small' }, U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end)),
        h('div', { class: 'kv' }, h('span', null, 'Progress'), PM.ui.meter(prog, 1, 'Planning progress', 'progress')),
        h('div', { class: 'kv' }, h('span', null, 'Hours ' + U.fmtNum(s.hours) + ' / ' + U.fmtNum(p.budget_hours)), PM.ui.meter(s.hours, U.num(p.budget_hours))),
        h('div', { class: 'kv' }, h('span', null, 'Cost ' + U.fmtMoney(s.total) + ' / ' + U.fmtMoney(p.budget_costs)), PM.ui.meter(s.total, U.num(p.budget_costs))),
        h('div', { class: 'small proj-tasks' }, t.open + ' open task(s)', t.overdue ? h('span', { class: 'bad-text' }, ' · ' + t.overdue + ' overdue') : null));
    })));

    function renderProject(el, ctx) {
      const p = ctx.project;
      const s = calc.summary({ project: p.id });
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      const today = U.todayISO();

      el.appendChild(h('div', { class: 'page-head' },
        h('span', { class: 'swatch big', style: { background: p.color || '#2f6fed' } }),
        h('div', null, h('h1', null, p.name), h('p', { class: 'muted' }, p.id + (p.client ? ' · ' + p.client : '') + ' · ' + U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end))),
        h('span', { class: 'spacer' }),
        h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active'),
        h('button', { class: 'btn', onclick: () => PM.app.editProjectDialog(p.id) }, '✎ Edit project')));
      if (p.description) el.appendChild(h('p', { class: 'proj-desc' }, p.description));

      el.appendChild(h('div', { class: 'stats' },
        PM.ui.stat('Planning progress', U.fmtPct(prog), PM.store.list('lines', { project: p.id }).length + ' planning lines'),
        PM.ui.stat('Hours', U.fmtNum(s.hours) + ' h', 'of ' + U.fmtNum(p.budget_hours) + ' h budget · est. ' + U.fmtNum(s.estimateHours) + ' h', p.budget_hours && s.hours > p.budget_hours ? 'bad' : ''),
        PM.ui.stat('Cost', U.fmtMoney(s.total), 'of ' + U.fmtMoney(p.budget_costs) + ' · ' + U.fmtPct(p.budget_costs ? s.total / p.budget_costs : NaN), p.budget_costs && s.total > p.budget_costs ? 'bad' : ''),
        PM.ui.stat('Tasks', t.done + ' / ' + t.total + ' done', t.overdue ? t.overdue + ' overdue' : 'none overdue', t.overdue ? 'bad' : '')));

      const grid = h('div', { class: 'two-col' });
      el.appendChild(grid);

      // current & upcoming planning lines
      const lines = PM.store.list('lines', l => l.project === p.id && l.end >= today && l.start <= U.addDays(today, 21))
        .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
      grid.appendChild(PM.ui.section('Now and next 3 weeks',
        lines.length ? h('ul', { class: 'line-list' }, lines.map(l => {
          const tasks = calc.lineTasks(p.id, l.id);
          return h('li', null,
            h('span', { class: 'dot ' + (tasks.length ? 'linked' : '') }),
            h('div', { class: 'grow' }, h('div', null, l.title), h('div', { class: 'muted small' }, (l.group ? l.group + ' · ' : '') + U.fmtDate(l.start) + ' – ' + U.fmtDate(l.end) + (tasks.length ? ' · ' + tasks.filter(x => x.status === 'done').length + '/' + tasks.length + ' tasks done' : ''))),
            h('span', { class: 'small muted' }, U.num(l.progress) + '%'));
        })) : h('p', { class: 'muted' }, 'Nothing planned in this period.'),
        h('a', { class: 'btn ghost small', href: '#/planning?project=' + p.id }, 'Open planning')));

      // attention: overdue / due soon tasks
      const due = PM.store.list('tasks', x => x.project === p.id && x.status !== 'done' && x.due && x.due <= U.addDays(today, 7))
        .sort((a, b) => a.due.localeCompare(b.due));
      grid.appendChild(PM.ui.section('Tasks due within a week',
        due.length ? h('ul', { class: 'line-list' }, due.map(x => {
          const who = PM.store.find('people', x.assignee);
          return h('li', null,
            h('span', { class: 'pill small st-' + x.status }, x.status),
            h('div', { class: 'grow' }, h('div', null, x.title), h('div', { class: 'muted small' }, x.id + (who ? ' · ' + who.name : ''))),
            h('span', { class: 'small ' + (x.due < today ? 'bad-text' : 'muted') }, U.fmtDate(x.due)));
        })) : h('p', { class: 'muted' }, 'No tasks due.'),
        h('a', { class: 'btn ghost small', href: '#/tasks?project=' + p.id }, 'Open tasks')));

      // project details (read-only summary; edit through the dialog)
      const def = PM.collection('projects');
      const shown = def.fields.filter(f => f.type !== 'id' && f.type !== 'color' && f.key !== 'description');
      const details = h('dl', { class: 'details' }, shown.map(f => [
        h('dt', null, f.label),
        h('dd', null, f.key === 'status' ? h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active') : (PM.ui.displayValue(f, p[f.key], p) || h('span', { class: 'muted' }, '—')))]));
      const notes = h('textarea', { class: 'notes', rows: 6, 'data-focus': 'projects|' + p._key + '|_notes', 'aria-label': 'Project notes' }, p._notes || '');
      notes.addEventListener('change', () => PM.store.update('projects', p._key, { _notes: notes.value }));
      el.appendChild(PM.ui.section('Project details', h('div', null, details,
        h('label', { class: 'form-row wide' }, h('span', null, 'Notes'), notes),
        h('p', { class: 'muted small' }, 'Stored in ', h('code', null, PM.store.pathFor(def, p.id)))),
        h('button', { class: 'btn small', onclick: () => PM.app.editProjectDialog(p.id) }, '✎ Edit')));
    }
  }
});
