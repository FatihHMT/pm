  <script>/* js/core/store.js */
/* PM Tool — core/store.js
 * The in-memory data model + load/save to Markdown through a storage backend.
 *
 * Public API (stable — use this from modules and plugins):
 *   PM.store.list(collection, filter?)        -> records   filter: {project:'P-001', status:'done'} or fn
 *   PM.store.get(collection, key)             -> record    key = record._key (or id for global/meta)
 *   PM.store.find(collection, id, projectId)  -> record
 *   PM.store.insert(collection, data, projectId?) -> record   (id auto-assigned)
 *   PM.store.update(collection, key, patch)   -> record
 *   PM.store.remove(collection, key)
 *   PM.store.createProject(data)              -> project record (creates the folder + files)
 *   PM.store.project(id), PM.store.projects()
 *   PM.store.serializeAll()                   -> { 'path.md': text } of the whole data set
 *   PM.store.flush()                          -> save pending changes now
 * Every mutation emits PM.events 'change' and schedules an autosave.
 */
PM.store = (function () {
  const U = PM.util;
  let backend = null;
  let records = {};            // collection name -> array
  let docs = {};               // path -> {meta, before, after, columns} preserved from disk
  const dirty = new Map();     // path -> {def, projectId}
  const changedSinceLoad = new Set();
  let saving = false;

  function reset() {
    records = {};
    docs = {};
    dirty.clear();
    changedSinceLoad.clear();
    PM.collections().forEach(d => { records[d.name] = []; });
  }

  function keyFor(def, rec) {
    return def.scope === 'project' ? rec.project + '/' + rec.id : rec.id;
  }

  function coerce(def, row) {
    const rec = {};
    const known = new Set(def.fields.map(f => f.key));
    def.fields.forEach(f => {
      if (f.key in row) rec[f.key] = PM.md.fromCell(f, row[f.key]);
      else rec[f.key] = f.default != null ? f.default : (f.type === 'bool' ? false : '');
    });
    Object.keys(row).forEach(k => { if (!known.has(k) && !k.startsWith('_')) rec[k] = row[k]; });   // keep unknown columns
    return rec;
  }

  function projectFolder(pid) {
    const p = records.projects && records.projects.find(x => x.id === pid);
    return p ? p._folder : null;
  }
  function pathFor(def, projectId) {
    if (def.scope === 'global') return def.file;
    const folder = projectFolder(projectId);
    if (!folder) return null;
    return 'projects/' + folder + '/' + (def.scope === 'meta' ? 'project.md' : def.file);
  }

  /* ---------- loading ---------- */
  async function load(be, onProgress) {
    backend = be;
    reset();
    conflicts.clear();
    authBlocked = false;
    if (be.prefetch) await be.prefetch(onProgress);
    const defs = PM.collections();

    for (const def of defs.filter(d => d.scope === 'global')) {
      const text = await be.readText(def.file);
      if (text == null) continue;
      const doc = PM.md.parseTableDoc(text);
      docs[def.file] = doc;
      records[def.name] = doc.rows.map(r => { const rec = coerce(def, r); rec._key = keyFor(def, rec); return rec; });
    }

    const metaDef = PM.collection('projects');
    const folders = await be.listDirs('projects');
    for (const folder of folders) {
      const text = await be.readText('projects/' + folder + '/project.md');
      if (text == null) continue;
      const fm = PM.md.parseFrontmatter(text);
      const rec = coerce(metaDef, fm.data);
      if (!rec.id) rec.id = folder;
      rec._folder = folder;
      rec._notes = fm.body.replace(/^\n+/, '');
      rec._key = rec.id;
      if (records.projects.find(p => p.id === rec.id)) { console.warn('Duplicate project id', rec.id, 'in', folder); continue; }
      records.projects.push(rec);

      for (const def of defs.filter(d => d.scope === 'project')) {
        const path = 'projects/' + folder + '/' + def.file;
        const t = await be.readText(path);
        if (t == null) continue;
        const doc = PM.md.parseTableDoc(t);
        docs[path] = doc;
        doc.rows.forEach(r => {
          const rec2 = coerce(def, r);
          rec2.project = rec.id;
          rec2._key = keyFor(def, rec2);
          records[def.name].push(rec2);
        });
      }
    }
    PM.events.emit('loaded', { source: be.label });
    PM.events.emit('status', statusInfo());
  }

  /* ---------- queries ---------- */
  function list(name, filter) {
    const arr = records[name] || [];
    if (!filter) return arr.slice();
    if (typeof filter === 'function') return arr.filter(filter);
    const keys = Object.keys(filter).filter(k => filter[k] != null && filter[k] !== '');
    return arr.filter(r => keys.every(k => r[k] === filter[k]));
  }
  function get(name, key) { return (records[name] || []).find(r => r._key === key) || null; }
  function find(name, id, projectId) {
    const def = PM.collection(name);
    return (records[name] || []).find(r => r.id === id && (def.scope !== 'project' || r.project === projectId)) || null;
  }
  function project(id) { return find('projects', id); }
  function projects() { return list('projects'); }

  /* ---------- mutations ---------- */
  function markDirty(def, projectId) {
    const path = pathFor(def, projectId);
    if (!path) return;
    dirty.set(path, { def, projectId });
    changedSinceLoad.add(path);
    scheduleSave();
  }

  function insert(name, data, projectId) {
    const def = PM.collection(name);
    if (!def) throw new Error('Unknown collection ' + name);
    if (def.scope === 'meta') return createProject(data);
    const pid = def.scope === 'project' ? (projectId || data.project) : null;
    if (def.scope === 'project' && !project(pid)) throw new Error('Unknown project ' + pid);
    const scopeIds = list(name, def.scope === 'project' ? { project: pid } : null).map(r => r.id);
    const rec = coerce(def, Object.assign({}, data));
    if (!rec.id || scopeIds.includes(rec.id)) rec.id = U.nextId(def.idPrefix, scopeIds, def.idPad);
    if (pid) rec.project = pid;
    rec._key = keyFor(def, rec);
    records[name].push(rec);
    markDirty(def, pid);
    PM.events.emit('change', { collection: name, action: 'insert', record: rec });
    return rec;
  }

  function update(name, key, patch) {
    const def = PM.collection(name);
    const rec = get(name, key);
    if (!rec) throw new Error('Record not found: ' + name + ' ' + key);
    Object.keys(patch).forEach(k => {
      if (k === 'id' || k === 'project' || k === '_key' || k === '_folder') return;
      const f = def.fields.find(x => x.key === k);
      rec[k] = f ? PM.md.fromCell(f, patch[k]) : patch[k];
    });
    markDirty(def, def.scope === 'meta' ? rec.id : rec.project);
    PM.events.emit('change', { collection: name, action: 'update', record: rec, patch });
    return rec;
  }

  function remove(name, key) {
    const def = PM.collection(name);
    const rec = get(name, key);
    if (!rec) return;
    if (def.scope === 'meta') throw new Error('Projects are not deleted from the app; set status to "archived" or remove the folder.');
    records[name] = records[name].filter(r => r !== rec);
    markDirty(def, rec.project);
    // Referential cleanup: clear any field pointing at the removed record (same project).
    PM.collections().forEach(d => d.fields.filter(f => f.type === 'ref' && f.ref === name).forEach(f => {
      list(d.name).forEach(r => {
        if (r[f.key] === rec.id && (def.scope !== 'project' || d.scope !== 'project' || r.project === rec.project)) {
          r[f.key] = '';
          markDirty(d, d.scope === 'meta' ? r.id : r.project);
        }
      });
    }));
    PM.events.emit('change', { collection: name, action: 'remove', record: rec });
  }

  function createProject(data) {
    const def = PM.collection('projects');
    const ids = projects().map(p => p.id);
    const rec = coerce(def, Object.assign({}, data));
    if (!rec.id || ids.includes(rec.id)) rec.id = U.nextId(def.idPrefix, ids, def.idPad);
    rec._folder = rec.id + '-' + U.slugify(rec.name);
    rec._notes = '# ' + (rec.name || rec.id) + '\n\nProject notes, scope and agreements can be written here.\n';
    rec._key = rec.id;
    records.projects.push(rec);
    markDirty(def, rec.id);
    PM.collections().filter(d => d.scope === 'project').forEach(d => markDirty(d, rec.id));
    PM.events.emit('change', { collection: 'projects', action: 'insert', record: rec });
    return rec;
  }

  /* ---------- serialisation ---------- */
  function columnsFor(def, path, rows) {
    const cols = def.fields.filter(f => !f.computed).map(f => f.key);
    const extra = new Set();
    (docs[path] && docs[path].columns || []).forEach(c => { if (c && !cols.includes(c) && c !== 'project') extra.add(c); });
    rows.forEach(r => Object.keys(r).forEach(k => { if (!k.startsWith('_') && k !== 'project' && !cols.includes(k)) extra.add(k); }));
    return cols.concat(Array.from(extra));
  }

  function serialize(def, projectId) {
    const path = pathFor(def, projectId);
    if (def.scope === 'meta') {
      const p = project(projectId);
      const meta = {};
      def.fields.forEach(f => { meta[f.key] = p[f.key]; });
      Object.keys(p).forEach(k => { if (!k.startsWith('_') && !(k in meta)) meta[k] = p[k]; });
      Object.keys(meta).forEach(k => { if (meta[k] === '' && k !== 'name') delete meta[k]; });
      return { path, text: PM.md.stringifyFrontmatter(meta, def.fields.map(f => f.key)) + '\n' + (p._notes || '').replace(/^\n+/, '') };
    }
    const rows = def.scope === 'project' ? list(def.name, { project: projectId }) : list(def.name);
    const prev = docs[path];
    const doc = {
      meta: Object.assign({ collection: def.name }, def.scope === 'project' ? { project: projectId } : {}, prev ? prev.meta : {}),
      metaOrder: ['collection', 'project'],
      before: prev ? prev.before : '# ' + (def.heading || def.label) + (def.intro ? '\n\n' + def.intro : ''),
      after: prev ? prev.after : ''
    };
    if (def.scope === 'project') doc.meta.project = projectId;
    return { path, text: PM.md.writeTableDoc(doc, columnsFor(def, path, rows), rows) };
  }

  function serializeAll() {
    const out = {};
    PM.collections().forEach(def => {
      if (def.scope === 'global') { const s = serialize(def); out[s.path] = s.text; }
      else projects().forEach(p => { const s = serialize(def, p.id); if (s.path) out[s.path] = s.text; });
    });
    return out;
  }

  /* ---------- saving ---------- */
  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    const delay = (backend && backend.saveDelay) || 500;
    if (delay > 1000 && backend) PM.events.emit('status', { text: 'Saving soon…', kind: 'busy' });
    saveTimer = setTimeout(() => flush(), delay);
  }
  // Save right away when the app goes to the background (phones may close it without warning)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { clearTimeout(saveTimer); flush(); } });
  window.addEventListener('pagehide', () => { clearTimeout(saveTimer); flush(); });
  window.addEventListener('online', () => { if (dirty.size) flush(); });

  const conflicts = new Map();   // path -> job, files changed elsewhere since we read them
  let authBlocked = false;

  async function flush() {
    if (saving || !backend) { if (saving) scheduleSave(); return; }
    if (!dirty.size) return;
    if (authBlocked) { parkUnsaved(); return; }
    saving = true;
    PM.events.emit('status', { text: 'Saving…', kind: 'busy' });
    const jobs = Array.from(dirty.entries());
    dirty.clear();
    const written = [];
    let failed = null;
    for (let i = 0; i < jobs.length; i++) {
      const [path, job] = jobs[i];
      const s = serialize(job.def, job.projectId);
      if (!s.path) continue;
      try {
        await backend.writeText(s.path, s.text);
        docs[s.path] = PM.md.parseTableDoc(s.text);
        written.push(s.path);
      } catch (e) {
        if (e.code === 'conflict') { conflicts.set(path, job); continue; }
        // stop on other errors: keep this and the remaining files dirty
        jobs.slice(i).forEach(([p, j]) => dirty.set(p, j));
        failed = e;
        break;
      }
    }
    saving = false;
    if (written.length) PM.events.emit('saved', { files: written });
    if (failed) {
      console.error(failed);
      if (failed.code === 'auth') { authBlocked = true; parkUnsaved(); PM.events.emit('auth-required', { kind: backend.kind, message: failed.message }); }
      const txt = failed.code === 'auth' ? (backend.kind === 'github' ? 'Token refused — not saved' : 'Signed out — sign in to save')
        : failed.code === 'offline' ? 'Offline — will save when connected' : 'Save failed: ' + failed.message;
      PM.events.emit('status', { text: txt, kind: failed.code === 'offline' ? 'warn' : 'error' });
    } else if (conflicts.size) {
      PM.events.emit('status', { text: 'Conflict — see banner', kind: 'error' });
    } else {
      PM.events.emit('status', statusInfo());
    }
    if (conflicts.size) PM.events.emit('conflict', { paths: Array.from(conflicts.keys()) });
  }

  /* Keep unsaved file contents safe (e.g. when the sign-in expired) so they survive a page reload. */
  function parkUnsaved() {
    if (!PM.onedrive || !backend || backend.kind !== 'onedrive') return;
    const out = {};
    dirty.forEach((job) => { const s = serialize(job.def, job.projectId); if (s.path) out[s.path] = s.text; });
    if (Object.keys(out).length) PM.onedrive.parkPending(out);
  }

  /* Conflict resolution: 'overwrite' writes our version anyway, 'reload' takes theirs. */
  async function resolveConflicts(how) {
    if (how === 'overwrite') {
      conflicts.forEach((job, path) => { if (backend.force) backend.force(path); dirty.set(path, job); });
      conflicts.clear();
      await flush();
    } else {
      conflicts.clear();
      await flush();
      if (backend.prefetch) backend.files = {};
      await load(backend);
    }
  }

  /* Write parked files (from before a forced sign-in) back, then forget them. */
  async function writeParked(files) {
    for (const p in files) {
      try { await backend.writeText(p, files[p]); }
      catch (e) { if (e.code === 'conflict') { backend.force(p); await backend.writeText(p, files[p]); } else throw e; }
    }
  }

  function statusInfo() {
    if (!backend) return { text: 'No data', kind: 'warn' };
    if (backend.kind === 'memory') return { text: 'Demo data — changes are not saved', kind: 'warn' };
    if (backend.kind === 'onedrive') return { text: 'Saved to OneDrive', kind: 'ok' };
    if (backend.kind === 'github') return { text: 'Saved to GitHub', kind: 'ok' };
    if (backend.kind === 'readonly') return { text: changedSinceLoad.size ? changedSinceLoad.size + ' changed file(s) — download to keep' : 'Read-only folder', kind: 'warn' };
    return { text: 'All changes saved', kind: 'ok' };
  }

  async function writeAllTo(be) {
    const files = serializeAll();
    for (const p in files) await be.writeText(p, files[p]);
    return Object.keys(files).length;
  }

  function changedFiles() {
    const all = serializeAll();
    const out = {};
    changedSinceLoad.forEach(p => { if (p in all) out[p] = all[p]; });
    return out;
  }

  // Warn before closing with unsaved changes.
  // When we leave on purpose (Microsoft sign-in), park unsaved work instead of asking.
  window.addEventListener('beforeunload', e => {
    if (!dirty.size && !saving) return;
    if (PM.leaving) { parkUnsaved(); return; }
    flush(); e.preventDefault(); e.returnValue = '';
  });

  return {
    load, list, get, find, insert, update, remove, createProject, project, projects,
    retry() { authBlocked = false; return flush(); },
    get pending() { return dirty.size; },
    serialize, serializeAll, flush, writeAllTo, changedFiles, statusInfo, pathFor, resolveConflicts, writeParked,
    get conflicts() { return Array.from(conflicts.keys()); },
    get backend() { return backend; }
  };
})();

  <script>/* js/core/calc.js */
/* PM Tool — core/calc.js
 * Calculation service: hours, labour cost (per role rate), fixed costs, purchases.
 * Exposed as PM.services.calc so reports, dashboards and future plugins all use
 * the same numbers.
 *
 *   calc.summary({ project?, from?, to? })  -> totals + breakdowns (see below)
 *   calc.entryCost(hourRecord)               -> EUR
 *   calc.costAmount(costRecord)              -> EUR
 *   calc.progress(projectId)                 -> 0..1 (duration-weighted planning progress)
 *   calc.taskStats(projectId?)               -> { total, done, open, overdue, byStatus }
 */
PM.registerService('calc', (function () {
  const U = PM.util;
  const S = () => PM.store;

  function role(id) { return S().find('roles', id); }
  function person(id) { return S().find('people', id); }
  function entryRole(h) { return h.role || (person(h.person) || {}).role || ''; }
  function rate(roleId) { const r = role(roleId); return r ? U.num(r.rate) : 0; }
  function entryCost(h) { return U.num(h.hours) * rate(entryRole(h)); }
  function costAmount(c) {
    const q = c.qty === '' || c.qty == null ? 1 : U.num(c.qty);
    return q * U.num(c.unit_price);
  }

  function inRange(date, from, to) {
    if (from && (!date || date < from)) return false;
    if (to && (!date || date > to)) return false;
    return true;
  }

  function add(map, key, init, fn) { if (!map.has(key)) map.set(key, Object.assign({}, init)); fn(map.get(key)); }

  function summary(opts) {
    opts = opts || {};
    const pf = opts.project ? { project: opts.project } : null;
    const projects = opts.project ? [S().project(opts.project)].filter(Boolean) : S().projects().filter(p => opts.includeArchived || p.status !== 'archived');
    const pids = new Set(projects.map(p => p.id));
    const hours = S().list('hours', pf).filter(h => pids.has(h.project) && inRange(h.date, opts.from, opts.to));
    const costs = S().list('costs', pf).filter(c => pids.has(c.project) && inRange(c.date, opts.from, opts.to));
    const tasks = S().list('tasks', pf).filter(t => pids.has(t.project));
    const warnings = [];

    const byRole = new Map(), byPerson = new Map(), byMonth = new Map(), byCat = new Map(), byLine = new Map(), byProject = new Map();
    projects.forEach(p => byProject.set(p.id, { project: p.id, name: p.name, client: p.client, status: p.status,
      budgetHours: U.num(p.budget_hours), budgetCosts: U.num(p.budget_costs), hours: 0, labour: 0, fixed: 0, purchases: 0, total: 0 }));

    let tHours = 0, tLabour = 0, tFixed = 0, tPurch = 0;

    hours.forEach(h => {
      const rid = entryRole(h);
      const r = role(rid);
      const hh = U.num(h.hours);
      const cost = hh * (r ? U.num(r.rate) : 0);
      if (!rid) warnings.push('Hours ' + h.project + ' ' + h.id + ' has no role (and the person has no default role).');
      else if (!r) warnings.push('Hours ' + h.project + ' ' + h.id + ' uses unknown role "' + rid + '".');
      tHours += hh; tLabour += cost;
      add(byRole, rid || '(none)', { role: rid, name: r ? r.name : (rid || 'No role'), rate: r ? U.num(r.rate) : 0, hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      const pe = person(h.person);
      add(byPerson, h.person || '(none)', { person: h.person, name: pe ? pe.name : (h.person || 'Unknown'), hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      add(byMonth, U.monthKey(h.date) || '(no date)', { month: U.monthKey(h.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { x.hours += hh; x.labour += cost; });
      if (h.line) add(byLine, h.project + '/' + h.line, { project: h.project, line: h.line, hours: 0, labour: 0, costs: 0 }, x => { x.hours += hh; x.labour += cost; });
      const bp = byProject.get(h.project); if (bp) { bp.hours += hh; bp.labour += cost; }
    });

    costs.forEach(c => {
      const amt = costAmount(c);
      const fixed = c.type === 'fixed';
      if (fixed) tFixed += amt; else tPurch += amt;
      add(byCat, (c.type || 'purchase') + '|' + (c.category || 'Uncategorised'), { type: c.type || 'purchase', category: c.category || 'Uncategorised', amount: 0, count: 0 }, x => { x.amount += amt; x.count++; });
      add(byMonth, U.monthKey(c.date) || '(no date)', { month: U.monthKey(c.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { if (fixed) x.fixed += amt; else x.purchases += amt; });
      if (c.line) add(byLine, c.project + '/' + c.line, { project: c.project, line: c.line, hours: 0, labour: 0, costs: 0 }, x => { x.costs += amt; });
      const bp = byProject.get(c.project); if (bp) { if (fixed) bp.fixed += amt; else bp.purchases += amt; }
    });

    byProject.forEach(x => { x.total = x.labour + x.fixed + x.purchases; });
    const lines = Array.from(byLine.values()).map(x => {
      const l = S().find('lines', x.line, x.project);

      }
    }

    // 3) last used folder (PC)
    const last = await PM.storage.lastFolder();
    if (last && last.granted) {
      try { await useBackend(new PM.storage.FolderBackend(last.handle), true); return; } catch (e) { console.warn(e); }
    }

    // 4) demo data, plus the right offer for this device
    await useBackend(demoBackend(), true);
    const odBtn = PM.onedrive.configured() && PM.onedrive.canSignIn()
      ? h('button', { class: 'btn ghost small', onclick: connectOneDrive }, PM.onedrive.signedIn() ? 'Open my OneDrive data' : 'Sign in with Microsoft')
      : null;
    const ghBtn = h('button', { class: 'btn primary small', onclick: () => connectGitHub() }, PM.github.configured() ? 'Open my GitHub data' : 'Connect GitHub');
    if (last) {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'Showing demo data. Your folder "' + last.handle.name + '" needs permission again.'),
        h('button', { class: 'btn primary small', onclick: async () => { try { await useBackend(await PM.storage.reopen(last.handle)); } catch (e) { PM.ui.toast(e.message, 'error'); } } }, 'Reconnect folder'),
        ghBtn, odBtn,
        h('button', { class: 'btn ghost small', onclick: openFolder }, 'Choose another folder')));
    } else {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'You are looking at demo data. Changes are not saved until you connect your data (GitHub) or choose a folder.'),
        ghBtn,
        odBtn,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: saveToFolder }, 'Save demo to a new folder') : null,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: openFolder }, 'Open existing folder') : null,
        h('button', { class: 'icon-btn', 'aria-label': 'Dismiss', onclick: hideBanner }, '✕')));
    }
  }

  function isTouch() { return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }

  return { boot, render, navigate, setProject, openFolder, saveToFolder, downloadZip, newProjectDialog, useBackend, connectOneDrive, copyToOneDrive, connectGitHub, copyDemoTo, isTouch, get route() { return route; } };
})();

/* PM Tool — modules/dashboard.js
 * Portfolio overview (all projects) and project overview (one project).
 */
PM.registerModule({
  id: 'dashboard', title: 'Dashboard', icon: '◧', order: 10,
  render(el, ctx) {
    const U = PM.util, h = U.h, calc = PM.services.calc;
    if (ctx.project) return renderProject(el, ctx);

    const st = this.state = this.state || { showAll: false };
    const all = PM.store.projects();
    const projects = all.filter(p => st.showAll ? p.status !== 'archived' : ['active', 'planned', 'on-hold'].includes(p.status || 'active'));
    const sum = calc.summary({});
    const month = U.todayISO().slice(0, 7);
    const monthSum = calc.summary({ from: month + '-01', to: month + '-31' });
    const ts = calc.taskStats();

    el.appendChild(h('div', { class: 'page-head' },
      h('div', null, h('h1', null, 'Portfolio'), h('p', { class: 'muted' }, U.fmtDate(U.todayISO()) + ' · ' + all.filter(p => p.status === 'active').length + ' active project(s)')),
      h('span', { class: 'spacer' }),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.showAll || null, onchange: e => { st.showAll = e.target.checked; ctx.rerender(); } }), ' Show completed'),

    el.appendChild(h('div', { class: 'stats' },
      PM.ui.stat('Hours this month', U.fmtNum(monthSum.hours), U.fmtMoney(monthSum.labour) + ' labour'),
      PM.ui.stat('Total cost to date', U.fmtMoney(sum.total), 'budget ' + U.fmtMoney(sum.budgetCosts), sum.budgetCosts && sum.total > sum.budgetCosts ? 'bad' : ''),
      PM.ui.stat('Hours to date', U.fmtNum(sum.hours), 'budget ' + U.fmtNum(sum.budgetHours) + ' h'),
      PM.ui.stat('Open tasks', U.fmtNum(ts.open), ts.overdue ? ts.overdue + ' overdue' : 'none overdue', ts.overdue ? 'bad' : '')));

    if (!projects.length) {
      el.appendChild(PM.ui.empty('No projects to show.', h('button', { class: 'btn primary', onclick: () => PM.app.newProjectDialog() }, 'Create the first project')));
      return;
    }

    const byId = new Map(sum.byProject.map(x => [x.project, x]));
    el.appendChild(h('div', { class: 'proj-grid' }, projects.map(p => {
      const s = byId.get(p.id) || { hours: 0, total: 0 };
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      return h('a', { class: 'proj-card', href: '#/dashboard?project=' + p.id, style: { '--pc': p.color || '#2f6fed' } },
        h('div', { class: 'proj-card-head' },
          h('div', null, h('div', { class: 'proj-name' }, p.name), h('div', { class: 'muted small' }, p.id + (p.client ? ' · ' + p.client : ''))),
          h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active')),
        h('div', { class: 'muted small' }, U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end)),
        h('div', { class: 'kv' }, h('span', null, 'Progress'), PM.ui.meter(prog, 1, 'Planning progress', 'progress')),
        h('div', { class: 'kv' }, h('span', null, 'Hours ' + U.fmtNum(s.hours) + ' / ' + U.fmtNum(p.budget_hours)), PM.ui.meter(s.hours, U.num(p.budget_hours))),
        h('div', { class: 'kv' }, h('span', null, 'Cost ' + U.fmtMoney(s.total) + ' / ' + U.fmtMoney(p.budget_costs)), PM.ui.meter(s.total, U.num(p.budget_costs))),
        h('div', { class: 'small proj-tasks' }, t.open + ' open task(s)', t.overdue ? h('span', { class: 'bad-text' }, ' · ' + t.overdue + ' overdue') : null));
    })));

    function renderProject(el, ctx) {
      const p = ctx.project;
      const s = calc.summary({ project: p.id });
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      const today = U.todayISO();

      el.appendChild(h('div', { class: 'page-head' },
        h('span', { class: 'swatch big', style: { background: p.color || '#2f6fed' } }),
        h('div', null, h('h1', null, p.name), h('p', { class: 'muted' }, p.id + (p.client ? ' · ' + p.client : '') + ' · ' + U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end))),
        h('span', { class: 'spacer' }),
        h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active')));

      el.appendChild(h('div', { class: 'stats' },
        PM.ui.stat('Planning progress', U.fmtPct(prog), PM.store.list('lines', { project: p.id }).length + ' planning lines'),
        PM.ui.stat('Hours', U.fmtNum(s.hours) + ' h', 'of ' + U.fmtNum(p.budget_hours) + ' h budget · est. ' + U.fmtNum(s.estimateHours) + ' h', p.budget_hours && s.hours > p.budget_hours ? 'bad' : ''),
        PM.ui.stat('Cost', U.fmtMoney(s.total), 'of ' + U.fmtMoney(p.budget_costs) + ' · ' + U.fmtPct(p.budget_costs ? s.total / p.budget_costs : NaN), p.budget_costs && s.total > p.budget_costs ? 'bad' : ''),
        PM.ui.stat('Tasks', t.done + ' / ' + t.total + ' done', t.overdue ? t.overdue + ' overdue' : 'none overdue', t.overdue ? 'bad' : '')));

      const grid = h('div', { class: 'two-col' });
      el.appendChild(grid);

      // current & upcoming planning lines
      const lines = PM.store.list('lines', l => l.project === p.id && l.end >= today && l.start <= U.addDays(today, 21))
        .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
      grid.appendChild(PM.ui.section('Now and next 3 weeks',
        lines.length ? h('ul', { class: 'line-list' }, lines.map(l => {
          const tasks = calc.lineTasks(p.id, l.id);
          return h('li', null,
            h('span', { class: 'dot ' + (tasks.length ? 'linked' : '') }),
            h('div', { class: 'grow' }, h('div', null, l.title), h('div', { class: 'muted small' }, (l.group ? l.group + ' · ' : '') + U.fmtDate(l.start) + ' – ' + U.fmtDate(l.end) + (tasks.length ? ' · ' + tasks.filter(x => x.status === 'done').length + '/' + tasks.length + ' tasks done' : ''))),
            h('span', { class: 'small muted' }, U.num(l.progress) + '%'));
        })) : h('p', { class: 'muted' }, 'Nothing planned in this period.'),
        h('a', { class: 'btn ghost small', href: '#/planning?project=' + p.id }, 'Open planning')));

      // attention: overdue / due soon tasks
      const due = PM.store.list('tasks', x => x.project === p.id && x.status !== 'done' && x.due && x.due <= U.addDays(today, 7))
        .sort((a, b) => a.due.localeCompare(b.due));
      grid.appendChild(PM.ui.section('Tasks due within a week',
        due.length ? h('ul', { class: 'line-list' }, due.map(x => {
          const who = PM.store.find('people', x.assignee);
          return h('li', null,
            h('span', { class: 'pill small st-' + x.status }, x.status),
            h('div', { class: 'grow' }, h('div', null, x.title), h('div', { class: 'muted small' }, x.id + (who ? ' · ' + who.name : ''))),
            h('span', { class: 'small ' + (x.due < today ? 'bad-text' : 'muted') }, U.fmtDate(x.due)));
        })) : h('p', { class: 'muted' }, 'No tasks due.'),
        h('a', { class: 'btn ghost small', href: '#/tasks?project=' + p.id }, 'Open tasks')));

      // project details (editable)
      const def = PM.collection('projects');
      const details = h('div', { class: 'form-grid' }, def.fields.filter(f => f.type !== 'id').map(f =>
        h('label', { class: 'form-row' }, h('span', null, f.label),
          PM.ui.input(f, p[f.key], { record: p, collection: 'projects', focusKey: 'projects|' + p._key + '|' + f.key, onCommit: v => PM.store.update('projects', p._key, { [f.key]: v }) }))));
      const notes = h('textarea', { class: 'notes', rows: 8, 'data-focus': 'projects|' + p._key + '|_notes', 'aria-label': 'Project notes' }, p._notes || '');
      notes.addEventListener('change', () => PM.store.update('projects', p._key, { _notes: notes.value }));
      el.appendChild(PM.ui.section('Project details', h('div', null, details,
        h('label', { class: 'form-row wide' }, h('span', null, 'Notes (Markdown, saved in project.md)'), notes),
        h('p', { class: 'muted small' }, 'Stored in ', h('code', null, PM.store.pathFor(def, p.id))))));
    }
  }
});

  <script>/* js/modules/planning.js */
/* PM Tool — modules/planning.js
 * Timeline (Gantt-style bars). One bar per planning line (planning.md).
 * Bars with linked tasks get the project colour; bars without tasks are grey;
 * bars whose tasks are all done (or progress 100%) turn green.
 * Drag a bar to move it, drag its edges to change start/end, click to edit and link tasks.
 */
(function () {
  const U = PM.util, h = U.h;
  const ZOOM = { day: { px: 30, label: 'Days' }, week: { px: 12, label: 'Weeks' }, month: { px: 4, label: 'Months' } };
  const state = { zoom: 'week', collapsed: {}, expandedProjects: {}, view: 'timeline', filter: 'all' };

  let taskIndex = null;            // project/line -> tasks, rebuilt on every timeline render
  function buildIndex() {
    taskIndex = new Map();
    PM.store.list('tasks').forEach(t => { if (t.line) { const k = t.project + '/' + t.line; if (!taskIndex.has(k)) taskIndex.set(k, []); taskIndex.get(k).push(t); } });
  }
  function lineState(l) {
    const tasks = taskIndex ? (taskIndex.get(l.project + '/' + l.id) || []) : PM.services.calc.lineTasks(l.project, l.id);
    const done = tasks.filter(t => t.status === 'done').length;
    const complete = tasks.length > 0 && done === tasks.length;     // green only when every linked task is done
    return { tasks, done, linked: tasks.length > 0, complete };
  }

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / U.DAY + 1) / 7);
  }

  /* ---------------- line dialog: edit + link tasks ---------------- */
  function openLineDialog(line) {
    const pid = line.project;
    const f = PM.ui.form('lines', line, { projectId: pid });
    const taskBox = h('div', { class: 'linked-tasks' });

    function refresh() {
      taskBox.innerHTML = '';
      const linked = PM.services.calc.lineTasks(pid, line.id);
      taskBox.appendChild(h('h4', null, 'Linked tasks (' + linked.length + ')'));
      taskBox.appendChild(linked.length ? h('ul', { class: 'line-list' }, linked.map(t => {
        const who = PM.store.find('people', t.assignee);
        const sel = PM.ui.input(PM.collection('tasks').fields.find(x => x.key === 'status'), t.status, { onCommit: v => { PM.store.update('tasks', t._key, { status: v }); refresh(); } });
        return h('li', null, sel,
          h('div', { class: 'grow' }, h('div', null, t.title), h('div', { class: 'muted small' }, t.id + (who ? ' · ' + who.name : '') + (t.due ? ' · due ' + U.fmtDate(t.due) : ''))),
          h('button', { class: 'btn ghost small', onclick: () => { PM.store.update('tasks', t._key, { line: '' }); refresh(); } }, 'Unlink'));
      })) : h('p', { class: 'muted small' }, 'No tasks linked yet — this bar is shown in grey.'));

      // link an existing task
      const free = PM.store.list('tasks', t => t.project === pid && t.line !== line.id);
      if (free.length) {
        const sel = h('select', { 'aria-label': 'Task to link' }, free.map(t => h('option', { value: t._key }, t.id + ' · ' + t.title + (t.line ? '  (now on ' + t.line + ')' : ''))));
        taskBox.appendChild(h('div', { class: 'inline-form' }, sel, h('button', { class: 'btn small', onclick: () => { PM.store.update('tasks', sel.value, { line: line.id }); refresh(); } }, 'Link task')));
      }
      // create a new task on this line
      const title = h('input', { type: 'text', placeholder: 'New task title…', 'aria-label': 'New task title' });
      const who = PM.ui.input(PM.collection('tasks').fields.find(x => x.key === 'assignee'), '', {});
      const add = () => {
        if (!title.value.trim()) { title.focus(); return; }
        PM.store.insert('tasks', { title: title.value.trim(), line: line.id, assignee: who.value, status: 'todo', due: f.values().end || line.end }, pid);
        refresh();
        taskBox.querySelector('input[type=text]').focus();
      };
      title.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      taskBox.appendChild(h('div', { class: 'inline-form' }, title, who, h('button', { class: 'btn primary small', onclick: add }, 'Add task')));
    }
    refresh();

    const dlg = PM.ui.dialog({
      title: line.id + ' · ' + (line.title || 'Planning line'), wide: true,
      content: h('div', null, f.el, taskBox),
      footLeft: h('button', { class: 'btn danger', onclick: () => {
        if (confirm('Delete planning line ' + line.id + '? Linked tasks stay, but are unlinked.')) { PM.store.remove('lines', line._key); dlg.close(); }
      } }, 'Delete line'),
      actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: () => {
        const v = f.values();
        if (v.start && v.end && v.end < v.start) { PM.ui.toast('End date is before start date.', 'warn'); return false; }
        const patch = {};
        ['group', 'title', 'start', 'end', 'progress', 'milestone'].forEach(k => { if (v[k] !== line[k]) patch[k] = v[k]; });
        if (Object.keys(patch).length) PM.store.update('lines', line._key, patch);
      } }]
    });
  }

  function addLine(pid) {
    const lines = PM.store.list('lines', { project: pid });
    const last = lines[lines.length - 1];
    const start = U.todayISO();
    const rec = PM.store.insert('lines', { title: 'New planning line', group: last ? last.group : '', start, end: U.addDays(start, 6), progress: 0 }, pid);
    openLineDialog(rec);
  }

  /* ---------------- timeline ---------------- */
  function renderTimeline(el, ctx) {
    buildIndex();
    const LABEL_W = PM.ui.isNarrow() ? 150 : 300;
    const px = ZOOM[state.zoom].px;
    const today = U.todayISO();

    // Build the row model
    const rows = [];
    const allLines = [];
    const passes = l => state.filter === 'all' || (state.filter === 'linked') === lineState(l).linked;
    if (ctx.project) {
      const lines = PM.store.list('lines', { project: ctx.projectId });
      const groups = U.groupBy(lines, l => l.group || '');
      groups.forEach((ls, g) => {
        const vis = ls.filter(passes);
        if (!vis.length) return;
        const gk = ctx.projectId + '|' + g;
        if (g) rows.push({ type: 'group', key: gk, title: g, lines: ls, color: ctx.project.color });
        if (!g || !state.collapsed[gk]) vis.forEach(l => rows.push({ type: 'line', line: l }));
        allLines.push(...ls);
      });
    } else {
      PM.store.projects().filter(p => p.status !== 'archived' && p.status !== 'completed').forEach(p => {
        const ls = PM.store.list('lines', { project: p.id });
        rows.push({ type: 'project', key: p.id, title: p.name, project: p, lines: ls, color: p.color });
        allLines.push(...ls);
        if (state.expandedProjects[p.id]) ls.filter(passes).forEach(l => rows.push({ type: 'line', line: l, indent: true }));
        if (!ls.length && p.start && p.end) allLines.push({ start: p.start, end: p.end });
      });
    }

    // Date range
    const starts = allLines.map(l => l.start).filter(Boolean).concat(today);
    const ends = allLines.map(l => l.end || l.start).filter(Boolean).concat(today);
    let from = starts.reduce((a, b) => a < b ? a : b);
    let to = ends.reduce((a, b) => a > b ? a : b);
    from = U.addDays(from, -10);
    const fd = U.parseDate(from);
    from = U.addDays(from, -((fd.getUTCDay() + 6) % 7));       // align to Monday
    to = U.addDays(to, 21);
    const days = U.daysBetween(from, to) + 1;
    const W = days * px;
    const x = d => U.daysBetween(from, d) * px;

    // Header (months + days/weeks)
    const top = h('div', { class: 'g-scale top', style: { width: W + 'px' } });
    const bottom = h('div', { class: 'g-scale bottom', style: { width: W + 'px' } });
    let d = U.parseDate(from);
    const end = U.parseDate(to);
    while (d <= end) {
      const di = U.iso(d);
      if (d.getUTCDate() === 1 || di === from) {
        const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
        const w = Math.min(U.daysBetween(di, U.iso(next)), U.daysBetween(di, to) + 1) * px;
        top.appendChild(h('div', { class: 'g-cell', style: { left: x(di) + 'px', width: w + 'px' } }, w > 50 ? U.MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : (w > 22 ? U.MONTHS[d.getUTCMonth()] : '')));
      }
      if (state.zoom === 'day') {
        const dow = d.getUTCDay();
        bottom.appendChild(h('div', { class: 'g-cell' + (dow === 0 || dow === 6 ? ' wknd' : '') + (di === today ? ' today' : ''), style: { left: x(di) + 'px', width: px + 'px' } }, d.getUTCDate()));
      } else if (state.zoom === 'week' && d.getUTCDay() === 1) {
        bottom.appendChild(h('div', { class: 'g-cell', style: { left: x(di) + 'px', width: 7 * px + 'px' } }, 'W' + isoWeek(d)));
      }
      d = new Date(d.getTime() + U.DAY);
    }

    // background: weekends (day/week zoom) or week lines (month zoom)
    const bg = state.zoom === 'month'
      ? 'repeating-linear-gradient(to right, transparent 0, transparent ' + (7 * px - 1) + 'px, var(--grid) ' + (7 * px - 1) + 'px, var(--grid) ' + (7 * px) + 'px)'
      : 'repeating-linear-gradient(to right, transparent 0, transparent ' + (5 * px) + 'px, var(--weekend) ' + (5 * px) + 'px, var(--weekend) ' + (7 * px) + 'px)';
    const trackStyle = { width: W + 'px', backgroundImage: bg };

    const inner = h('div', { class: 'g-inner', style: { width: (LABEL_W + W) + 'px' } });
    inner.appendChild(h('div', { class: 'g-head' }, h('div', { class: 'g-label head' }, ctx.project ? 'Planning line' : 'Project'), h('div', { class: 'g-scales' }, top, bottom)));

    const body = h('div', { class: 'g-body' });
    inner.appendChild(body);
    if (U.daysBetween(from, today) >= 0) body.appendChild(h('div', { class: 'g-today', style: { left: (LABEL_W + x(today) + px / 2) + 'px' }, title: 'Today' }));

    rows.forEach(r => {
      if (r.type === 'group' || r.type === 'project') {
        const ls = r.lines.filter(l => l.start);
        const s = ls.length ? ls.map(l => l.start).reduce((a, b) => a < b ? a : b) : (r.project && r.project.start);
        const e = ls.length ? ls.map(l => l.end || l.start).reduce((a, b) => a > b ? a : b) : (r.project && r.project.end);
        const open = r.type === 'group' ? !state.collapsed[r.key] : !!state.expandedProjects[r.key];
        const toggle = () => { if (r.type === 'group') state.collapsed[r.key] = open; else state.expandedProjects[r.key] = !open; ctx.rerender(); };
        const linked = r.lines.filter(l => lineState(l).linked).length;
        const label = h('div', { class: 'g-label group', style: { '--pc': r.color || '#2f6fed' } },
          h('button', { class: 'caret', 'aria-expanded': String(open), 'aria-label': (open ? 'Collapse ' : 'Expand ') + r.title, onclick: toggle }, open ? '▾' : '▸'),
          h('span', { class: 'g-title', onclick: toggle }, r.title),
          h('span', { class: 'muted small nowrap', title: linked + ' of ' + r.lines.length + ' planning lines have linked tasks' }, linked + '/' + r.lines.length),
          r.type === 'project' ? h('a', { class: 'open-link small', href: '#/planning?project=' + r.key, title: 'Open project planning' }, 'open ›') : null);
        const track = h('div', { class: 'g-track', style: trackStyle });
        if (s && e) track.appendChild(h('div', { class: 'g-summary', style: { left: x(s) + 'px', width: Math.max(px, (U.daysBetween(s, e) + 1) * px) + 'px', '--pc': r.color || '#2f6fed' }, title: r.title + ': ' + U.fmtDate(s) + ' – ' + U.fmtDate(e) }));
        body.appendChild(h('div', { class: 'g-row group-row' }, label, track));
        return;
      }

      const l = r.line;
      const ls = lineState(l);
      const proj = PM.store.project(l.project);
      const label = h('div', { class: 'g-label' + (r.indent ? ' indent' : '') },
        h('span', { class: 'dot ' + (ls.linked ? 'linked' : '') + (ls.complete ? ' done' : ''), style: ls.linked ? { '--pc': proj.color || '#2f6fed' } : null }),
        h('button', { class: 'g-title link', onclick: () => openLineDialog(l), title: 'Edit ' + l.id }, l.title || l.id),

/* PM Tool — modules/reports.js
 * Hours and cost reports, per project or for the whole portfolio.
 * Every table can be exported as CSV; the page prints cleanly (Print / PDF).
 * Uses PM.services.calc.summary() — the same numbers are available to plugins.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { period: 'all', from: '', to: '' };

  function periodRange() {
    const t = U.parseDate(U.todayISO());
    const y = t.getUTCFullYear(), m = t.getUTCMonth();
    const d = (yy, mm, dd) => U.iso(new Date(Date.UTC(yy, mm, dd)));
    switch (state.period) {
      case 'month': return [d(y, m, 1), d(y, m + 1, 0)];
      case 'lastmonth': return [d(y, m - 1, 1), d(y, m, 0)];
      case 'quarter': { const q = Math.floor(m / 3) * 3; return [d(y, q, 1), d(y, q + 3, 0)]; }

      case 'custom': return [state.from, state.to];
      default: return ['', ''];
    }
  }

  PM.registerModule({
    id: 'reports', title: 'Reports', icon: '▥', order: 60,
    render(el, ctx) {
      const calc = PM.services.calc;
      const [from, to] = periodRange();
      const s = calc.summary({ project: ctx.projectId, from, to });

  <script>/* js/adapters/json.js */
/* PM Tool — adapters/json.js
 * Full data set as one JSON document — the easiest way for other programs to
 * read everything, or to move data between installations.
 *
 * Format:
 * { "format": "pm-tool", "version": 1, "exported": "2026-10-12",
 *   "collections": { "projects": [ {...} ], "roles": [...], "tasks": [ {"project": "P-001", ...} ] } }
 */
(function () {
  const U = PM.util;

  function exportAll() {
    const out = { format: 'pm-tool', version: 1, exported: U.todayISO(), collections: {} };
    PM.collections().forEach(def => {
      out.collections[def.name] = PM.store.list(def.name).map(r => {
        const o = {};
        Object.keys(r).forEach(k => { if (!k.startsWith('_')) o[k] = r[k]; });
        if (def.scope === 'meta') { o.folder = r._folder; o.notes = r._notes; }
        return o;
      });
    });
    return out;
  }

  /* Merge records into the store: same id (+ project) = update, otherwise insert. */
  function importData(data) {
    if (!data || !data.collections) throw new Error('Not a pm-tool JSON file (missing "collections").');
    const counts = {};
    const order = ['roles', 'people', 'projects'].concat(PM.collections().map(d => d.name).filter(n => !['roles', 'people', 'projects'].includes(n)));
    order.forEach(name => {
      const def = PM.collection(name);
      const list = data.collections[name];
      if (!def || !Array.isArray(list)) return;
      let ins = 0, upd = 0;
      list.forEach(raw => {
        const r = Object.assign({}, raw);
        if (def.scope === 'meta') {
          const ex = PM.store.project(r.id);
          const notes = r.notes; delete r.notes; delete r.folder;
          if (notes != null) r._notes = notes;
          if (ex) { PM.store.update('projects', ex._key, r); upd++; } else { const p = PM.store.createProject(r); if (notes != null) p._notes = notes; ins++; }
          return;
        }
        const pid = r.project;
        const ex = r.id ? PM.store.find(name, r.id, pid) : null;
        if (ex) { PM.store.update(name, ex._key, r); upd++; }
        else if (def.scope !== 'project' || PM.store.project(pid)) { PM.store.insert(name, r, pid); ins++; }
      });
      if (ins || upd) counts[def.label] = ins + ' new, ' + upd + ' updated';
    });
    return Object.keys(counts).map(k => k + ': ' + counts[k]).join('; ') || 'Nothing imported.';
  }

  PM.registerAdapter({
    id: 'json', label: 'JSON (complete data set)',
    exports: [{ id: 'json-all', label: 'Export everything as JSON', run: () => ({ filename: 'pm-data-' + U.todayISO() + '.json', content: JSON.stringify(exportAll(), null, 2), mime: 'application/json' }) }],
    imports: [{ id: 'json-all', label: 'Import / merge JSON', accept: '.json,application/json', run: async text => importData(JSON.parse(text)) }]
  });

  PM.json = { exportAll, importData };
})();

  <script>/* js/adapters/csv.js */
/* PM Tool — adapters/csv.js
 * CSV per collection (Excel, Google Sheets, accounting tools).
 * Export: the selected project, or all projects (with a "project" column).
 * Import: rows are merged by id into the selected project (or by their "project" column).
 */
(function () {
  const U = PM.util;

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    const head = (rows.shift() || []).map(x => x.trim().toLowerCase().replace(/\s+/g, '_'));
    return rows.filter(r => r.some(c => c.trim() !== '')).map(r => { const o = {}; head.forEach((k, i) => { o[k] = (r[i] || '').trim(); }); return o; });
  }

  function exportCollection(name, projectId) {
    const def = PM.collection(name);
    const rows = PM.store.list(name, projectId && def.scope === 'project' ? { project: projectId } : null);
    const cols = (def.scope === 'project' ? [{ key: 'project', label: 'project' }] : []).concat(def.fields.map(f => ({ key: f.key, label: f.key })));
    return U.toCSV(cols, rows);
  }

  function importCollection(name, text, projectId) {
    const def = PM.collection(name);
    const rows = parseCSV(text);
    let ins = 0, upd = 0, skipped = 0;
    rows.forEach(r => {
      if (def.scope === 'meta') {
        const ex = PM.store.project(r.id);
        if (ex) { PM.store.update('projects', ex._key, r); upd++; } else { PM.store.createProject(r); ins++; }
        return;
      }
      const pid = def.scope === 'project' ? (r.project || projectId) : null;
      delete r.project;
      if (def.scope === 'project' && !PM.store.project(pid)) { skipped++; return; }
      const ex = r.id ? PM.store.find(name, r.id, pid) : null;
      if (ex) { PM.store.update(name, ex._key, r); upd++; } else { PM.store.insert(name, r, pid); ins++; }
