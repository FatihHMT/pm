      const r = role(rid);
      const hh = U.num(h.hours);
      const cost = hh * entryRate(h);
      if (!rid) warnings.push('Hours ' + h.project + ' ' + h.id + ' has no role (and the person has no default role).');
      else if (!r) warnings.push('Hours ' + h.project + ' ' + h.id + ' uses unknown role "' + rid + '".');
      tHours += hh; tLabour += cost;
      add(byRole, rid || '(none)', { role: rid, name: r ? r.name : (rid || 'No role'), rate: r ? U.num(r.rate) : 0, hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      const pe = person(h.person);
      add(byPerson, h.person || '(none)', { person: h.person, name: pe ? pe.name : (h.person || 'Unknown'), hours: 0, cost: 0 }, x => { x.hours += hh; x.cost += cost; });
      add(byMonth, U.monthKey(h.date) || '(no date)', { month: U.monthKey(h.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { x.hours += hh; x.labour += cost; });
      if (h.line) add(byLine, h.project + '/' + h.line, { project: h.project, line: h.line, hours: 0, labour: 0, costs: 0 }, x => { x.hours += hh; x.labour += cost; });
      const bp = byProject.get(h.project); if (bp) { bp.hours += hh; bp.labour += cost; }
    });

    costs.forEach(c => {
      const amt = costAmount(c);
      const fixed = c.type === 'fixed';
      if (fixed) tFixed += amt; else tPurch += amt;
      add(byCat, (c.type || 'purchase') + '|' + (c.category || 'Uncategorised'), { type: c.type || 'purchase', category: c.category || 'Uncategorised', amount: 0, count: 0 }, x => { x.amount += amt; x.count++; });
      add(byMonth, U.monthKey(c.date) || '(no date)', { month: U.monthKey(c.date), hours: 0, labour: 0, fixed: 0, purchases: 0 }, x => { if (fixed) x.fixed += amt; else x.purchases += amt; });
      if (c.line) add(byLine, c.project + '/' + c.line, { project: c.project, line: c.line, hours: 0, labour: 0, costs: 0 }, x => { x.costs += amt; });
      const bp = byProject.get(c.project); if (bp) { if (fixed) bp.fixed += amt; else bp.purchases += amt; }
    });

    byProject.forEach(x => { x.total = x.labour + x.fixed + x.purchases; });
    const lines = Array.from(byLine.values()).map(x => {
      const l = S().find('lines', x.line, x.project);
      const est = U.sum(tasks.filter(t => t.project === x.project && t.line === x.line), t => t.estimate);
      return Object.assign(x, { title: l ? l.title : x.line, group: l ? l.group : '', estimate: est, total: x.labour + x.costs });
    });

    const budgetHours = U.sum(projects, p => p.budget_hours);
    const budgetCosts = U.sum(projects, p => p.budget_costs);
    const total = tLabour + tFixed + tPurch;
    return {
      projects: projects.map(p => p.id),
      hours: tHours, labour: tLabour, fixed: tFixed, purchases: tPurch, total,
      budgetHours, budgetCosts,
      remainingHours: budgetHours - tHours, remainingCosts: budgetCosts - total,
      estimateHours: U.sum(tasks, t => t.estimate),
      byRole: Array.from(byRole.values()).sort((a, b) => b.cost - a.cost),
      byPerson: Array.from(byPerson.values()).sort((a, b) => b.hours - a.hours),
      byCategory: Array.from(byCat.values()).sort((a, b) => a.type.localeCompare(b.type) || b.amount - a.amount),
      byMonth: Array.from(byMonth.values()).map(m => Object.assign(m, { total: m.labour + m.fixed + m.purchases })).sort((a, b) => (a.month || '').localeCompare(b.month || '')),
      byLine: lines.sort((a, b) => b.total - a.total),
      byProject: Array.from(byProject.values()),
      warnings: Array.from(new Set(warnings))
    };
  }

  function progress(projectId) {
    const lines = S().list('lines', { project: projectId });
    let w = 0, done = 0;
    lines.forEach(l => {
      const d = Math.max(1, U.daysBetween(l.start, l.end) + 1);
      w += d; done += d * Math.min(100, U.num(l.progress)) / 100;
    });
    return w ? done / w : 0;
  }

  function taskStats(projectId) {
    const tasks = S().list('tasks', projectId ? { project: projectId } : null);
    const today = U.todayISO();
    const byStatus = {};
    tasks.forEach(t => { byStatus[t.status || 'todo'] = (byStatus[t.status || 'todo'] || 0) + 1; });
    const done = byStatus.done || 0;
    return {
      total: tasks.length, done, open: tasks.length - done, byStatus,
      overdue: tasks.filter(t => t.status !== 'done' && t.due && t.due < today).length
    };
  }

  /* Tasks linked to a planning line */
  function lineTasks(projectId, lineId) {
    return S().list('tasks', t => t.project === projectId && t.line === lineId);
  }

  /* ---------- preliminary estimate vs actual ---------- */
  function estimatePrice(e) { return e.unit_price === '' || e.unit_price == null ? (e.role ? rateFor(e.project, e.role) : 0) : U.num(e.unit_price); }
  function estimateAmount(e) {
    const q = e.qty === '' || e.qty == null ? 1 : U.num(e.qty);
    return q * estimatePrice(e);
  }

  /* Rows ("buckets") compared against actuals:
   *  - a normal estimate line  ← costs linked to it (costs.estimate = line id)
   *  - all labour lines of one role together ← hours with that role (+ costs linked to those lines)
   *  - "not in estimate" rows for hours of other roles and costs that are not linked
   * Approved / invoiced additional work uses its price (what the client pays) in the estimate column,
   * so its difference shows the margin left on that work.
   * Current margin = revenue (offer + approved additional work) − actual costs so far. */
  function estimateAnalysis(projectId) {
    const p = S().project(projectId) || {};
    const est = S().list('estimate', { project: projectId });
    const costs = S().list('costs', { project: projectId });
    const hours = S().list('hours', { project: projectId });
    const extras = S().list('extras', { project: projectId });
    const ids = new Set(est.map(e => e.id));
    const xids = new Set(extras.map(x => x.id));
    const rows = [], byKey = new Map();
    const subjOf = e => (e.subject || '').trim() || 'Other';
    const mk = (key, init) => { if (!byKey.has(key)) { const r = Object.assign({ key, estimate: 0, actual: 0, estHours: null, actHours: null, lines: [], costs: [], hours: [] }, init); byKey.set(key, r); rows.push(r); } return byKey.get(key); };

    est.forEach(e => {
      const amt = estimateAmount(e);
      if (e.role) {
        const r = mk('role|' + e.role, { kind: 'labour', subject: subjOf(e), role: e.role, title: (role(e.role) || {}).name || e.role, estHours: 0, actHours: 0 });
        r.estimate += amt; r.estHours += U.num(e.qty); r.lines.push(e);
      } else {
        const r = mk('line|' + e.id, { kind: 'line', subject: subjOf(e), title: e.description || e.id, id: e.id });
        r.estimate += amt; r.lines.push(e);
      }
    });
    const COUNTS = st => st === 'approved' || st === 'invoiced';
    extras.forEach(x => {
      const counted = COUNTS(x.status);
      if (x.status === 'rejected') return;      // rejected items only appear when costs were booked on them (below)
      mk('extra|' + x.id, { kind: 'extra', subject: 'Additional work', title: x.description || x.id, id: x.id, status: x.status || 'quoted', counted,
        estimate: counted ? U.num(x.price) : 0, quotedCost: U.num(x.cost_estimate), revenue: counted ? U.num(x.price) : 0, price: U.num(x.price) });
    });
    const extraRow = id => { const x = extras.find(e => e.id === id); return byKey.get('extra|' + id) || mk('extra|' + id, { kind: 'extra', subject: 'Additional work', title: x.description || x.id, id: x.id, status: x.status, counted: false, revenue: 0, price: U.num(x.price), quotedCost: U.num(x.cost_estimate) }); };
    const lineRow = id => { const e = est.find(x => x.id === id); return e && byKey.get(e.role ? 'role|' + e.role : 'line|' + e.id); };
    costs.forEach(c => {
      const amt = costAmount(c);
      const r = c.estimate && ids.has(c.estimate) ? lineRow(c.estimate) : c.estimate && xids.has(c.estimate) ? extraRow(c.estimate) : mk('unlinked', { kind: 'unlinked', subject: 'Not in estimate', title: 'Costs not linked to an estimate line' });
      r.actual += amt; r.costs.push(c);
    });
    hours.forEach(hr => {
      const rid = entryRole(hr), hh = U.num(hr.hours), cost = entryCost(hr);
      if (hr.extra && xids.has(hr.extra)) { const x = extraRow(hr.extra); x.actual += cost; x.actHours = (x.actHours || 0) + hh; x.hours.push(hr); return; }
      const r = byKey.get('role|' + rid) || mk('hours|' + (rid || '-'), { kind: 'unplanned-labour', subject: 'Not in estimate', title: 'Hours · ' + ((role(rid) || {}).name || rid || 'no role'), role: rid, estHours: 0, actHours: 0 });
      r.actual += cost; r.actHours += hh; r.hours.push(hr);
    });

    rows.forEach(r => { r.diff = r.estimate - r.actual; r.forecast = Math.max(r.estimate, r.actual); r.over = r.actual > r.estimate + 0.005; });
    // group by subject in the order subjects first appear in the estimate; "Not in estimate" last
    const order = [];
    rows.forEach(r => { if (!order.includes(r.subject)) order.push(r.subject); });
    const rank = x => x === 'Not in estimate' ? 2 : x === 'Additional work' ? 1 : 0;
    order.sort((a, b) => rank(a) - rank(b));
    const groups = order.map(subject => {
      const rr = rows.filter(r => r.subject === subject);
      const g = { subject, rows: rr, estimate: U.sum(rr, r => r.estimate), actual: U.sum(rr, r => r.actual), forecast: U.sum(rr, r => r.forecast) };
      g.diff = g.estimate - g.actual; g.over = g.actual > g.estimate + 0.005;
      return g;
    });
    const offer = U.num(p.budget_costs);
    const estimate = U.sum(rows, r => r.estimate), actual = U.sum(rows, r => r.actual), forecast = U.sum(rows, r => r.forecast);
    const baseEstimate = U.sum(rows.filter(r => r.kind === 'line' || r.kind === 'labour'), r => r.estimate);
    const extrasRevenue = U.sum(extras.filter(x => COUNTS(x.status)), x => x.price);
    const extrasQuoted = U.sum(extras.filter(x => (x.status || 'quoted') === 'quoted'), x => x.price);
    const revenue = offer + extrasRevenue;
    const extrasCost = U.sum(extras.filter(x => COUNTS(x.status)), x => x.cost_estimate);
    return {
      project: projectId, offer, extrasRevenue, extrasCost, extrasQuoted, revenue, baseEstimate, estimate, actual, forecast,
      baseMargin: offer ? offer - baseEstimate : null, baseMarginPct: offer ? (offer - baseEstimate) / offer : null,
      margin: revenue ? revenue - (baseEstimate + extrasCost) : null, marginPct: revenue ? (revenue - (baseEstimate + extrasCost)) / revenue : null,
      currentMargin: revenue ? revenue - actual : null, currentMarginPct: revenue ? (revenue - actual) / revenue : null,
      expectedMargin: revenue ? revenue - forecast : null, expectedMarginPct: revenue ? (revenue - forecast) / revenue : null,
      extras: extras.length,
      used: estimate ? actual / estimate : 0, progress: progress(projectId),
      lines: est.length, unlinkedCosts: (byKey.get('unlinked') || { costs: [] }).costs.length,
      overRows: rows.filter(r => r.over && r.estimate > 0).length,
      groups, rows
    };
  }

  return { role, person, entryRole, rate, rateFor, rateInfo, entryRate, entryCost, costAmount, estimatePrice, estimateAmount, estimateAnalysis, summary, progress, taskStats, lineTasks };
})());

  <script>/* js/core/files.js */
/* PM Tool — core/files.js
 * Photos and other binary files (survey photos, company logo).
 *
 *   PM.files.compress(file)          -> Promise<Blob>  JPEG, max 1600 px (keeps uploads small)
 *   PM.files.save(path, blob)        -> stores locally at once, uploads in the background
 *   PM.files.url(path)               -> Promise<string|null>  object URL for <img src>
 *   PM.files.dataUrl(path)           -> Promise<string|null>  for PDF export
 *   PM.files.remove(path)
 *   PM.files.pending                 -> number of uploads still waiting (no signal etc.)
 *
 * Uploads that fail (no signal in the pump room) are kept in this browser's
 * IndexedDB "outbox" and retried when the connection is back, also after the app
 * was closed and opened again.
 */
PM.files = (function () {
  const urls = new Map();          // path -> object URL (this session)
  let pendingCount = 0;
  let flushing = false;

  /* ---------- outbox (IndexedDB) ---------- */
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const rq = indexedDB.open('pm-outbox', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('files');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    try {
      const d = await db();
      return await new Promise((res, rej) => {
        const t = d.transaction('files', mode);
        const out = fn(t.objectStore('files'));
        t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
        t.onerror = () => rej(t.error);
      });
    } catch (e) { return undefined; }
  }
  function sourceKey() { const be = PM.store.backend; return be ? be.kind + '|' + be.label : ''; }
  const outboxPut = (path, blob) => tx('readwrite', s => s.put({ source: sourceKey(), path, blob, at: Date.now() }, sourceKey() + '::' + path));
  const outboxDel = (path) => tx('readwrite', s => s.delete(sourceKey() + '::' + path));
  async function outboxAll() {
    const all = await tx('readonly', s => s.getAll());
    return (all || []).filter(x => x.source === sourceKey());
  }

  /* ---------- image compression ---------- */
  async function compress(file, maxDim, quality) {
    maxDim = maxDim || 1600; quality = quality || 0.8;
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
    }
    const w = bmp.width, h = bmp.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', quality));
  }

  /* ---------- API ---------- */
  async function save(path, blob) {
    if (urls.has(path)) URL.revokeObjectURL(urls.get(path));
    urls.set(path, URL.createObjectURL(blob));
    const be = PM.store.backend;
    if (!be || !be.writeBinary) return;
    await outboxPut(path, blob);
    flush();
  }

  async function flush() {
    const be = PM.store.backend;
    if (flushing || !be || !be.writeBinary) return;
    flushing = true;
    try {
      const items = await outboxAll();
      pendingCount = items.length;
      for (const it of items) {
        try {
          await be.writeBinary(it.path, it.blob);
          await outboxDel(it.path);
          pendingCount--;
        } catch (e) {
          console.warn('Upload postponed:', it.path, e.message);
          break;                       // no signal: try again later
        }
      }
    } finally {
      flushing = false;
      PM.events.emit('files', { pending: pendingCount });
      if (pendingCount > 0) setTimeout(flush, 30000);
    }
  }

  async function url(path) {
    if (!path) return null;
    if (urls.has(path)) return urls.get(path);
    const be = PM.store.backend;
    if (!be || !be.readBinary) return null;
    // not uploaded yet? it is still in the outbox
    const waiting = (await outboxAll()).find(x => x.path === path);
    let blob = waiting ? waiting.blob : null;
    if (!blob) { try { blob = await be.readBinary(path); } catch (e) { console.warn(e); return null; } }
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    urls.set(path, u);
    return u;
  }

  async function dataUrl(path) {
    const u = await url(path);
    if (!u) return null;
    const blob = await (await fetch(u)).blob();
    return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  }

  async function remove(path) {
    if (urls.has(path)) { URL.revokeObjectURL(urls.get(path)); urls.delete(path); }
    await outboxDel(path);
    const be = PM.store.backend;
    if (be && be.deleteFile) { try { await be.deleteFile(path); } catch (e) { console.warn('Could not delete', path, e.message); } }
  }

  /* <img> that loads its picture from storage */
  function img(path, attrs) {
    const el = PM.util.h('img', Object.assign({ alt: '', loading: 'lazy' }, attrs || {}));
    el.classList.add('loading-img');
    url(path).then(u => { if (u) { el.src = u; el.classList.remove('loading-img'); } else el.classList.add('missing-img'); });
    return el;
  }

  PM.events.on('loaded', () => { urls.forEach(u => URL.revokeObjectURL(u)); urls.clear(); flush(); });
  window.addEventListener('online', () => flush());

  return { compress, save, flush, url, dataUrl, remove, img, get pending() { return pendingCount; } };
})();

          h('label', { class: 'form-row', for: 'gh-branch' }, h('span', null, 'Branch'), branch),
          h('label', { class: 'form-row', for: 'gh-folder' }, h('span', null, 'Folder in repository'), folder)),
        msg),
      actions: [{ label: 'Cancel' }, { label: 'Connect', primary: true, onClick: async () => {
        const nc = { repo: repo.value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, ''), token: token.value.trim(), branch: branch.value.trim(), folder: folder.value.trim() };
        if (!/^[^/\s]+\/[^/\s]+$/.test(nc.repo) || !nc.token) { msg.className = 'small bad-text'; msg.textContent = 'Enter the repository as owner/name and paste the token.'; return false; }
        msg.className = 'small muted'; msg.textContent = 'Checking access…';
        try {
          const info = await PM.github.test(nc);
          if (!nc.branch) nc.branch = info.branch;
          PM.github.saveCfg(nc);
          if (!info.private) PM.ui.toast('Note: this repository is public — anyone can read your project data. Make it private on GitHub (Settings → General → Danger zone).', 'warn');
        } catch (e) { msg.className = 'small bad-text'; msg.textContent = e.code === 'auth' ? 'GitHub refused this token. Check that you copied all of it, and that it has not expired.' : e.message; return false; }
        const be = PM.store.backend;
        if (opts.keepData && be && be.kind === 'github') { be.c = PM.github.cfg(); hideBanner(); await PM.store.retry(); PM.ui.toast('Token updated — changes saved.', 'ok'); return; }
        await useBackend(PM.github.backend(), true);
        PM.ui.toast('Connected to ' + nc.repo + '.', 'ok');
        if (!PM.store.projects().length) emptyRepoBanner();
      } }]
    });
    setTimeout(() => (c.repo ? token : repo).focus(), 50);
  }

  function emptyRepoBanner() {
    showBanner(h('div', { class: 'banner-inner' },
      h('span', null, 'Your repository has no project data yet. Start with the demo projects to try things out, or start empty.'),
      h('button', { class: 'btn primary small', onclick: () => copyDemoTo(PM.github.backend()) }, 'Copy demo data'),
      h('button', { class: 'btn ghost small', onclick: async () => { hideBanner(); await PM.store.writeAllTo(PM.store.backend); PM.ui.toast('Started with an empty data set. Create your first project with “+ New project”.', 'ok'); } }, 'Start empty')));
  }

  async function copyDemoTo(target) {
    hideBanner();
    const overlay = h('div', { class: 'loading' }, h('div', { class: 'spinner', 'aria-hidden': 'true' }), h('span', null, 'Copying demo data…'));
    document.body.appendChild(overlay);
    try {
      const demo = new PM.storage.MemoryBackend(PM.sampleFiles || {}, 'Demo data');
      await PM.store.load(demo);
      const files = PM.store.serializeAll();
      const paths = Object.keys(files);
      for (let i = 0; i < paths.length; i++) {
        overlay.lastChild.textContent = 'Copying demo data… ' + (i + 1) + ' / ' + paths.length;
        await target.writeText(paths[i], files[paths[i]]);
      }
      overlay.remove();
      await useBackend(target.kind === 'github' ? PM.github.backend() : target, true);
      PM.ui.toast(paths.length + ' files copied.', 'ok');
    } catch (e) {
      overlay.remove();
      PM.ui.toast('Copy failed: ' + e.message, 'error');
    }
  }

  function demoBackend() { return new PM.storage.MemoryBackend(PM.sampleFiles || {}, 'Demo data'); }

  async function openFolder() {
    if (PM.storage.supportsFolder) {
      try { await useBackend(await PM.storage.pickFolder()); }
      catch (e) { if (e.name !== 'AbortError') PM.ui.toast('Could not open folder: ' + e.message, 'error'); }
    } else {
      const inp = h('input', { type: 'file', webkitdirectory: true, multiple: true, style: { display: 'none' } });
      inp.addEventListener('change', async () => { if (inp.files.length) await useBackend(new PM.storage.FileListBackend(inp.files)); inp.remove(); });
      document.body.appendChild(inp);
      inp.click();
    }
  }

  async function saveToFolder() {
    if (!PM.storage.supportsFolder) { downloadZip(); return; }
    try {
      const be = await PM.storage.pickFolder();
      const existing = await be.listDirs('projects');
      if (existing.length && !confirm('This folder already contains ' + existing.length + ' project folder(s). Files with the same name will be overwritten. Continue?')) return;
      const n = await PM.store.writeAllTo(be);
      await useBackend(be, true);
      PM.ui.toast(n + ' files written. You are now working in "' + be.label + '".', 'ok');
    } catch (e) { if (e.name !== 'AbortError') PM.ui.toast('Could not save: ' + e.message, 'error'); }
  }

  function downloadZip(onlyChanged) {
    const files = onlyChanged ? PM.store.changedFiles() : PM.store.serializeAll();
    if (!Object.keys(files).length) { PM.ui.toast('No changed files.', 'warn'); return; }
    U.download((onlyChanged ? 'pm-changed-' : 'pm-data-') + U.todayISO() + '.zip', PM.zip(files), 'application/zip');
  }

  function showBanner(content) {
    banner.innerHTML = '';
    banner.appendChild(content);
    banner.hidden = false;
  }
  function hideBanner() { banner.hidden = true; banner.innerHTML = ''; }

  function dataMenu(anchor) {
    const be = PM.store.backend;
    const items = [
      { label: PM.github.configured() ? 'GitHub connection…' : 'Connect GitHub…', run: () => connectGitHub() },
      { label: 'Use GitHub data', run: () => useBackend(PM.github.backend()), hide: !PM.github.configured() || (be && be.kind === 'github') },
      { label: 'Copy demo data to GitHub…', run: () => copyDemoTo(PM.github.backend()), hide: !PM.github.configured() },
      { label: 'Disconnect GitHub on this device', run: () => { PM.github.forget(); PM.ui.toast('Token removed from this device.', 'ok'); useBackend(demoBackend()); }, hide: !PM.github.configured() },
      { label: PM.onedrive.signedIn() ? 'Use OneDrive' : 'Connect OneDrive…', run: () => PM.onedrive.signedIn() ? useBackend(PM.onedrive.backend()) : connectOneDrive(), hide: !PM.onedrive.configured() || (be && be.kind === 'onedrive') },
      { label: 'Copy demo data to OneDrive…', run: copyToOneDrive, hide: !PM.onedrive.signedIn() },
      { label: 'Sign out of OneDrive', run: () => PM.onedrive.signOut(), hide: !PM.onedrive.signedIn() },
      { label: PM.storage.supportsFolder ? 'Open data folder…' : 'Open data folder (read-only)…', run: openFolder, hide: isTouch() && !PM.storage.supportsFolder },
      { label: 'Save all data to a folder…', run: saveToFolder, hide: !PM.storage.supportsFolder },
      { label: 'Download all data (.zip)', run: () => downloadZip(false) },
      { label: 'Download changed files (.zip)', run: () => downloadZip(true), hide: !be || be.kind !== 'readonly' },
      { label: 'Reload from source', run: () => be && useBackend(be), hide: !be || be.kind === 'memory' },
      { label: 'Load demo data', run: () => useBackend(demoBackend()) }
    ].filter(i => !i.hide);
    const menu = h('div', { class: 'menu', role: 'menu' }, items.map(i => h('button', { role: 'menuitem', onclick: () => { close(); i.run(); } }, i.label)));
    const r = anchor.getBoundingClientRect();
    Object.assign(menu.style, { top: (r.bottom + 4) + 'px', right: (window.innerWidth - r.right) + 'px' });
    document.body.appendChild(menu);
    const close = () => { menu.remove(); document.removeEventListener('mousedown', outside, true); };
    const outside = e => { if (!menu.contains(e.target) && e.target !== anchor) close(); };
    setTimeout(() => document.addEventListener('mousedown', outside, true));
    menu.querySelector('button').focus();
    menu.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }

  const NEW_PROJECT_FIELDS = ['name', 'client', 'description', 'status', 'manager', 'start', 'end', 'budget_costs', 'color'];

  function newProjectDialog() {
    if (!PM.store.backend) return;
    const today = U.todayISO();
    const f = PM.ui.form('projects', { status: 'active', start: today, end: U.addDays(today, 90), color: '#2f6fed' }, { fields: NEW_PROJECT_FIELDS });
    PM.ui.dialog({
      title: 'New project', content: f.el,
      actions: [{ label: 'Cancel' }, { label: 'Create project', primary: true, onClick: () => {
        if (!f.valid()) { PM.ui.toast('Please fill in the object.', 'warn'); return false; }
        const p = PM.store.createProject(f.values());
        setProject(p.id);
        PM.ui.toast('Project ' + p.id + ' created.', 'ok');
      } }]
    });
  }

  /* Edit all details of an existing project */
  function editProjectDialog(pid) {
    const p = PM.store.project(pid);
    if (!p) return;
    const f = PM.ui.form('projects', p);
    PM.ui.dialog({
      title: 'Edit project ' + p.id, content: f.el,
      actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: () => {
        if (!f.valid()) { PM.ui.toast('Please fill in the object.', 'warn'); return false; }
        const v = f.values();
        if (v.start && v.end && v.end < v.start) { PM.ui.toast('End date is before start date.', 'warn'); return false; }
        const patch = {};
        PM.collection('projects').fields.forEach(fd => { if (fd.type !== 'id' && v[fd.key] !== p[fd.key]) patch[fd.key] = v[fd.key]; });
        if (Object.keys(patch).length) PM.store.update('projects', p._key, patch);
        PM.ui.toast('Project saved.', 'ok');
      } }]
    });
  }

  /* ---------- boot ---------- */
  async function boot() {
    const root = document.getElementById('app');
    navEl = h('nav', { class: 'nav', 'aria-label': 'Main' });
    projSel = h('select', { class: 'proj-select', 'aria-label': 'Project', onchange: () => setProject(projSel.value) });
    statusEl = h('span', { class: 'status-pill' }, 'Loading…');
    viewEl = h('div', { id: 'view' });
    banner = h('div', { class: 'banner', hidden: true });
    const dataBtn = h('button', { class: 'btn ghost', 'aria-haspopup': 'menu', onclick: e => dataMenu(e.currentTarget) }, 'Data ▾');

    root.appendChild(h('aside', { class: 'sidebar' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }), h('span', null, 'Project Manager')),
      navEl,
      h('div', { class: 'side-foot' }, h('div', { class: 'muted small' }, 'Data source'), h('div', { id: 'source-name', class: 'small' }, '—'))));
    root.appendChild(h('div', { class: 'main', id: 'main' },
      h('header', { class: 'topbar' }, projSel, h('button', { class: 'btn ghost hide-narrow', onclick: newProjectDialog, title: 'New project' }, '+ Project'), h('span', { class: 'spacer' }), statusEl, dataBtn),
      banner, viewEl));
    // table toolbars (search + Add) stick just below the top bar; keep that offset right when the bar changes height
    const topbar = root.querySelector('.topbar');
    const setTop = () => document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
    setTop();
    if (window.ResizeObserver) new ResizeObserver(setTop).observe(topbar);

    PM.events.on('status', setStatus);
    PM.events.on('files', () => setStatus(lastStatus));
    PM.events.on('forms', () => renderSoon());
    PM.events.on('change', () => { if (!(current && current.manualRefresh)) renderSoon(); else renderProjectSelect(); });
    PM.events.on('modules', () => { if (PM.store.backend) renderSoon(); });
    window.addEventListener('hashchange', () => { route = parseHash(); render(); });
    // switch between table and card layouts when the screen size class changes (rotate tablet, resize window)
    if (window.matchMedia) window.matchMedia('(max-width: 760px)').addEventListener('change', () => { if (PM.store.backend) render(); });

    route = parseHash();
    if (!('project' in route.params)) {
      let last = '';
      try { last = localStorage.getItem('pm.project') || ''; } catch (e) { /* ignore */ }
      if (last) route.params.project = last;
    }

    PM.events.on('conflict', conflictBanner);
    PM.events.on('parked-conflict', e => showBanner(h('div', { class: 'banner-inner bad' },
      h('span', null, 'Changes you made earlier on this device were never saved, and meanwhile someone else changed ', h('code', null, e.paths.join(', ')), '. Which version do you want to keep?'),
      h('button', { class: 'btn primary small', onclick: async () => { hideBanner(); await PM.store.resolveParked('mine'); render(); PM.ui.toast('Your earlier changes are saved.', 'ok'); } }, 'Keep my earlier changes'),
      h('button', { class: 'btn ghost small', onclick: () => { hideBanner(); PM.store.resolveParked('theirs'); PM.ui.toast('Your earlier changes were discarded.', 'ok'); } }, 'Discard them'))));
    PM.events.on('auth-required', authBanner);

    // 0) coming back from the Microsoft sign-in page?
    if (PM.onedrive.configured()) {
      let res = null;
      try { res = await PM.onedrive.handleRedirect(); } catch (e) { res = { error: e.message }; }
      if (res && res.ok) {
        const carry = sessionStorage.getItem('pm.carry'); sessionStorage.removeItem('pm.carry');
        try {
          await useBackend(PM.onedrive.backend(), true);
          if (carry && !PM.store.projects().length && confirm('Your OneDrive folder is empty. Copy the data you were working with to OneDrive?')) {
            const files = JSON.parse(carry);
            const od = PM.onedrive.backend();
            for (const p in files) await od.writeText(p, files[p]);
            await useBackend(PM.onedrive.backend());
          }
          return;
        } catch (e) { PM.ui.toast('OneDrive: ' + e.message, 'error'); }
      } else if (res && res.error && !res.silent) {
        PM.ui.toast('Microsoft sign-in failed: ' + res.error, 'error');
      }
    }

    // 1) served by tools/server.js (or any compatible server)?
    if (/^https?:$/.test(location.protocol) && !PM.onedrive.configured()) {
      try {
        const r = await fetch('api/ping');
        if (r.ok) { await useBackend(new PM.storage.HttpBackend(''), true); return; }
      } catch (e) { /* not a server with an API */ }
    }

    let lastSource = '';
    try { lastSource = localStorage.getItem('pm.source') || ''; } catch (e) { /* ignore */ }

    // 2a) GitHub, if connected on this device
    if (PM.github.configured() && lastSource !== 'folder' && lastSource !== 'onedrive') {
      try { await useBackend(PM.github.backend(), true); if (!PM.store.projects().length) emptyRepoBanner(); return; }
      catch (e) { PM.ui.toast('GitHub: ' + e.message, 'error'); }
    }

    // 2b) OneDrive, if signed in before (and that was the last source used here)
    if (PM.onedrive.configured() && (lastSource === 'onedrive' || !PM.storage.supportsFolder)) {
      if (PM.onedrive.signedIn()) {
        try { await useBackend(PM.onedrive.backend(), true); return; }
        catch (e) {
          if (e.code === 'auth' && PM.onedrive.canSignIn() && !sessionStorage.getItem('pm.silent')) {
            sessionStorage.setItem('pm.silent', '1');          // try once per session without asking
            await PM.onedrive.signIn({ silent: true });
          }
          PM.ui.toast('OneDrive: ' + e.message, 'error');
        }
      }
    }

    // 3) last used folder (PC)
    const last = await PM.storage.lastFolder();
    if (last && last.granted) {
      try { await useBackend(new PM.storage.FolderBackend(last.handle), true); return; } catch (e) { console.warn(e); }
    }

    // 4) demo data, plus the right offer for this device
    await useBackend(demoBackend(), true);
    const odBtn = PM.onedrive.configured() && PM.onedrive.canSignIn()
      ? h('button', { class: 'btn ghost small', onclick: connectOneDrive }, PM.onedrive.signedIn() ? 'Open my OneDrive data' : 'Sign in with Microsoft')
      : null;
    const ghBtn = h('button', { class: 'btn primary small', onclick: () => connectGitHub() }, PM.github.configured() ? 'Open my GitHub data' : 'Connect GitHub');
    if (last) {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'Showing demo data. Your folder "' + last.handle.name + '" needs permission again.'),
        h('button', { class: 'btn primary small', onclick: async () => { try { await useBackend(await PM.storage.reopen(last.handle)); } catch (e) { PM.ui.toast(e.message, 'error'); } } }, 'Reconnect folder'),
        ghBtn, odBtn,
        h('button', { class: 'btn ghost small', onclick: openFolder }, 'Choose another folder')));
    } else {
      showBanner(h('div', { class: 'banner-inner' },
        h('span', null, 'You are looking at demo data. Changes are not saved until you connect your data (GitHub) or choose a folder.'),
        ghBtn,
        odBtn,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: saveToFolder }, 'Save demo to a new folder') : null,
        PM.storage.supportsFolder ? h('button', { class: 'btn ghost small', onclick: openFolder }, 'Open existing folder') : null,
        h('button', { class: 'icon-btn', 'aria-label': 'Dismiss', onclick: hideBanner }, '✕')));
    }
  }

  function isTouch() { return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }

  return { boot, render, navigate, setProject, openFolder, saveToFolder, downloadZip, newProjectDialog, editProjectDialog, useBackend, connectOneDrive, copyToOneDrive, connectGitHub, copyDemoTo, isTouch, get route() { return route; } };
})();

  </script>

  <!-- Modules (screens). Remove a line to hide a screen. -->
  <script>/* js/modules/dashboard.js */
/* PM Tool — modules/dashboard.js
 * Portfolio overview (all projects) and project overview (one project).
 */
PM.registerModule({
  id: 'dashboard', title: 'Dashboard', short: 'Home', icon: '◧', order: 10,
  render(el, ctx) {
    const U = PM.util, h = U.h, calc = PM.services.calc;
    if (ctx.project) return renderProject(el, ctx);

    const st = this.state = this.state || { showAll: false };
    const all = PM.store.projects();
    const projects = all.filter(p => st.showAll ? p.status !== 'archived' : ['active', 'planned', 'on-hold'].includes(p.status || 'active'));
    const sum = calc.summary({});
    const month = U.todayISO().slice(0, 7);
    const monthSum = calc.summary({ from: month + '-01', to: month + '-31' });
    const ts = calc.taskStats();

    el.appendChild(h('div', { class: 'page-head' },
      h('div', null, h('h1', null, 'Portfolio'), h('p', { class: 'muted' }, U.fmtDate(U.todayISO()) + ' · ' + all.filter(p => p.status === 'active').length + ' active project(s)')),
      h('span', { class: 'spacer' }),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.showAll || null, onchange: e => { st.showAll = e.target.checked; ctx.rerender(); } }), ' Show completed'),
      h('button', { class: 'btn primary', onclick: () => PM.app.newProjectDialog() }, '+ New project')));

    el.appendChild(h('div', { class: 'stats' },
      PM.ui.stat('Hours this month', U.fmtNum(monthSum.hours), U.fmtMoney(monthSum.labour) + ' labour'),
      PM.ui.stat('Total cost to date', U.fmtMoney(sum.total), 'budget ' + U.fmtMoney(sum.budgetCosts), sum.budgetCosts && sum.total > sum.budgetCosts ? 'bad' : ''),
      PM.ui.stat('Hours to date', U.fmtNum(sum.hours), 'budget ' + U.fmtNum(sum.budgetHours) + ' h'),
      PM.ui.stat('Open tasks', U.fmtNum(ts.open), ts.overdue ? ts.overdue + ' overdue' : 'none overdue', ts.overdue ? 'bad' : '')));

    if (!projects.length) {
      el.appendChild(PM.ui.empty('No projects to show.', h('button', { class: 'btn primary', onclick: () => PM.app.newProjectDialog() }, 'Create the first project')));
      return;
    }

    const byId = new Map(sum.byProject.map(x => [x.project, x]));
    el.appendChild(h('div', { class: 'proj-grid' }, projects.map(p => {
      const s = byId.get(p.id) || { hours: 0, total: 0 };
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      return h('a', { class: 'proj-card', href: '#/dashboard?project=' + p.id, style: { '--pc': p.color || '#2f6fed' } },
        h('div', { class: 'proj-card-head' },
          h('div', null, h('div', { class: 'proj-name' }, p.name), h('div', { class: 'muted small' }, p.id + (p.client ? ' · ' + p.client : ''))),
          h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active'),
          h('button', { class: 'icon-btn edit', title: 'Edit project', 'aria-label': 'Edit ' + p.name, onclick: e => { e.preventDefault(); e.stopPropagation(); PM.app.editProjectDialog(p.id); } }, '✎')),
        p.description ? h('div', { class: 'small proj-card-desc' }, p.description) : null,
        h('div', { class: 'muted small' }, U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end)),
        h('div', { class: 'kv' }, h('span', null, 'Progress'), PM.ui.meter(prog, 1, 'Planning progress', 'progress')),
        h('div', { class: 'kv' }, h('span', null, 'Hours ' + U.fmtNum(s.hours) + ' / ' + U.fmtNum(p.budget_hours)), PM.ui.meter(s.hours, U.num(p.budget_hours))),
        h('div', { class: 'kv' }, h('span', null, 'Cost ' + U.fmtMoney(s.total) + ' / ' + U.fmtMoney(p.budget_costs)), PM.ui.meter(s.total, U.num(p.budget_costs))),
        h('div', { class: 'small proj-tasks' }, t.open + ' open task(s)', t.overdue ? h('span', { class: 'bad-text' }, ' · ' + t.overdue + ' overdue') : null));
    })));

    function renderProject(el, ctx) {
      const p = ctx.project;
      const s = calc.summary({ project: p.id });
      const t = calc.taskStats(p.id);
      const prog = calc.progress(p.id);
      const today = U.todayISO();

      el.appendChild(h('div', { class: 'page-head' },
        h('span', { class: 'swatch big', style: { background: p.color || '#2f6fed' } }),
        h('div', null, h('h1', null, p.name), h('p', { class: 'muted' }, p.id + (p.client ? ' · ' + p.client : '') + ' · ' + U.fmtDate(p.start) + ' – ' + U.fmtDate(p.end))),
        h('span', { class: 'spacer' }),
        h('span', { class: 'pill st-' + (p.status || 'active') }, p.status || 'active'),
        h('button', { class: 'btn', onclick: () => PM.app.editProjectDialog(p.id) }, '✎ Edit project')));
      if (p.description) el.appendChild(h('p', { class: 'proj-desc' }, p.description));

      el.appendChild(h('div', { class: 'stats' },
        PM.ui.stat('Planning progress', U.fmtPct(prog), PM.store.list('lines', { project: p.id }).length + ' planning lines'),
        PM.ui.stat('Hours', U.fmtNum(s.hours) + ' h', 'of ' + U.fmtNum(p.budget_hours) + ' h budget · est. ' + U.fmtNum(s.estimateHours) + ' h', p.budget_hours && s.hours > p.budget_hours ? 'bad' : ''),
        PM.ui.stat('Cost', U.fmtMoney(s.total), 'of ' + U.fmtMoney(p.budget_costs) + ' · ' + U.fmtPct(p.budget_costs ? s.total / p.budget_costs : NaN), p.budget_costs && s.total > p.budget_costs ? 'bad' : ''),
        PM.ui.stat('Tasks', t.done + ' / ' + t.total + ' done', t.overdue ? t.overdue + ' overdue' : 'none overdue', t.overdue ? 'bad' : '')));

      const grid = h('div', { class: 'two-col' });

      // current & upcoming planning lines
      const lines = PM.store.list('lines', l => l.project === p.id && l.end >= today && l.start <= U.addDays(today, 21))
        .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
      grid.appendChild(PM.ui.section('Now and next 3 weeks',
        lines.length ? h('ul', { class: 'line-list' }, lines.map(l => {
          const tasks = calc.lineTasks(p.id, l.id);
          return h('li', null,

  <script>/* js/modules/planning.js */
/* PM Tool — modules/planning.js
 * Timeline (Gantt-style bars). One bar per planning line (planning.md).
 * Bars with linked tasks get the project colour; bars without tasks are grey;
 * bars whose tasks are all done (or progress 100%) turn green.
 * Drag a bar to move it, drag its edges to change start/end, click to edit and link tasks.
 * With "Move following lines" on, every line that starts on/after the dragged bar moves along
 * (in working days), together with the dates of their linked tasks. "Shift from here…" in the
 * line dialog does the same with an exact number of days or weeks. Both can be undone.
 * The Team view (planning-team.js) shows the same work per person.
 */
(function () {
  const U = PM.util, h = U.h;
  const ZOOM = { day: { px: 30, label: 'Days' }, week: { px: 12, label: 'Weeks' }, month: { px: 4, label: 'Months' } };
  const state = { zoom: 'week', collapsed: {}, expandedProjects: {}, view: 'timeline', filter: 'all', mode: 'projects', push: false, undo: null };

  let taskIndex = null;            // project/line -> tasks, rebuilt on every timeline render
  function buildIndex() {
    taskIndex = new Map();
    PM.store.list('tasks').forEach(t => { if (t.line) { const k = t.project + '/' + t.line; if (!taskIndex.has(k)) taskIndex.set(k, []); taskIndex.get(k).push(t); } });
  }
  function lineState(l) {
    const tasks = taskIndex ? (taskIndex.get(l.project + '/' + l.id) || []) : PM.services.calc.lineTasks(l.project, l.id);
    const done = tasks.filter(t => t.status === 'done').length;
    const complete = tasks.length > 0 && done === tasks.length;     // green only when every linked task is done
    return { tasks, done, linked: tasks.length > 0, complete };
  }

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / U.DAY + 1) / 7);
  }

  /* A start date moved past the end date (table view, imports, plugins…): the end follows. */
  PM.events.on('change', e => {
    if (!e || e.collection !== 'lines' || e.action !== 'update' || !e.patch || !('start' in e.patch)) return;
    const r = e.record;
    if (r && r.start && r.end && r.end < r.start) PM.store.update('lines', r._key, { end: r.start });
  });

  /* ---------------- shifting lines (and what comes after) ---------------- */
  /* Lines of a project affected by a shift that starts at `line`:
   *   scope 'after'  : lines starting on/after `ref` (default ref = line.start), incl. the line itself
   *   scope 'later'  : same, but not the line itself
   *   scope 'phase'  : like 'after', only within the line's phase */
  function linesToShift(line, scope, ref) {
    ref = ref || line.start;
    return PM.store.list('lines', l => l.project === line.project && l.start && l.start >= ref &&

  function shiftLines(lines, n, unit, moveTasks, label) {
    if (!n || !lines.length) return 0;
    const mv = d => !d ? d : unit === 'cal' ? U.addDays(d, n) : U.addWorkdays(d, n);
    const undo = [];
    const keys = new Set(lines.map(l => l._key));
    lines.forEach(l => {
      undo.push({ c: 'lines', key: l._key, old: { start: l.start, end: l.end } });
      PM.store.update('lines', l._key, { start: mv(l.start), end: mv(l.end || l.start) });
    });
    let tasks = 0;
    if (moveTasks) {
      const ids = new Set(lines.map(l => l.project + '/' + l.id));
      PM.store.list('tasks', t => t.line && ids.has(t.project + '/' + t.line) && (t.due || t.start) && t.status !== 'done').forEach(t => {
        undo.push({ c: 'tasks', key: t._key, old: { start: t.start, due: t.due } });
        const patch = {};

    const unit = h('select', { id: 'sh-unit' }, h('option', { value: 'wd' }, 'working days'), h('option', { value: 'wk' }, 'weeks'), h('option', { value: 'cal' }, 'calendar days'));
    const scope = h('select', { id: 'sh-scope' },

      h('option', { value: 'phase' }, 'This line and what follows in phase "' + (line.group || '—') + '"'));

    PM.ui.dialog({
      title: 'Shift from "' + (line.title || line.id) + '"',
      content: h('div', null,
        h('div', { class: 'form-grid' },
          h('label', { class: 'form-row' }, h('span', null, 'Move by'), amount),
          h('label', { class: 'form-row' }, h('span', null, 'Unit'), unit),
          h('label', { class: 'form-row wide' }, h('span', null, 'Which lines'), scope)),
        h('label', { class: 'check' }, tasks, ' Also move start and due dates of linked open tasks'),
        info),
      actions: [{ label: 'Cancel' }, { label: 'Shift', primary: true, onClick: () => {

  /* ---------------- line dialog: edit + link tasks ---------------- */

    rows.forEach(r => {

          title: l.id + ' · ' + (l.title || '') + '\n' + U.fmtDate(l.start) + ' – ' + U.fmtDate(lEnd) + '\n' + (ls.linked ? ls.tasks.length + ' linked task(s), ' + ls.done + ' done' : 'No linked tasks') + '\nProgress ' + U.num(l.progress) + '%',

        track.appendChild(bar);

    const titleW = W - M - rightW - 6 - x - (o.label ? PM.pdf.textWidth(o.label.toUpperCase(), 7, true) + 10 : 0);
    pg.text(PM.pdf.fit(o.title || 'Project planning', titleW, 8, false), x, top + 3.5, { size: 8, color: C.muted });
    pg.text(PM.pdf.fit(o.scope === 'all' ? 'All active projects' : p.name, titleW, 15, true), x, top + 10, { size: 15, bold: true, color: C.text });
    const sub = o.scope === 'all' ? '' : [p.client, p.id].filter(Boolean).join('  ·  ');
    if (sub) pg.text(PM.pdf.fit(sub, titleW, 9), x, top + 15, { size: 9, color: C.muted });
    // document block (right)
    const bx = W - M - rightW;
    const rowsInfo = [['Date', U.fmtDate(U.todayISO())], o.docNo ? ['Document', o.docNo] : null, o.revision ? ['Revision', o.revision] : null, o.preparedBy ? ['Prepared by', o.preparedBy] : null].filter(Boolean);
    rowsInfo.forEach((r, i) => {
      pg.text(r[0], bx, top + 3.5 + i * 4.2, { size: 7.5, color: C.muted });
      pg.text(PM.pdf.fit(r[1], rightW - 22, 8, true), W - M, top + 3.5 + i * 4.2, { size: 8, bold: true, color: C.text, align: 'right' });
    });
    if (o.label) {
      const lw = PM.pdf.textWidth(o.label.toUpperCase(), 7, true) + 5;
      pg.rect(bx - lw - 5, top + 0.6, lw, 4.6, { fill: '#fdecec', r: 1 });
      pg.text(o.label.toUpperCase(), bx - 5 - lw / 2, top + 3.9, { size: 7, bold: true, color: C.bad, align: 'center' });
    }
    const hy = top + 19;
    pg.line(M, hy, W - M, hy, { stroke: C.gridStrong, lw: 0.4 });
    // footer
    const fy = pg.height - M + 3;
    pg.line(M, fy - 4, W - M, fy - 4, { stroke: C.grid, lw: 0.2 });
    const foot = co.footer || [co.name, co.address, co.phone, co.email, co.website].filter(Boolean).join('  ·  ');
    if (foot) pg.text(PM.pdf.fit(foot, W - 2 * M - 30, 6.5), M, fy, { size: 6.5, color: C.muted });
    pg.text('Page ' + pageNo + ' of ' + total, W - M, fy, { size: 6.5, color: C.muted, align: 'right' });
    return hy;
  }

  function drawPage(pg, o, model, info, assets, pageNo, total) {
    const W = pg.width;
    const big = o.size === 'large';
    let y = drawHeader(pg, o, info, assets, pageNo, total) + 3;
    const p = info.sec.project;
    const color = o.colors === 'mono' ? '#555b66' : (p.color || '#2f6fed');

    if (info.first && info.descH) {
      PM.pdf.wrap(p.description, W - 2 * M, 8).slice(0, 3).forEach((ln, i) => pg.text(ln, M, y + 3 + i * 3.6, { size: 8, color: C.text }));
      y += info.descH;
    }
    if (info.first && info.summaryH && info.sec.summary) {
      const s = info.sec.summary;
      const cells = [
        ['Progress', U.fmtPct(info.sec.progress), ''],
        ['Hours', U.fmtNum(s.hours) + ' h', s.budgetHours ? 'of ' + U.fmtNum(s.budgetHours) + ' h (' + U.fmtPct(s.hours / s.budgetHours) + ')' : 'no budget'],
        ['Labour', U.fmtMoney(s.labour), ''],
        ['Fixed + purchases', U.fmtMoney(s.fixed + s.purchases), ''],
        ['Total cost', U.fmtMoney(s.total), s.budgetCosts ? 'of ' + U.fmtMoney(s.budgetCosts) + ' (' + U.fmtPct(s.total / s.budgetCosts) + ')' : 'no budget']
      ];
      const cw = (W - 2 * M) / cells.length;
      cells.forEach((c, i) => {
        const cx = M + i * cw;
        pg.rect(cx + (i ? 1 : 0), y, cw - (i ? 1 : 0), 12, { fill: C.head, r: 1 });
        pg.text(c[0].toUpperCase(), cx + 3, y + 3.6, { size: 6, bold: true, color: C.muted });
        const over = (i === 1 && s.budgetHours && s.hours > s.budgetHours) || (i === 4 && s.budgetCosts && s.total > s.budgetCosts);
        pg.text(c[1], cx + 3, y + 8.4, { size: 10, bold: true, color: over ? C.bad : C.text });
        if (c[2]) pg.text(PM.pdf.fit(c[2], cw - 30, 6.5), cx + cw - 2, y + 8.4, { size: 6.5, color: over ? C.bad : C.muted, align: 'right' });
      });
      y += info.summaryH;
    }

    // geometry
    const cols = columnsFor(o);
    const fixedW = cols.reduce((a, c) => a + c.w, 0);
    const tableW = W - 2 * M;
    const titleW = Math.max(38, Math.min(big ? 80 : 70, tableW * 0.3));
    cols.find(c => c.flex).w = titleW;
    const leftW = fixedW + titleW;
    const tlX = M + leftW, tlW = tableW - leftW;
    const days = Math.max(1, U.daysBetween(model.from, model.to) + 1);
    const dayW = tlW / days;
    const X = d => tlX + U.daysBetween(model.from, d) * dayW;
    const rh = info.rh;
    const fs = Math.max(5.5, Math.min(big ? 10 : 8.5, rh * 1.5));
    const scaleH = 9;

    // scale header
    pg.rect(M, y, tableW, scaleH, { fill: C.head });
    let cx = M;
    cols.forEach(c => {
      const tx = c.align === 'right' ? cx + c.w - 1.5 : cx + 1.5;
      pg.text(c.label, tx, y + 6, { size: 6.5, bold: true, color: C.muted, align: c.align === 'right' ? 'right' : 'left' });
      cx += c.w;
    });
    const unit = dayW >= 3.2 ? 'day' : dayW * 7 >= 7 ? 'week' : 'month';
    const tableTop = y + scaleH;
    const rowsH = info.rows.length * rh;
    const tableBottom = tableTop + Math.max(rowsH, rh);
    // months (top half)
    let d = U.parseDate(model.from);
    const end = U.parseDate(model.to);
    pg.clip(tlX, y, tlW, scaleH + rowsH + 2);
    while (d <= end) {
      const di = U.iso(d);
      if (d.getUTCDate() === 1 || di === model.from) {
        const next = U.iso(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)));
        const x0 = X(di), x1 = X(next < model.to ? next : U.addDays(model.to, 1));
        const label = (x1 - x0) > 16 ? U.MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : (x1 - x0) > 7 ? U.MONTHS[d.getUTCMonth()] : '';
        pg.line(x0, y, x0, tableBottom, { stroke: C.gridStrong, lw: 0.25 });
        if (label) pg.text(label, x0 + 1.2, y + 3.4, { size: 6.5, bold: true, color: C.text });
      }
      if (unit === 'day') {
        const dow = d.getUTCDay();
        if (o.weekends && (dow === 0 || dow === 6)) pg.rect(X(di), tableTop, dayW, tableBottom - tableTop, { fill: C.weekend });
        pg.text(String(d.getUTCDate()), X(di) + dayW / 2, y + 7.8, { size: 5.5, color: C.muted, align: 'center' });
        if (dow === 1) pg.line(X(di), y + 4.5, X(di), tableBottom, { stroke: C.grid, lw: 0.15 });
      } else if (unit === 'week' && d.getUTCDay() === 1) {
        if (o.weekends) pg.rect(X(U.addDays(di, 5)), tableTop, dayW * 2, tableBottom - tableTop, { fill: C.weekend });
        pg.line(X(di), y + 4.5, X(di), tableBottom, { stroke: C.grid, lw: 0.15 });
        if (dayW * 7 > 6) pg.text('W' + isoWeek(d), X(di) + dayW * 3.5, y + 7.8, { size: 5.5, color: C.muted, align: 'center' });
      }
      d = new Date(d.getTime() + U.DAY);
    }
    pg.unclip();
    pg.line(M, tableTop, W - M, tableTop, { stroke: C.gridStrong, lw: 0.3 });

    // rows
    info.rows.forEach((r, i) => {
      const ry = tableTop + i * rh;
      const base = ry + rh / 2 + fs / 2.83 * 0.36;   // vertical centre for text (pt -> mm)
      if (r.type === 'group') pg.rect(M, ry, tableW, rh, { fill: C.group });
      pg.line(M, ry + rh, W - M, ry + rh, { stroke: C.grid, lw: 0.15 });
      let cx2 = M;
      cols.forEach(c => {
        let v = '', bold = false, color = C.text, size = fs, indent = 0;
        if (r.type === 'group') {
          if (c.key === 'title') { v = r.title; bold = true; }
          else if (c.key === 'start') v = shortDate(r.start);
          else if (c.key === 'end') v = shortDate(r.end);
          color = C.text;
        } else if (r.type === 'line') {
          const l = r.line;
          switch (c.key) {
            case 'id': v = l.id; color = C.muted; break;
            case 'title': v = l.title; indent = o.groupPhases && l.group ? 2.5 : 0; break;
            case 'start': v = shortDate(l.start); break;
            case 'end': v = l.milestone ? '' : shortDate(l._end); break;
            case 'duration': v = l.milestone ? '' : String(U.daysBetween(l.start, l._end) + 1); break;
            case 'progress': v = l.milestone ? '' : U.num(l.progress) + '%'; break;
            case 'tasks': v = l._s.linked ? l._s.done + '/' + l._s.tasks.length : ''; break;
            case 'assignee': { const lp = l.person ? PM.store.find('people', l.person) : null; const names = Array.from(new Set([lp ? lp.name.split(' ')[0] : ''].concat(l._s.tasks.map(t => { const pp = PM.store.find('people', t.assignee); return pp ? pp.name.split(' ')[0] : ''; })).filter(Boolean))); if (l.who) names.push(l.who); v = names.join(', '); color = C.muted; break; }
            case 'hours': v = r.hours ? U.fmtNum(r.hours) : ''; break;
            case 'cost': v = r.cost ? U.fmtMoney(r.cost) : ''; break;
          }
        } else if (r.type === 'task') {
          const t = r.task;
          size = fs * 0.88; color = C.muted;
          switch (c.key) {
            case 'id': v = t.id; break;
            case 'title': v = '– ' + t.title; indent = o.groupPhases ? 5 : 2.5; break;
            case 'assignee': { const pp = PM.store.find('people', t.assignee); v = pp ? pp.name : ''; break; }
            case 'end': v = shortDate(t.due); color = t.status !== 'done' && t.due && t.due < model.today ? C.bad : C.muted; break;
            case 'tasks': v = t.status; break;
            case 'hours': v = t.estimate ? 'est. ' + U.fmtNum(t.estimate) : ''; break;
          }
        }
        if (v) {
          const maxW = c.w - 3 - indent;
          const tx = c.align === 'right' ? cx2 + c.w - 1.5 : cx2 + 1.5 + indent;
          pg.text(PM.pdf.fit(v, maxW, size, bold), tx, base, { size, bold, color, align: c.align === 'right' ? 'right' : 'left' });
        }
        cx2 += c.w;
      });

      // timeline
      pg.clip(tlX, ry, tlW, rh);
      if (r.type === 'group' && r.start) {
        const x0 = X(r.start), x1 = X(U.addDays(r.end, 1));
        const by = ry + rh * 0.38, bh = Math.max(1, rh * 0.22);
        pg.rect(x0, by, x1 - x0, bh, { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
        pg.poly([[x0, by + bh], [x0 + 1.4, by + bh], [x0, by + bh + 1.2]], { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
        pg.poly([[x1, by + bh], [x1 - 1.4, by + bh], [x1, by + bh + 1.2]], { fill: o.colors === 'mono' ? '#30343b' : shade(color, -0.25) });
      } else if (r.type === 'line') {
        const l = r.line, st = l._s;
        const x0 = X(l.start), x1 = X(U.addDays(l._end, 1));
        const bh = Math.max(1.6, rh * 0.62), by = ry + (rh - bh) / 2;
        if (l.milestone) {
          if (!o.milestones) { pg.unclip(); return; }
          const mx = x0 + dayW / 2, ms = Math.min(bh * 0.62, 2.6);
          pg.poly([[mx, by + bh / 2 - ms], [mx + ms, by + bh / 2], [mx, by + bh / 2 + ms], [mx - ms, by + bh / 2]], { fill: st.complete ? (o.colors === 'mono' ? '#999' : C.ok) : (o.colors === 'mono' ? '#222' : shade(color, -0.2)) });
          pg.text(PM.pdf.fit(l.title, 50, fs * 0.9), mx + ms + 1.2, base, { size: fs * 0.9, color: C.text });
        } else {
          let fill, stroke = null, dash = null, prog, txt = '#ffffff';
          if (o.colors === 'mono') { fill = st.complete ? '#b9bdc4' : '#5d636e'; prog = '#30343b'; }
          else if (o.colors === 'status' && !st.linked) { fill = C.unlinked; stroke = C.unlinkedLine; dash = [0.8, 0.6]; prog = '#dde1e8'; txt = C.text; }
          else if (st.complete) { fill = C.ok; prog = shade(C.ok, -0.22); }
          else { fill = color; prog = shade(color, -0.28); }
          pg.rect(x0, by, Math.max(0.6, x1 - x0), bh, { fill, stroke, lw: 0.25, dash, r: 0.6 });
          const pr = Math.min(100, U.num(l.progress)) / 100;
          if (pr > 0 && pr < 1 && !st.complete) pg.rect(x0, by + bh * 0.7, (x1 - x0) * pr, bh * 0.3, { fill: prog });
          const label = l.title;
          const vx0 = Math.max(x0, tlX), vx1 = Math.min(x1, tlX + tlW);
          const inside = vx1 - vx0 - 2;
          if (inside > 14 && PM.pdf.textWidth(label, fs * 0.85) <= inside) pg.text(label, vx0 + 1, base, { size: fs * 0.85, color: txt });
          else if (inside > 14) pg.text(PM.pdf.fit(label, inside, fs * 0.85), vx0 + 1, base, { size: fs * 0.85, color: txt });
          else if (x1 + 1 < tlX + tlW - 10) pg.text(PM.pdf.fit(label, tlX + tlW - x1 - 2, fs * 0.85), x1 + 1, base, { size: fs * 0.85, color: C.text });
        }
      } else if (r.type === 'task' && r.task.due) {
        const t = r.task;
        const mx = X(t.due) + dayW / 2, ms = Math.min(rh * 0.22, 1.3);
        const late = t.status !== 'done' && t.due < model.today;
        pg.circle(mx, ry + rh / 2, ms, { fill: t.status === 'done' ? (o.colors === 'mono' ? '#999' : C.ok) : late ? C.bad : '#8a93a6' });
      }
      pg.unclip();
    });

    // vertical separators of the column area
    let sx = M;
    cols.forEach(c => { sx += c.w; pg.line(sx, y, sx, tableBottom, { stroke: c.flex || sx === tlX ? C.gridStrong : C.grid, lw: sx === tlX ? 0.35 : 0.15 }); });
    pg.rect(M, y, tableW, tableBottom - y, { stroke: C.gridStrong, lw: 0.3 });

    // today line
    if (o.today && model.today >= model.from && model.today <= model.to) {
      const tx = X(model.today) + dayW / 2;
      pg.line(tx, tableTop, tx, tableBottom, { stroke: C.today, lw: 0.35, dash: [1.2, 0.8] });
      pg.rect(tx - 5, tableTop - 2.6, 10, 2.8, { fill: C.today, r: 0.6 });
      pg.text('Today', tx, tableTop - 0.6, { size: 5.5, bold: true, color: '#ffffff', align: 'center' });
    }
    if (!info.rows.length) pg.text('No planning lines in this selection.', M + 3, tableTop + 5, { size: 8, color: C.muted });

    // legend
    if (o.legend) {
      const ly = tableBottom + 4.6;
      let lx = M;
      const item = (draw, label) => { draw(lx, ly - 2.2); lx += 7; pg.text(label, lx, ly, { size: 6.5, color: C.muted }); lx += PM.pdf.textWidth(label, 6.5) + 6; };
      const mono = o.colors === 'mono';
      item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: mono ? '#5d636e' : color, r: 0.4 }), 'Planned');
      if (o.colors === 'status') item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: '#fff', stroke: C.unlinkedLine, lw: 0.25, dash: [0.8, 0.6], r: 0.4 }), 'No tasks linked');
      item((x, yy) => pg.rect(x, yy, 5, 2.6, { fill: mono ? '#b9bdc4' : C.ok, r: 0.4 }), 'Completed');
      item((x, yy) => pg.rect(x, yy + 1.8, 5 * 0.6, 0.8, { fill: mono ? '#30343b' : shade(color, -0.28) }), 'Progress');
      if (o.milestones) item((x, yy) => pg.poly([[x + 2.5, yy - 0.2], [x + 4, yy + 1.3], [x + 2.5, yy + 2.8], [x + 1, yy + 1.3]], { fill: mono ? '#222' : shade(color, -0.2) }), 'Milestone');
      if (o.tasks !== 'none') item((x, yy) => pg.circle(x + 2.5, yy + 1.3, 1, { fill: '#8a93a6' }), 'Task due');
      if (o.today) item((x, yy) => pg.line(x + 2.5, yy - 0.5, x + 2.5, yy + 3, { stroke: C.today, lw: 0.35, dash: [0.8, 0.5] }), 'Today');
    }
  }

  async function loadAssets(o) {
    const out = {};
    const co = PM.company();
    if (o.showLogo && co.logo) {
      try { const u = await PM.files.url(co.logo); if (u) out.logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* logo missing */ }
    }
    return out;
  }

  function pageGeom(o) {
    const s = PM.pdf.SIZES[o.paper] || PM.pdf.SIZES.A4;
    return o.orientation === 'landscape' ? { w: s[1], h: s[0] } : { w: s[0], h: s[1] };
  }

  function layout(o, projectId) {
    const model = build(o, projectId);
    const geom = pageGeom(o);
    const pages = paginate(o, model, geom, 22);
    return { model, geom, pages };
  }

  async function render(o, projectId) {
    const L = layout(o, projectId);
    const assets = await loadAssets(o);
    const doc = PM.pdf.create({ size: o.paper, orientation: o.orientation, title: o.title });
    L.pages.forEach((info, i) => drawPage(doc.addPage(), o, L.model, info, assets, i + 1, L.pages.length));
    return doc.output();
  }

  /* ---------- export screen ---------- */
  const LS = 'pm.pdf.last';
  function open(projectId) {
    const project = PM.store.project(projectId);
    let last = {};
    try { last = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { /* ignore */ }
    let presetId = last.preset || 'customer';
    let o = presetOptions(presetId);
    const meta = { docNo: (project && project.pdf_docno) || '', revision: (project && project.pdf_revision) || '', preparedBy: last.preparedBy || '' };
    Object.assign(o, meta);
    if (!project) o.scope = 'all';
    let page = 0, assets = {}, L = null;

    const canvas = h('canvas', { class: 'pdf-canvas', 'aria-label': 'Preview of the PDF' });
    const pageInfo = h('span', { class: 'small muted', role: 'status' });
    const warn = h('p', { class: 'small bad-text', role: 'status' });
    const prevBtn = h('button', { class: 'btn ghost small', 'aria-label': 'Previous page', onclick: () => { if (page > 0) { page--; draw(); } } }, '‹');
    const nextBtn = h('button', { class: 'btn ghost small', 'aria-label': 'Next page', onclick: () => { if (L && page < L.pages.length - 1) { page++; draw(); } } }, '›');
    const previewWrap = h('div', { class: 'pdf-preview' }, h('div', { class: 'pdf-canvas-wrap' }, canvas), h('div', { class: 'pdf-pager' }, prevBtn, pageInfo, nextBtn), warn);

    function draw() {
      L = layout(o, projectId);
      page = Math.min(page, L.pages.length - 1);
      const avail = Math.max(260, (previewWrap.clientWidth || 600) - 4);
      const scale = Math.min(4, (avail / L.geom.w) * (window.devicePixelRatio || 1));
      const pg = PM.pdf.canvasPage(canvas, L.geom.w, L.geom.h, scale);
      if (L.pages.length) drawPage(pg, o, L.model, L.pages[page], assets, page + 1, L.pages.length);
      canvas.style.width = '100%';
      pageInfo.textContent = 'Page ' + (page + 1) + ' of ' + L.pages.length + ' · ' + o.paper + ' ' + o.orientation;
      prevBtn.disabled = page === 0; nextBtn.disabled = page >= L.pages.length - 1;
      const rows = L.model.sections.reduce((a, s) => a + s.rows.length, 0);
      warn.textContent = o.fit === 'page' && L.pages.length > L.model.sections.length ? 'Too many rows for one page at a readable size — continued on the next page. Choose A3, fewer lines, or a shorter period.' : (!rows ? 'Nothing to show with these settings.' : '');
    }
    const redraw = U.debounce(draw, 60);
    const set = (k, v) => { o[k] = v; markCustom(); redraw(); };

    // controls
    const presetSel = h('select', { id: 'pdf-preset' });
    function fillPresets() {
      presetSel.innerHTML = '';
      presetSel.appendChild(h('optgroup', { label: 'Ready-made' }, PRESETS.map(p => h('option', { value: p.id, selected: presetId === p.id || null }, p.name))));
      const mine = PM.store.list('pdfpresets');
      if (mine.length) presetSel.appendChild(h('optgroup', { label: 'Your presets' }, mine.map(p => h('option', { value: p.id, selected: presetId === p.id || null }, p.name))));
      presetSel.appendChild(h('option', { value: '_custom', selected: presetId === '_custom' || null, disabled: true }, 'Custom (changed)'));
    }
    const presetDesc = h('p', { class: 'small muted preset-desc' });
    function descFor(id) { const b = PRESETS.find(p => p.id === id); return b ? b.description : id === '_custom' ? 'Your own adjustments.' : 'Your saved preset.'; }
    function markCustom() { if (presetId !== '_custom') { presetId = '_custom'; fillPresets(); presetDesc.textContent = descFor(presetId); } }
    presetSel.addEventListener('change', () => {
      presetId = presetSel.value;
      o = Object.assign(presetOptions(presetId), meta, { scope: o.scope, from: o.from, to: o.to });
      if (!project) o.scope = 'all';
      presetDesc.textContent = descFor(presetId);
      buildControls(); redraw();
    });

    const controls = h('div', { class: 'pdf-controls' });
    function seg(name, value, options, onChange) {
      return h('div', { class: 'seg wrap', role: 'radiogroup', 'aria-label': name }, options.map(([v, t]) =>
        h('button', { type: 'button', class: value === v ? 'on' : '', role: 'radio', 'aria-checked': String(value === v), onclick: () => onChange(v) }, t)));
    }
    function check(id, label, checked, onChange) {
      const i = h('input', { type: 'checkbox', id, checked: checked || null });
      i.addEventListener('change', () => onChange(i.checked));
      return h('label', { class: 'check', for: id }, i, ' ' + label);
    }
    function text(id, label, value, onInput, placeholder) {
      const i = h('input', { type: 'text', id, value: value || '', placeholder: placeholder || '' });
      i.addEventListener('input', () => onInput(i.value));
      return h('label', { class: 'form-row', for: id }, h('span', null, label), i);
    }

  /* ---------- render ---------- */
  function render(el, ctx, zoom) {

      h('button', { class: 'btn ghost small', 'aria-label': 'Earlier', onclick: () => { st.offset--; ctx.rerender(); } }, '◀'),

      ctx.projectId ? h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: st.onlyProject || null, onchange: e => { st.onlyProject = e.target.checked; ctx.rerender(); } }), ' Only ' + ctx.projectId) : null,
      h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: st.showDone || null, onchange: e => { st.showDone = e.target.checked; ctx.rerender(); } }), ' Done tasks'),

    // scale
    const top = h('div', { class: 'g-scale top', style: { width: W + 'px' } });
    const bottom = h('div', { class: 'g-scale bottom', style: { width: W + 'px' } });
    for (let d = from; d <= to; d = U.addDays(d, 1)) {
      const dt = U.parseDate(d);
      if (dt.getUTCDate() === 1 || d === from) {
        const next = U.iso(new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1)));
        const w = Math.min(U.daysBetween(d, next), U.daysBetween(d, to) + 1) * px;
        top.appendChild(h('div', { class: 'g-cell', style: { left: x(d) + 'px', width: w + 'px' } }, w > 50 ? U.MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear() : (w > 22 ? U.MONTHS[dt.getUTCMonth()] : '')));
      }
      if (zoom === 'day') bottom.appendChild(h('div', { class: 'g-cell' + (U.isWeekend(d) ? ' wknd' : '') + (d === today ? ' today' : ''), style: { left: x(d) + 'px', width: px + 'px' } }, dt.getUTCDate()));
      else if (zoom !== 'month' && dt.getUTCDay() === 1) bottom.appendChild(h('div', { class: 'g-cell', style: { left: x(d) + 'px', width: 7 * px + 'px' } }, 'W' + isoWeek(d)));

    const bgOffset = -((U.parseDate(from).getUTCDay() + 6) % 7) * px;

    const inner = h('div', { class: 'g-inner', style: { width: (LABEL_W + W) + 'px' } });
    inner.appendChild(h('div', { class: 'g-head' }, h('div', { class: 'g-label head' }, 'Person'), h('div', { class: 'g-scales' }, top, bottom)));
    const body = h('div', { class: 'g-body' });

      track.addEventListener('click', ev => {
        if (ev.target !== track) return;
        const rect = track.getBoundingClientRect();
        const d = U.addDays(from, Math.floor((ev.clientX - rect.left) / px));
        addTaskDialog(ctx, { person: p.id, date: d, project: st.onlyProject ? ctx.projectId : '' });
      });
      r.items.forEach(i => {
        const s = i.start < from ? from : i.start, e = i.end > to ? to : i.end;
        const left = x(s), width = Math.max(px, (U.daysBetween(s, e) + 1) * px);
        const color = colorOf(i);
        const isMs = i.kind === 'line' && i.rec.milestone;
        const tip = i.label + '\n' + U.fmtDate(i.start) + (i.end !== i.start ? ' – ' + U.fmtDate(i.end) : '') + (i.kind === 'task' ? '\nTask ' + i.rec.id + ' · ' + (i.rec.status || 'todo') : i.kind === 'ptask' ? '\nPersonal task · ' + (i.rec.status || 'todo') : i.kind === 'line' ? '\nPlanning line ' + i.rec.id : '') + (i.conflict ? '\n⚠ overlaps time off' : '');
        const bar = h('div', { class: 'tbar ' + i.kind + (i.done ? ' done' : '') + (i.conflict ? ' conflict' : '') + (isMs ? ' ms' : ''), role: 'button', tabindex: 0, title: tip,

      emptyText: 'No time off planned. Add holidays, training or public holidays (leave person empty for everyone).',

  }

  /* ---------- PDF ---------- */
  function shade(hex, f) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#dde3ee';
    const n = parseInt(m[1], 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * f));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
  }

  async function renderPdf(o) {
    const co = PM.company();
    const doc = PM.pdf.create({ size: o.size || 'A4', orientation: 'landscape', title: 'Team planning' });
    const W = doc.width, H = doc.height, M = 12, CW = W - 2 * M;
    let logo = null;
    if (co.logo) { try { const u = await PM.files.url(co.logo); if (u) logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* none */ } }
    const people = PM.store.list('people', p => p.active !== false && (!o.people || o.people.includes(p.id)));
    const days = U.daysBetween(o.from, o.to) + 1;
    const NAME_W = 38, tlX = M + NAME_W, tlW = CW - NAME_W, dayW = tlW / days;
    const X = d => tlX + U.daysBetween(o.from, d) * dayW;
    const LANE = 5.2, BOTTOM = H - M - 10;
    const pages = [];
    let pg, y;
    const C = { text: '#1c2230', muted: '#687187', line: '#dfe3ea', wk: '#f3f4f7', today: '#2f6fed', bad: '#c43a3a' };

    function header() {
      if (logo) { const lh = 10, lw = Math.min(45, lh * logo.ratio); pg.image(logo, M, M, lw, lw / logo.ratio); }
      else if (co.name) pg.text(co.name, M, M + 6, { size: 12, bold: true, color: C.text });
      pg.text('Team planning', W - M, M + 4.5, { size: 13, bold: true, color: C.text, align: 'right' });
      pg.text(U.fmtDate(o.from) + ' – ' + U.fmtDate(o.to) + (o.project ? '   ·   project ' + o.project : ''), W - M, M + 9.5, { size: 8.5, color: C.muted, align: 'right' });
      y = M + 15;
      // scale
      const sTop = y;
      for (let d = o.from; d <= o.to; d = U.addDays(d, 1)) {
        const dt = U.parseDate(d);
        if (dt.getUTCDate() === 1 || d === o.from) {
          pg.line(X(d), sTop, X(d), sTop + 9, { stroke: C.line, lw: 0.2 });
          pg.text(U.MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear(), X(d) + 1, sTop + 3.6, { size: 7, bold: true, color: C.text });
        }
        if (days <= 45) {
          if (dayW > 3.2) pg.text(String(dt.getUTCDate()), X(d) + dayW / 2, sTop + 8, { size: 5.5, color: U.isWeekend(d) ? '#a3a9b6' : C.muted, align: 'center' });
        } else if (dt.getUTCDay() === 1 && dayW * 7 > 6) pg.text('W' + isoWeek(d), X(d) + 1, sTop + 8, { size: 6, color: C.muted });
      }
      pg.line(M, sTop + 9.5, W - M, sTop + 9.5, { stroke: '#c9ced8', lw: 0.3 });
      y = sTop + 10.5;
    }
    function newPage() { pg = doc.addPage(); pages.push(pg); header(); }
    newPage();

    people.forEach(p => {
      const r = items(p.id, o.from, o.to, { project: o.project, showDone: o.showDone });
      if (o.skipEmpty && !r.items.filter(i => i.kind !== 'off').length) return;
      const rowH = Math.max(r.lanes * LANE + 2, 9);
      if (y + rowH > BOTTOM) newPage();
      // background: weekends
      for (let d = o.from; d <= o.to; d = U.addDays(d, 1)) if (U.isWeekend(d) && days <= 120) pg.rect(X(d), y, dayW, rowH, { fill: C.wk });
      pg.text(PM.pdf.fit(p.name, NAME_W - 2, 8, true), M, y + 4, { size: 8, bold: true, color: C.text });
      r.items.forEach(i => {
        const s = i.start < o.from ? o.from : i.start, e = i.end > o.to ? o.to : i.end;
        const bx = X(s), bw = Math.max(dayW, (U.daysBetween(s, e) + 1) * dayW), by = y + 1 + i.lane * LANE, bh = LANE - 1;
        const col = colorOf(i);
        if (i.kind === 'off') pg.rect(bx, by, bw, bh, { fill: '#e6e8ec', stroke: '#b3b8c2', lw: 0.2, r: 0.6 });
        else if (i.kind === 'task' || i.kind === 'ptask') pg.rect(bx, by, bw, bh, { fill: shade(col, 0.75), stroke: i.conflict ? C.bad : col, lw: i.conflict ? 0.5 : 0.25, r: 0.6 });
        else pg.rect(bx, by, bw, bh, { fill: shade(col, 0.15), stroke: i.conflict ? C.bad : null, lw: 0.5, r: 0.6 });
        const tc = i.kind === 'line' ? '#ffffff' : C.text;
        if (bw > 6) { pg.clip(bx, by, bw, bh); pg.text(PM.pdf.fit(i.label, bw - 1.6, 6.3), bx + 0.8, by + bh - 1.2, { size: 6.3, color: tc }); pg.unclip(); }
      });
      y += rowH;
      pg.line(M, y, W - M, y, { stroke: C.line, lw: 0.2 });
    });
    const today = U.todayISO();
    pages.forEach((pp, n) => {
      if (today >= o.from && today <= o.to) pp.line(X(today) + dayW / 2, M + 15, X(today) + dayW / 2, BOTTOM, { stroke: C.today, lw: 0.3, dash: [0.8, 0.6] });
      // legend + footer
      const ly = H - M - 4;
      let lx = M;
      [['Planning line', shade('#2f6fed', 0.15), null], ['Task', shade('#2f6fed', 0.75), '#2f6fed'], ['Time off', '#e6e8ec', '#b3b8c2'], ['Overlaps time off', '#ffffff', C.bad]].forEach(([t, f, s]) => {
        pp.rect(lx, ly - 2.4, 5, 2.8, { fill: f, stroke: s, lw: 0.4, r: 0.4 }); pp.text(t, lx + 6.2, ly, { size: 6.5, color: C.muted }); lx += 8 + PM.pdf.textWidth(t, 6.5) + 4;
      });
      pp.text(PM.pdf.fit([co.footer || co.name, 'Generated ' + U.fmtDate(today)].filter(Boolean).join('   ·   '), 120, 6.5), lx + 4, ly, { size: 6.5, color: C.muted });
      pp.text((n + 1) + ' / ' + pages.length, W - M, ly, { size: 6.5, color: C.muted, align: 'right' });
    });
    return doc.output();
  }

  function pdfDialog(ctx, from0, to0) {
    const people = PM.store.list('people', p => p.active !== false);
    const o = { from: from0, to: to0, people: people.map(p => p.id), size: 'A4', showDone: false, skipEmpty: false, project: '' };
    const fromI = h('input', { type: 'date', id: 'tp-from', value: o.from }), toI = h('input', { type: 'date', id: 'tp-to', value: o.to });
    const quick = (label, f, t) => h('button', { class: 'btn ghost small', type: 'button', onclick: () => { fromI.value = f; toI.value = t; } }, label);
    const mon = monday(U.todayISO());
    const nextMon = U.addDays(mon, 7);

    const checks = people.map(p => { const c = h('input', { type: 'checkbox', checked: shown.has(p.id) || null, value: p.id }); return { p, c, el: h('label', { class: 'check' }, c, ' ' + p.name) }; });
    const size = h('select', { id: 'tp-size' }, h('option', { value: 'A4' }, 'A4 landscape'), h('option', { value: 'A3' }, 'A3 landscape'));
    const done = h('input', { type: 'checkbox' }), empty = h('input', { type: 'checkbox' }), only = h('input', { type: 'checkbox' });
    PM.ui.dialog({
      title: 'Team planning – PDF', wide: true,
      content: h('div', null,
        h('div', { class: 'form-grid' },
          h('label', { class: 'form-row' }, h('span', null, 'From'), fromI),
          h('label', { class: 'form-row' }, h('span', null, 'Until'), toI)),
        h('div', { class: 'btn-row' }, quick('This week', mon, U.addDays(mon, 6)), quick('Next week', nextMon, U.addDays(nextMon, 6)), quick('Next 2 weeks', mon, U.addDays(mon, 13)), quick('Next 4 weeks', mon, U.addDays(mon, 27)), quick('Next 3 months', mon, U.addDays(mon, 90))),
        h('h4', null, 'People'),
        h('div', { class: 'check-grid' }, checks.map(c => c.el)),
        h('div', { class: 'form-grid' }, h('label', { class: 'form-row' }, h('span', null, 'Paper'), size)),
        h('label', { class: 'check' }, done, ' Include finished tasks'),
        h('label', { class: 'check' }, empty, ' Leave out people with nothing planned'),
        ctx.projectId ? h('label', { class: 'check' }, only, ' Only project ' + ctx.projectId) : null),
      actions: [{ label: 'Cancel' }, { label: 'Create PDF', primary: true, onClick: async () => {
        o.from = fromI.value; o.to = toI.value;
        if (!o.from || !o.to || o.to < o.from) { PM.ui.toast('Choose a valid date range.', 'warn'); return false; }
        if (U.daysBetween(o.from, o.to) > 400) { PM.ui.toast('Choose a range of at most about a year.', 'warn'); return false; }
        o.people = checks.filter(c => c.c.checked).map(c => c.p.id);
        o.size = size.value; o.showDone = done.checked; o.skipEmpty = empty.checked; o.project = only.checked ? ctx.projectId : '';
        try { await PM.pdf.deliver(await renderPdf(o), 'team-planning-' + o.from + '-' + o.to + '.pdf'); }
        catch (e) { console.error(e); PM.ui.toast('Could not create the PDF: ' + e.message, 'error'); }

  PM.team = { render, items, taskDates, renderPdf, timeOffDialog, addTaskDialog, personDialog };
})();
