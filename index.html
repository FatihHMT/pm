/* PM Tool — modules/tasks.js
 * Task list. The "Planning line" column links a task to a bar on the timeline.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { status: 'open', person: '' };

  PM.registerModule({
    id: 'tasks', title: 'Tasks', icon: '☑', order: 30,
    render(el, ctx) {
      const all = PM.store.list('tasks', ctx.projectId ? { project: ctx.projectId } : t => { const p = PM.store.project(t.project); return p && p.status !== 'archived'; });
      const counts = { all: all.length, open: all.filter(t => t.status !== 'done').length, unlinked: all.filter(t => !t.line).length };
      PM.constants.STATUS_TASK.forEach(s => { counts[s] = all.filter(t => (t.status || 'todo') === s).length; });
      const today = U.todayISO();
      counts.overdue = all.filter(t => t.status !== 'done' && t.due && t.due < today).length;

      const filters = [['open', 'Open'], ['all', 'All']].concat(PM.constants.STATUS_TASK.map(s => [s, s])).concat([['overdue', 'Overdue'], ['unlinked', 'Not on planning']]);
      let rows = all;
      if (state.status === 'open') rows = rows.filter(t => t.status !== 'done');
      else if (state.status === 'overdue') rows = rows.filter(t => t.status !== 'done' && t.due && t.due < today);
      else if (state.status === 'unlinked') rows = rows.filter(t => !t.line);
      else if (state.status !== 'all') rows = rows.filter(t => (t.status || 'todo') === state.status);
      if (state.person) rows = rows.filter(t => t.assignee === state.person);

      const hoursByTask = new Map();
      PM.store.list('hours', ctx.projectId ? { project: ctx.projectId } : null).forEach(x => { if (x.task) { const k = x.project + '/' + x.task; hoursByTask.set(k, (hoursByTask.get(k) || 0) + U.num(x.hours)); } });

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Tasks'), h('p', { class: 'muted' }, (ctx.project ? ctx.project.name : 'All projects') + ' · ' + counts.open + ' open, ' + counts.done + ' done'))));

      el.appendChild(h('div', { class: 'toolbar wrap' },
        h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter by status' }, filters.map(([k, label]) => h('button', {
          class: 'chip' + (state.status === k ? ' on' : '') + (k === 'overdue' && counts.overdue ? ' bad' : ''), 'aria-pressed': String(state.status === k),
          onclick: () => { state.status = k; ctx.rerender(); }
        }, label, h('span', { class: 'chip-n' }, counts[k] || 0)))),
        h('span', { class: 'spacer' }),
        h('select', { 'aria-label': 'Filter by assignee', onchange: e => { state.person = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'Everyone'),

      el.appendChild(PM.ui.dataTable({
        id: 'tasks', collection: 'tasks', projectId: ctx.projectId, rows, showProject: !ctx.projectId,
        emptyText: ctx.projectId ? 'No tasks match this filter.' : 'No tasks match. Select a project to add tasks.',
        newRecord: ctx.projectId ? () => ({ status: 'todo', assignee: state.person || '' }) : false,
        extra: [{ key: 'logged', label: 'Logged h', width: 85, align: 'right', after: 'estimate', value: t => { const v = hoursByTask.get(t.project + '/' + t.id) || 0; return v ? U.fmtNum(v) : ''; }, sortVal: t => hoursByTask.get(t.project + '/' + t.id) || 0 }],

      }));
    }
  });
})();

/* PM Tool — surveys/surveys.js
 * Forms core ("surveys" in the data): form definitions, answers, storage.
 *
 * FORM DEFINITIONS are Markdown files in your data: settings/forms/<id>.md
 * (built-in forms are copied there the first time, so you can change them).
 *
 *   ---
 *   id: prefab-spec
 *   name: Prefab pump room – specification
 *   short: Prefab spec
 *   lang: en                         en | nl  (button texts: Yes/No, OK/Not OK…)
 *   description: One line shown when choosing a form.
 *   signatures: Tested by; Witnessed by     (optional: signature lines in the PDF)
 *   ---
 *   # Prefab pump room – specification
 *
 *   ## General
 *   Optional note under the section title.
 *
 *   | key  | question | type | options       | unit | hint |
 *   | ---- | -------- | ---- | ------------- | ---- | ---- |
 *   | date | Date     | date | default=today |      |      |
 *
 *   ## Fire pump {n} [repeat=pump_count]     section repeated "pump_count" times
 *   ## Positions [diagram]                   shows the pump-set drawing
 *
 * Question types and their options (separate options with ;):
 *   text, textarea, tel, email, date      default=today · prefill=client|address|number · rows=8
 *   number                                +approx (±) · prefix=ø          (unit column)
 *   dims                                  L; W; H                          (unit column)
 *   yesno                                 +na (adds N/A)
 *   choice                                A; B; C · +other ("Other…" free text)
 *   check                                 OK / Not OK / N/A with remark and photos per item
 *   position                              F; G; H · mark=panel|jockey|fuel|cooling
 *   pipesize                              DN or ANSI with size list
 *   pumptest                              rated_flow=<key>; rated_pressure=<key>; flow=m³/h; pressure=bar
 *   table                                 rows=A, B, C; cols=X (unit), Y (unit)
 *   multi                                 A; B; C  (tick several; stored as "A; B")
 *   calc                                  formula=<expression>; decimals=1; min=<key> (Pass when ≥ that value)
 *                                         expression: numbers, keys of other questions, + - * / ( ),
 *                                         max(a,b) min(a,b) round(a) ceil(a) floor(a) if(test,a,b)
 *   layout                                interactive top view: length=<key>; width=<key>;
 *                                         items=code:Label, code:Label, *code:Label (* = can stand inside)
 *   person, estimate, photos
 * Text and textarea: default=<text> fills in a starting text (\n = new line). Texts may contain
 *   {key} placeholders; the PDF shows the answer of that question in its place.
 * Front matter "layout: report" prints the form as a report (numbered chapters, paragraphs),
 *   "header: key; key" = lines top right, "footer: Made by: {made_by} · rev. {revision}".
 *   A section flagged [nopdf] is not printed (e.g. report data used in the header).
 * Options for every type: +optional (not counted in progress) · +nolabel ·
 *   show=<key>=<value> (only shown when that answer is given) · show=<key>~<text> (answer contains text)
 *
 * ANSWERS are stored per project in projects/<folder>/surveys.md (see codec below).

PM.surveys = (function () {
  const templates = [];
  const U = PM.util;
  const FORMS_DIR = 'settings/forms';

  const L = {
    nl: { yes: 'Ja', no: 'Nee', na: 'NVT', ok: 'Akkoord', nok: 'Niet akkoord', other: 'Anders…', otherPh: 'Anders, namelijk…', choose: '— kies —', photo: 'Foto', remark: 'Opmerking', addRemark: '+ opmerking / foto', filled: 'ingevuld', days: 'dagen', men: 'man', mandays: 'mandagen', flow: 'Debiet', suction: 'Zuigdruk', discharge: 'Persdruk', net: 'Netto', speed: 'Toerental', rated: 'van nominaal', pass: 'Voldoet', fail: 'Voldoet niet', churn: 'Afgesloten (0%)', deviations: 'Afwijkingen', size: 'Maat' },
    en: { yes: 'Yes', no: 'No', na: 'N/A', ok: 'OK', nok: 'Not OK', other: 'Other…', otherPh: 'Other, namely…', choose: '— choose —', photo: 'Photo', remark: 'Remark', addRemark: '+ remark / photo', filled: 'filled in', days: 'days', men: 'men', mandays: 'man-days', flow: 'Flow', suction: 'Suction', discharge: 'Discharge', net: 'Net pressure', speed: 'Speed', rated: 'of rated', pass: 'Pass', fail: 'Fail', churn: 'Churn (0%)', deviations: 'Deviations', size: 'Size' }
  };
  const lang = t => L[(t && t.lang) || 'en'] || L.en;

  const PIPE = {
    DN: ['DN25', 'DN32', 'DN40', 'DN50', 'DN65', 'DN80', 'DN100', 'DN125', 'DN150', 'DN200', 'DN250', 'DN300', 'DN350', 'DN400', 'DN450', 'DN500'],
    ANSI: ['1"', '1¼"', '1½"', '2"', '2½"', '3"', '4"', '5"', '6"', '8"', '10"', '12"', '14"', '16"', '18"', '20"']

  /* ---------- compile a question from its raw table row ---------- */

      c.items = String(c.items || '').split(',').map(x => x.trim()).filter(Boolean).map(x => {

      });
    }
    if (c.prefill) { const pf = c.prefill; c.prefill = p => (p && (pf === 'number' ? p.number : pf === 'address' ? p.address : pf === 'client' ? p.client : p[pf])) || ''; }

      const m = marks[l] || [];
      pg.circle(X(cx), Y(350), L(28), { fill: m[0] ? m[0].color : grey, stroke: m[1] ? m[1].color : ink, lw: m[1] ? L(9) : lw });

  <script>/* js/surveys/survey-pdf.js */
/* PM Tool — surveys/survey-pdf.js
 * PDF report of a filled-in form (A4 portrait): company header, client and
 * contact boxes, deviations summary, all sections (with the pump-set drawing,
 * check results, test tables), photos, and signature boxes for signing by pen.
 *   PM.surveyPdf.render(record) -> Promise<Blob>
 */
PM.surveyPdf = (function () {
  const U = PM.util, S = PM.surveys;
  const TX = {
    nl: { page: 'Pagina', of: 'van', draft: 'CONCEPT', photos: 'Foto’s', none: '—', client: 'Klant', contact: 'Contactpersoon', phone: 'Tel.', email: 'E-mail', address: 'Adres locatie', project: 'Projectnummer', deviations: 'Afwijkingen', noDeviations: 'Geen afwijkingen', signatures: 'Ondertekening', name: 'Naam', date: 'Datum', signature: 'Handtekening', seeAppendix: 'zie foto’s', photo: 'foto', photosN: 'foto’s', result: 'Resultaat', summary: 'items akkoord' },
    en: { page: 'Page', of: 'of', draft: 'DRAFT', photos: 'Photos', none: '—', client: 'Client', contact: 'Contact', phone: 'Phone', email: 'Email', address: 'Site address', project: 'Project number', deviations: 'Deviations', noDeviations: 'No deviations', signatures: 'Signatures', name: 'Name', date: 'Date', signature: 'Signature', seeAppendix: 'see photos', photo: 'photo', photosN: 'photos', result: 'Result', summary: 'items OK' }
  };
  const C = { text: '#1c2230', muted: '#687187', line: '#dfe3e9', head: '#f1f3f6', accent: '#2f6fed', bad: '#d14343', ok: '#1f9d55', faint: '#aab1bd' };
  const M = 14;
  const BOXED = ['date', 'projectnr', 'client', 'client_contact', 'client_phone', 'client_email', 'address'];

  function answer(f, v, t) {
    const L = TX[t.lang] || TX.en, F = S.lang(t);
    const has = x => x != null && String(x).trim() !== '';
    switch (f.type) {
      case 'dims': { const ps = f.parts.map(p => v[f.key + '_' + p.toLowerCase()]); return ps.some(has) ? ps.map(x => has(x) ? x : '?').join(' × ') + (f.unit ? ' ' + f.unit : '') + ' (' + f.parts.join('×') + ')' : ''; }
      case 'number': return has(v[f.key]) ? (f.approx ? '± ' : '') + (f.prefix ? f.prefix + ' ' : '') + v[f.key] + (f.unit ? ' ' + f.unit : '') : '';
      case 'estimate': { const d = v[f.key + '_days'], m = v[f.key + '_men']; if (!has(d) && !has(m)) return ''; const tot = U.num(d) * U.num(m); return (d || '?') + ' ' + F.days + ' × ' + (m || '?') + ' ' + F.men + (tot ? ' = ' + U.fmtNum(tot) + ' ' + F.mandays : '') + (f.hint ? '  (' + f.hint + ')' : ''); }
      case 'person': { const pp = PM.store.find('people', v[f.key]); return pp ? [pp.name, pp.phone, pp.email].filter(Boolean).join('  ·  ') : (v[f.key] || ''); }
      case 'date': return has(v[f.key]) ? U.fmtDate(v[f.key]) : '';
      case 'pipesize': return has(v[f.key]) ? v[f.key] + (v[f.key + '_std'] === 'ANSI' ? ' (ANSI)' : '') : '';
      case 'photos': { const n = (v[f.key] || []).length; return n ? n + ' ' + (n === 1 ? L.photo : L.photosN) + ' (' + L.seeAppendix + ')' : ''; }
      case 'calc': { const c = S.calcCheck(t, v, f); return c.text ? c.text + (f.unit ? ' ' + f.unit : '') : ''; }
      case 'layout': { const n = S.parseLayout(v[f.key]).length; return n ? n + ' item(s) placed' : ''; }
      case 'textarea': case 'text': return has(v[f.key]) ? S.fillText(v[f.key], t, v) : '';
      default: return has(v[f.key]) ? String(v[f.key]) : '';
    }
  }

  const LCOL = ['#2f6fed', '#d14343', '#1f9d55', '#d9822b', '#8e5bd9', '#0f9d8a', '#b4235a', '#5b6b8c', '#a0711c', '#2a8bc9', '#6a8f2a', '#c2410c', '#4b5563', '#9333ea'];
  /* top view of a layout question: long side vertical, items on the walls with leaders and labels */
  function drawLayout(pg, f, v, x0, y0, maxW, maxH) {
    const items = f.items || [];
    const dim = k => U.num(v[S.resolveKey(f, k, v)]);
    const Lmm = dim(f.length || 'length') || 12000, Wmm = dim(f.width || 'width') || 3200;
    const padX = 30, padY = 18;
    let bh = maxH - 2 * padY, bw = bh * Wmm / Lmm;
    if (bw > maxW - 2 * padX) { bw = maxW - 2 * padX; bh = bw * Lmm / Wmm; }
    bw = Math.max(bw, 14);
    const bx = x0 + (maxW - bw) / 2, by = y0 + padY;
    pg.rect(bx, by, bw, bh, { stroke: '#1c2230', lw: 0.6, fill: '#fafbfc' });
    [['A', bx + bw / 2, by + 4], ['C', bx + bw / 2, by + bh - 1.8], ['B', bx + bw - 2.2, by + bh / 2 + 1], ['D', bx + 2.2, by + bh / 2 + 1]].forEach(([w, x, y]) => pg.text(w, x, y, { size: 7, bold: true, color: '#c3c8d1', align: 'center' }));
    pg.text('L ' + U.fmtNum(Lmm) + ' × W ' + U.fmtNum(Wmm) + ' mm', bx + bw / 2, by + bh + 17, { size: 6.5, color: '#687187', align: 'center' });
    const placed = S.parseLayout(v[f.key]);
    const level = new Map();
    ['A', 'C'].forEach(wl => placed.map((p, i) => ({ p, i })).filter(o => S.wallOf(o.p) === wl).sort((a, b) => a.p.x - b.p.x).forEach((o, k) => level.set(o.i, k % 3)));
    const colorOf = code => LCOL[Math.max(0, items.findIndex(i => i.code === code)) % LCOL.length];
    const labelOf = code => (items.find(i => i.code === code) || { label: code }).label;
    placed.forEach((p, idx) => {
      const w = S.wallOf(p), c = colorOf(p.code);
      const px = bx + p.x * bw, py = by + p.y * bh;
      const out = w === 'A' ? [0, -1] : w === 'B' ? [1, 0] : w === 'C' ? [0, 1] : w === 'D' ? [-1, 0] : [0, 0];
      if (p.code === 'door' && w) {
        const horiz = w === 'A' || w === 'C';
        const along = 1250 / (horiz ? Wmm : Lmm) * (horiz ? bw : bh);
        const hs = p.flag === 'R' ? 1 : -1;
        if (horiz) {
          pg.line(px - along / 2, py, px + along / 2, py, { stroke: '#ffffff', lw: 1.2 });
          const hx = px + hs * along / 2, oy = out[1] * along;
          pg.line(hx, py, hx, py + oy, { stroke: c, lw: 0.6 });
          const pts = []; for (let k = 0; k <= 12; k++) { const a = k / 12 * Math.PI / 2; pts.push([hx - hs * along * Math.sin(a), py + oy * Math.cos(a)]); }
          for (let k = 1; k < pts.length; k++) pg.line(pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1], { stroke: c, lw: 0.3, dash: [0.8, 0.6] });
        } else {
          pg.line(px, py - along / 2, px, py + along / 2, { stroke: '#ffffff', lw: 1.2 });
          const hy = py + hs * along / 2, ox = out[0] * along;
          pg.line(px, hy, px + ox, hy, { stroke: c, lw: 0.6 });
          const pts = []; for (let k = 0; k <= 12; k++) { const a = k / 12 * Math.PI / 2; pts.push([px + ox * Math.cos(a), hy - hs * along * Math.sin(a)]); }
          for (let k = 1; k < pts.length; k++) pg.line(pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1], { stroke: c, lw: 0.3, dash: [0.8, 0.6] });
        }
      } else if (/louv/.test(p.code) && w) {
        const horiz = w === 'A' || w === 'C';
        const len = 800 / (horiz ? Wmm : Lmm) * (horiz ? bw : bh);
        if (horiz) pg.rect(px - len / 2, py - 0.9, len, 1.8, { fill: c }); else pg.rect(px - 0.9, py - len / 2, 1.8, len, { fill: c });
      } else if (!w) pg.rect(px - 2, py - 2, 4, 4, { fill: c, r: 0.6 });
      else pg.circle(px, py, 1.3, { fill: c });
      const lx = px + out[0] * 6, ly = py + out[1] * (4 + (level.get(idx) || 0) * 3.4);
      if (w) pg.line(px, py, lx, ly, { stroke: c, lw: 0.3 });
      const txt = labelOf(p.code) + (p.code === 'door' ? ' (' + (p.flag || 'L') + ')' : '');
      pg.text(PM.pdf.fit(txt, padX - 2, 6.5, true), w ? lx + out[0] * 0.8 : px, w ? ly + (out[1] < 0 ? -0.8 : out[1] > 0 ? 2.6 : 1) : py + 5, { size: 6.5, bold: true, color: c, align: out[0] > 0 ? 'left' : out[0] < 0 ? 'right' : 'center' });
    });
    return { Lmm, Wmm, colorOf, labelOf };
  }

  async function render(rec) {
    const t = S.get(rec.template);
    const L = TX[t.lang] || TX.en, F = S.lang(t);
    const v = rec.values || {};
    const co = PM.company();
    const project = PM.store.project(rec.project);
    const doc = PM.pdf.create({ size: 'A4', orientation: 'portrait', title: t.name });
    const W = doc.width, H = doc.height, CW = W - 2 * M, BOTTOM = H - M - 8;
    let logo = null;
    if (co.logo) { try { const u = await PM.files.url(co.logo); if (u) logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* no logo */ } }

    let pg, y;
    const pages = [];
    const R = !!t.report;
    const fill = txt => S.fillText(txt, t, v, (f, vv) => answer(f, vv, t));
    function header() {
      if (R) {
        if (logo) { const lh = 15, lw = Math.min(62, lh * logo.ratio); pg.image(logo, M, M, lw, lw / logo.ratio); }
        else if (co.name) pg.text(co.name, M, M + 8, { size: 15, bold: true, color: C.text });
        const lines = (t.header && t.header.length ? t.header : ['{report_type}', '{report_no}', '{report_title}']).map(hk => {
          const f = S.fieldsOf(t).find(x => x.key === hk);
          return f ? answer(f, v, t) : fill(hk);
        }).filter(x => x && x !== '…');
        let hy = M + 4;
        const hx = W / 2 + 2;
        lines.forEach((ln, i) => { pg.text(PM.pdf.fit(ln, W - M - hx, i < 2 ? 11.5 : 11, i < 2), hx, hy, { size: i < 2 ? 11.5 : 11, bold: i < 2, color: C.text }); hy += 5.2; });
        if (rec.status !== 'complete') {
          const lw = PM.pdf.textWidth(L.draft, 7.5, true) + 6;
          pg.rect(W - M - lw, M - 1, lw, 4.8, { fill: '#fdecec', r: 1 });
          pg.text(L.draft, W - M - lw / 2, M + 2.4, { size: 7.5, bold: true, color: C.bad, align: 'center' });
        }
        const lineY = Math.max(M + 24, hy - 1);
        pg.line(M - 2, lineY, W - M + 2, lineY, { stroke: C.text, lw: 0.5 });
        y = lineY + 8;
        return;
      }
      if (logo) { const lh = 13, lw = Math.min(55, lh * logo.ratio); pg.image(logo, M, M, lw, lw / logo.ratio); }
      else if (co.name) pg.text(co.name, M, M + 7, { size: 13, bold: true, color: C.text });
      pg.text(PM.pdf.fit(t.name, CW - 60, 14, true), W - M, M + 5, { size: 14, bold: true, color: C.text, align: 'right' });
      const sub = [v.projectnr ? L.project + ': ' + v.projectnr : (project ? project.id : ''), v.date ? U.fmtDate(v.date) : ''].filter(Boolean).join('   ·   ');
      pg.text(sub, W - M, M + 10.5, { size: 8.5, color: C.muted, align: 'right' });
      if (rec.status !== 'complete') {
        const lw = PM.pdf.textWidth(L.draft, 7.5, true) + 6;
        pg.rect(W - M - lw, M + 12.6, lw, 4.8, { fill: '#fdecec', r: 1 });
        pg.text(L.draft, W - M - lw / 2, M + 16, { size: 7.5, bold: true, color: C.bad, align: 'center' });
      }
      pg.line(M, M + 19, W - M, M + 19, { stroke: '#c9ced8', lw: 0.4 });
      y = M + 26;
    }
    function newPage() { pg = doc.addPage(); pages.push(pg); header(); }
    function ensure(hNeeded) { if (y + hNeeded > BOTTOM) newPage(); }
    function sectionTitle(title) {
      ensure(16);
      pg.rect(M, y, CW, 6.6, { fill: C.head, r: 1 });
      pg.text(PM.pdf.fit(title.toUpperCase(), CW - 5, 8, true), M + 2.5, y + 4.6, { size: 8, bold: true, color: C.text });
      y += 9;
    }
    function tick(ok, x, yy) {
      pg.rect(x, yy, 2.8, 2.8, { stroke: ok ? C.ok : C.faint, lw: 0.3, fill: ok ? C.ok : null });
      if (ok) pg.poly([[x + 0.6, yy + 1.4], [x + 1.2, yy + 2.1], [x + 2.3, yy + 0.6], [x + 2.3, yy + 1.1], [x + 1.2, yy + 2.6], [x + 0.6, yy + 1.9]], { fill: '#ffffff' });
    }
    function row(label, value, opts) {
      opts = opts || {};
      const lw = R ? 64 : 82;
      if (R) opts.check = false;
      const lLines = PM.pdf.wrap(label, lw - 3, 8.5);
      const vLines = value ? PM.pdf.wrap(value, CW - lw - 6, 9, true) : [L.none];
      const hh = Math.max(lLines.length * 3.9, vLines.length * 4.1) + 2.6;
      ensure(hh);
      if (opts.check !== false) tick(!!value, M + 0.3, y + 0.9);
      lLines.forEach((ln, i) => pg.text(ln, M + 5, y + 3.3 + i * 3.9, { size: 8.5, color: C.muted }));
      vLines.forEach((ln, i) => pg.text(ln, M + lw + 3, y + 3.3 + i * 4.1, { size: 9, bold: !!value, color: value ? C.text : C.faint }));
      if (opts.chip) {
        const cw = PM.pdf.textWidth(opts.chip.text, 7, true) + 4, cx = M + lw + 3 + PM.pdf.textWidth(vLines[0] || '', 9, true) + 3;
        pg.rect(cx, y + 0.4, cw, 4, { fill: opts.chip.color, r: 0.8 });
        pg.text(opts.chip.text, cx + cw / 2, y + 3.2, { size: 7, bold: true, color: '#ffffff', align: 'center' });
      }
      y += hh;
      pg.line(M, y - 1.1, W - M, y - 1.1, { stroke: C.line, lw: 0.15 });
    }
    function checkRow(f) {
      const val = v[f.key], note = v[f.key + '_note'];
      const lLines = PM.pdf.wrap(f.label, CW - 36, 8.8);
      const nLines = note ? PM.pdf.wrap(note, CW - 36, 8) : [];
      const nph = (v[f.key + '_ph'] || []).length;
      const hh = lLines.length * 4 + nLines.length * 3.7 + (nph ? 3.7 : 0) + 3;
      ensure(hh);
      const map = { ok: [F.ok, C.ok], nok: [F.nok, C.bad], na: [F.na, '#8a909a'] };
      const st = map[val];
      if (st) {
        const w = Math.max(16, PM.pdf.textWidth(st[0], 7.5, true) + 5);
        pg.rect(M, y + 0.4, w, 4.6, { fill: st[1], r: 1 });
        pg.text(st[0], M + w / 2, y + 3.7, { size: 7.5, bold: true, color: '#ffffff', align: 'center' });
      } else pg.rect(M, y + 0.4, 16, 4.6, { stroke: C.faint, lw: 0.3, r: 1 });
      lLines.forEach((ln, i) => pg.text(ln, M + 32, y + 3.6 + i * 4, { size: 8.8, color: C.text }));
      let yy = y + 3.6 + lLines.length * 4;
      nLines.forEach(ln => { pg.text(ln, M + 32, yy, { size: 8, color: val === 'nok' ? C.bad : C.muted }); yy += 3.7; });
      if (nph) pg.text(nph + ' ' + (nph === 1 ? L.photo : L.photosN) + ' (' + L.seeAppendix + ')', M + 32, yy, { size: 7.5, color: C.muted });
      y += hh;
      pg.line(M, y - 1.1, W - M, y - 1.1, { stroke: C.line, lw: 0.15 });
    }
    function textBox(f) {
      const lines = v[f.key] ? PM.pdf.wrap(fill(v[f.key]), CW - 6, 9.5) : [];
      if (!f.hideLabel) { ensure(12); pg.text(f.label, M, y + 3, { size: 8.5, color: C.muted }); y += 5; }
      if (!lines.length) { ensure(8); pg.text(L.none, M + 3, y + 4, { size: 9, color: C.faint }); y += 8; return; }
      ensure(10);
      let segTop = y;
      lines.forEach(ln => {
        if (y + 5 > BOTTOM) { pg.line(M + 0.5, segTop, M + 0.5, y, { stroke: '#c9ced8', lw: 0.8 }); newPage(); segTop = y; }
        pg.text(ln, M + 4, y + 3.8, { size: 9.5, color: C.text });
        y += 4.6;
      });
      pg.line(M + 0.5, segTop, M + 0.5, y, { stroke: '#c9ced8', lw: 0.8 });
      y += 3;
    }
    function paragraph(text, size) {
      const lines = PM.pdf.wrap(fill(text), CW - (R ? 8 : 0), size || 9.5);
      lines.forEach(ln => { ensure(5); pg.text(ln, M + (R ? 8 : 0), y + 3.8, { size: size || 9.5, color: C.text }); y += 4.4; });
      y += 2.5;
    }
    function gridTable(head, body, widths, opts) {
      opts = opts || {};
      const rh = 5.4;
      ensure(rh * (body.length + 1) + 3);
      const xs = []; let x = M; widths.forEach(w => { xs.push(x); x += w; });
      pg.rect(M, y, CW, rh, { fill: C.head });
      head.forEach((c, i) => pg.text(PM.pdf.fit(c, widths[i] - 2, 7, true), xs[i] + (i ? widths[i] - 1.2 : 1.2), y + 3.7, { size: 7, bold: true, color: C.muted, align: i ? 'right' : 'left' }));
      y += rh;
      body.forEach(r => {
        r.forEach((c, i) => {
          if (c && typeof c === 'object') {           // status chip
            const w = Math.min(widths[i] - 2, PM.pdf.textWidth(c.text, 7, true) + 4);
            pg.rect(xs[i] + widths[i] - 1.2 - w, y + 0.8, w, 3.9, { fill: c.color, r: 0.8 });
            pg.text(c.text, xs[i] + widths[i] - 1.2 - w / 2, y + 3.6, { size: 7, bold: true, color: '#ffffff', align: 'center' });
          } else pg.text(PM.pdf.fit(c == null || c === '' ? (i ? '' : '') : String(c), widths[i] - 2.4, 8, i === 0), xs[i] + (i ? widths[i] - 1.2 : 1.2), y + 3.8, { size: 8, bold: i === 0, color: c == null || c === '' ? C.faint : C.text, align: i ? 'right' : 'left' });
        });
        y += rh;
        pg.line(M, y, W - M, y, { stroke: C.line, lw: 0.15 });
      });
      y += 2;
    }

    newPage();

    // ---- client / contact boxes ----
    const fields = S.visibleFields(rec);
    const personField = fields.find(f => f.type === 'person' && v[f.key]) || fields.find(f => f.type === 'person');
    const us = personField ? PM.store.find('people', v[personField.key]) : null;
    const hasClient = ['client', 'client_contact', 'client_phone', 'client_email'].some(k => v[k]) || (project && project.client);
    if (!R && (hasClient || personField)) {
      const boxW = (CW - 6) / 2, bh = 26;
      const boxes = [];
      if (hasClient) boxes.push([L.client, [[v.client || (project && project.client) || ''], [L.contact, v.client_contact], [L.phone, v.client_phone], [L.email, v.client_email]]]);
      if (personField) boxes.push([personField.label || co.name || L.contact, [[us ? us.name : ''], [L.phone, us && us.phone], [L.email, us && us.email]]]);
      boxes.forEach((b, i) => {
        const bx = M + i * (boxW + 6);
        pg.rect(bx, y, boxW, bh, { stroke: C.line, lw: 0.3, r: 1.5 });
        pg.text(PM.pdf.fit(b[0].toUpperCase(), boxW - 6, 7, true), bx + 3, y + 5, { size: 7, bold: true, color: C.muted });
        b[1].forEach((ln, j) => {
          const yy = y + 10.5 + j * 4.6;
          if (ln.length === 1) pg.text(PM.pdf.fit(ln[0] || L.none, boxW - 6, 10.5, true), bx + 3, yy, { size: 10.5, bold: true, color: ln[0] ? C.text : C.faint });
          else { pg.text(ln[0], bx + 3, yy, { size: 8, color: C.muted }); pg.text(PM.pdf.fit(ln[1] || L.none, boxW - 34, 8.5), bx + 30, yy, { size: 8.5, color: ln[1] ? C.text : C.faint }); }
        });
      });
      y += bh + 4;
    }
    if (v.address && !R) {
      const lines = PM.pdf.wrap(v.address, CW - 36, 9);
      pg.text(L.address, M, y + 3.5, { size: 8, color: C.muted });
      lines.forEach((ln, i) => pg.text(ln, M + 34, y + 3.5 + i * 4.2, { size: 9, bold: true, color: C.text }));
      y += lines.length * 4.2 + 4;
    }

    // ---- deviations summary (check items "Not OK") ----
    const checksAll = fields.filter(f => f.type === 'check');
    if (checksAll.length && !R) {
      const dev = checksAll.filter(f => v[f.key] === 'nok');
      const okN = checksAll.filter(f => v[f.key] === 'ok').length;
      const naN = checksAll.filter(f => v[f.key] === 'na').length;
      const lines = [];
      dev.forEach(f => { lines.push({ t: '• ' + f.label, b: true }); if (v[f.key + '_note']) PM.pdf.wrap(v[f.key + '_note'], CW - 14, 8).forEach(n => lines.push({ t: n, b: false })); });
      const hh = 12 + lines.length * 4;
      ensure(Math.min(hh, 80));
      pg.rect(M, y, CW, hh, { fill: dev.length ? '#fdf0f0' : '#eef8f2', r: 1.5 });
      pg.text((dev.length ? L.deviations + ': ' + dev.length : L.noDeviations).toUpperCase(), M + 3, y + 5.2, { size: 8, bold: true, color: dev.length ? C.bad : C.ok });
      pg.text(okN + ' / ' + checksAll.length + ' ' + L.summary + (naN ? '  ·  ' + naN + ' ' + F.na : ''), W - M - 3, y + 5.2, { size: 8, color: C.muted, align: 'right' });
      let yy = y + 10.5;
      lines.forEach(ln => { if (yy > BOTTOM) return; pg.text(PM.pdf.fit(ln.t, CW - 10, 8.5, ln.b), M + (ln.b ? 3 : 6.5), yy, { size: ln.b ? 8.5 : 8, bold: ln.b, color: ln.b ? C.text : C.muted }); yy += 4; });
      y += hh + 4;
    }

    // ---- sections ----
    const usedKeys = new Set(R ? [] : BOXED.concat(personField ? [personField.key] : []));
    let chapter = 0;
    for (const sec of S.expand(t, v)) {
      if (sec.sec.nopdf) continue;
      const fs = sec.fields.filter(f => S.isVisible(f, v) && !usedKeys.has(f.key) && (R || f.type !== 'photos') && !(R && f.optional && f.type !== 'calc' && !S.isAnswered(f, v)));
      if (!fs.length) continue;
      if (R) {
        ensure(20);
        y += 2;
        pg.text(++chapter + '.  ' + sec.title + (/[.:!?]$/.test(sec.title) ? '' : '.'), M + 8 - 8, y + 4, { size: 12.5, bold: true, color: C.text });
        y += 8.5;
      } else sectionTitle(sec.title);
      if (sec.sec.note) { PM.pdf.wrap(sec.sec.note, CW, 7.5).forEach(ln => { ensure(4); pg.text(ln, M, y + 2, { size: 7.5, color: C.muted }); y += 3.6; }); y += 1.5; }
      const positions = fs.filter(f => f.type === 'position');
      if (positions.length) {
        const dw = 44, dh = dw / S.PUMPSET_RATIO;
        ensure(dh + 4);
        const top = y;
        S.drawPumpset(pg, W - M - dw, top, dw, S.marksFor(rec), t.diagram);
        positions.forEach(f => {
          const val = v[f.key];
          const m = S.MARKS[f.mark];
          pg.circle(M + 2, y + 2.6, 1.6, { fill: m ? m.color : C.accent });
          pg.text(PM.pdf.fit(f.label, 84, 9), M + 6, y + 3.6, { size: 9, color: C.text });
          pg.text(val || L.none, M + 92, y + 3.8, { size: 13, bold: true, color: val ? (m ? m.color : C.text) : C.faint });
          y += 9;
          pg.line(M, y - 2, W - M - dw - 6, y - 2, { stroke: C.line, lw: 0.15 });
        });
        y = Math.max(y, top + dh) + 4;
      }
      for (const f of fs) {
        if (f.type === 'position') continue;
        if (R && f.type === 'textarea') {
          if (!f.hideLabel) { ensure(10); pg.text(f.label, M + 8, y + 3, { size: 9.5, bold: true, color: C.text }); pg.line(M + 8, y + 3.8, M + 8 + PM.pdf.textWidth(f.label, 9.5, true), y + 3.8, { stroke: C.text, lw: 0.25 }); y += 6; }
          if (v[f.key]) paragraph(v[f.key]); else { pg.text(L.none, M + 8, y + 3.8, { size: 9, color: C.faint }); y += 7; }
          continue;
        }
        if (R && f.type === 'photos') {
          const list = v[f.key] || [];
          if (!list.length) continue;
          ensure(12);
          pg.text(f.label, M + 8, y + 3, { size: 9.5, bold: true, color: C.text });
          pg.line(M + 8, y + 3.8, M + 8 + PM.pdf.textWidth(f.label, 9.5, true), y + 3.8, { stroke: C.text, lw: 0.25 });
          y += 6;
          const per = list.length === 1 ? 1 : 2, gap = 4, cw = (CW - 8 - gap * (per - 1)) / per;
          let col = 0, rowH = 0;
          for (const rel of list) {
            let img = null;
            try { const u = await PM.files.url(S.photoPath(rec, rel)); if (u) img = await PM.pdf.loadImage(u, 1600); } catch (e) { /* missing */ }
            const ih = img ? Math.min(cw / img.ratio, per === 1 ? 150 : 95) : 30, iw = img ? ih * img.ratio : cw;
            if (col === 0) ensure(ih + 4);
            const x = M + 8 + col * (cw + gap);
            if (img) { pg.image(img, x + (cw - iw) / 2, y, iw, ih); pg.rect(x + (cw - iw) / 2, y, iw, ih, { stroke: C.line, lw: 0.2 }); }
            else { pg.rect(x, y, cw, ih, { fill: C.head }); pg.text('—', x + cw / 2, y + ih / 2, { size: 8, color: C.muted, align: 'center' }); }
            rowH = Math.max(rowH, ih); col++;
            if (col === per) { col = 0; y += rowH + gap; rowH = 0; }
          }
          if (col) y += rowH + gap;
          y += 2;
          continue;
        }
        if (f.type === 'layout') {
          const placed = S.parseLayout(v[f.key]);
          const dh = 120, dw = 92;
          ensure(dh + 6);
          const top = y;
          if (!R) { pg.text(f.label, M, y + 3.4, { size: 9, bold: true, color: C.text }); }
          const info = drawLayout(pg, f, v, W - M - dw, top, dw, dh);
          let ly = top + (R ? 0 : 7);
          if (!placed.length) pg.text(L.none, M, ly + 3.5, { size: 9, color: C.faint });
          placed.forEach(p => {
            if (ly > top + dh - 4) return;
            pg.circle(M + 1.6, ly + 2.4, 1.3, { fill: info.colorOf(p.code) });
            pg.text(PM.pdf.fit(info.labelOf(p.code) + (p.code === 'door' ? ' (hinge ' + (p.flag || 'L') + ')' : ''), 40, 8, true), M + 4.5, ly + 3.4, { size: 8, bold: true, color: C.text });
            pg.text(PM.pdf.fit(S.describePos(p, info.Lmm, info.Wmm), CW - dw - 50, 7.5), M + 46, ly + 3.4, { size: 7.5, color: C.muted });
            ly += 5;
          });
          y = top + dh + 4;
          continue;
        }
        if (f.type === 'calc') {
          const c = S.calcCheck(t, v, f);
          row(f.label, c.text ? c.text + (f.unit ? ' ' + f.unit : '') : '', { check: false, chip: c.ok == null ? null : { text: c.ok ? F.pass : F.fail, color: c.ok ? C.ok : C.bad } });
          continue;
        }
        if (f.type === 'check') { checkRow(f); continue; }
        if (f.type === 'textarea' && (f.hideLabel || (v[f.key] || '').length > 90)) { textBox(f); continue; }
        if (f.type === 'multi' && !R) { row(f.label, (v[f.key] || '').split(';').map(x => x.trim()).filter(Boolean).join(', '), { check: !f.optional }); continue; }
        if (f.type === 'pumptest') {
          ensure(30);
          pg.text(f.label, M, y + 3.4, { size: 9, bold: true, color: C.text });
          const rq = v[S.resolveKey(f, f.ratedFlow, v)], rp = v[S.resolveKey(f, f.ratedPressure, v)];
          if (rp) pg.text('Rated: ' + (rq || '?') + ' ' + f.flowUnit + ' at ' + rp + ' ' + f.pressureUnit, W - M, y + 3.4, { size: 8, color: C.muted, align: 'right' });
          y += 6;
          const chk = S.pumpCheck(f, v, t);
          gridTable(['', F.flow + ' (' + f.flowUnit + ')', F.suction + ' (' + f.pressureUnit + ')', F.discharge + ' (' + f.pressureUnit + ')', F.net + ' (' + f.pressureUnit + ')', '% ' + F.rated, F.speed + ' (rpm)', F.pass + '?'],
            chk.map(r => [r.label, r.flow, r.suction, r.discharge, r.net == null ? '' : U.fmtNum(r.net), r.ratio == null ? '' : Math.round(r.ratio * 100) + '%', r.rpm, r.ok == null ? '' : { text: r.ok ? F.pass : F.fail, color: r.ok ? C.ok : C.bad }]),
            [26, 22, 22, 24, 24, 20, 22, CW - 160]);
          if (f.hint) PM.pdf.wrap(f.hint, CW, 7).forEach(ln => { ensure(4); pg.text(ln, M, y + 1.5, { size: 7, color: C.muted }); y += 3.4; });
          y += 3;
          continue;
        }
        if (f.type === 'table') {
          if (!S.isAnswered(f, v)) { row(f.label, '', { check: !f.optional }); continue; }
          ensure(12);
          pg.text(f.label, M, y + 3.4, { size: 9, bold: true, color: C.text }); y += 6;
          const cols = f.cols || [];
          const first = 40, w = (CW - first) / Math.max(1, cols.length);
          gridTable([''].concat(cols), (f.rows || []).map((r, i) => [r].concat(cols.map((c, j) => v[f.key + '_r' + (i + 1) + '_c' + (j + 1)] || ''))), [first].concat(cols.map(() => w)));
          continue;
        }
        row(f.label, answer(f, v, t), { check: !f.optional });
      }
      y += 3;
    }

    // ---- photos ----
    const photoItems = [];
    S.expand(t, v).forEach(sec => sec.fields.filter(f => S.isVisible(f, v)).forEach(f => {
      if (sec.sec.nopdf) return;
      const list = f.type === 'photos' && !R ? v[f.key] : f.type === 'check' ? v[f.key + '_ph'] : null;
      if (list && list.length) photoItems.push({ label: (sec.n ? sec.title + ' – ' : '') + f.label, list });
    }));
    if (photoItems.length) {
      sectionTitle(L.photos);
      for (const it of photoItems) {
        ensure(12);
        pg.text(PM.pdf.fit(it.label, CW, 9, true), M, y + 3, { size: 9, bold: true, color: C.text });
        y += 6;
        const per = 3, gap = 4, cw = (CW - gap * (per - 1)) / per;
        let col = 0, rowH = 0;
        for (const rel of it.list) {
          let img = null;
          try { const u = await PM.files.url(S.photoPath(rec, rel)); if (u) img = await PM.pdf.loadImage(u, 1400); } catch (e) { /* missing */ }
          const ih = img ? Math.min(cw / img.ratio, 70) : 30;
          const iw = img ? ih * img.ratio : cw;
          if (col === 0) ensure(ih + 4);
          const x = M + col * (cw + gap);
          if (img) pg.image(img, x + (cw - iw) / 2, y, iw, ih);

    ['Text / long text', 'default=Starting text (\\n = new line) · {key} in a text is replaced by that answer in the PDF'],
    ['Multiple choice', 'Option A; Option B; Option C — tick any number of them'],
    ['Calculation', 'formula=power_kw * 5.07 * 1.10; decimals=0; min=<key> (shows Pass/Fail against that value). Use keys of other questions; functions max, min, round, ceil, floor, if(test, a, b)'],
    ['Layout drawing', 'length=<key>; width=<key> (e.g. outside_l, outside_w) · items=door:Door, louvre_h:Louvre high, *ap:Panel (* = can stand inside)'],
    ['Sections', 'Repeat a section a number of times by choosing a number question under “Repeat per”. Use {n} in the title for the number.']
  ];

  function badge(t) {
    if (t.source === 'data' && t.builtin && t.edited) return h('span', { class: 'pill small st-review' }, 'built-in, changed');
    if (t.source === 'data' && t.builtin) return h('span', { class: 'pill small' }, 'built-in');
    if (t.source === 'data') return h('span', { class: 'pill small st-active' }, 'your own');
    return h('span', { class: 'pill small' }, 'built-in (not yet in your data)');
  }

  function renderTab(el) {
    const forms = S.list();
    el.appendChild(h('p', { class: 'muted' }, 'Forms are stored in your data as ', h('code', null, 'settings/forms/<id>.md'), '. Changing a question’s text, options or order is safe. Changing a question’s key disconnects answers already given to it.'));
    el.appendChild(h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', onclick: () => newForm() }, '+ New form')));
    el.appendChild(h('div', { class: 'forms-list' }, forms.map(t => {
      const n = S.fieldsOf(t).length;
      const used = PM.store.list('surveys', r => r.template === t.id).length;
      return h('div', { class: 'card form-card' },
        h('div', { class: 'form-card-head' }, h('strong', null, t.name), badge(t)),
        h('div', { class: 'muted small' }, [t.id + '.md', (t.lang || 'en').toUpperCase(), t.sections.length + ' sections', n + ' questions', used + ' filled in'].join(' · ')),
        t.description ? h('p', { class: 'small form-card-desc' }, t.description) : null,
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn small', onclick: () => edit(t) }, 'Edit'),
          h('button', { class: 'btn ghost small', onclick: () => duplicate(t) }, 'Duplicate'),
          t.builtin && t.edited ? h('button', { class: 'btn ghost small', onclick: () => confirmBox('Reset “' + t.name + '” to the built-in version?', 'Your changes to this form are replaced. Answers already given are kept.', 'Reset', async () => { await S.resetForm(t.id); PM.ui.toast('Form reset.', 'ok'); PM.app.render(); }) }, 'Reset to built-in') : null,
          !S.isBuiltin(t.id) ? h('button', { class: 'btn ghost small danger-text', onclick: () => confirmBox('Delete the form “' + t.name + '”?', used ? used + ' filled-in form(s) use it. Their answers are kept, but cannot be opened until the form exists again.' : 'The file ' + t.id + '.md is removed from your data.', 'Delete', async () => { await S.deleteForm(t.id); PM.ui.toast('Form deleted.', 'ok'); PM.app.render(); }) }, 'Delete') : null));
    })));
  }

  function confirmBox(title, text, label, fn) {
    PM.ui.dialog({ title, content: h('p', null, text), actions: [{ label: 'Cancel' }, { label, danger: true, onClick: fn }] });
  }

  function clone(t) {
    return { id: t.id, name: t.name, short: t.short, lang: t.lang || 'en', description: t.description || '', signatures: (t.signatures || []).slice(), diagram: Object.assign({}, t.diagram), intro: t.intro || '', report: !!t.report, header: (t.header || []).slice(), footer: t.footer || '',
      sections: t.sections.map(s => ({ id: s.id, title: s.title, note: s.note || '', repeat: s.repeat || '', diagram: !!s.diagram, nopdf: !!s.nopdf,
        fields: s.fields.map(f => ({ key: f.key, label: f.label, type: f.type, opt: f.opt != null ? f.opt : '', unit: f.unit || '', hint: f.hint || '' })) })) };
  }
  function uniqueId(base) { let id = U.slugify(base) || 'form', i = 2; const b = id; while (S.get(id)) id = b + '-' + i++; return id; }

  function newForm() {
    const t = { id: '', name: 'New form', short: 'New form', lang: 'en', description: '', signatures: [], diagram: {}, sections: [
      { title: 'General', note: '', repeat: '', diagram: false, fields: [
        { key: 'date', label: 'Date', type: 'date', opt: 'default=today', unit: '', hint: '' },
        { key: 'projectnr', label: 'Project number', type: 'text', opt: 'prefill=number', unit: '', hint: '' },
        { key: 'client', label: 'Client', type: 'text', opt: 'prefill=client', unit: '', hint: '' },
        { key: 'surveyor', label: 'Filled in by', type: 'person', opt: '', unit: '', hint: '' }] },
      { title: 'Remarks', note: '', repeat: '', diagram: false, fields: [{ key: 'remarks', label: 'Remarks', type: 'textarea', opt: '+optional; +nolabel; rows=6', unit: '', hint: '' }] }] };
    edit(t, true);
  }
  function duplicate(t) {
    const c = clone(t);
    c.name = t.name + ' (copy)'; c.short = (t.short || t.name) + ' (copy)'; c.id = '';
    edit(c, true);
  }

  function keyFrom(label, used) {
    let k = U.slugify(label).replace(/-/g, '_').slice(0, 24) || 'q';
    if (/^\d/.test(k)) k = 'q_' + k;
    let i = 2; const b = k;
    while (used.has(k)) k = b + '_' + i++;
    return k;
  }

  /* ---------- the editor ---------- */
  function edit(orig, isNew) {
    const t = clone(orig);
    let textMode = false;
    const body = h('div', { class: 'fe' });
    const err = h('p', { class: 'small bad-text', role: 'alert' });

    function allKeys(except) { const s = new Set(); t.sections.forEach(sec => sec.fields.forEach(f => { if (f !== except && f.key) s.add(f.key); })); return s; }
    function inp(obj, prop, attrs) {
      const i = h(attrs && attrs.tag === 'textarea' ? 'textarea' : 'input', Object.assign({ type: 'text', value: obj[prop] || '' }, attrs, { tag: null }));
      if (i.tagName === 'TEXTAREA') i.value = obj[prop] || '';
      i.addEventListener('input', () => { obj[prop] = i.value; });
      return i;
    }

    function draw() {
      body.innerHTML = '';
      if (textMode) {
        const ta = h('textarea', { class: 'fe-text', spellcheck: 'false', 'aria-label': 'Form as Markdown text' });
        ta.value = S.serializeForm(Object.assign({}, t, { id: t.id || uniqueId(t.name) }));
        ta.addEventListener('input', () => { body.dataset.text = ta.value; });
        body.dataset.text = ta.value;
        body.append(h('p', { class: 'small muted' }, 'The form as it is stored in your data. Each section is a table: key | question | type | options | unit | hint.'), ta);
        return;
      }
      const sig = h('input', { type: 'text', value: (t.signatures || []).join('; '), placeholder: 'e.g. Tested by; Witnessed by (client)', id: 'fe-sig' });
      sig.addEventListener('input', () => { t.signatures = sig.value.split(';').map(x => x.trim()).filter(Boolean); });
      const lang = h('select', { id: 'fe-lang' }, [['en', 'English'], ['nl', 'Nederlands']].map(([v, l]) => h('option', { value: v, selected: t.lang === v || null }, l)));
      lang.addEventListener('change', () => { t.lang = lang.value; });
      body.append(h('div', { class: 'form-grid fe-meta' },
        h('label', { class: 'form-row', for: 'fe-name' }, h('span', null, 'Form name *'), inp(t, 'name', { id: 'fe-name' })),
        h('label', { class: 'form-row', for: 'fe-short' }, h('span', null, 'Short name (badge)'), inp(t, 'short', { id: 'fe-short' })),
        h('label', { class: 'form-row', for: 'fe-lang' }, h('span', null, 'Language of buttons and PDF'), lang),
        h('label', { class: 'form-row wide', for: 'fe-desc' }, h('span', null, 'Description'), inp(t, 'description', { id: 'fe-desc' })),
        h('label', { class: 'form-row wide', for: 'fe-sig' }, h('span', null, 'Signature boxes in the PDF (separate with ;)'), sig)));

      t.sections.forEach((sec, si) => {
        const numberKeys = [];
        t.sections.forEach((s2, j) => { if (j < si) s2.fields.forEach(f => { if (f.type === 'number') numberKeys.push(f); }); });
        const rep = h('select', { 'aria-label': 'Repeat per' }, h('option', { value: '' }, '— no —'), numberKeys.map(f => h('option', { value: f.key, selected: sec.repeat === f.key || null }, f.label + ' (' + f.key + ')')));
        rep.addEventListener('change', () => { sec.repeat = rep.value; });
        const dia = h('input', { type: 'checkbox', checked: sec.diagram || null });
        dia.addEventListener('change', () => { sec.diagram = dia.checked; });
        const qWrap = h('div', { class: 'fe-questions' });
        sec.fields.forEach((f, fi) => qWrap.appendChild(questionRow(sec, f, fi)));
        body.appendChild(h('section', { class: 'fe-section' },
          h('div', { class: 'fe-sec-head' },
            inp(sec, 'title', { class: 'fe-sec-title', 'aria-label': 'Section title' }),
            h('div', { class: 'fe-tools' },
              h('button', { type: 'button', class: 'icon-btn', title: 'Move up', disabled: si === 0 || null, onclick: () => { t.sections.splice(si - 1, 0, t.sections.splice(si, 1)[0]); draw(); } }, '↑'),
              h('button', { type: 'button', class: 'icon-btn', title: 'Move down', disabled: si === t.sections.length - 1 || null, onclick: () => { t.sections.splice(si + 1, 0, t.sections.splice(si, 1)[0]); draw(); } }, '↓'),
              h('button', { type: 'button', class: 'icon-btn', title: 'Delete section', onclick: () => { if (!sec.fields.length || confirm('Delete section “' + sec.title + '” with ' + sec.fields.length + ' question(s)?')) { t.sections.splice(si, 1); draw(); } } }, '✕'))),
          h('div', { class: 'fe-sec-opts' },
            h('label', { class: 'form-row' }, h('span', null, 'Note under the title'), inp(sec, 'note')),
            h('label', { class: 'form-row' }, h('span', null, 'Repeat per'), rep),
            h('label', { class: 'check' }, dia, ' Show pump-set drawing')),
          h('div', { class: 'fe-q-head', 'aria-hidden': 'true' }, ['Question', 'Type', 'Options', 'Unit', 'Hint', 'Key', ''].map(x => h('span', null, x))),
          qWrap,
          h('button', { type: 'button', class: 'btn ghost small', onclick: () => { sec.fields.push({ key: '', label: '', type: 'text', opt: '', unit: '', hint: '' }); draw(); const qs = body.querySelectorAll('.fe-section')[si].querySelectorAll('.fe-q input'); const last = qs[qs.length - 6]; if (last) last.focus(); } }, '+ Question')));
      });
      body.appendChild(h('button', { type: 'button', class: 'btn', onclick: () => { t.sections.push({ title: 'New section', note: '', repeat: '', diagram: false, fields: [] }); draw(); } }, '+ Section'));
      body.appendChild(h('details', { class: 'fe-help' }, h('summary', null, 'Help: options per question type'),
        h('dl', null, HELP.map(([k, d]) => [h('dt', null, k), h('dd', null, d)]))));
    }

    function questionRow(sec, f, fi) {
      const label = inp(f, 'label', { placeholder: 'Question', 'aria-label': 'Question' });
      const key = inp(f, 'key', { placeholder: 'auto', 'aria-label': 'Key', class: 'fe-key' });
      label.addEventListener('change', () => { if (!f.key && f.label) { f.key = keyFrom(f.label, allKeys(f)); key.value = f.key; } });
      key.addEventListener('change', () => { f.key = f.key.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_'); key.value = f.key; });
      const type = h('select', { 'aria-label': 'Type' }, TYPES.map(([v, l]) => h('option', { value: v, selected: f.type === v || null }, l)));
      type.addEventListener('change', () => { f.type = type.value; });
      return h('div', { class: 'fe-q' },
        label, type,
        inp(f, 'opt', { placeholder: 'Options', 'aria-label': 'Options' }),
        inp(f, 'unit', { placeholder: 'Unit', 'aria-label': 'Unit', class: 'fe-unit' }),
        inp(f, 'hint', { placeholder: 'Hint', 'aria-label': 'Hint' }),
        key,
        h('div', { class: 'fe-tools' },
          h('button', { type: 'button', class: 'icon-btn', title: 'Move up', disabled: fi === 0 || null, onclick: () => { sec.fields.splice(fi - 1, 0, sec.fields.splice(fi, 1)[0]); draw(); } }, '↑'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Move down', disabled: fi === sec.fields.length - 1 || null, onclick: () => { sec.fields.splice(fi + 1, 0, sec.fields.splice(fi, 1)[0]); draw(); } }, '↓'),
          h('button', { type: 'button', class: 'icon-btn', title: 'Delete question', onclick: () => { sec.fields.splice(fi, 1); draw(); } }, '✕')));
    }

    function validate(form) {
      if (!form.name || !form.name.trim()) return 'Give the form a name.';
      const seen = new Set();
      for (const sec of form.sections) {
        if (!sec.title.trim()) return 'Every section needs a title.';
        for (const f of sec.fields) {
          if (!f.label.trim()) return 'Every question needs a text (section “' + sec.title + '”).';
          if (!f.key) f.key = keyFrom(f.label, seen);
          if (!/^[a-z0-9_]+$/.test(f.key)) return 'Key “' + f.key + '” may only contain a–z, 0–9 and _.';
          if (seen.has(f.key)) return 'The key “' + f.key + '” is used twice. Every question needs its own key.';
          seen.add(f.key);
        }
      }
      return null;
    }

    const modeBtn = h('button', { type: 'button', class: 'btn ghost', onclick: () => {
      if (textMode) {
        try { const p = S.parseForm(body.dataset.text || '', 'data'); Object.assign(t, clone(p)); }
        catch (e) { err.textContent = 'The text could not be read: ' + e.message; return; }
      }
      textMode = !textMode; modeBtn.textContent = textMode ? 'Edit visually' : 'Edit as text'; err.textContent = ''; draw();
    } }, 'Edit as text');

    draw();
    PM.ui.dialog({
      title: isNew ? 'New form' : 'Edit form · ' + orig.name, wide: true, className: 'fe-dialog',
      content: h('div', null, body, err),
      footLeft: modeBtn,
      actions: [{ label: 'Cancel' }, { label: 'Save form', primary: true, onClick: async () => {
        let form = t;
        if (textMode) { try { form = clone(S.parseForm(body.dataset.text || '', 'data')); } catch (e) { err.textContent = 'The text could not be read: ' + e.message; return false; } }
        const problem = validate(form);
        if (problem) { err.textContent = problem; return false; }
        if (!form.id) form.id = uniqueId(form.name);
        if (!isNew && form.id !== orig.id) form.id = orig.id;
        try { await S.saveForm(form); }
        catch (e) { err.textContent = 'Could not save: ' + e.message; return false; }
        PM.ui.toast('Form “' + form.name + '” saved.', 'ok');
        PM.app.render();
      } }]
    });
  }

  return { renderTab, edit, newForm };
})();

  <script>/* js/modules/hours.js */
/* PM Tool — modules/hours.js
 * Time registration. Cost = hours × rate: the project rate (Costs → Estimate → Hourly rates for this project)
 * if set, else the rate of the role (entry role, else the person's default role). * in the Rate column = project rate.
 */
(function () {
  const U = PM.util, h = U.h;
  const state = { month: '', person: '', last: {} };

  PM.registerModule({
    id: 'hours', title: 'Hours', icon: '◷', order: 40,
    render(el, ctx) {
      const calc = PM.services.calc;
      const all = PM.store.list('hours', ctx.projectId ? { project: ctx.projectId } : null);
      const months = Array.from(new Set(all.map(x => U.monthKey(x.date)).filter(Boolean))).sort().reverse();
      let rows = all;
      if (state.month) rows = rows.filter(x => U.monthKey(x.date) === state.month);
      if (state.person) rows = rows.filter(x => x.person === state.person);

      el.appendChild(h('div', { class: 'page-head' },
        h('div', null, h('h1', null, 'Hours'), h('p', { class: 'muted' }, (ctx.project ? ctx.project.name : 'All projects') + ' · ' + U.fmtNum(U.sum(rows, x => x.hours)) + ' h · ' + U.fmtMoney(U.sum(rows, calc.entryCost)) + ' labour in this selection'))));

      // Quick entry
      if (ctx.project) {
        const pid = ctx.projectId;
        const def = PM.collection('hours');
        const fld = k => def.fields.find(f => f.key === k);
        const v = Object.assign({ date: U.todayISO(), person: '', role: '', line: '', task: '', extra: '', hours: '', note: '' }, state.last[pid] || {}, { hours: '', note: '' });
        const mk = k => { const i = PM.ui.input(fld(k), v[k], { record: { project: pid }, projectId: pid, onCommit: val => { v[k] = val; if (k === 'person') roleHint(); if (k === 'task') { const t = PM.store.find('tasks', val, pid); if (t && t.line) { v.line = t.line; lineSel.value = t.line; } } } }); if (i.tagName === 'INPUT') i.addEventListener('input', () => { v[k] = i.value; }); return i; };
        const lineSel = mk('line');
        const hint = h('span', { class: 'muted small' });
        const roleHint = () => { const p = PM.store.find('people', v.person); const r = p && PM.store.find('roles', p.role); hint.textContent = r ? '(default ' + r.name + ')' : ''; };
        roleHint();
        const hoursInp = mk('hours');
        hoursInp.placeholder = 'h';
        const noteInp = mk('note');
        noteInp.placeholder = 'Note';
        const submit = () => {
          if (!U.num(v.hours)) { PM.ui.toast('Enter the number of hours.', 'warn'); hoursInp.focus(); return; }
          if (!v.person) { PM.ui.toast('Choose a person.', 'warn'); return; }
          state.last[pid] = { date: v.date, person: v.person, role: v.role, line: v.line, task: v.task, extra: v.extra };
          PM.ui.pendingFocus = 'quick-hours';
          PM.store.insert('hours', Object.assign({}, v), pid);
        };
        hoursInp.dataset.focus = 'quick-hours';
        [hoursInp, noteInp].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { v.hours = hoursInp.value; v.note = noteInp.value; submit(); } }));
        el.appendChild(h('div', { class: 'card quick' },
          h('div', { class: 'quick-grid' },
            h('label', null, h('span', null, 'Date'), mk('date')),
            h('label', null, h('span', null, 'Person'), mk('person')),
            h('label', null, h('span', null, 'Role ', hint), mk('role')),
            h('label', null, h('span', null, 'Planning line'), lineSel),
            h('label', null, h('span', null, 'Task'), mk('task')),
            PM.store.list('extras', x => x.project === pid && x.status !== 'rejected').length ? h('label', null, h('span', null, 'Additional work'), mk('extra')) : null,
            h('label', null, h('span', null, 'Hours'), hoursInp),
            h('label', { class: 'wide' }, h('span', null, 'Note'), noteInp),
            h('button', { class: 'btn primary', onclick: () => { v.hours = hoursInp.value; v.note = noteInp.value; submit(); } }, 'Log hours'))));
      }

      el.appendChild(h('div', { class: 'toolbar' },
        h('select', { 'aria-label': 'Month', onchange: e => { state.month = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'All months'), months.map(m => h('option', { value: m, selected: state.month === m || null }, U.fmtMonth(m)))),
        h('select', { 'aria-label': 'Person', onchange: e => { state.person = e.target.value; ctx.rerender(); } },
          h('option', { value: '' }, 'Everyone'), PM.store.list('people').map(p => h('option', { value: p.id, selected: state.person === p.id || null }, p.name)))));

      el.appendChild(PM.ui.dataTable({
        id: 'hours', collection: 'hours', projectId: ctx.projectId, rows, showProject: !ctx.projectId,
        newRecord: false, defaultSort: ['date', -1],
        extra: [
          { key: 'rate', label: 'Rate', width: 90, align: 'right', after: 'hours', value: x => { const i = calc.rateInfo(x.project, calc.entryRole(x), x.person); return i.rate ? U.fmtMoney(i.rate, true) + (i.project ? ' *' : '') : '⚠ none'; }, sortVal: x => calc.entryRate(x) },
          { key: 'cost', label: 'Cost', width: 100, align: 'right', after: 'hours', value: x => U.fmtMoney(calc.entryCost(x), true), sortVal: x => calc.entryCost(x) }
        ],
        totals: { hours: r => U.fmtNum(U.sum(r, x => x.hours)), cost: r => U.fmtMoney(U.sum(r, calc.entryCost)) }
      }));
    }
  });
})();

  <script>/* js/modules/costs-pdf.js */
/* PM Tool — modules/costs-pdf.js
 * Table-style PDF reports for the Costs tab (estimate, additional work, actual
 * costs, analysis). Generic: give it a spec, get a PDF.
 *
 *   await PM.costsPdf.render({
 *     title: 'Cost estimate', subtitle: 'P-001 · Object · Client', orientation: 'portrait'|'landscape',
 *     internal: true,                                // shows an "INTERNAL" tag in the header
 *     stats: [{ label, value, sub }],
 *     sections: [{ title, note, columns: [{ label, w, align }], rows: [{ cells: [], kind: 'group'|'muted'|'total', bad: [colIdx] }] }]
 *   })  -> Blob
 */
PM.costsPdf = (function () {
  const U = PM.util;
  const M = 14;
  const C = { text: '#1c2230', muted: '#687187', faint: '#a3a9b6', line: '#e1e4ea', head: '#eef1f6', group: '#f4f6f9', bad: '#c43a3a', accent: '#2f6fed' };

  async function render(spec) {
    const co = PM.company();
    const doc = PM.pdf.create({ size: 'A4', orientation: spec.orientation || 'portrait', title: spec.title });
    const W = doc.width, H = doc.height, CW = W - 2 * M, BOTTOM = H - M - 8;
    let logo = null;
    if (co.logo) { try { const u = await PM.files.url(co.logo); if (u) logo = await PM.pdf.loadImage(u, 900); } catch (e) { /* no logo */ } }
    const pages = [];
    let pg, y;

    function header() {
      if (logo) { const lh = 12, lw = Math.min(50, lh * logo.ratio); pg.image(logo, M, M, lw, lw / logo.ratio); }
      else if (co.name) pg.text(co.name, M, M + 7, { size: 13, bold: true, color: C.text });
      pg.text(PM.pdf.fit(spec.title, CW - 60, 14, true), W - M, M + 5, { size: 14, bold: true, color: C.text, align: 'right' });
      pg.text(PM.pdf.fit(spec.subtitle || '', CW - 60, 8.5), W - M, M + 10.5, { size: 8.5, color: C.muted, align: 'right' });
      if (spec.internal) {
        const t = 'INTERNAL', lw = PM.pdf.textWidth(t, 7, true) + 6;
        pg.rect(W - M - lw, M + 12.6, lw, 4.6, { fill: '#fdf3e1', r: 1 });
        pg.text(t, W - M - lw / 2, M + 15.9, { size: 7, bold: true, color: '#9a6514', align: 'center' });
      }
      pg.line(M, M + 19, W - M, M + 19, { stroke: '#c9ced8', lw: 0.4 });
      y = M + 26;
    }
    function newPage() { pg = doc.addPage(); pages.push(pg); header(); }
    function ensure(hh) { if (y + hh > BOTTOM) { newPage(); return true; } return false; }

    newPage();

    // stat boxes
    if (spec.stats && spec.stats.length) {
      const n = spec.stats.length, gap = 3, bw = (CW - gap * (n - 1)) / n, bh = 17;
      spec.stats.forEach((s, i) => {
        const x = M + i * (bw + gap);
        pg.rect(x, y, bw, bh, { stroke: C.line, lw: 0.3, r: 1.2 });
        pg.text(PM.pdf.fit(String(s.label).toUpperCase(), bw - 5, 6.5, true), x + 2.5, y + 4.5, { size: 6.5, bold: true, color: C.muted });
        pg.text(PM.pdf.fit(s.value, bw - 5, 12, true), x + 2.5, y + 10.5, { size: 12, bold: true, color: s.bad ? C.bad : C.text });
        if (s.sub) pg.text(PM.pdf.fit(s.sub, bw - 5, 6.8), x + 2.5, y + 14.6, { size: 6.8, color: C.muted });
      });
      y += bh + 7;
    }

    (spec.sections || []).forEach(sec => {
      const cols = sec.columns;
      const tw = U.sum(cols, c => c.w);
      const xs = []; let acc = M;
      cols.forEach(c => { const w = c.w / tw * CW; xs.push({ x: acc, w }); acc += w; });
      const RH = 5.4, FS = sec.fontSize || 8;
      function colHead() {
        pg.rect(M, y, CW, 6, { fill: C.head });
        cols.forEach((c, i) => {
          const { x, w } = xs[i];
          const tx = c.align === 'right' ? x + w - 1.5 : x + 1.5;
          pg.text(PM.pdf.fit(String(c.label).toUpperCase(), w - 2.5, 6.5, true), tx, y + 4.1, { size: 6.5, bold: true, color: C.muted, align: c.align === 'right' ? 'right' : 'left' });
        });
        y += 6;
      }
      ensure(22);
      pg.text(sec.title, M, y + 3, { size: 10.5, bold: true, color: C.text });
      y += 6;
      colHead();
      sec.rows.forEach(r => {
        const kind = r.kind || '';
        const hh = kind === 'group' ? RH + 0.8 : RH;
        if (ensure(hh + (kind === 'group' ? RH : 0))) colHead();
        if (kind === 'group') pg.rect(M, y, CW, hh, { fill: C.group });
        if (kind === 'total') pg.line(M, y + 0.2, W - M, y + 0.2, { stroke: C.text, lw: 0.35 });
        const bold = kind === 'group' || kind === 'total';
        r.cells.forEach((cell, i) => {
          if (cell == null || cell === '') return;
          const c = cols[i], x = xs[i].x;
          let w = xs[i].w;                       // text may run into empty cells to the right
          if (c.align !== 'right') for (let j = i + 1; j < r.cells.length && (r.cells[j] == null || r.cells[j] === ''); j++) w += xs[j].w;
          const indent = i === 0 && r.indent ? 3 : 0;
          const tx = c.align === 'right' ? x + w - 1.5 : x + 1.5 + indent;
          const color = (r.bad || []).includes(i) ? C.bad : kind === 'muted' ? C.muted : C.text;
          pg.text(PM.pdf.fit(cell, w - 2.5 - indent, FS, bold), tx, y + hh / 2 + FS * 0.13, { size: FS, bold, color, align: c.align === 'right' ? 'right' : 'left' });
        });
        y += hh;
        if (kind !== 'group') pg.line(M, y, W - M, y, { stroke: C.line, lw: 0.15 });
      });
      if (!sec.rows.length) { pg.text('No data.', M + 1.5, y + 4, { size: 8, color: C.faint }); y += 6; }
      if (sec.note) {
        const lines = PM.pdf.wrap(sec.note, CW, 7.2);
        ensure(lines.length * 3.3 + 3);
        y += 2.5;
        lines.forEach(ln => { pg.text(ln, M, y + 2.5, { size: 7.2, color: C.muted }); y += 3.3; });
      }
      y += 8;
    });

    // footers
    const gen = 'Generated ' + U.fmtDate(U.todayISO()) + ' · amounts in EUR, excl. VAT';
    pages.forEach((p, i) => {
      p.line(M, H - M - 4, W - M, H - M - 4, { stroke: C.line, lw: 0.2 });
      p.text(PM.pdf.fit([co.footer || co.name, gen].filter(Boolean).join('   ·   '), CW - 30, 7), M, H - M, { size: 7, color: C.muted });
      p.text((i + 1) + ' / ' + pages.length, W - M, H - M, { size: 7, color: C.muted, align: 'right' });
    });
    return doc.output();
  }

  async function exportPdf(spec, filename, btn) {
    if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'PDF…'; }
    try { await PM.pdf.deliver(await render(spec), filename); }
    catch (e) { console.error(e); PM.ui.toast('Could not create the PDF: ' + e.message, 'error'); }
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t || 'PDF'; }
  }

  return { render, exportPdf };
})();

  <script>/* js/modules/estimate-formats.js */
/* PM Tool — modules/estimate-formats.js
 * Estimate formats: a ready-made list of estimate lines (subjects, descriptions,
 * quantities, units and optionally prices) to insert into a project's estimate.
 * Stored in settings/estimate-formats.md (collection "etlines"). The built-in
 * "Prefab pump room" format is copied into your data the first time.
 *
 *   PM.estimateFormats.insertDialog(projectId)
 *   PM.estimateFormats.saveDialog(projectId)
 *   PM.estimateFormats.renderSettings(el, rerender)
 */
(function () {
  const U = PM.util, h = U.h;

  // [subject, description, qty, unit] — structure only, prices are filled in per project
  const BUILTIN = {
    'Prefab pump room': [
      ['Firepacks', 'Firepack pump', 1, 'pcs'],
      ['Purchase', 'Jockeypump', 1, 'pcs'],
      ['Purchase', 'Louvre', 4, 'pcs'],
      ['Purchase', 'Flowmeter', 1, 'pcs'],
      ['Purchase', 'Testset', 1, 'pcs'],
      ['Purchase', 'Overspanningsbeveiliging', 1, 'pcs'],
      ['Pumproom', 'Pumproom', 1, 'pcs'],
      ['Piping & valves', 'Valves and Piping Accessories', 1, 'lot'],
      ['Subcontracting', 'Electricity', 1, 'lot'],
      ['Subcontracting', 'Exhaust isolation', 1, 'pcs'],
      ['Manufacturing', 'Tanks on frame', 1, 'pcs'],
      ['Manufacturing', 'Larger fuel tank', 1, 'pcs'],
      ['Labour', 'Engineering E + W', 1, 'lot'],
      ['Labour', 'Project manager', 1, 'lot'],
      ['Transport', 'Transportation', 1, 'lot'],
      ['Engineering', 'Calculations', 1, 'lot'],
      ['Contingency', 'Price spike', 1, 'lot']
    ]
  };

  PM.store.addLoader(async be => {
    if (PM.store.list('etlines').length || !be || be.kind === 'readonly') return;
    let existing = null;
    try { existing = await be.readText('settings/estimate-formats.md'); } catch (e) { existing = null; }
    if (existing != null) return;
    Object.keys(BUILTIN).forEach(name => BUILTIN[name].forEach(r => PM.store.insert('etlines', { format: name, subject: r[0], description: r[1], qty: r[2], unit: r[3] })));
  });

  function names() {
    const out = [];
    PM.store.list('etlines').forEach(r => { if (r.format && !out.includes(r.format)) out.push(r.format); });
    return out;
  }
  const rows = name => PM.store.list('etlines', r => r.format === name);
  const amount = r => (r.qty === '' || r.qty == null ? 1 : U.num(r.qty)) * U.num(r.unit_price);

  function insertDialog(pid) {
    const list = names();
    if (!list.length) { PM.ui.toast('No estimate formats yet. Save an estimate as a format first.', 'warn'); return; }
    const st = { name: list[0], skip: {} };
    const sel = h('select', { id: 'ef-name' }, list.map(n => h('option', { value: n }, n + ' (' + rows(n).length + ' lines)')));
    const prices = h('input', { type: 'checkbox', checked: true, id: 'ef-prices' });
    const preview = h('div', { class: 'tpl-preview' });
    const summary = h('p', { class: 'muted small' });
    function draw() {
      const rs = rows(st.name);
      const hasPrices = rs.some(r => U.num(r.unit_price));
      prices.disabled = !hasPrices;
      preview.innerHTML = '';
      const body = h('tbody');
      let last = null;
      rs.forEach(r => {
        if ((r.subject || '') !== last) { last = r.subject || ''; body.appendChild(h('tr', { class: 'tpl-group' }, h('td'), h('td', { colspan: 4 }, last || '(no subject)'))); }
        body.appendChild(h('tr', null,
          h('td', null, h('input', { type: 'checkbox', checked: !st.skip[r._key], 'aria-label': r.description, onchange: e => { st.skip[r._key] = !e.target.checked; count(); } })),
          h('td', null, r.description), h('td', { class: 'right nowrap' }, (r.qty === '' || r.qty == null ? '' : U.fmtNum(r.qty)) + ' ' + (r.unit || '')),
          h('td', { class: 'right nowrap' }, U.num(r.unit_price) ? U.fmtMoney(r.unit_price, true) : '—'),
          h('td', { class: 'right nowrap' }, U.num(r.unit_price) ? U.fmtMoney(amount(r), true) : '')));
      });
      preview.appendChild(h('table', { class: 'data tpl-table' }, h('thead', null, h('tr', null, h('th'), h('th', null, 'Line'), h('th', { class: 'right' }, 'Qty'), h('th', { class: 'right' }, 'Unit price'), h('th', { class: 'right' }, 'Amount'))), body));
      count();
    }
    function count() {
      const rs = rows(st.name).filter(r => !st.skip[r._key]);
      const tot = U.sum(rs, amount);
      summary.textContent = rs.length + ' line(s) will be added below the current estimate' + (tot && prices.checked ? ' · ' + U.fmtMoney(tot) : '') + '. Fill in or adjust the prices afterwards.';
    }
    sel.addEventListener('change', () => { st.name = sel.value; st.skip = {}; draw(); });
    prices.addEventListener('change', count);
    draw();
    PM.ui.dialog({
      title: 'Insert estimate format', wide: true,
      content: h('div', null,
        h('div', { class: 'form-grid' }, h('label', { class: 'form-row' }, h('span', null, 'Format'), sel)),
        h('label', { class: 'check' }, prices, ' Copy the prices of the format (when it has them)'),
        summary, preview),
      actions: [{ label: 'Cancel' }, { label: 'Insert lines', primary: true, onClick: () => {
        const rs = rows(st.name).filter(r => !st.skip[r._key]);
        if (!rs.length) { PM.ui.toast('Select at least one line.', 'warn'); return false; }
        rs.forEach(r => PM.store.insert('estimate', { subject: r.subject, description: r.description, role: r.role, qty: r.qty === '' || r.qty == null ? 1 : r.qty, unit: r.unit,
          unit_price: prices.checked ? r.unit_price : '', note: r.note }, pid));
        PM.ui.toast(rs.length + ' estimate lines added from "' + st.name + '".');
      } }]
    });
  }

  function saveDialog(pid) {
    const est = PM.store.list('estimate', { project: pid });
    if (!est.length) { PM.ui.toast('This estimate has no lines yet.', 'warn'); return; }
    const p = PM.store.project(pid);
    const name = h('input', { type: 'text', id: 'efs-name', value: p ? p.name : '' });
    const prices = h('input', { type: 'checkbox', id: 'efs-prices' });
    PM.ui.dialog({
      title: 'Save estimate as format',
      content: h('div', null,
        h('div', { class: 'form-grid' }, h('label', { class: 'form-row' }, h('span', null, 'Format name'), name)),
        h('label', { class: 'check' }, prices, ' Also save the unit prices'),
        h('p', { class: 'muted small' }, est.length + ' lines are saved with subject, description, role, quantity and unit. Without prices the format is a clean structure to fill in per project.')),
      actions: [{ label: 'Cancel' }, { label: 'Save format', primary: true, onClick: () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return false; }
        const old = rows(n);
        if (old.length && !confirm('A format "' + n + '" already exists (' + old.length + ' lines). Replace it?')) return false;
        old.forEach(r => PM.store.remove('etlines', r._key));
        est.forEach(e => PM.store.insert('etlines', { format: n, subject: e.subject, description: e.description, role: e.role, qty: e.qty, unit: e.unit, unit_price: prices.checked ? e.unit_price : '', note: e.note }));
        PM.ui.toast('Format "' + n + '" saved with ' + est.length + ' lines.');
      } }]
    });
  }

  const sstate = { open: '' };
  function renderSettings(el, rerender) {
    const list = names();
    if (sstate.open && !list.includes(sstate.open)) sstate.open = '';
    el.appendChild(h('p', { class: 'muted' }, 'Ready-made estimate structures. Insert one in Costs → Estimate → Insert format, or save a project estimate as a format there.'));
    el.appendChild(h('div', { class: 'tpl-cards' }, list.map(n => {
      const rs = rows(n), tot = U.sum(rs, amount);
      return h('div', { class: 'card tpl-card' + (sstate.open === n ? ' on' : '') },
        h('div', { class: 'card-head' }, h('h2', null, n)),
        h('p', { class: 'muted small' }, rs.length + ' lines · ' + Array.from(new Set(rs.map(r => r.subject).filter(Boolean))).length + ' subjects' + (tot ? ' · ' + U.fmtMoney(tot) : ' · no prices')),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn small', onclick: () => { sstate.open = sstate.open === n ? '' : n; rerender(); } }, sstate.open === n ? 'Close' : 'Edit lines'),
          h('button', { class: 'btn ghost small', onclick: () => { const nn = prompt('New name for "' + n + '"', n); if (nn && nn.trim() && nn.trim() !== n) { rs.forEach(r => PM.store.update('etlines', r._key, { format: nn.trim() })); sstate.open = nn.trim(); } } }, 'Rename'),
          h('button', { class: 'btn ghost small danger-text', onclick: () => { if (confirm('Delete format "' + n + '"? Estimates that used it keep their lines.')) rs.forEach(r => PM.store.remove('etlines', r._key)); } }, 'Delete')));
    })));
    if (!list.length) el.appendChild(PM.ui.empty('No estimate formats. Open a project → Costs → Estimate → Save as format.'));
    if (sstate.open) {
      el.appendChild(h('h3', null, 'Lines of "' + sstate.open + '"'));
      el.appendChild(PM.ui.dataTable({ id: 'etlines', collection: 'etlines', rows: rows(sstate.open), columns: ['id', 'subject', 'description', 'role', 'qty', 'unit', 'unit_price', 'note'],
        newRecord: () => { const rs = rows(sstate.open), last = rs[rs.length - 1]; return { format: sstate.open, subject: last ? last.subject : '', qty: 1 }; } }));
    }
  }

  PM.estimateFormats = { BUILTIN, names, rows, insertDialog, saveDialog, renderSettings };
})();
