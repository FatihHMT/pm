  <style>
/* PM Tool — styles. Colours are tokens so a theme is one block of variables. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e1e4ea; --border-strong: #c9ced8;
  --text: #1c2230; --muted: #687187; --accent: #2f6fed; --accent-weak: #e7eefe;
  --ok: #1f9d55; --ok-weak: #e3f4ea; --warn: #b7791f; --warn-weak: #fdf3e1; --bad: #d14343; --bad-weak: #fbe9e9;
  --bar-empty: #b9c0cc; --bar-empty-bg: #eef0f4; --weekend: rgba(30, 40, 60, .045); --grid: rgba(30, 40, 60, .07);
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --radius: 8px; --row-h: 32px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1e26; --surface-2: #222733; --border: #2c3240; --border-strong: #3a4152;
    --text: #e6e9ef; --muted: #9099ad; --accent: #6b9bff; --accent-weak: #1f2b45;
    --ok: #4cc38a; --ok-weak: #17322a; --warn: #e0a84a; --warn-weak: #332a17; --bad: #f07272; --bad-weak: #3a1f22;
    --bar-empty: #5a6275; --bar-empty-bg: #262b36; --weekend: rgba(255, 255, 255, .035); --grid: rgba(255, 255, 255, .06);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: 12.5px ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
h3 { font-size: 16px; margin: 0; }
h4 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .nowrap { white-space: nowrap; }
.spacer { flex: 1; } .grow { flex: 1; min-width: 0; }
.bad-text { color: var(--bad); }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
#app { display: flex; height: 100vh; }
.sidebar { width: 210px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font-weight: 650; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent) 0 55%, var(--ok) 55% 100%); }
.nav { display: flex; flex-direction: column; padding: 6px 10px; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--text); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); text-decoration: none; }
.nav-item.active { background: var(--accent-weak); color: var(--accent); }
.nav-icon { width: 18px; text-align: center; opacity: .8; }
.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--border); word-break: break-word; }
.main { flex: 1; min-width: 0; overflow: auto; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.proj-select { min-width: 260px; font-weight: 500; }
#view { padding: 20px 24px 60px; max-width: 1600px; }
.view-planning { max-width: none; }
.banner { margin: 12px 24px 0; }
.banner-inner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--warn-weak); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: var(--radius); }
.banner-inner > span:first-child { flex: 1; min-width: 240px; }

.status-pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.status-pill.ok { background: var(--ok-weak); color: var(--ok); }
.status-pill.warn { background: var(--warn-weak); color: var(--warn); }
.status-pill.error { background: var(--bad-weak); color: var(--bad); }
.status-pill.busy { background: var(--accent-weak); color: var(--accent); }

/* ---------- controls ---------- */
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; min-height: 32px; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .bar:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 500; min-height: 32px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 10px; min-height: 28px; font-size: 13px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; }
.icon-btn:hover { background: var(--surface-2); color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; text-transform: capitalize; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.bad:not(.on) { border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
.chip-n { margin-left: 6px; opacity: .7; font-size: 12px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.check input { min-height: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tabs button { border: 0; background: none; padding: 8px 14px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head p { margin: 2px 0 0; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }

/* ---------- cards & stats ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stat-value { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.stat.bad .stat-value { color: var(--bad); }
.stat.accent .stat-value { color: var(--accent); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.two-col > .card { margin-bottom: 0; }
.two-col + * { margin-top: 16px; }

.pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); text-transform: capitalize; white-space: nowrap; }
.pill.small { font-size: 11px; padding: 1px 7px; }
.st-active, .st-in-progress { background: var(--accent-weak); color: var(--accent); }
.st-done, .st-completed { background: var(--ok-weak); color: var(--ok); }
.st-blocked { background: var(--bad-weak); color: var(--bad); }
.st-on-hold, .st-review { background: var(--warn-weak); color: var(--warn); }
.st-fixed { background: var(--accent-weak); color: var(--accent); }
.st-purchase { background: var(--warn-weak); color: var(--warn); }

.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; background: var(--accent); }
.meter.progress .meter-fill { background: var(--accent); }
.meter.ok .meter-fill { background: var(--ok); } .meter.warn .meter-fill { background: var(--warn); } .meter.over .meter-fill { background: var(--bad); }
.meter-text { font-size: 12px; color: var(--muted); width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
.meter.over .meter-text { color: var(--bad); font-weight: 600; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 1.2fr); gap: 12px; align-items: center; font-size: 13px; margin: 6px 0; }
.budget-rows .kv { grid-template-columns: minmax(0, 1fr) minmax(220px, 2fr); }

.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.proj-card { display: block; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--pc); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.proj-card:hover { text-decoration: none; border-color: var(--border-strong); border-left-color: var(--pc); transform: translateY(-1px); }
.proj-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.proj-name { font-weight: 600; font-size: 15px; }
.proj-tasks { margin-top: 8px; color: var(--muted); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.swatch.big { width: 18px; height: 40px; border-radius: 4px; }
.line-list { list-style: none; padding: 0; margin: 0; }
.line-list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.line-list li:last-child { border-bottom: 0; }
.line-list select { min-height: 28px; padding: 2px 6px; font-size: 12.5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bar-empty); flex: none; }
.dot.linked { background: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); }
.dot.done { background: var(--ok); border-color: var(--ok); }
.picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.picker-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.picker-item:hover { border-color: var(--accent); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.error-box, .warn-box { padding: 12px 14px; border-radius: var(--radius); margin-bottom: 16px; }
.error-box { background: var(--bad-weak); color: var(--bad); }
.warn-box { background: var(--warn-weak); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.warn-box ul { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }

/* ---------- data tables ---------- */
.tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.tbl-toolbar { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.tbl-search { width: 220px; min-height: 30px; padding: 4px 8px; }
.tbl-scroll { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
table.data th.sorted { color: var(--accent); }
table.data td { padding: 2px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
table.data td.calc { padding: 6px 8px; color: var(--muted); white-space: nowrap; }
table.data td.right, table.data th.right { text-align: right; }
table.data td.edit input:not([type=checkbox]), table.data td.edit select { width: 100%; border-color: transparent; background: transparent; min-height: 30px; padding: 4px 6px; }
table.data td.edit input:hover, table.data td.edit select:hover { border-color: var(--border); }
table.data td.edit input:focus, table.data td.edit select:focus { border-color: var(--accent); background: var(--surface); }
table.data td.edit input.num { text-align: right; }
table.data td.t-bool { text-align: center; }
table.data tfoot td { font-weight: 600; padding: 8px; border-top: 2px solid var(--border-strong); border-bottom: 0; white-space: nowrap; }
table.data td.empty { text-align: center; color: var(--muted); padding: 24px; }
table.report td { padding: 7px 8px; }
table.report th { cursor: default; }
.cell-id { display: inline-block; padding: 0 6px; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); white-space: nowrap; }
.row-actions { width: 36px; text-align: center; }
.proj-link { white-space: nowrap; padding: 0 6px; }
select.pill-select { border-radius: 999px; font-size: 12.5px; text-transform: capitalize; }
table.data td.edit select.pill-select { border-color: transparent; }
.tbl-wrap > .btn { margin: 8px 12px; }

/* ---------- forms & dialogs ---------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 14px; }
.form-row { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.form-row.wide { grid-column: 1 / -1; margin-top: 12px; }
.form-row.inline { flex-direction: row; align-items: center; gap: 10px; }
.form-row input, .form-row select, .form-row textarea { color: var(--text); font-size: 14px; }
.form-row input[type=checkbox] { align-self: flex-start; min-height: 20px; width: 20px; }
.dlg { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.dlg.wide { width: min(820px, calc(100vw - 32px)); }
.dlg::backdrop { background: rgba(15, 20, 30, .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.dlg-body { padding: 18px 20px; max-height: 70vh; overflow: auto; }
.dlg-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.inline-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.inline-form input[type=text] { flex: 1; min-width: 200px; }
.inline-form select { max-width: 340px; }
.linked-tasks { margin-top: 6px; }
.menu { position: fixed; z-index: 100; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 6px; display: flex; flex-direction: column; min-width: 240px; }
.menu button { text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 5px; }
.menu button:hover, .menu button:focus { background: var(--surface-2); outline: none; }
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); font-size: 13.5px; transition: opacity .3s, transform .3s; }
.toast.ok { border-left: 4px solid var(--ok); } .toast.warn { border-left: 4px solid var(--warn); } .toast.error { border-left: 4px solid var(--bad); }
.toast.out { opacity: 0; transform: translateY(8px); }

/* quick hour entry */
.card.quick { padding: 12px 14px; }
.quick-grid { display: grid; grid-template-columns: 150px 160px 200px 1fr 1fr 110px; gap: 8px 10px; align-items: end; }
.quick-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.quick-grid label.wide { grid-column: 1 / span 5; }
.quick-grid select, .quick-grid input { width: 100%; }
@media (max-width: 1100px) { .quick-grid { grid-template-columns: 1fr 1fr 1fr; } .quick-grid label.wide { grid-column: 1 / span 2; } }

/* bar lists (reports) */
.bars { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 100px; gap: 10px; align-items: center; font-size: 13px; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---------- planning / gantt ---------- */
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 22px; height: 10px; border-radius: 3px; }
.lg.unlinked { background: var(--bar-empty-bg); border: 1.5px dashed var(--bar-empty); }
.lg.linked { background: var(--pc); }
.lg.complete { background: var(--ok); }

  <!-- Core: data model, Markdown read/write, storage, calculations -->
  <script>/* js/core/util.js */
/* PM Tool — core/util.js
 * Small, dependency-free helpers shared by every layer.
 * Everything lives on the global `PM` namespace so plain <script> tags work
 * offline from file:// (ES modules are blocked there by browsers).
 */
window.PM = window.PM || {};

PM.util = (function () {
  const DAY = 86400000;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* Dates are ISO strings "YYYY-MM-DD" everywhere; converted to UTC midnight
     internally so day arithmetic never trips over daylight saving time. */
  function parseDate(s) {
    if (!s) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return null;
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  }
  function iso(d) {
    if (!d) return '';
    return d.toISOString().slice(0, 10);
  }
  function todayISO() {
    const n = new Date();
    return iso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
  }
  function addDays(s, n) {
    const d = parseDate(s);
    return d ? iso(new Date(d.getTime() + n * DAY)) : '';
  }
  function daysBetween(a, b) {
    const da = parseDate(a), db = parseDate(b);
    if (!da || !db) return 0;
    return Math.round((db - da) / DAY);
  }
  function monthKey(s) { return s ? String(s).slice(0, 7) : ''; }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(s) {
    const d = parseDate(s);
    if (!d) return '';
    return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }
  function fmtMonth(key) {
    if (!key) return '';
    const [y, m] = key.split('-');
    return MONTHS[+m - 1] + ' ' + y;
  }

  const moneyFmt = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const money2Fmt = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const numFmt = new Intl.NumberFormat('en-IE', { maximumFractionDigits: 1 });
  function fmtMoney(n, decimals) { return (decimals ? money2Fmt : moneyFmt).format(+n || 0); }
  function fmtNum(n) { return numFmt.format(+n || 0); }
  function fmtPct(n) { return isFinite(n) ? Math.round(n * 100) + '%' : '–'; }

  function num(v) {
    if (v === '' || v == null) return 0;
    const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : 0;
  }

  function slugify(s) {
    return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'item';
  }

  /* Next sequential id like "T-007" given the ids already in use. */
  function nextId(prefix, ids, pad) {
    let max = 0;
    const re = new RegExp('^' + prefix.replace(/[-]/g, '\\-') + '(\\d+)$');
    ids.forEach(id => { const m = re.exec(id || ''); if (m) max = Math.max(max, +m[1]); });
    return prefix + String(max + 1).padStart(pad || 3, '0');
  }

  function debounce(fn, ms) {
    let t;
    return function () { clearTimeout(t); const a = arguments, self = this; t = setTimeout(() => fn.apply(self, a), ms); };
  }

  function groupBy(list, fn) {
    const m = new Map();
    list.forEach(x => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    return m;
  }
  function sum(list, fn) { return list.reduce((a, x) => a + num(fn ? fn(x) : x), 0); }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(columns, rows) {
    const head = columns.map(c => csvCell(c.label || c.key)).join(',');
    const body = rows.map(r => columns.map(c => csvCell(typeof c.value === 'function' ? c.value(r) : r[c.key])).join(','));
    return [head].concat(body).join('\n');
  }

  /* Tiny DOM builder: h('div', {class:'x', onclick:fn}, 'text', childEl) */
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (v[sk] == null) continue; if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(x => append(el, x));
    else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }

  return { esc, parseDate, iso, todayISO, addDays, daysBetween, monthKey, fmtDate, fmtMonth,
    fmtMoney, fmtNum, fmtPct, num, slugify, nextId, debounce, groupBy, sum, download, toCSV, h, DAY, MONTHS };
})();

/* Minimal event bus. Events used by the core:
 *   'loaded'  {source}                         — data (re)loaded
 *   'change'  {collection, action, record, id} — any record inserted/updated/removed
 *   'saved'   {files}                          — dirty files written
 *   'status'  {text, kind}                     — storage status changes
 *   'route'   {module, params}                 — navigation
 */
PM.events = (function () {
  const map = {};
  return {
    on(name, fn) { (map[name] = map[name] || []).push(fn); return () => this.off(name, fn); },
    off(name, fn) { map[name] = (map[name] || []).filter(f => f !== fn); },
    emit(name, payload) { (map[name] || []).slice().forEach(fn => { try { fn(payload); } catch (e) { console.error('[PM event ' + name + ']', e); } }); }
  };
})();

  <script>/* js/core/registry.js */
/* PM Tool — core/registry.js
 * The extension points. Everything the app shows or stores is registered here,
 * so new functions can be added by dropping in one more <script> file.
 *
 *   PM.defineCollection(def)   a data type stored in a Markdown file (see collections.js)
 *   PM.registerModule(def)     a screen in the sidebar (see modules/*.js)
 *   PM.registerService(n, o)   shared logic other modules can call (e.g. PM.services.calc)
 *   PM.registerAdapter(def)    an import/export format (see adapters/*.js)
 */
(function () {
  const collections = {};
  const modules = [];
  const adapters = [];
  PM.services = PM.services || {};

  /* Collection definition:
   * {
   *   name:     'tasks',                 unique key
   *   label:    'Tasks',
   *   scope:    'project' | 'global' | 'meta'
   *             project = one file inside each project folder
   *             global  = one shared file (e.g. settings/roles.md)
   *             meta    = the frontmatter of projects/<folder>/project.md
   *   file:     'tasks.md'               (project) or 'settings/roles.md' (global)
   *   idPrefix: 'T-', idPad: 3
   *   fields:   [{ key, label, type, options, ref, width, required, default, hidden }]
   *             types: id, string, text, number, money, date, enum, ref, bool, color
   *   title:    record => display name (used by ref dropdowns)
   *   heading:  'Tasks'                  (# heading written above the table)
   *   intro:    'text written under the heading when a new file is created'
   * }
   */
  PM.defineCollection = function (def) {
    if (!def.name) throw new Error('Collection needs a name');
    def.label = def.label || def.name;
    def.scope = def.scope || 'project';
    def.idPrefix = def.idPrefix || (def.name[0].toUpperCase() + '-');
    def.idPad = def.idPad || 3;
    def.fields = def.fields || [];
    if (!def.fields.find(f => f.key === 'id')) def.fields.unshift({ key: 'id', label: 'ID', type: 'id' });
    def.fields.forEach(f => { f.label = f.label || f.key; f.type = f.type || 'string'; });
    def.title = def.title || (r => r.title || r.name || r.id);
    collections[def.name] = def;
    PM.events.emit('schema', { collection: def.name });
    return def;
  };
  PM.collection = name => collections[name];
  PM.collections = () => Object.values(collections);

  /* Module definition:
   * {
   *   id: 'planning', title: 'Planning', icon: '▤', order: 20,

  <script>/* js/core/markdown.js */
/* PM Tool — core/markdown.js
 * Reads and writes the Markdown data files.
 *
 * A data file =  YAML frontmatter (optional)  +  free text  +  ONE pipe table  +  free text
 * The free text before and after the table is preserved when the app saves,
 * so you can keep notes in the same file.
 *
 * Only a small, safe YAML subset is supported in frontmatter:
 *   key: value | "quoted" | 'quoted' | 12.5 | true/false | [a, b, c]
 */
PM.md = (function () {

  /* ---------- frontmatter ---------- */
  function parseFrontmatter(text) {
    text = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    const m = /^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/.exec(text);
    if (!m) return { data: {}, body: text };
    return { data: parseYaml(m[1]), body: text.slice(m[0].length) };
  }

  function parseYaml(src) {
    const out = {};
    src.split('\n').forEach(line => {
      if (!line.trim() || /^\s*#/.test(line)) return;
      const m = /^\s*([A-Za-z0-9_.\-]+)\s*:\s*(.*)$/.exec(line);
      if (!m) return;
      out[m[1]] = parseScalar(m[2]);
    });
    return out;
  }

  function parseScalar(v) {
    v = v.trim();
    if (v === '' || v === '~' || v === 'null') return '';
    if (v[0] === '"') { const e = v.lastIndexOf('"'); return v.slice(1, e > 0 ? e : undefined).replace(/\\"/g, '"').replace(/\\n/g, '\n').replace(/\\\\/g, '\\'); }
    if (v[0] === "'") { const e = v.lastIndexOf("'"); return v.slice(1, e > 0 ? e : undefined).replace(/''/g, "'"); }
    if (v[0] === '[') {
      const inner = v.replace(/^\[/, '').replace(/\].*$/, '');
      return inner.split(',').map(s => parseScalar(s)).filter(s => s !== '');
    }
    v = v.replace(/\s+#.*$/, '');               // trailing comment
    if (v === 'true') return true;
    if (v === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);
    return v;
  }

  function yamlValue(v) {
    if (v === true || v === false) return String(v);
    if (typeof v === 'number') return String(v);
    if (Array.isArray(v)) return '[' + v.map(yamlValue).join(', ') + ']';
    const s = v == null ? '' : String(v);
    if (s === '') return '""';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    if (/^[A-Za-z][A-Za-z0-9 _.\/@()&+-]*$/.test(s) && !/^(true|false|null|yes|no)$/i.test(s) && !/\s$/.test(s)) return s;
    return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
  }

  function stringifyFrontmatter(data, keyOrder) {
    const keys = (keyOrder || []).filter(k => k in data)
      .concat(Object.keys(data).filter(k => !(keyOrder || []).includes(k)));
    const lines = keys.filter(k => !k.startsWith('_')).map(k => k + ': ' + yamlValue(data[k]));
    return '---\n' + lines.join('\n') + '\n---\n';
  }

  /* ---------- tables ---------- */
  function isRow(line) { return /^\s*\|/.test(line); }
  function isSep(line) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line); }

  function splitRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue; }
      if (c === '|') { cells.push(cur); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur);
    return cells.map(c => c.trim().replace(/<br\s*\/?>/gi, '\n'));
  }

  function normKey(h) { return h.trim().toLowerCase().replace(/\s+/g, '_'); }

  /* Parse a whole data file.
   * returns { meta, before, after, columns:[key], rows:[{key: string}] } */
  function parseTableDoc(text) {
    const fm = parseFrontmatter(text);
    const lines = fm.body.split('\n');
    let start = -1;
    for (let i = 0; i < lines.length - 1; i++) {
      if (isRow(lines[i]) && isSep(lines[i + 1])) { start = i; break; }
    }
    if (start < 0) return { meta: fm.data, before: fm.body, after: '', columns: [], rows: [] };
    const columns = splitRow(lines[start]).map(normKey);
    let end = start + 2;
    const rows = [];
    while (end < lines.length && isRow(lines[end])) {
      const cells = splitRow(lines[end]);
      if (cells.some(c => c !== '')) {
        const r = {};
        columns.forEach((k, i) => { if (k) r[k] = cells[i] != null ? cells[i] : ''; });
        rows.push(r);
      }
      end++;
    }
    return {
      meta: fm.data,
      before: lines.slice(0, start).join('\n'),
      after: lines.slice(end).join('\n'),
      columns, rows
    };
  }

  function cellText(v) {
    if (v === true) return 'yes';
    if (v === false) return 'no';
    if (v == null) return '';
    return String(v).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
  }

  /* Write a data file. columns = [key]; rows = [{key: value}] */
  function writeTableDoc(doc, columns, rows) {
    const cells = rows.map(r => columns.map(k => cellText(r[k])));
    const widths = columns.map((k, i) => Math.min(40, Math.max(3, k.length, ...cells.map(c => c[i].length))));
    const pad = (s, w) => s + ' '.repeat(Math.max(0, w - s.length));
    const out = [];
    out.push('| ' + columns.map((k, i) => pad(k, widths[i])).join(' | ') + ' |');
    out.push('| ' + widths.map(w => '-'.repeat(w)).join(' | ') + ' |');
    cells.forEach(c => out.push('| ' + c.map((s, i) => pad(s, widths[i])).join(' | ') + ' |'));

    let text = '';
    if (doc.meta && Object.keys(doc.meta).length) text += stringifyFrontmatter(doc.meta, doc.metaOrder);
    let before = (doc.before || '').replace(/\s+$/, '');
    text += (before ? before + '\n\n' : '') + out.join('\n') + '\n';
    const after = (doc.after || '').replace(/^\s+/, '').replace(/\s+$/, '');
    if (after) text += '\n' + after + '\n';
    return text;
  }

  /* ---------- value coercion by field type ---------- */
  function fromCell(field, raw) {
    const v = raw == null ? '' : raw;
    switch (field.type) {
      case 'number': case 'money': return v === '' ? '' : PM.util.num(v);
      case 'bool': return /^(yes|true|x|1|y|ja)$/i.test(String(v).trim());
      case 'date': { const d = PM.util.parseDate(v); return d ? PM.util.iso(d) : ''; }
      default: return typeof v === 'string' ? v : String(v);
    }
  }

  return { parseFrontmatter, stringifyFrontmatter, parseTableDoc, writeTableDoc, fromCell, yamlValue, parseYaml };
})();

  <script>/* js/core/storage.js */
/* PM Tool — core/storage.js
 * Storage backends. The store only talks to this interface, so moving from
 * "files on my laptop" to "online server" later means adding a backend, not
 * rewriting the app.
 *
 * Backend interface:
 *   label        string shown in the header
 *   kind         'memory' | 'folder' | 'readonly' | 'http'
 *   writable     true if writeText() persists
 *   readText(path)          -> Promise<string|null>   (null = file does not exist)
 *   writeText(path, text)   -> Promise<void>
 *   listDirs(path)          -> Promise<string[]>      (sub-folder names)
 * Paths are relative, forward-slash: "projects/P-001-website/tasks.md"
 */
PM.storage = (function () {

  /* ---------- in-memory (demo data, tests) ---------- */
  class MemoryBackend {
    constructor(files, label) {
      this.files = Object.assign({}, files || {});
      this.label = label || 'Demo data';
      this.kind = 'memory';
      this.writable = false;     // edits work, but are not persisted anywhere
    }
    async readText(p) { return p in this.files ? this.files[p] : null; }
    async writeText(p, t) { this.files[p] = t; }
    async listDirs(p) {
      const pre = p.replace(/\/?$/, '/');
      const set = new Set();
      Object.keys(this.files).forEach(f => {
        if (f.startsWith(pre)) { const rest = f.slice(pre.length); if (rest.includes('/')) set.add(rest.split('/')[0]); }
      });
      return Array.from(set).sort();
    }
  }

  /* ---------- real folder via File System Access API (Chrome, Edge, Opera) ---------- */
  class FolderBackend {
    constructor(handle) {
      this.handle = handle;
      this.label = handle.name;
      this.kind = 'folder';
      this.writable = true;
      this.stamps = {};          // path -> lastModified when we last read/wrote it (conflict detection)
      this.forced = new Set();
    }
    force(path) { this.forced.add(path); }
    async _dir(parts, create) {
      let d = this.handle;
      for (const p of parts) d = await d.getDirectoryHandle(p, { create: !!create });
      return d;
    }
    async readText(path) {
      const parts = path.split('/');
      const name = parts.pop();
      try {
        const dir = await this._dir(parts, false);
        const fh = await dir.getFileHandle(name);
        const f = await fh.getFile();
        this.stamps[path] = f.lastModified;
        return await f.text();
      } catch (e) {
        if (e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError')) return null;
        throw e;
      }
    }
    async writeText(path, text) {
      const parts = path.split('/');
      const name = parts.pop();
      const dir = await this._dir(parts, true);
      const fh = await dir.getFileHandle(name, { create: true });
      // Someone (a colleague via OneDrive/Dropbox sync, or an editor) changed the file since we read it?
      if (path in this.stamps && !this.forced.has(path)) {
        const now = (await fh.getFile()).lastModified;
        if (now !== this.stamps[path]) { const e = new Error('Changed elsewhere: ' + path); e.code = 'conflict'; e.path = path; throw e; }
      }
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
      this.stamps[path] = (await fh.getFile()).lastModified;
      this.forced.delete(path);
    }
    async listDirs(path) {
      let dir;
      try { dir = await this._dir(path.split('/').filter(Boolean), false); } catch (e) { return []; }
      const out = [];
      for await (const [name, h] of dir.entries()) if (h.kind === 'directory' && !name.startsWith('.')) out.push(name);
      return out.sort();
    }
  }

  /* ---------- fallback: folder chosen with <input webkitdirectory> (Firefox, Safari) ----------
   * Read-only on disk: changes are kept in memory and can be downloaded. */
  class FileListBackend {
    constructor(fileList) {
      this.map = {};
      let root = '';
      Array.from(fileList).forEach(f => {
        const rel = f.webkitRelativePath || f.name;
        const parts = rel.split('/');
        if (!root && parts.length > 1) root = parts[0];
        this.map[parts.slice(1).join('/') || rel] = f;
      });
      this.changed = {};
      this.label = (root || 'folder') + ' (read-only)';
      this.kind = 'readonly';
      this.writable = false;
    }
    async readText(p) {
      if (p in this.changed) return this.changed[p];
      return this.map[p] ? await this.map[p].text() : null;
    }
    async writeText(p, t) { this.changed[p] = t; }
    async listDirs(p) {
      const pre = p.replace(/\/?$/, '/');
      const set = new Set();
      Object.keys(this.map).concat(Object.keys(this.changed)).forEach(f => {
        if (f.startsWith(pre)) { const rest = f.slice(pre.length); if (rest.includes('/')) set.add(rest.split('/')[0]); }
      });
      return Array.from(set).sort();
    }
  }

  /* ---------- HTTP (for running online later; works with tools/server.js) ---------- */
  class HttpBackend {
    constructor(baseUrl) {
      this.base = (baseUrl || '').replace(/\/$/, '');
      this.label = 'Server ' + (this.base || location.host);
      this.kind = 'http';
      this.writable = true;
    }
    async readText(p) {
      const r = await fetch(this.base + '/api/file?path=' + encodeURIComponent(p));
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('Read failed: ' + r.status);
      return await r.text();
    }
    async writeText(p, t) {
      const r = await fetch(this.base + '/api/file?path=' + encodeURIComponent(p), { method: 'PUT', body: t, headers: { 'Content-Type': 'text/markdown; charset=utf-8' } });
      if (!r.ok) throw new Error('Write failed: ' + r.status);
    }
    async listDirs(p) {
      const r = await fetch(this.base + '/api/dirs?path=' + encodeURIComponent(p));
      return r.ok ? await r.json() : [];
    }
  }

  /* ---------- remember the chosen folder between sessions (IndexedDB) ---------- */
  function idb() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('pm-tool', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  async function kvSet(k, v) {
    try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* storage unavailable */ }
  }
  async function kvGet(k) {
    try { const db = await idb(); return await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); }); } catch (e) { return null; }
  }

  const supportsFolder = typeof window.showDirectoryPicker === 'function';

  async function pickFolder() {
    const handle = await window.showDirectoryPicker({ id: 'pm-data', mode: 'readwrite' });
    await kvSet('folder', handle);
    return new FolderBackend(handle);
  }

  /* Returns {handle, granted} for the last used folder, or null. */
  async function lastFolder() {
    if (!supportsFolder) return null;
    const handle = await kvGet('folder');
    if (!handle) return null;
    let state = 'prompt';
    try { state = await handle.queryPermission({ mode: 'readwrite' }); } catch (e) { /* ignore */ }
    return { handle, granted: state === 'granted' };
  }
  async function reopen(handle) {
    const state = await handle.requestPermission({ mode: 'readwrite' });
    if (state !== 'granted') throw new Error('Permission denied');
    return new FolderBackend(handle);
  }

  return { MemoryBackend, FolderBackend, FileListBackend, HttpBackend, supportsFolder, pickFolder, lastFolder, reopen, kvSet, kvGet };
})();

  <script>/* js/core/onedrive.js */
/* PM Tool — core/onedrive.js
 * OneDrive storage: sign in with a Microsoft account (OAuth 2.0 + PKCE, no
 * password ever touches this app) and read/write the Markdown files through
 * Microsoft Graph. Works in every modern browser: PC, tablet, phone.
 *
 * Needs an app registration (free) — see docs/SETUP-ONEDRIVE.md — and must be
 * served over https (or http://localhost) for sign-in to work.
 *
 *   PM.onedrive.configured()      client ID present?
 *   PM.onedrive.signIn()          redirect to Microsoft
 *   PM.onedrive.handleRedirect()  finish sign-in when Microsoft sends the user back
 *   PM.onedrive.backend()         -> storage backend (see storage.js) or null if not signed in
 *   PM.onedrive.signOut()
 */
PM.onedrive = (function () {
  const GRAPH = 'https://graph.microsoft.com/v1.0';
  const SCOPES = 'offline_access Files.ReadWrite User.Read';
  const LS_TOKENS = 'pm.ms.tokens', LS_CFG = 'pm.ms.config', LS_PENDING = 'pm.ms.pending', SS_PKCE = 'pm.ms.pkce';

  /* ---------- configuration (config.js, overridable in Settings) ---------- */
  function cfg() {
    const base = (PM.config && PM.config.onedrive) || {};
    let local = {};
    try { local = JSON.parse(localStorage.getItem(LS_CFG) || '{}'); } catch (e) { /* ignore */ }
    return {
      clientId: (local.clientId || base.clientId || '').trim(),
      tenant: local.tenant || base.tenant || 'common',
      folder: (local.folder || base.folder || 'ProjectManager').replace(/^\/+|\/+$/g, '')
    };
  }
  function saveCfg(c) { try { localStorage.setItem(LS_CFG, JSON.stringify(c)); } catch (e) { /* ignore */ } }
  function configured() { return !!cfg().clientId; }
  function canSignIn() { return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; }
  function redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
  function authBase() { return 'https://login.microsoftonline.com/' + cfg().tenant + '/oauth2/v2.0'; }

  /* ---------- tokens ---------- */
  function getTokens() { try { return JSON.parse(localStorage.getItem(LS_TOKENS) || 'null'); } catch (e) { return null; } }
  function setTokens(t) { try { if (t) localStorage.setItem(LS_TOKENS, JSON.stringify(t)); else localStorage.removeItem(LS_TOKENS); } catch (e) { /* ignore */ } }

  function b64url(bytes) {
    let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function randomString(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }
  async function challenge(verifier) {
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return b64url(new Uint8Array(d));
  }

  async function signIn(opts) {
    opts = opts || {};
    const c = cfg();
    if (!c.clientId) throw new Error('No client ID configured (config.js or Settings → Data).');
    if (!canSignIn()) throw new Error('Sign-in needs the app to be opened over https (put it online first, see docs/SETUP-ONEDRIVE.md).');
    const verifier = randomString(48);
    const state = randomString(16);
    sessionStorage.setItem(SS_PKCE, JSON.stringify({ verifier, state, hash: location.hash, silent: !!opts.silent }));
    const t = getTokens();
    const q = new URLSearchParams({
      client_id: c.clientId, response_type: 'code', redirect_uri: redirectUri(), response_mode: 'query',
      scope: SCOPES, state, code_challenge: await challenge(verifier), code_challenge_method: 'S256'
    });
    if (opts.silent) q.set('prompt', 'none');
    else if (!t) q.set('prompt', 'select_account');
    if (t && t.username) q.set('login_hint', t.username);

    location.assign(authBase() + '/authorize?' + q.toString());
    return new Promise(() => {});          // page navigates away
  }

  /* Called at start-up. Returns {ok:true} after a successful sign-in,
   * {error} if Microsoft returned an error, or null when this is not a redirect back. */
  async function handleRedirect() {
    const params = new URLSearchParams(location.search);
    if (!params.has('code') && !params.has('error')) return null;
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(SS_PKCE) || 'null'); } catch (e) { /* ignore */ }
    sessionStorage.removeItem(SS_PKCE);
    const clean = () => history.replaceState(null, '', redirectUri() + ((saved && saved.hash) || ''));
    if (params.has('error')) {
      clean();
      return { error: params.get('error_description') || params.get('error'), silent: saved && saved.silent, code: params.get('error') };
    }

      redirect_uri: redirectUri(), code_verifier: saved.verifier, scope: SCOPES
    });

    const r = await fetch(authBase() + '/token', { method: 'POST', body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { error: j.error_description || j.error || ('Token request failed (' + r.status + ')') };
    storeTokenResponse(j);

    return { ok: true };
  }

  function storeTokenResponse(j) {
    const prev = getTokens() || {};
    setTokens({
      access: j.access_token,
      expires: Date.now() + (j.expires_in || 3600) * 1000 - 60000,

    const t = getTokens();

        const body = new URLSearchParams({ client_id: cfg().clientId, grant_type: 'refresh_token', refresh_token: t.refresh, scope: SCOPES });
        const r = await fetch(authBase() + '/token', { method: 'POST', body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
        const j = await r.json().catch(() => ({}));

  /* fetch against Graph with auth, one retry after refresh, and 429/503 back-off */
  async function graph(url, init, attempt) {
    attempt = attempt || 0;
    init = Object.assign({}, init);
    init.headers = Object.assign({}, init.headers, { Authorization: 'Bearer ' + await accessToken() });
    const r = await fetch(url.startsWith('http') ? url : GRAPH + url, init);
    if (r.status === 401 && attempt < 1) { await refresh(); return graph(url, init, attempt + 1); }
    if ((r.status === 429 || r.status === 503) && attempt < 4) {
      const wait = (+r.headers.get('Retry-After') || (attempt + 1) * 2) * 1000;
      await new Promise(res => setTimeout(res, Math.min(wait, 15000)));
      return graph(url, init, attempt + 1);
    }
    return r;
  }

  async function loadProfile() {
    try {
      const r = await graph('/me?$select=displayName,userPrincipalName,mail');
      if (!r.ok) return;
      const me = await r.json();
      const t = getTokens();
      t.name = me.displayName; t.username = me.userPrincipalName || me.mail;

  /* ---------- small IndexedDB cache: path -> {eTag, text}; makes the next start fast ---------- */
  const cache = {
    db: null,
    async open() {
      if (this.db) return this.db;
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('pm-onedrive', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('files');
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
      return this.db;
    },
    async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('files').objectStore('files').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
    async put(k, v) { try { const db = await this.open(); db.transaction('files', 'readwrite').objectStore('files').put(v, k); } catch (e) { /* ignore */ } }
  };

  /* ---------- the storage backend ---------- */
  function encPath(p) { return p.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }

  class OneDriveBackend {
    constructor() {
      const c = cfg();
      this.root = c.folder;
      const a = account();
      this.label = 'OneDrive · ' + this.root + (a && a.username ? ' (' + a.username + ')' : '');
      this.kind = 'onedrive';
      this.writable = true;
      this.files = {};      // path -> {eTag, text}
      this.dirs = {};       // path -> [sub-folder names]
      this.forced = new Set();
    }
    item(path) { return '/me/drive/root:/' + encPath(this.root + '/' + path); }

    async children(path) {
      let url = this.item(path) + ':/children?$expand=children&$top=200';
      const out = [];
      while (url) {
        const r = await graph(url);
        if (r.status === 404) return null;
        if (!r.ok) throw new Error('OneDrive list failed (' + r.status + ')');
        const j = await r.json();
        out.push(...(j.value || []));
        url = j['@odata.nextLink'] || null;
      }
      return out;
    }

    /* Load everything in as few requests as possible; unchanged files come from the cache. */
    async prefetch(onProgress) {
      const jobs = [];
      const settings = await this.children('settings');
      (settings || []).filter(i => i.file && /\.md$/i.test(i.name)).forEach(i => jobs.push(['settings/' + i.name, i]));
      const projects = await this.children('projects');
      this.dirs.projects = [];
      (projects || []).filter(i => i.folder && !i.name.startsWith('.')).forEach(f => {
        this.dirs.projects.push(f.name);
        (f.children || []).filter(i => i.file && /\.md$/i.test(i.name)).forEach(i => jobs.push(['projects/' + f.name + '/' + i.name, i]));
      });
      this.dirs.projects.sort();
      let done = 0;
      const worker = async () => {
        while (jobs.length) {
          const [path, it] = jobs.shift();
          const key = this.root + '/' + path;
          const hit = await cache.get(key);
          let text;
          if (hit && hit.eTag === it.eTag) text = hit.text;
          else {
            const url = it['@microsoft.graph.downloadUrl'];
            const r = url ? await fetch(url) : await graph(this.item(path) + ':/content');
            if (!r.ok) throw new Error('Download failed for ' + path + ' (' + r.status + ')');
            text = await r.text();
            cache.put(key, { eTag: it.eTag, text });
          }
          this.files[path] = { eTag: it.eTag, text };
          done++;
          if (onProgress) onProgress(done);
        }
      };
      await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    }

    async readText(path) { return path in this.files ? this.files[path].text : null; }
    async listDirs(path) { return this.dirs[path] || []; }

    /* Write with optimistic locking: if someone else changed the file since we
     * read it, OneDrive answers 412 and we raise a 'conflict' error. */
    async writeText(path, text) {
      const known = this.files[path];
      const headers = { 'Content-Type': 'text/markdown; charset=utf-8' };
      if (known && known.eTag && !this.forced.has(path)) headers['If-Match'] = known.eTag;
      let r = await graph(this.item(path) + ':/content', { method: 'PUT', headers, body: text });
      if (r.status === 404) { await this.ensureFolders(path); r = await graph(this.item(path) + ':/content', { method: 'PUT', headers, body: text }); }
      if (r.status === 412) { const e = new Error('Changed elsewhere: ' + path); e.code = 'conflict'; e.path = path; throw e; }
      if (!r.ok) throw new Error('OneDrive save failed (' + r.status + ') for ' + path);
      const j = await r.json().catch(() => ({}));
      this.files[path] = { eTag: j.eTag, text };
      this.forced.delete(path);
      cache.put(this.root + '/' + path, { eTag: j.eTag, text });
      const parts = path.split('/');
      if (parts[0] === 'projects' && parts.length === 3) { this.dirs.projects = this.dirs.projects || []; if (!this.dirs.projects.includes(parts[1])) this.dirs.projects.push(parts[1]); }
    }
    force(path) { this.forced.add(path); }

    async ensureFolders(path) {
      const parts = (this.root + '/' + path).split('/').filter(Boolean);
      parts.pop();
      let parent = '';
      for (const name of parts) {
        const url = parent ? '/me/drive/root:/' + encPath(parent) + ':/children' : '/me/drive/root/children';
        const r = await graph(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }) });
        if (!r.ok && r.status !== 409) throw new Error('Could not create folder ' + name + ' (' + r.status + ')');
        parent = parent ? parent + '/' + name : name;
      }
    }
  }

  /* Changes that could not be saved because the sign-in expired are parked here
   * and written right after signing in again. */
  function parkPending(files) { try { localStorage.setItem(LS_PENDING, JSON.stringify(files)); } catch (e) { /* ignore */ } }
  function takePending() {
    try { const p = JSON.parse(localStorage.getItem(LS_PENDING) || 'null'); localStorage.removeItem(LS_PENDING); return p; } catch (e) { return null; }
  }

  return {
    cfg, saveCfg, configured, canSignIn, signIn, handleRedirect, signedIn, account, signOut, redirectUri,
    backend: () => (signedIn() ? new OneDriveBackend() : null),
    refresh, parkPending, takePending, OneDriveBackend
  };
})();

  <script>/* js/core/github.js */
/* PM Tool — core/github.js
 * GitHub storage: the Markdown files live in a (private) GitHub repository.
 * No app registration needed — you paste a fine-grained personal access token
 * that only has access to that one repository. Works in every browser.
 *
 * Every save is a commit, so you get a full history of who changed what.
 * Conflicts are detected with the file's SHA: if another device changed the
 * file since we read it, GitHub refuses the write and the app asks what to do.
 *
 *   PM.github.cfg() / saveCfg({repo:'owner/name', token, branch, folder})
 *   PM.github.configured()
 *   PM.github.backend()   -> storage backend (see storage.js)
 *   PM.github.test(cfg)   -> Promise<string> checks token + repository access
 */
PM.github = (function () {
  const API = 'https://api.github.com';
  const LS = 'pm.gh.config';

  function cfg() {
    let c = {};
    try { c = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { /* ignore */ }
    const base = (PM.config && PM.config.github) || {};
    return {
      repo: (c.repo || base.repo || '').trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, ''),
      token: (c.token || '').trim(),
      branch: (c.branch || base.branch || '').trim(),
      folder: (c.folder != null ? c.folder : (base.folder || '')).trim().replace(/^\/+|\/+$/g, '')
    };
  }
  function saveCfg(c) { try { localStorage.setItem(LS, JSON.stringify(c)); } catch (e) { /* ignore */ } }
  function forget() { try { localStorage.removeItem(LS); } catch (e) { /* ignore */ } }
  function configured() { const c = cfg(); return !!(c.repo && c.token && /^[^/]+\/[^/]+$/.test(c.repo)); }

  async function api(c, path, init, attempt) {
    attempt = attempt || 0;
    init = Object.assign({}, init);
    init.headers = Object.assign({ Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: 'Bearer ' + c.token }, init.headers);
    let r;
    try { r = await fetch(path.startsWith('http') ? path : API + path, init); }
    catch (e) { const err = new Error('No connection to GitHub.'); err.code = 'offline'; throw err; }
    if ((r.status === 403 || r.status === 429) && r.headers.get('x-ratelimit-remaining') === '0') {
      const e = new Error('GitHub rate limit reached — try again in a few minutes.'); e.code = 'ratelimit'; throw e;
    }
    if (r.status >= 500 && attempt < 2) { await new Promise(res => setTimeout(res, 1000 * (attempt + 1))); return api(c, path, init, attempt + 1); }
    if (r.status === 401) { const e = new Error('GitHub refused the token (expired or wrong). Open Settings → Data to enter a new one.'); e.code = 'auth'; throw e; }
    return r;
  }

  /* UTF-8 safe base64 */
  function toB64(text) {
    const bytes = new TextEncoder().encode(text);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromB64(b64) {
    const bin = atob(b64.replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function encPath(p) { return p.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }

  /* Check token + repository; returns a short description or throws. */
  async function test(c) {
    const r = await api(c, '/repos/' + c.repo);
    if (r.status === 404) throw new Error('Repository "' + c.repo + '" not found, or the token has no access to it. Check the name (owner/name) and the token\'s repository access.');
    if (!r.ok) throw new Error('GitHub answered ' + r.status + '.');
    const j = await r.json();
    if (j.permissions && j.permissions.push === false) throw new Error('The token can read but not write. Give it "Contents: Read and write" permission.');
    return { branch: j.default_branch || 'main', private: !!j.private, name: j.full_name };
  }

  /* cache of file contents by blob SHA (a SHA identifies the exact content) */
  const cache = {
    db: null,
    async open() {
      if (this.db) return this.db;
      this.db = await new Promise((res, rej) => { const rq = indexedDB.open('pm-github', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('blobs'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
      return this.db;
    },
    async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('blobs').objectStore('blobs').get(k); q.onsuccess = () => res(q.result == null ? null : q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
    async put(k, v) { try { const db = await this.open(); db.transaction('blobs', 'readwrite').objectStore('blobs').put(v, k); } catch (e) { /* ignore */ } }
  };

  class GitHubBackend {
    constructor(c) {
      this.c = c || cfg();
      this.label = 'GitHub · ' + this.c.repo + (this.c.folder ? '/' + this.c.folder : '');
      this.kind = 'github';
      this.writable = true;
      this.saveDelay = 2500;          // group quick edits into fewer commits
      this.files = {};                // path -> {sha, text}
      this.dirs = {};
      this.forced = new Set();
    }
    full(path) { return (this.c.folder ? this.c.folder + '/' : '') + path; }

    async prefetch(onProgress) {
      if (!this.c.branch) { const info = await test(this.c); this.c.branch = info.branch; }
      const r = await api(this.c, '/repos/' + this.c.repo + '/git/trees/' + encodeURIComponent(this.c.branch) + '?recursive=1');
      if (r.status === 409 || r.status === 404) { this.dirs.projects = []; return; }   // empty repository / no branch yet
      if (!r.ok) throw new Error('Could not read the repository (' + r.status + ').');
      const tree = await r.json();
      const pre = this.c.folder ? this.c.folder + '/' : '';
      const jobs = [];
      const projects = new Set();
      (tree.tree || []).forEach(e => {
        if (e.type !== 'blob' || !e.path.startsWith(pre) || !/\.md$/i.test(e.path)) return;
        const rel = e.path.slice(pre.length);
        const parts = rel.split('/');
        if (parts[0] === 'settings' && parts.length === 2) jobs.push([rel, e.sha]);
        if (parts[0] === 'projects' && parts.length === 3) { projects.add(parts[1]); jobs.push([rel, e.sha]); }
      });
      this.dirs.projects = Array.from(projects).sort();
      let done = 0;
      const worker = async () => {
        while (jobs.length) {
          const [rel, sha] = jobs.shift();
          let text = await cache.get(sha);
          if (text == null) {
            const b = await api(this.c, '/repos/' + this.c.repo + '/git/blobs/' + sha);
            if (!b.ok) throw new Error('Could not download ' + rel + ' (' + b.status + ').');
            const j = await b.json();
            text = j.encoding === 'base64' ? fromB64(j.content) : j.content;
            cache.put(sha, text);
          }
          this.files[rel] = { sha, text };
          done++;
          if (onProgress) onProgress(done);
        }
      };
      await Promise.all([worker(), worker(), worker(), worker(), worker()]);
    }

    async readText(path) { return path in this.files ? this.files[path].text : null; }
    async listDirs(path) { return this.dirs[path] || []; }

    async currentSha(path) {
      const r = await api(this.c, '/repos/' + this.c.repo + '/contents/' + encPath(this.full(path)) + '?ref=' + encodeURIComponent(this.c.branch || ''));
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('Could not check ' + path + ' (' + r.status + ').');
      return (await r.json()).sha;
    }

    async writeText(path, text, attempt) {
      attempt = attempt || 0;
      if (!this.c.branch) { const info = await test(this.c); this.c.branch = info.branch; }
      const known = this.files[path];
      if (known && known.text === text && !this.forced.has(path)) return;          // nothing changed
      let sha = known ? known.sha : undefined;
      if (this.forced.has(path)) sha = await this.currentSha(path) || undefined;
      const parts = path.split('/');
      const body = {
        message: 'Update ' + (parts[0] === 'projects' ? parts[1] + ' / ' + parts[2] : path),
        content: toB64(text),
        branch: this.c.branch
      };
      if (sha) body.sha = sha;
      const r = await api(this.c, '/repos/' + this.c.repo + '/contents/' + encPath(this.full(path)), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.status === 409 || r.status === 422) {
        // Either the file changed elsewhere (real conflict), or the branch moved under us (retry).
        const now = await this.currentSha(path);
        if (attempt < 2 && (now || null) === (sha || null)) { await new Promise(res => setTimeout(res, 700)); return this.writeText(path, text, attempt + 1); }
        const e = new Error('Changed elsewhere: ' + path); e.code = 'conflict'; e.path = path; throw e;
      }
      if (r.status === 404) throw new Error('Repository or branch not found — check Settings → Data.');
      if (r.status === 403) throw new Error('The token may not write to this repository (needs "Contents: Read and write").');
      if (!r.ok) throw new Error('GitHub save failed (' + r.status + ') for ' + path);
      const j = await r.json();
      const newSha = j.content && j.content.sha;
      this.files[path] = { sha: newSha, text };
      if (newSha) cache.put(newSha, text);
      this.forced.delete(path);
      if (parts[0] === 'projects' && parts.length === 3) { this.dirs.projects = this.dirs.projects || []; if (!this.dirs.projects.includes(parts[1])) this.dirs.projects.push(parts[1]); }
    }
    force(path) { this.forced.add(path); }
  }

  return {
    cfg, saveCfg, forget, configured, test,
    backend: () => (configured() ? new GitHubBackend(cfg()) : null),
    GitHubBackend
  };
})();

  <script>/* js/core/zip.js */
/* PM Tool — core/zip.js
 * Tiny uncompressed ZIP writer (no dependencies) so the whole data folder can be
 * downloaded as one file: backups, and browsers that cannot write to disk.
 *   PM.zip({ 'projects/P-001/tasks.md': 'text…' }) -> Blob

PM.zip = (function () {
